# Supabase project config for the TGK ERP edge functions.
# Shopify and ShipStation call these two webhooks without a Supabase login, so the platform must not demand one.
# The functions check who is calling themselves (webhook signatures, and EDGE_AUTH_MODE for ERP actions).
[functions.shopify-orders]
verify_jwt = false

[functions.shipstation-ship]
verify_jwt = false

# Only ever called by a signed-in ERP admin.
[functions.invite-user]
verify_jwt = true
