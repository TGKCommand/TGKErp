<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;--bg4:#e9ebee;--bg5:#dde0e5;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#565f6d;
  --teal:#0d9488;--teal-d:#0f766e;--teal-dim:rgba(13,148,136,.09);
  --orange:#ea580c;--orange-d:#c2410c;--orange-dim:rgba(234,88,12,.09);
  --red:#dc2626;--red-dim:rgba(220,38,38,.09);
  --green:#16a34a;--green-dim:rgba(22,163,74,.09);
  --yellow:#d97706;--yellow-dim:rgba(217,119,6,.09);
  --blue:#2563eb;--blue-dim:rgba(37,99,235,.09);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.09);
  --r:6px;--r-lg:10px;--r-sm:4px;--r-md:8px;--r-pill:999px;--t-xs:10px;--t-sm:11.5px;--t-md:12.5px;--t-lg:15px;--t-xl:16px;--t-2xl:20px;--font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--t-lg);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
body{font-size:var(--t-md)}
input,button,select,textarea{font-family:var(--font)}
.shell{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar-wrap{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{padding:14px 16px 12px;border-bottom:1px solid var(--border);position:relative}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.sidebar-brand{font-size:var(--t-sm);font-weight:800;color:var(--teal);letter-spacing:.18em;text-transform:uppercase}
.sidebar-brand small{display:block;font-size:var(--t-lg);font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;margin-top:2px}
.sidebar-section{padding:14px 14px 4px;font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);opacity:.85}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:1px 8px;border-radius:var(--r-md);cursor:pointer;transition:all .12s;border:1px solid transparent;background:transparent;width:calc(100% - 16px);text-align:left;color:var(--text2);font-size:var(--t-md);font-weight:500;outline:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .15s}
.nav-sub{margin:2px 8px 8px 8px;display:flex;flex-direction:column;gap:1px}
.nav-subitem{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 26px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text3);font-size:var(--t-sm);text-align:left;width:100%;transition:all .12s}
.nav-subitem:hover{background:var(--bg3);color:var(--text)}
.nav-subitem.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-subitem .nav-badge{margin-left:auto}
.nav-subdot{width:4px;height:4px;border-radius:50%;background:var(--text3);flex-shrink:0}
.nav-subitem.active .nav-subdot{background:var(--teal)}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{font-size:var(--t-xs);font-family:var(--mono);font-weight:700;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:1px 6px;border-radius:var(--r-md);min-width:22px;text-align:center;margin-left:auto}
.nav-item.active .nav-badge{color:var(--teal);background:var(--teal-dim);border-color:rgba(13,148,136,.22)}
.nav-item.alert-nav .nav-badge{color:var(--red);background:var(--red-dim);border-color:rgba(224,85,85,.25)}
.sidebar-footer{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--border);flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-label{font-size:var(--t-sm);color:var(--text2);flex:1;font-weight:500}
.sync-sub{font-size:var(--t-xs);color:var(--text3)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;z-index:10;position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal) 30%,var(--orange) 70%,transparent 100%);opacity:.7}
.topbar-title{font-size:var(--t-lg);font-weight:700;color:var(--text);letter-spacing:.01em}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.content{flex:1;overflow-y:auto;overflow-x:auto;padding:20px 24px;position:relative}

/* ============================================================
   MOBILE — sidebar becomes an off-canvas drawer below 768px
   instead of a permanently-visible 220px column. On a ~375px
   phone screen, a fixed 220px sidebar was leaving barely 150px
   for actual content — effectively unusable.
   ============================================================ */
.mobile-menu-btn{display:none}
#sidebar-scrim{display:none}
@media(max-width:768px){
  .mobile-menu-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;flex-shrink:0}
  .mobile-menu-btn:hover{background:var(--bg3)}
  .sidebar-wrap{position:fixed;top:0;left:0;bottom:0;z-index:200;width:250px;min-width:250px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  .sidebar-wrap.mobile-open{transform:translateX(0)}
  #sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
  #sidebar-scrim.active{display:block}
  .topbar{padding:0 12px;gap:8px}
  .topbar-title{font-size:var(--t-lg)}
  .content{padding:14px 12px}
  table{font-size:var(--t-sm)}
  .modal{width:calc(100vw - 24px);padding:16px}
  #tk-panel{width:100vw;max-width:100vw}
  .kpi-grid-4,.kpi-grid-5{grid-template-columns:repeat(2,1fr)}
  .cols-2{grid-template-columns:1fr}
  .stack-sm{grid-template-columns:1fr!important}
  /* Ticket list: table -> cards (important: beats the base .tk-cards{display:none} which appears later in source) */
  .tk-desktop{display:none!important}
  .tk-cards{display:flex!important;flex-direction:column;gap:10px}
  /* Filter bar: stack full-width, tappable */
  .filter-bar{flex-direction:column;align-items:stretch;gap:10px}
  .filter-bar .search-wrap{max-width:none;min-width:0;width:100%}
  .filter-bar .form-input{width:100%!important}
  .filter-bar .checkbox-row{padding:6px 2px}
  .filter-bar > .btn{width:100%;justify-content:center}
  /* Bigger touch targets; 16px inputs stop iOS zoom-on-focus */
  .form-input{min-height:44px;font-size:var(--t-xl);padding:11px 12px}
  .btn{min-height:42px;padding:10px 14px;font-size:var(--t-md)}
  .btn-sm{min-height:38px}
  .topbar-actions .btn{padding:9px 12px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:var(--t-sm);font-weight:600;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;transition:all .12s;letter-spacing:.01em}
.btn:hover{background:var(--bg5);color:var(--text);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.22)}
.btn-teal:hover{background:rgba(13,148,136,.13);border-color:rgba(13,148,136,.35)}
.btn-sm{padding:4px 10px;font-size:var(--t-sm)}

/* Panels / KPIs */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.panel-title{font-size:var(--t-xs);font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text2);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-grid{display:grid;gap:10px;margin-bottom:18px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px}
.kpi-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.kpi-value{font-size:24px;font-weight:600;line-height:1.1;font-family:var(--mono);margin-top:4px}
.kpi-sub{font-size:var(--t-xs);color:var(--text3);margin-top:3px}
.kpi-orange .kpi-value{color:var(--orange)}
.kpi-red .kpi-value{color:var(--red)}
.kpi-teal .kpi-value{color:var(--teal)}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:var(--t-md)}
thead th{background:var(--bg3);padding:10px 12px;text-align:left;font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
tbody td{padding:10px 12px;color:var(--text2);vertical-align:middle;font-size:var(--t-md)}
td.main-col{color:var(--text);font-weight:500}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--teal-dim)!important}
.pn{font-family:var(--mono);font-size:var(--t-sm);color:var(--text3)}
.tk-cards{display:none}
.tk-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.tk-card:active{background:var(--bg3)}
.tk-card-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tk-card-num{font-family:var(--mono);font-size:var(--t-sm);color:var(--text3);font-weight:600}
.tk-card-subj{font-size:var(--t-lg);font-weight:600;color:var(--text);line-height:1.32}
.tk-card-meta{font-size:var(--t-sm);color:var(--text3);display:flex;flex-wrap:wrap;gap:3px 12px}
.tk-card-chk{width:20px;height:20px;flex-shrink:0}

/* Pills */
.pill{display:inline-flex;align-items:center;padding:2.5px 9px;font-size:var(--t-xs);font-weight:600;border-radius:var(--r-md);border:1px solid transparent}
.pill-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.pill-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(224,123,40,.2)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(76,175,125,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(212,168,67,.2)}
.pill-muted{background:var(--bg4);color:var(--text3);border-color:var(--border)}
.src-tag{font-size:var(--t-xs);color:var(--text3);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-md)}

/* Filters */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:300px}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:var(--t-md);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--teal)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:var(--t-md);pointer-events:none}
.form-input{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:9px 11px;font-size:var(--t-md);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
select.form-input{cursor:pointer}

/* Modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);width:480px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.14)}
.modal-title{font-size:var(--t-lg);font-weight:700;margin-bottom:18px}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Slide-over ticket panel (styled after the ERP's cart panel) */
#tk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:600;display:none}
#tk-overlay.open{display:block}
#tk-panel{position:fixed;top:0;right:0;bottom:0;width:var(--tk-w,960px);max-width:96vw;background:var(--bg);border-left:1px solid var(--border2);z-index:601;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 24px rgba(0,0,0,.12)}
#tk-panel.open{transform:translateX(0)}
#tk-panel[data-w="narrow"]{--tk-w:520px}
#tk-panel[data-w="wide"]{--tk-w:960px}
#tk-panel[data-w="full"]{--tk-w:1600px}
/* Once there is real width to work with, stop stretching single fields across the whole
   panel - two columns reads far better. Below this the panel stays single-column. */
#tk-panel[data-w="wide"] .tk-body .form-row.cols-2,
#tk-panel[data-w="full"] .tk-body .form-row.cols-2{grid-template-columns:1fr 1fr}
#tk-panel .tk-body{max-width:100%}
.tk-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;background:var(--bg2)}
.tk-head-title{font-size:var(--t-lg);font-weight:700;color:var(--text);flex:1}
.tk-close{background:none;border:none;font-size:var(--t-xl);color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:var(--r-sm)}
.tk-close:hover{background:var(--bg4);color:var(--text)}
.tk-body{flex:1;overflow-y:auto;padding:16px 18px}
#threadBox{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;background:var(--bg2)}
.tk-foot{padding:14px 18px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);display:flex;gap:8px}

.linked-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin:10px 0;font-size:var(--t-md);color:var(--text2)}
.linked-box .lk-title{font-weight:700;font-size:var(--t-xs);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
/* ---- Wholesale application card (v1.22) ---- */
.wsa{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg);margin:10px 0;overflow:hidden}
.wsa-hd{padding:11px 13px;background:var(--bg2);border-bottom:1px solid var(--border)}
.wsa-hd-t{font-size:var(--t-sm);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
.wsa-hd-b{font-size:var(--t-lg);font-weight:700;color:var(--text);margin-top:5px;line-height:1.3}
.wsa-hd-s{font-size:var(--t-sm);color:var(--text3);margin-top:2px}
.wsa-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.wsa-sec{padding:10px 13px;border-bottom:1px solid var(--border)}
.wsa-sec:last-child{border-bottom:none}
.wsa-sec-t{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.wsa-row{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:4.5px 0;align-items:baseline}
.wsa-row+.wsa-row{border-top:1px solid var(--border)}
.wsa-k{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);line-height:1.5}
.wsa-v{font-size:var(--t-md);color:var(--text);word-break:break-word;line-height:1.45}
.wsa-v a{color:var(--blue);text-decoration:none}
.wsa-v a:hover{text-decoration:underline}
.wsa-v.mono{font-family:var(--mono);font-size:var(--t-sm)}
.wsa-v.strong{font-weight:700}
.wsa-blk{font-size:var(--t-md);color:var(--text2);white-space:pre-wrap;line-height:1.5}
.wsa-blk.muted{color:var(--text3);font-style:italic}
.wsa-addr{font-size:var(--t-md);color:var(--text);line-height:1.55;white-space:pre-wrap}
.wsa-code{display:inline-block;font-family:var(--mono);font-size:var(--t-md);font-weight:700;color:var(--teal);background:var(--teal-dim);border:1px solid rgba(13,148,136,.25);border-radius:var(--r);padding:3px 9px;letter-spacing:.04em}
.wsa-acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px;background:var(--bg2);border-top:1px solid var(--border)}
.wsa-btn{font-family:inherit;font-size:var(--t-sm);font-weight:700;letter-spacing:.03em;padding:6px 11px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.wsa-btn:hover{background:var(--bg3);border-color:var(--text3);color:var(--text)}
.wsa-btn.on{background:var(--teal-dim);border-color:rgba(13,148,136,.35);color:var(--teal)}
.wsa-warn{margin:0;padding:9px 13px;background:var(--orange-dim);border-top:1px solid rgba(234,88,12,.25);font-size:var(--t-sm);color:var(--orange);font-weight:600;line-height:1.45}
.wsa-warn ul{margin:5px 0 0;padding-left:16px;font-weight:500}
.wsa-raw{margin:0;padding:11px 13px;background:var(--bg3);border-top:1px solid var(--border);font-family:var(--mono);font-size:var(--t-sm);color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:320px;overflow:auto}

.tabs-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;font-size:var(--t-sm);font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}

.msg{border-radius:var(--r-lg);padding:10px 13px;margin-bottom:8px;font-size:var(--t-md);line-height:1.5}
.msg.customer{background:var(--blue-dim)}
.msg.staff{background:var(--teal-dim)}
.msg.system{background:var(--bg3);color:var(--text3);font-style:italic}
.msg.note{background:var(--orange-dim);border:1px dashed var(--orange)}
.msg .meta{font-size:var(--t-xs);color:var(--text3);margin-bottom:3px;display:flex;gap:6px;align-items:center;font-weight:600}
.checkbox-row{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--text3);margin-top:6px}

#toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:var(--r);font-size:var(--t-md);z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.1)}
#toast.show{opacity:1}
#toast.err{border-color:rgba(220,38,38,.4);color:var(--red)}

.empty{text-align:center;padding:40px;color:var(--text3);font-size:var(--t-md)}.watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.05}.watermark img{width:420px;height:auto}

/* Login gate */
#auth-gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
#auth-gate.hidden{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:var(--r-sm);border:2px solid var(--bg2)}

body{font-size:var(--t-md)}
.main{background:#ECEEF0}
.watermark{opacity:.09}
.watermark img{width:640px}
/* header: aligned signature line + machined title */
.topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(3px);height:var(--hdrh)!important;min-height:var(--hdrh)!important}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--teal) 0,var(--teal) 6%,var(--orange) 55%,rgba(0,0,0,0) 94%)}
.topbar-title{font-size:var(--t-2xl);font-weight:800;letter-spacing:.005em;display:flex;flex-direction:column;gap:2px;line-height:1.1}
.tb-eb{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;letter-spacing:.18em;color:var(--text3)}
.tb-tt{font-size:var(--t-2xl);font-weight:800;text-transform:uppercase;letter-spacing:.012em;color:var(--text)}
/* sidebar: pinned logo, teal line meets the header bar */
.sidebar-logo{position:sticky;top:0;z-index:30;background:var(--bg2);height:var(--hdrh)!important;min-height:var(--hdrh)!important;max-height:var(--hdrh)!important;box-sizing:border-box!important;padding:0 16px!important;display:flex;align-items:center}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--teal)}
.nav-item{border-radius:var(--r-sm)}
.sidebar-footer .sync-pill{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 120px;background-position:var(--cb-p);border:none;border-radius:var(--r-sm);padding:8px 12px;box-shadow:0 2px 6px rgba(17,24,39,.3),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.55)}
.sidebar-footer .sync-label{color:#E2E8EB}
.sidebar-footer .sync-sub{color:#B7C1C7}
/* KPI cluster: one continuous forged-carbon sheet */
.kpi-grid{gap:0;border-radius:var(--r-lg);overflow:hidden;background-color:var(--cb-c);background-image:var(--cb-i);background-size:var(--cb-s);background-position:var(--cb-p);box-shadow:0 3px 12px rgba(17,24,39,.32),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.6)}
.kpi,.kpi:hover{background:transparent!important;border:none;border-radius:0;border-left:1px solid rgba(255,255,255,.22)}
.kpi:first-child{border-left:none}
.kpi-label{color:#E4E9EC;text-shadow:0 1px 2px rgba(0,0,0,.75);font-size:var(--t-xs);letter-spacing:.12em}
.kpi-value{color:#EDF1F0;text-shadow:0 1px 3px rgba(0,0,0,.75);font-size:27px;font-weight:600;letter-spacing:-.01em}
.kpi-sub{color:#BCC6CC;text-shadow:0 1px 2px rgba(0,0,0,.75);font-size:var(--t-sm)}
.kpi-teal .kpi-value{color:#2BC7B1}
.kpi-green .kpi-value{color:#4ADE9F}
.kpi-orange .kpi-value{color:#F0812E}
.kpi-red .kpi-value{color:#FF8A5B}
.kpi-yellow .kpi-value{color:#F2C14E}
.kpi-blue .kpi-value{color:#7FB5FF}
.kpi .kpi-value[style*="var(--text)"]{color:#EDF1F0!important}
.kpi .kpi-value[style*="var(--red)"]{color:#FF8A5B!important}
.kpi .kpi-value[style*="var(--yellow)"]{color:#F2C14E!important}
.kpi .kpi-value[style*="var(--green)"]{color:#4ADE9F!important}
.kpi .kpi-value[style*="var(--orange)"]{color:#F0812E!important}
.kpi .kpi-value[style*="var(--teal)"]{color:#2BC7B1!important}
/* tables: continuous carbon header band + teal bezel */
thead{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 140px;background-position:var(--cb-p);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
thead th{background:transparent;color:#E8EDF0;border-bottom:2px solid rgba(13,148,136,.6);text-shadow:0 1px 2px rgba(0,0,0,.75)}
tbody tr:hover{background:rgba(13,148,136,.05)}
tbody tr:hover td{background:rgba(13,148,136,.05)}
/* plates on the aluminum field */
.panel{background:rgba(255,255,255,.78);border-color:transparent;box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
.tbl-wrap{background:rgba(255,255,255,.66);border-color:transparent;box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
.modal{background:var(--bg);border-color:transparent;box-shadow:0 16px 48px rgba(14,20,24,.16),0 0 0 1px var(--border2)}
.btn{background:var(--bg);border-color:var(--border2)}
.btn:hover{background:#F2F4F6}
.btn-primary{background:var(--orange);border-color:var(--orange)}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn-teal{background:var(--teal-dim);border-color:rgba(13,148,136,.22)}
.form-input,.search-wrap input,input[type=text],input[type=email],select,textarea{background:var(--bg);border-color:var(--border2)}
.pill{border-radius:var(--r-sm)}
.tbl-wrap{border-radius:var(--r-md)}
#toast{border-radius:var(--r-sm)}
.sync-pill{border-radius:var(--r-sm)}
::-webkit-scrollbar-track{background:#ECEEF0}
/* mobile: 2-col kpi grid gets proper dividers; title ellipsis */
@media(max-width:768px){
  .kpi,.kpi:hover{border-left:none;border-top:1px solid rgba(255,255,255,.22)}
  .kpi:nth-child(even){border-left:1px solid rgba(255,255,255,.22)}
  .kpi:nth-child(-n+2){border-top:none}
  .tb-eb{display:none}
  .tb-tt{font-size:var(--t-lg);text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
}
/* print: carbon and field are screen-only */
@media print{
  thead,thead th{background:var(--bg3)!important;background-image:none!important;color:var(--text3)!important;text-shadow:none!important;border-bottom:1px solid var(--border)!important;box-shadow:none!important}
  .kpi,.kpi:hover{background:#fff!important;background-image:none!important;border:1px solid var(--border)!important;border-radius:var(--r-md)!important}
  .kpi-grid{gap:10px!important;box-shadow:none!important;overflow:visible!important;background:none!important;background-image:none!important}
  .kpi-label,.kpi-sub{color:var(--text3)!important;text-shadow:none!important}
  .kpi-value{color:var(--text)!important;text-shadow:none!important}

<script>
/* ============================================================
   CONFIG — same Supabase project as the ERP
   ============================================================ */
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";

const TGK_SUPPORT_VERSION = 'v1.26';
const TGK_SUPPORT_BUILD_DATE = '2026-08-06';
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const IDLE_TIMEOUT_MS = 8 * 60 * 60 * 1000; // 8 hours, matches the ERP
const CHAT_IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes of no activity in this tab before auto-going-offline. Safe to exceed the server's 10-min staleness window: the 3-min heartbeat keeps the server fresh while the toggle is on, so this is the sole idle enforcer; the server window only catches dead tabs.

/* ============================================================
   STATE
   ============================================================ */
const S = {
  user: null,
  role: 'customer_service',
  page: 'dashboard',
  tickets: [],
  messages: {},
  activityLog: {},
  selectedTickets: new Set(),
  warranty: [],
  shipErrors: [],
  dealers: [],
  team: [],
  templates: [],
  settings: {},
  settingsTable: 'unknown',
  settingsTab: 'categories',
  activeTicket: null,
  filters: { status: '__active__', priority: '', source: '', category: '', tag: '', assignedTo: '', staleOnly: false, showArchived: false, q: '' },
  lastActivity: Date.now()
};
window.S = S;

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function desktopNotify(title, body, ticketId){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  // Skip if the tab is already focused and visible — the in-app toast covers that case
  if(document.hasFocus() && !document.hidden) return;
  try{
    const n = new Notification(title, { body, icon: undefined, tag: ticketId || undefined });
    n.onclick = () => {
      window.focus();
      if(ticketId){
        goPage('tickets');
        setTimeout(()=>openTicket(ticketId), 100);
      }
      n.close();
    };
  }catch(e){ /* non-critical */ }
}

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3200);
}
window.toast = toast;

function isUserActivelyWorking(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

// Any interaction in this tab resets the idle clock: mouse movement, clicks,
// typing, wheel, touch, scrolling (capture:true so scrolls inside panels count),
// and refocusing the tab after working elsewhere.
['mousemove','mousedown','keydown','wheel','touchstart'].forEach(function(evt){
  document.addEventListener(evt, function(){ S.lastActivity = Date.now(); }, { passive: true });
});
document.addEventListener('scroll', function(){ S.lastActivity = Date.now(); }, { passive: true, capture: true });
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) S.lastActivity = Date.now();
});
setInterval(async ()=>{
  if(Date.now() - S.lastActivity > IDLE_TIMEOUT_MS){
    sb.auth.signOut();
    location.reload();
    return;
  }
  // Chat availability has its own, much shorter idle timeout — someone who steps away shouldn't
  // keep showing as available to customers just because their tab is still open. Without this, the
  // heartbeat below would keep chat_available_updated_at fresh regardless of whether they're actually
  // at their desk, silently defeating the staleness check this is meant to back up.
  const chatToggle = document.getElementById('chatAvailableToggle');
  if(chatToggle && chatToggle.checked && Date.now() - S.lastActivity > CHAT_IDLE_TIMEOUT_MS){
    chatToggle.checked = false;
    await toggleChatAvailability(false); // awaited so its own generic toast fires first, not last
    toast('Live chat availability turned off - no activity for ' + Math.round(CHAT_IDLE_TIMEOUT_MS/60000) + ' minutes', true);
  }
}, 60000);

// Keeps chat_available_updated_at fresh every 3 minutes while the toggle
// is on, so availability doesn't silently expire (see check-chat-availability's
// 10-minute staleness window) just because nothing else changed.
setInterval(async ()=>{
  const toggle = document.getElementById('chatAvailableToggle');
  if(toggle && toggle.checked && S.user){
    try{ await sb.from('team_members').update({ chat_available_updated_at: new Date().toISOString() }).ilike('email', S.user.email); }catch(e){}
  }
}, 180000);

/* ============================================================
   AUTH
   ============================================================ */
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){
    errEl.textContent = e.message || 'Login failed.';
  }
}
window.doLogin = doLogin;

async function toggleChatAvailability(available){
  if(!S.user) return;
  try{
    await sb.from('team_members').update({
      chat_available: available,
      chat_available_updated_at: new Date().toISOString()
    }).ilike('email', S.user.email);
    toast(available ? 'You\'re now available for live chat' : 'You\'re now offline for live chat');
  }catch(e){
    toast('Failed to update availability: ' + e.message, true);
  }
}
window.toggleChatAvailability = toggleChatAvailability;

async function doLogout(){
  if(S.user){
    try{ await sb.from('team_members').update({ chat_available: false }).ilike('email', S.user.email); }catch(e){}
  }
  await sb.auth.signOut();
  location.reload();
}
window.doLogout = doLogout;

async function afterLogin(user){
  S.user = user;
  let lookupError = null;
  let row = null;
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(error) throw error;
    row = data;
  }catch(e){
    lookupError = e;
  }
  S.role = (row && row.role) ? row.role : null;

  if(!['admin','customer_service'].includes(S.role)){
    let msg = 'Your account does not have Support Center access.';
    if(lookupError){
      msg += ` (profiles lookup failed: ${lookupError.message})`;
      console.error('profiles lookup error:', lookupError);
    } else if(!row){
      msg += ` No profiles row found for user id ${user.id}.`;
    } else {
      msg += ` Role on file: "${row.role}".`;
    }
    document.getElementById('login-error').textContent = msg;
    console.log('Support Center access check — user:', user.email, 'row:', row, 'error:', lookupError);
    await sb.auth.signOut();
    return;
  }
  document.getElementById('auth-gate').classList.add('hidden');
  document.getElementById('tgk-app').style.display = 'block';
  document.getElementById('userLabel').textContent = user.email;
  const vb = document.getElementById('support-version-badge'); if(vb) vb.textContent = TGK_SUPPORT_VERSION;
  const bd = document.getElementById('support-build-date'); if(bd) bd.textContent = TGK_SUPPORT_BUILD_DATE;
  await loadAll();
  renderNav();
  goPage('dashboard');
  setupBackButton();
  subscribeRealtime();

  try{
    const { data: myRow } = await sb.from('team_members').select('chat_available').ilike('email', user.email).maybeSingle();
    const toggle = document.getElementById('chatAvailableToggle');
    if(toggle) toggle.checked = !!(myRow && myRow.chat_available);
  }catch(e){ /* non-critical */ }

  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

(async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await afterLogin(data.session.user); }
})();

/* ============================================================
   SSO — when opened inline inside the Command Center (as an iframe),
   accept the auth token it posts so staff don't have to log in twice.
   Same pattern as the ERP's own Command Center integration.

   Security note: this checks the message shape (source/type) but does
   NOT restrict which origin can send it. If you know the Command
   Center's exact hosted URL, tighten this by also checking
   event.origin === 'https://your-command-center-domain' below.
   ============================================================ */
window.addEventListener('message', async (event) => {
  if (event.origin !== 'https://command.tgkmotorsport.com') return; // [SSO] only accept the token from the Command Center's own origin
  if (!event.data || event.data.source !== 'TGK_CC' || event.data.type !== 'AUTH_TOKEN') return;
  try{
    const { error } = await sb.auth.setSession({
      access_token: event.data.access_token,
      refresh_token: event.data.refresh_token || ''
    });
    if(error){ console.error('SSO setSession failed:', error.message); return; }
    const { data: sessionData } = await sb.auth.getSession();
    if(sessionData?.session && !S.user){
      await afterLogin(sessionData.session.user);
    }
  }catch(e){
    console.error('SSO token accept failed:', e);

/* ============================================================
   DATA LOADING
   ============================================================ */
async function fetchAll(queryFn, pageSize=1000){
  let all = [], from = 0;
  while(true){
    const { data, error } = await queryFn(from, from + pageSize - 1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function loadAll(){
  try{
    const [tickets, warranty, shipErrors, dealers, team, templates] = await Promise.all([
      fetchAll((f,t)=> sb.from('tickets').select('*').order('created_at',{ascending:false}).range(f,t)),
      fetchAll((f,t)=> sb.from('warranty_claims').select('*').order('created_at',{ascending:false}).range(f,t)),
      fetchAll((f,t)=> sb.from('shipment_errors').select('*').order('created_at',{ascending:false}).range(f,t)),
      sb.from('dealers').select('id,name,email').then(r=>r.data||[]),
      sb.from('team_members').select('email,display_name').then(r=>r.data||[]),
      sb.from('ticket_templates').select('*').order('sort_order',{ascending:true}).then(r=>r.data||[]),
      loadSettings() // resolves to undefined; writes straight into S.settings
    ]);
    S.tickets = tickets;
    S.warranty = warranty;
    S.shipErrors = shipErrors;
    S.dealers = dealers;
    S.team = team;
    S.templates = templates;
  }catch(e){
    toast('Failed to load data: ' + e.message, true);
  }
}

async function loadMessages(ticketId){
  const { data, error } = await sb.from('ticket_messages').select('*').eq('ticket_id', ticketId).order('created_at',{ascending:true});
  if(error){ toast('Failed to load messages', true); return []; }
  S.messages[ticketId] = data;
  return data;
}

/* ============================================================
   REALTIME
   ============================================================ */
function subscribeRealtime(){
  sb.channel('support-tickets')
    .on('postgres_changes', { event:'*', schema:'public', table:'tickets' }, payload=>{
      if(isUserActivelyWorking() && S.page==='ticket_detail') return;
      handleTicketRealtime(payload);
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'ticket_messages' }, payload=>{
      const m = payload.new;
      if(!S.messages[m.ticket_id]) S.messages[m.ticket_id] = [];
      const alreadyHave = S.messages[m.ticket_id].some(x=>x.id===m.id);
      if(!alreadyHave){
        S.messages[m.ticket_id].push(m);
        if(S.activeTicket && S.activeTicket.id === m.ticket_id){
          document.getElementById('threadBox').innerHTML = renderThread(S.messages[m.ticket_id], showingNotes);
          scrollThreadToBottom();
        } else if(m.sender_type === 'customer' && !m.is_internal_note){
          const t = S.tickets.find(x=>x.id===m.ticket_id);
          const nowStr = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
          toast('New reply on ticket' + (t ? ' #' + t.ticket_number : '') + ' from ' + (m.sender_name||'customer') + ' · ' + nowStr);
          desktopNotify(
            '<span class="ic ic-chat"></span>New reply' + (t ? ' — Ticket #' + t.ticket_number : ''),
            (m.sender_name||'Customer') + ': ' + (m.body||'').slice(0,120),
            m.ticket_id
          );
        }
      }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'warranty_claims' }, payload=>{
      if(payload.eventType==='DELETE'){ handleErpClaimDelete('warranty', payload.old); }
      else if(payload.eventType==='UPDATE'){ handleErpClaimUpdate('warranty', payload.old, payload.new); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'shipment_errors' }, payload=>{
      if(payload.eventType==='DELETE'){ handleErpClaimDelete('shipment_error', payload.old); }
      else if(payload.eventType==='UPDATE'){ handleErpClaimUpdate('shipment_error', payload.old, payload.new); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'ticket_templates' }, payload=>{
      if(payload.eventType==='INSERT'){ if(!(S.templates||[]).some(x=>x.id===payload.new.id)) S.templates=[...(S.templates||[]),payload.new]; }
      else if(payload.eventType==='UPDATE'){ S.templates=(S.templates||[]).map(x=>x.id===payload.new.id?payload.new:x); }
      else if(payload.eventType==='DELETE'){ S.templates=(S.templates||[]).filter(x=>x.id!==(payload.old&&payload.old.id)); }
      var _pk=document.getElementById('tmplPicker'); if(_pk && S.activeTicket) _pk.innerHTML=templatePickerOptions(S.activeTicket);
      if(document.getElementById('tmpl-mgr-body')) renderTemplateManagerBody();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'support_settings' }, function(payload){
      var row = payload.new || payload.old; if(!row || !row.key) return;
      if(payload.eventType === 'DELETE') delete S.settings[row.key];
      else S.settings[row.key] = row.value;
      renderNav();
      if(S.page === 'settings') renderSettings();
      else if(S.page === 'tickets' || S.page === 'dashboard') renderPage();
    })
    .subscribe();
}

/* ============================================================
   ERP → TICKET PING-BACK
   When the ERP ships a warranty claim (status → 'Shipped') or a
   shipment error (tracking_number newly set / status → 'Reshipping'),
   reflect that on the linked ticket automatically: bump its status,
   flag it unread, and drop an internal note so staff see it happened
   without having to go check the ERP themselves.
   ============================================================ */
async function handleErpClaimUpdate(kind, oldRow, newRow){
  const idx = kind==='warranty' ? S.warranty.findIndex(w=>w.id===newRow.id) : S.shipErrors.findIndex(e=>e.id===newRow.id);
  if(idx!==-1){ if(kind==='warranty'){ S.warranty[idx]=newRow; } else { S.shipErrors[idx]=newRow; } }
  if(S.page==='warranty' || S.page==='shiperrors') renderPage();

  const justShipped = (!oldRow.tracking_number && newRow.tracking_number) ||
    (oldRow.status !== newRow.status && ['Shipped','Reshipping'].includes(newRow.status));
  if(!justShipped) return;

  const ticket = kind==='warranty'
    ? S.tickets.find(t=>t.warranty_claim_id===newRow.id)
    : S.tickets.find(t=>t.shipment_error_id===newRow.id);
  if(!ticket) return;

  try{
    const noteBody = `<span class="ic ic-box"></span>ERP update: ${kind==='warranty'?'Warranty claim':'Shipment error'} marked as shipped`
      + (newRow.carrier ? ` via ${newRow.carrier}` : '')
      + (newRow.tracking_number ? ` — tracking: ${newRow.tracking_number}` : '')
      + `. Ticket marked resolved automatically — if the customer replies, it'll reopen. (Synced automatically from the ERP.)`;

    await sb.from('ticket_messages').insert({
      ticket_id: ticket.id,
      sender_type: 'system',
      sender_name: 'System',
      body: noteBody,
      is_internal_note: true
    });

    const needsUpdate = ticket.status !== 'closed';
    const { data: updated, error } = await sb.from('tickets').update({
      status: needsUpdate ? 'resolved' : ticket.status,
      resolved_at: needsUpdate ? new Date().toISOString() : ticket.resolved_at,
      has_unread: true,
      updated_at: new Date().toISOString()
    }).eq('id', ticket.id).select().single();
    if(error) throw error;

    const tIdx = S.tickets.findIndex(t=>t.id===ticket.id);
    if(tIdx!==-1) S.tickets[tIdx] = updated;
    if(S.activeTicket && S.activeTicket.id===ticket.id){
      S.activeTicket = updated;
      await loadMessages(ticket.id);
      renderTicketPanel(updated);
    }
    toast(`Ticket #${updated.ticket_number} marked resolved — shipped from the ERP`);
    renderNav();
    if(S.page==='tickets' || S.page==='dashboard') renderPage();
  }catch(e){
    console.error('Failed to sync ERP shipment back to ticket:', e);
  }
}

function handleTicketRealtime(payload){
  const idx = S.tickets.findIndex(t=>t.id === (payload.new?.id || payload.old?.id));
  if(payload.eventType === 'INSERT'){
    if(idx === -1) S.tickets.unshift(payload.new);
    if(payload.new.is_live_chat){
      toast('<span class="ic ic-chat"></span>New live chat from ' + (payload.new.customer_name||'a visitor'));
      desktopNotify('<span class="ic ic-chat"></span>New Live Chat', (payload.new.customer_name||'A visitor') + ' started a chat', payload.new.id);
    } else {
      toast('New ticket: ' + payload.new.subject);
      desktopNotify('<span class="ic ic-ticket"></span>New Ticket #' + payload.new.ticket_number, payload.new.subject, payload.new.id);
    }
  } else if(payload.eventType === 'UPDATE'){
    if(idx !== -1) S.tickets[idx] = payload.new;
  } else if(payload.eventType === 'DELETE'){
    if(idx !== -1) S.tickets.splice(idx,1);
  }
  renderNav();
  if(S.page === 'tickets' || S.page === 'dashboard') renderPage();
}

function renderCategorySubnav(){

function setupBackButton(){
  // Trap the phone/browser Back button so it dismisses the current layer instead of closing the app.
  // Order: modal -> ticket panel -> mobile sidebar drawer -> non-dashboard page. One spare history
  // entry is kept and re-armed after each dismissal; only a Back from the dashboard (nothing open) exits.
  try{ history.pushState({tkTrap:1}, ''); }catch(_){}
  window.addEventListener('popstate', function(){
    const ov=document.getElementById('modalOverlay');
    const modalOpen = ov && !ov.classList.contains('hidden') && (ov.innerHTML||'').trim()!=='';
    const panel=document.getElementById('tk-panel');
    const panelOpen = panel && panel.classList.contains('open');
    const drawer=document.querySelector('.sidebar-wrap');
    const drawerOpen = drawer && drawer.classList.contains('mobile-open');
    let handled=false;
    if(modalOpen){ try{closeModal();}catch(_){} handled=true; }
    else if(panelOpen){ try{closePanel();}catch(_){} handled=true; }
    else if(drawerOpen){ try{closeMobileSidebar();}catch(_){} handled=true; }
    else if(S.page && S.page!=='dashboard'){ try{goPage('dashboard');}catch(_){} handled=true; }
    if(handled){ try{ history.pushState({tkTrap:1}, ''); }catch(_){} }
    // else: at dashboard with nothing open -> allow the app to close (do not re-arm)
  });
}
window.setupBackButton = setupBackButton;

async function bulkUpdateField(field, value){
  const ids = Array.from(S.selectedTickets);
  if(!ids.length) return;
  try{
    const patch = { [field]: value, updated_at: new Date().toISOString() };
    if(field==='status' && (value==='resolved'||value==='closed')) patch.resolved_at = new Date().toISOString();
    const { data, error } = await sb.from('tickets').update(patch).in('id', ids).select();
    if(error) throw error;
    (data||[]).forEach(updated=>{
      const idx = S.tickets.findIndex(x=>x.id===updated.id);
      if(idx!==-1) S.tickets[idx] = updated;
    });
    // Log activity per ticket (best-effort, doesn't block on failure)
    ids.forEach(id=> logActivity(id, field, null, value));
    toast(`Updated ${ids.length} ticket${ids.length===1?'':'s'}`);
    renderNav();
    renderTicketsList();
  }catch(e){
    toast('Bulk update failed: ' + e.message, true);
  }
}

function bulkSetStatus(status){ bulkUpdateField('status', status); }
window.bulkSetStatus = bulkSetStatus;

function bulkSetPriority(priority){ bulkUpdateField('priority', priority); }
window.bulkSetPriority = bulkSetPriority;

function bulkAssign(value){ bulkUpdateField('assigned_to', value==='__unassigned__' ? null : value); }
window.bulkAssign = bulkAssign;

function csvEscape(val){
  if(val==null) return '';
  const s = String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportTicketsToCSV(){
  const list = filteredTickets();
  if(!list.length){ toast('Nothing to export with the current filters', true); return; }

  const headers = [
    'Ticket #','Subject','Status','Priority','Source','Tags',
    'Customer Name','Customer Email','Customer Phone',
    'Order Number','Part Number','Assigned To',
    'Created At','Updated At','Resolved At','Archived',
    'Refund Amount','Restocking Fee','Refund Status','Shopify Refund ID',
    'Return Tracking Number','Return Carrier'
  ];

  const rows = list.map(t => [
    t.ticket_number,
    t.subject,
    label(t.status),
    label(t.priority),
    label(t.source),
    (t.tags||[]).join('; '),
    t.customer_name,
    t.customer_email,
    t.customer_phone,
    t.order_number,
    t.pn,
    t.assigned_to,
    t.created_at,
    t.updated_at,
    t.resolved_at,
    t.archived ? 'Yes' : 'No',
    t.refund_amount,
    t.restocking_fee,
    t.refund_status,
    t.shopify_refund_id,
    t.return_tracking_number,
    t.return_carrier
  ]);

  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tgk-tickets-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${list.length} ticket${list.length===1?'':'s'} to CSV`);
}
window.exportTicketsToCSV = exportTicketsToCSV;

/* ===== Ticket categories + reply templates =====
   Categories, tag presets and the stale threshold are stored in the Supabase
   table public.support_settings (key text PK, value jsonb). They are exposed
   here as live window getters so every existing call site picks up edits with
   no code change. If the table is missing or empty the built-in defaults below
   are used, so the app can never end up with an empty category list. */

var TK_CATEGORY_DEFAULTS = [
  { name:'Inquiry',          color:'pill-muted'  },
  { name:'Return',           color:'pill-orange' },
  { name:'Warranty',         color:'pill-red'    },
  { name:'Shipment Error',   color:'pill-yellow' },
  { name:'Wholesale/Dealer', color:'pill-teal'   },
  { name:'Other',            color:'pill-muted'  }
];
var TAG_PRESET_DEFAULTS = ['Shipping','Warranty/Defect','Billing','Return/Refund','Part Compatibility','General Question','Other'];
var STALE_HOURS_DEFAULT = 24;
var PILL_COLORS = [
  { v:'pill-muted',  label:'Grey'   },
  { v:'pill-teal',   label:'Teal'   },
  { v:'pill-orange', label:'Orange' },
  { v:'pill-red',    label:'Red'    },
  { v:'pill-green',  label:'Green'  },
  { v:'pill-yellow', label:'Yellow' }
];

function tkCategoryList(){
  var v = S.settings && S.settings.ticket_categories;
  if(Array.isArray(v) && v.length){
    return v.filter(function(c){ return c && c.name; })
            .map(function(c){ return { name:String(c.name), color:c.color||'pill-muted' }; });
  }
  return TK_CATEGORY_DEFAULTS;
}
function tkCategoryColor(name){
  if(!name) return 'pill-muted';
  var row = tkCategoryList().filter(function(c){ return c.name === name; })[0];
  return (row && row.color) ? row.color : 'pill-muted';
}
function categoryTicketCount(name){
  return S.tickets.filter(function(t){ return (t.category||'') === name; }).length;
}
Object.defineProperty(window, 'TK_CATEGORY_OPTIONS', {
  configurable: true,
  get: function(){ return tkCategoryList().map(function(c){ return c.name; }); }
});
Object.defineProperty(window, 'TICKET_CATEGORIES', {
  configurable: true,
  get: function(){
    var v = S.settings && S.settings.tag_presets;
    return (Array.isArray(v) && v.length) ? v.map(String) : TAG_PRESET_DEFAULTS;
  }
});
Object.defineProperty(window, 'STALE_THRESHOLD_HOURS', {
  configurable: true,
  get: function(){
    var n = Number(S.settings && S.settings.stale_hours);
    return (isFinite(n) && n > 0) ? n : STALE_HOURS_DEFAULT;
  }
});

// Pull every settings row into S.settings. A missing table is not fatal: the
// app falls back to defaults and the Settings page shows the setup SQL.
async function loadSettings(){
  try{
    var r = await sb.from('support_settings').select('key,value');
    if(r.error) throw r.error;
    var out = {};
    (r.data||[]).forEach(function(row){ out[row.key] = row.value; });
    S.settings = out;
    S.settingsTable = 'ok';
  }catch(e){
    S.settings = {};
    S.settingsTable = 'missing';
    console.warn('support_settings unavailable - using built-in defaults:', e.message);
  }
}

async function saveSetting(key, value){
  if(S.settingsTable === 'missing'){
    toast('Cannot save: the support_settings table does not exist yet (see the SQL Setup tab)', true);
    return false;
  }
  try{
    var r = await sb.from('support_settings')
      .upsert({ key:key, value:value, updated_at:new Date().toISOString(), updated_by:(S.user&&S.user.email)||null }, { onConflict:'key' })
      .select().single();
    if(r.error) throw r.error;
    S.settings[key] = r.data.value;
    return true;
  }catch(e){
    toast('Save failed: ' + e.message, true);
    return false;
  }
}

// Fallback category (for defaulting the template picker) when a ticket has no explicit category yet
function ticketCategory(t){
  if(!t) return 'Inquiry';
  if(t.category) return t.category;
  var m = { warranty:'Warranty', shipment_error:'Shipment Error' };
  return m[t.source] || 'Inquiry';
}

// Options for the composer template picker: current-category templates first, then the rest
function templatePickerOptions(t){
  var cat = ticketCategory(t);
  var all = (S.templates||[]);
  if(!all.length) return '<option value="">No templates yet - click Edit</option>';
  var inCat = all.filter(function(x){ return (x.category||'')===cat; });
  var others = all.filter(function(x){ return (x.category||'')!==cat; });
  function opt(x){ return '<option value="'+x.id+'">'+escapeHtml(x.title)+'</option>'; }
  var html = '<option value="">Insert template...</option>';
  if(inCat.length) html += '<optgroup label="'+escapeHtml(cat)+'">'+inCat.map(opt).join('')+'</optgroup>';
  if(others.length) html += '<optgroup label="Other templates">'+others.map(opt).join('')+'</optgroup>';
  return html;
}

// Replace {{tokens}} with live ticket data where available; unknown tokens are left untouched
function fillTemplateTokens(body, t){
  var agent = (S.user && S.user.email) ? (friendlyStaffName()||S.user.email) : '';
  var wc = (t && t.warranty_claim_id) ? (S.warranty.find(function(w){return w.id===t.warranty_claim_id;})||{}) : {};
  var se = (t && t.shipment_error_id) ? (S.shipErrors.find(function(e){return e.id===t.shipment_error_id;})||{}) : {};
  var map = {
    order_number: (t && t.order_number) ? t.order_number : '',
    customer_name: (t && t.customer_name) ? t.customer_name : '',
    first_name: (t && t.customer_name) ? String(t.customer_name).trim().split(/\s+/)[0] : '',
    customer_email: (t && t.customer_email) ? t.customer_email : '',
    pn: (t && t.pn) || wc.pn || se.pn || '',
    tracking: (t && t.tracking_number) || wc.tracking_number || se.tracking_number || '',
    ticket_number: (t && t.ticket_number!=null) ? ('#'+t.ticket_number) : '',
    agent: agent
  };
  return String(body||'').replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, function(m0, key){
    var k = key.toLowerCase();
    return (k in map) ? map[k] : m0;
  });
}

// Insert a template into the reply box (append if there is already a draft), tokens filled

}

async function saveTemplate(id){
  var title = (document.getElementById('tm-title').value||'').trim();
  var cat = document.getElementById('tm-cat').value||null;
  var bodyTxt = (document.getElementById('tm-body').value||'').trim();

      if(up.error) throw up.error;

    } else {
      var ins = await sb.from('ticket_templates').insert({ title:title, category:cat, body:bodyTxt, created_by:(S.user&&S.user.email)||null }).select().single();

function filteredTickets(){
  let list = S.tickets.slice();
  const f = S.filters;
  if(!f.showArchived) list = list.filter(t=>!t.archived);
  if(f.status === '__active__') list = list.filter(t=>!['resolved','closed'].includes(t.status));
  else if(f.status) list = list.filter(t=>t.status===f.status);
  if(f.priority) list = list.filter(t=>t.priority===f.priority);
  if(f.source) list = list.filter(t=>t.source===f.source);
  if(f.category === '__none__') list = list.filter(t=>!t.category);
  else if(f.category) list = list.filter(t=>(t.category||'')===f.category);
  if(f.tag) list = list.filter(t=>(t.tags||[]).includes(f.tag));
  if(f.assignedTo === '__unassigned__') list = list.filter(t=>!t.assigned_to);
  else if(f.assignedTo) list = list.filter(t=>t.assigned_to===f.assignedTo);
  if(f.staleOnly) list = list.filter(isStale);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t=>
      (t.subject||'').toLowerCase().includes(q) ||
      (t.customer_name||'').toLowerCase().includes(q) ||
      (t.customer_email||'').toLowerCase().includes(q) ||
      (t.order_number||'').toLowerCase().includes(q) ||
      (t.pn||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function label(s){ return (s||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }

const CLAIM_DONE_STATUSES = ['Resolved','Closed','Denied'];
function isActiveClaim(status){ return !CLAIM_DONE_STATUSES.includes(status); }

/* STALE_THRESHOLD_HOURS is now a live getter defined with the settings block above. */
function isStale(t){
  if(!['open','pending'].includes(t.status)) return false;
  return (Date.now() - new Date(t.updated_at).getTime()) > STALE_THRESHOLD_HOURS * 3600000;
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(dstr){
  if(!dstr) return '—';
  const diff = Date.now() - new Date(dstr).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

async function convertToTicket(kind, recordId){
  const record = kind==='warranty' ? S.warranty.find(w=>w.id===recordId) : S.shipErrors.find(e=>e.id===recordId);
  if(!record){ toast('Record not found', true); return; }
  const recordPn = kind==='warranty' ? record.pn : record.expected_pn;
  const subject = kind==='warranty'
    ? `Warranty claim — order #${record.order_number||'?'} / ${recordPn||'?'}`
    : `Shipment error — order #${record.order_number||'?'} / ${recordPn||'?'}`;
  const payload = {
    source: kind==='warranty' ? 'warranty' : 'shipment_error',
    status: 'open',
    priority: 'medium',
    subject,
    order_number: record.order_number || null,
    pn: recordPn || null,
    warranty_claim_id: kind==='warranty' ? record.id : null,
    shipment_error_id: kind==='shipment_error' ? record.id : null,
  };
  try{
    const { data, error } = await sb.from('tickets').insert(payload).select().single();
    if(error) throw error;
    S.tickets.unshift(data);
    toast('Ticket #' + data.ticket_number + ' created');
    goPage('tickets');
    openTicket(data.id);
  }catch(e){
    toast('Failed to create ticket: ' + e.message, true);
  }
}

/* Item type sent to the ERP per warranty line. "Finished Good" was added so Support can send the
   warehouse ANY saleable item, not just tracked parts/assemblies. This 'type' string is the contract
   the ERP's ship logic reads to decide where to deduct inventory -- keep the values in sync with it. */
const CLAIM_ITEM_TYPE_OPTIONS = [
  { value:'part', label:'Part' },
  { value:'assembly', label:'Assembly' },
  { value:'finished_good', label:'Finished Good' }
];

// Classify a SKU via assemblies + parts (canonical pn OR new_sku). Anything that is neither a tracked
// part nor assembly is treated as a finished good so it can still be shipped. Supabase queries resolve
// with {data,error} (no throw), so a table without a new_sku column just yields an ignorable error.
async function resolveClaimItemType(pn){
  pn = (pn||'').trim();
  if(!pn) return 'part';
  const inTable = async (table) => {
    try{
      const [byPn, byNew] = await Promise.all([
        sb.from(table).select('pn').eq('pn', pn).limit(1),
        sb.from(table).select('pn').eq('new_sku', pn).limit(1)
      ]);
      return !!((byPn.data && byPn.data.length) || (byNew.data && byNew.data.length));
    }catch(e){ return false; }
  };
  if(await inTable('assemblies')) return 'assembly';
  if(await inTable('parts')) return 'part';
  return 'finished_good';
}
window.resolveClaimItemType = resolveClaimItemType;

/* When a linked warranty claim / shipment error is DELETED in the ERP, purge it from our cache so the
   ticket stops showing "Sent to ERP" and the send buttons reappear -- letting staff resend a correction. */
function handleErpClaimDelete(kind, oldRow){
  if(!oldRow || oldRow.id==null) return;
  if(kind==='warranty'){ S.warranty = S.warranty.filter(w=>w.id!==oldRow.id); }
  else { S.shipErrors = S.shipErrors.filter(e=>e.id!==oldRow.id); }
  if(['warranty','shiperrors','tickets','dashboard'].includes(S.page)) renderPage();
  if(S.activeTicket && ((kind==='warranty' && S.activeTicket.warranty_claim_id===oldRow.id) || (kind==='shipment_error' && S.activeTicket.shipment_error_id===oldRow.id))){
    openTicket(S.activeTicket.id);
    toast('Linked ERP record was deleted \u2014 you can resend a correction');
  }
}

   warranty claim / shipment error can be created fresh. Warns if the old record still exists. */
async function resendToERP(ticketId, kind){
  const t = S.tickets.find(x=>x.id===ticketId);
  if(!t){ toast('Ticket not found', true); return; }
  const table = kind==='warranty' ? 'warranty_claims' : 'shipment_errors';
  const linkedId = kind==='warranty' ? t.warranty_claim_id : t.shipment_error_id;
  let existing=null;
  if(linkedId){ try{ const { data } = await sb.from(table).select('*').eq('id',linkedId).maybeSingle(); existing=data; }catch(e){} }
  if(existing){
    const shipped = existing.tracking_number || existing.return_tracking || existing.return_tracking_number;
    const msg = shipped
      ? 'Heads up: the existing ERP record was already SHIPPED (tracking '+(existing.tracking_number||existing.return_tracking||existing.return_tracking_number)+').\n\nResending creates a brand-new record and a duplicate shipment request. Continue only if the warehouse truly needs to ship again.\n\nResend anyway?'
      : 'The existing ERP record is still there.\n\nDelete it in the ERP first to avoid a duplicate in the warehouse queue, then resend.\n\nResend anyway? (this unlinks the ticket from that record)';
    if(!confirm(msg)) return;
  }
  // purge stale cache + unlink the ticket so the corrected send starts clean
  if(kind==='warranty'){ S.warranty = S.warranty.filter(w=>w.id!==linkedId); }
  else { S.shipErrors = S.shipErrors.filter(e=>e.id!==linkedId); }
  const patch = kind==='warranty' ? { warranty_claim_id:null } : { shipment_error_id:null };
  try{ await sb.from('tickets').update({ ...patch, updated_at:new Date().toISOString() }).eq('id',ticketId); }catch(e){ toast('Could not unlink ticket: '+(e.message||''), true); return; }
  const idx = S.tickets.findIndex(x=>x.id===ticketId);
  const merged = { ...t, ...patch };
  if(idx!==-1) S.tickets[idx]=merged;
  S.activeTicket = merged;
  toast('Ticket unlinked \u2014 send the corrected details');
  openSendToERPModal(ticketId, kind);
}

async function confirmSendToERP(ticketId, kind){
  const table = kind==='warranty' ? 'warranty_claims' : 'shipment_errors';
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  let payload;
  if(kind==='warranty'){
    const t = S.tickets.find(x=>x.id===ticketId);
    const validItems = warrantyClaimItems.filter(i=>i.pn && i.pn.trim());
    const primaryPn = validItems.length ? validItems[0].pn.trim() : '';
    // Each line carries its own type (part / assembly / finished_good) chosen in the form -- auto-detected
    // from parts/assemblies and overridable by staff. Finished goods are included so Support can send the
    // warehouse anything a customer needs. This is exactly what the ERP's ship logic reads.
    const __resTypeSel = val('erpResolutionType');
    const __resType = __resTypeSel === 'other' ? val('erpResolutionTypeOther') : __resTypeSel;
    payload = {
      order_number: val('erpOrder'),
      pn: primaryPn,
      claim_items: validItems.length ? validItems.map(i=>({ pn: i.pn.trim(), type: i.type || 'part', qty: i.qty||1, description: i.description||'' })) : null,
      customer_name: val('erpCustomer') || null,
      issue: val('erpIssue') || null,
      status: val('erpStatus'),
      resolution_type: __resType || null,
      resolution: val('erpResolution') || null,
      claim_cost: val('erpClaimCost') ? parseFloat(val('erpClaimCost')) : null,
      tracking_number: val('erpTracking') || null,
      carrier: val('erpCarrier') || null,
      shipping_details: (t && t.shipping_address && Object.values(t.shipping_address).some(v=>v)) ? t.shipping_address : null
    };
    if(!payload.order_number || !payload.pn){ toast('Order number and at least one part number are required', true); return; }
    if(!__resType){ toast(__resTypeSel === 'other' ? 'Please describe the resolution type' : 'Resolution type is required', true); return; }
  } else {
    const t = S.tickets.find(x=>x.id===ticketId);
    const __resSel = val('erpResolution');
    const __resVal = __resSel.toLowerCase() === 'other' ? val('erpResolutionOther') : __resSel;
    // The exact parts and quantities needed to correct this - decided here, not in the ERP.
    // expected_pn/expected_qty stay populated from the FIRST line for every existing dashboard,
    // export and list view that reads those two columns directly; line_items carries the full
    // list, which is what the ERP's ship flow and inventory deduction actually use.
    const validShipItems = shipErrorItems.filter(i=>i.pn && i.pn.trim());
    const primaryItem = validShipItems[0] || null;
    payload = {
      order_number: val('erpOrder'),
      customer_name: val('erpCustomer') || null,
      customer_email: val('erpCustomerEmail') || null,
      error_type: val('erpErrorType'),
      expected_pn: primaryItem ? primaryItem.pn.trim() : null,
      expected_qty: primaryItem ? (primaryItem.qty||1) : null,
      line_items: validShipItems.length ? validShipItems.map(i=>({ pn: i.pn.trim(), qty: i.qty||1, description: i.description||'' })) : null,
      actual_pn: val('erpActualPn') || null,
      resolution: __resVal || null,
      notes: val('erpNotes') || null,
      status: val('erpStatus'),
      tracking_number: val('erpTracking') || null,
      carrier: val('erpCarrier') || null,
      claim_cost: val('erpClaimCost') ? parseFloat(val('erpClaimCost')) : null,
      shipping_details: (t && t.shipping_address && Object.values(t.shipping_address).some(v=>v)) ? t.shipping_address : null
    };
    const actQty = val('erpActualQty');
    if(actQty) payload.actual_qty = parseInt(actQty, 10);
    if(!payload.order_number || !primaryItem){ toast('Order number and at least one part number are required', true); return; }
    if(!__resVal){ toast(__resSel.toLowerCase() === 'other' ? 'Please describe the resolution' : 'Resolution type is required', true); return; }
  }

  try{
    const { data, error } = await sb.from(table).insert(payload).select().single();
    if(error) throw error;
    if(kind==='warranty'){ S.warranty.unshift(data); } else { S.shipErrors.unshift(data); }

    const linkPatch = kind==='warranty'
      ? { warranty_claim_id: data.id, updated_at: new Date().toISOString() }
      : { shipment_error_id: data.id, updated_at: new Date().toISOString() };
    const { data: updated, error: updErr } = await sb.from('tickets').update(linkPatch).eq('id', ticketId).select().single();
    if(updErr) throw updErr;
    const idx = S.tickets.findIndex(x=>x.id===ticketId);
    if(idx!==-1) S.tickets[idx] = updated;
    S.activeTicket = updated;

    const kindLabelLower = kind==='warranty' ? 'warranty claim' : 'shipment error';
    await sb.from('ticket_messages').insert({
      ticket_id: ticketId,
      sender_type: 'system',
      sender_name: 'System',
      body: `<span class="ic ic-box"></span>Sent to ERP as a ${kindLabelLower} by ${S.user.email} — the warehouse team will see this in their queue.`,
      is_internal_note: true
    });
    await loadMessages(ticketId);

    closeModal();
    toast((kind==='warranty'?'Warranty claim':'Shipment error') + ' created in the ERP — warehouse will see it in their queue');
    renderNav();
    renderTicketPanel(updated);
  }catch(e){
    toast('Failed to send to ERP: ' + e.message, true);
  }
}
window.confirmSendToERP = confirmSendToERP;

function barRow(label, count, max, color){
  const pct = max > 0 ? Math.round((count/max)*100) : 0;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <div style="width:140px;font-size:var(--t-sm);color:var(--text2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(label)}</div>
    <div style="flex:1;background:var(--bg4);border-radius:var(--r-sm);height:16px;overflow:hidden">
      <div style="width:${pct}%;background:${color||'var(--teal)'};height:100%;border-radius:var(--r-sm)"></div>
    </div>
    <div style="width:36px;text-align:right;font-family:var(--mono);font-size:var(--t-sm);color:var(--text2)">${count}</div>
  </div>`;
}

function renderReports(){
  const el = document.getElementById('content');
  const t = S.tickets;

  const weeks = [];
  for(let i=7;i>=0;i--){
    const start = new Date(); start.setDate(start.getDate() - i*7); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(end.getDate()+7);
    const count = t.filter(x=>{ const d=new Date(x.created_at); return d>=start && d<end; }).length;
    weeks.push({ label: start.toLocaleDateString('en-US',{month:'short',day:'numeric'}), count });
  }
  const maxWeek = Math.max(1, ...weeks.map(w=>w.count));

  const bySource = {};
  t.forEach(x=> bySource[x.source] = (bySource[x.source]||0)+1);
  const maxSource = Math.max(1, ...Object.values(bySource), 1);

  const byTag = {};
  t.forEach(x=> (x.tags||[]).forEach(tag=> byTag[tag] = (byTag[tag]||0)+1));
  const maxTag = Math.max(1, ...Object.values(byTag), 1);

  const byAssignee = {};
  t.forEach(x=> { const key = x.assigned_to || 'Unassigned'; byAssignee[key] = (byAssignee[key]||0)+1; });
  const maxAssignee = Math.max(1, ...Object.values(byAssignee), 1);

  const resolved = t.filter(x=>x.resolved_at);
  const avgDays = resolved.length ? (resolved.reduce((s,x)=> s + (new Date(x.resolved_at)-new Date(x.created_at)),0) / resolved.length / 86400000).toFixed(1) : '—';
  const medianDays = (()=>{
    if(!resolved.length) return '—';
    const days = resolved.map(x=>(new Date(x.resolved_at)-new Date(x.created_at))/86400000).sort((a,b)=>a-b);
    const mid = Math.floor(days.length/2);
    return (days.length%2 ? days[mid] : (days[mid-1]+days[mid])/2).toFixed(1);
  })();

  const byOrder = {};
  t.forEach(x=>{ if(x.order_number) byOrder[x.order_number] = (byOrder[x.order_number]||0)+1; });
  const repeatOrders = Object.entries(byOrder).filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]).slice(0,8);

  el.innerHTML = `
    <div class="kpi-grid kpi-grid-4">
      <div class="kpi"><div class="kpi-label">Total Tickets</div><div class="kpi-value">${t.length}</div></div>
      <div class="kpi kpi-teal"><div class="kpi-label">Avg Resolution (days)</div><div class="kpi-value">${avgDays}</div></div>
      <div class="kpi kpi-orange"><div class="kpi-label">Median Resolution (days)</div><div class="kpi-value">${medianDays}</div></div>
      <div class="kpi kpi-red"><div class="kpi-label">Repeat-Issue Orders</div><div class="kpi-value">${repeatOrders.length}</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">Ticket Volume — Last 8 Weeks</div>
      ${weeks.map(w=>barRow(w.label, w.count, maxWeek)).join('')}
    </div>

    <div class="stack-sm" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="panel">
        <div class="panel-title">By Source</div>
        ${Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(label(k), v, maxSource, 'var(--orange)')).join('') || '<div class="empty">No data</div>'}
      </div>
      <div class="panel">
        <div class="panel-title">By Assignee</div>
        ${Object.entries(byAssignee).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k, v, maxAssignee, 'var(--blue)')).join('') || '<div class="empty">No data</div>'}
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">By Tag</div>
      ${Object.keys(byTag).length ? Object.entries(byTag).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k, v, maxTag, 'var(--purple)')).join('') : '<div class="empty">No tags applied yet — add tags to tickets to see this breakdown.</div>'}
    </div>

    <div class="panel">
      <div class="panel-title">Orders With Multiple Tickets (possible repeat/unresolved issues)</div>
      ${repeatOrders.length ? `<div class="tbl-wrap"><table><thead><tr><th>Order Number</th><th>Ticket Count</th></tr></thead>
        <tbody>${repeatOrders.map(([ord,c])=>`<tr class="rowlink" onclick="goPage('tickets'); setTimeout(()=>{S.filters.q='${ord}'; renderTicketsList();},50)"><td>#${escapeHtml(ord)}</td><td class="pn">${c}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">No repeat-issue orders detected.</div>'}
    </div>
  `;
}
