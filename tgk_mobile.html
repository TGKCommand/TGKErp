<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TGK Mobile">
<meta name="theme-color" content="#0f1012">
<title>TGK Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#2ABFAA;--teal-dim:rgba(42,191,170,.12);
  --orange:#E07B28;--orange-dim:rgba(224,123,40,.12);
  --red:#e05555;--red-dim:rgba(224,85,85,.12);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.12);
  --green:#22c55e;
  --bg:#0f1012;--bg2:#1a1d21;--bg3:#22262b;--bg4:#2a2f36;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#f0f2f5;--text2:#a8b0bb;--text3:#6b7280;
  --mono:'JetBrains Mono',monospace;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── LAYOUT ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;gap:16px}
#app{display:none;flex-direction:column;height:100dvh}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + var(--safe-b))}
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:#141618;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--text3);transition:color .15s;padding:8px 4px}
.nav-btn.active{color:var(--teal)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;transition:opacity .15s}
.nav-btn.active .nav-dot{opacity:1}

/* ── CARDS & PANELS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:10px}
.panel-hd{padding:16px;font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.section{padding:12px 16px}
.page-title{font-size:20px;font-weight:700;padding:20px 16px 8px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:4px}
.kpi-value{font-size:26px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:2px}
.kpi-teal .kpi-value{color:var(--teal)}
.kpi-red .kpi-value{color:var(--red)}
.kpi-orange .kpi-value{color:var(--orange)}
.kpi-purple .kpi-value{color:var(--purple)}

/* ── INPUTS ── */
.input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-family:inherit;font-size:15px;outline:none}
.input:focus{border-color:var(--teal)}
.input::placeholder{color:var(--text3)}
.search-wrap{position:relative;padding:12px 16px}
.search-wrap .input{padding-left:40px}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:18px}
.label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--teal);color:#0f1012;width:100%}
.btn-secondary{background:var(--bg3);border:1px solid var(--border2);color:var(--text)}
.btn-danger{background:var(--red-dim);border:1px solid rgba(224,85,85,.25);color:var(--red)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-full{width:100%}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill-open{background:rgba(42,191,170,.12);color:var(--teal)}
.pill-packed{background:rgba(224,123,40,.12);color:var(--orange)}
.pill-shipped{background:rgba(34,197,94,.12);color:var(--green)}
.pill-hold{background:rgba(107,114,128,.15);color:var(--text3)}

/* ── LIST ITEMS ── */
.list-item{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s}
.list-item:first-child{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
.list-item:last-child{border-bottom:none;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
.list-item:active{background:var(--bg3)}
.list-item-title{font-weight:600;font-size:14px}
.list-item-sub{font-size:12px;color:var(--text3);margin-top:2px}
.list-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 12px;overflow:hidden}

/* ── DETAIL / SHEET ── */
.back-btn{display:flex;align-items:center;gap:6px;padding:16px;font-size:14px;font-weight:600;color:var(--teal);cursor:pointer}
.detail-section{padding:16px;border-bottom:1px solid var(--border)}
.detail-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:4px}
.detail-value{font-size:15px;font-weight:500}

/* ── ORDER CARD ── */
.order-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;overflow:hidden}
.order-card-hd{padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.order-card-hd:active{background:var(--bg3)}
.order-card-body{border-top:1px solid var(--border);padding:14px;display:none}
.order-card.open .order-card-body{display:block}
.order-line{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.order-line:last-child{border-bottom:none}

/* ── PART DETAIL ── */
.stock-big{font-size:48px;font-weight:700;line-height:1}
.adjust-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.qty-btn{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border2);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qty-input{flex:1;text-align:center;font-size:20px;font-weight:700}

/* ── CHAT ── */
#chat-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.mine{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0}
.msg-bubble{max-width:72%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4}
.msg-row.mine .msg-bubble{background:var(--teal-dim);border-color:rgba(42,191,170,.25)}
.msg-time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.chat-input-wrap{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;background:#141618;border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
#chat-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;resize:none;max-height:100px;outline:none}
#chat-send{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#0f1012;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ── SCANNER FAB ── */
#scan-fab{position:fixed;right:20px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:52px;height:52px;border-radius:50%;background:var(--teal);color:#0f1012;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(42,191,170,.4);z-index:90;font-size:22px}

/* ── SCANNER OVERLAY ── */
#scan-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px}
.scan-frame{width:240px;height:240px;border-radius:16px;border:2px solid var(--teal);position:relative;display:flex;align-items:center;justify-content:center}
.scan-corner{position:absolute;width:20px;height:20px;border-color:var(--teal);border-style:solid}
.sc-tl{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.sc-tr{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.sc-bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.sc-br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}

/* ── LOGIN ── */
.login-logo{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--teal)}
.login-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login-err{background:var(--red-dim);border:1px solid rgba(224,85,85,.25);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);display:none}

/* ── TOAST ── */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1a1d21;border:1px solid var(--teal);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:500;transition:transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── CHIP FILTERS ── */
.chips{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:all .15s}
.chip.active{background:var(--teal-dim);border-color:rgba(42,191,170,.3);color:var(--teal)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px}

/* ── SELECT ── */
select.input{appearance:none}

/* ── SPINNER ── */
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-logo">TGK<span style="color:var(--text2);font-weight:400"> Mobile</span></div>
  <div style="font-size:13px;color:var(--text3)">TGK Motorsport Operations</div>
  <div class="login-card">
    <div class="login-err" id="login-err"></div>
    <div><label class="label">Email</label><input class="input" id="l-email" type="email" placeholder="you@tgkmotorsport.com" autocomplete="email"></div>
    <div><label class="label">Password</label><input class="input" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="view"></div>

  <!-- BOTTOM NAV -->
  <nav id="nav">
    <button class="nav-btn active" id="nb-home" onclick="setTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nb-orders" onclick="setTab('orders')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 11c0 2.21-1.79 4-4 4S8 13.21 8 11"/><path d="M5 21h14M5 21l-2-8h18l-2 8"/><path d="M8 3h8M7 7h10"/></svg>
      <span>Orders</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nb-parts" onclick="setTab('parts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Parts</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nb-tasks" onclick="setTab('tasks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Tasks</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" id="nb-chat" onclick="setTab('chat')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="chat-nav-label">Chat</span><div class="nav-dot"></div>
    </button>
  </nav>
</div>

<!-- SCAN FAB -->
<div id="scan-fab" onclick="openScanner()">📷</div>

<!-- SCAN OVERLAY -->
<div id="scan-overlay">
  <div style="text-align:center;color:var(--teal);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Scan Barcode / QR</div>
  <div class="scan-frame">
    <div class="scan-corner sc-tl"></div>
    <div class="scan-corner sc-tr"></div>
    <div class="scan-corner sc-bl"></div>
    <div class="scan-corner sc-br"></div>
    <div style="color:var(--text3);font-size:13px;text-align:center;padding:16px">Scanner integration<br>coming soon</div>
  </div>
  <div style="color:var(--text3);font-size:12px;text-align:center">Point camera at barcode — Capacitor integration in progress</div>
  <button class="btn btn-ghost" onclick="closeScanner()">Cancel</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const SUPA_URL='https://piamamighqiielfztgic.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA';
let db=null;

const S={
  user:null,email:'',
  tab:'home',tasksTab:'counts',
  sales:[],assemblies:[],parts:[],purchases:[],poLines:[],
  cycleCounts:[],chatMessages:[],
  loaded:{},
  partSearch:'',partDetail:null,
  orderFilter:'open',orderExpanded:null,
  poExpanded:null,countDetail:null,
  chatUnread:0,chatBottom:true,
  adjustPn:null,adjustQty:0,
};
let _rtChannel=null;

// ── UTILS ──────────────────────────────────────────────────────
function $(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,dur=2500){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function fmt(n){return Number(n||0).toLocaleString();}
function ago(ts){if(!ts)return'';const d=(Date.now()-new Date(ts))/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function initials(name){return(name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function spinner(){return '<div class="spin"></div>';}
function findPart(pn){return S.parts.find(p=>p.pn===pn||p.new_sku===pn);}
function findAsm(pn){return S.assemblies.find(a=>a.pn===pn||a.new_sku===pn);}

// ── INIT ───────────────────────────────────────────────────────
async function init(){
  db=supabase.createClient(SUPA_URL,SUPA_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(session){await onLogin(session);}
  db.auth.onAuthStateChange(async(ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess)await onLogin(sess);
    if(ev==='SIGNED_OUT'){$('app').style.display='none';$('login').style.display='flex';}
  });
}

async function onLogin(session){
  S.user=session.user;
  S.email=session.user.email;
  $('login').style.display='none';
  $('app').style.display='flex';
  await loadTab('home');
  render();
  setupRealtime();
}

// ── AUTH ──────────────────────────────────────────────────────
async function doLogin(){
  const email=$('l-email').value.trim();
  const pass=$('l-pass').value;
  const err=$('login-err');
  err.style.display='none';
  if(!email||!pass){err.textContent='Email and password required.';err.style.display='block';return;}
  const{error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent=error.message;err.style.display='block';}
}
async function doLogout(){
  if(!confirm('Sign out?'))return;
  if(_rtChannel)db.removeChannel(_rtChannel);
  await db.auth.signOut();
}

// ── DATA LOADING ───────────────────────────────────────────────
async function loadTab(tab){
  if(S.loaded[tab])return;
  S.loaded[tab]=true;
  try{
    if(tab==='home'||tab==='orders'){
      if(!S.loaded._sales){
        const{data}=await db.from('sales').select('*').order('sale_date',{ascending:false}).limit(1000);
        S.sales=data||[];
        S.loaded._sales=true;
      }
      if(!S.loaded._asms){
        const{data}=await db.from('assemblies').select('pn,description,category,total_on_hand,msrp,new_sku,use_new_sku,discontinued,stage').order('pn');
        S.assemblies=data||[];
        S.loaded._asms=true;
      }
    }
    if(tab==='parts'){
      if(!S.loaded._parts){
        const{data}=await db.from('parts').select('pn,description,category,vendor,total_unpckgd,unit_cost,location,min_qty,max_qty,new_sku').order('pn');
        S.parts=data||[];
        S.loaded._parts=true;
      }
    }
    if(tab==='tasks'){
      const[pos,counts]=await Promise.all([
        db.from('purchases').select('*').not('status','in','("Received","Cancelled")').order('order_date',{ascending:false}),
        db.from('cycle_counts').select('*').eq('status','Open').order('created_at',{ascending:false})
      ]);
      S.purchases=pos.data||[];
      S.cycleCounts=counts.data||[];
      if(!S.loaded._parts){
        const{data}=await db.from('parts').select('pn,description,category,vendor,total_unpckgd,unit_cost,location,min_qty,max_qty,new_sku').order('pn');
        S.parts=data||[];
        S.loaded._parts=true;
      }
    }
    if(tab==='chat'){
      const{data}=await db.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(100);
      S.chatMessages=(data||[]).reverse();
      S.chatUnread=0;
      updateChatBadge();
    }
  }catch(e){console.error(e);}
}

async function refreshSales(){
  const{data}=await db.from('sales').select('*').order('sale_date',{ascending:false}).limit(1000);
  S.sales=data||[];
}

// ── REALTIME ──────────────────────────────────────────────────
function setupRealtime(){
  _rtChannel=db.channel('mobile-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{
      S.chatMessages.push(p.new);
      if(S.tab==='chat'){render();}
      else{S.chatUnread++;updateChatBadge();}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},()=>{
      S.loaded._sales=false;
      if(S.tab==='home'||S.tab==='orders'){loadTab(S.tab).then(render);}
    })
    .subscribe();
}

function updateChatBadge(){
  const el=$('chat-nav-label');
  if(el)el.textContent=S.chatUnread>0?`Chat (${S.chatUnread})`:'Chat';
}

// ── NAV & RENDER ──────────────────────────────────────────────
async function setTab(tab){
  S.tab=tab;
  S.partDetail=null;S.orderExpanded=null;S.countDetail=null;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb=$('nb-'+tab);if(nb)nb.classList.add('active');
  $('scan-fab').style.display=(tab==='parts'||tab==='orders')?'flex':'none';
  if(!S.loaded[tab])$('view').innerHTML=spinner();
  await loadTab(tab);
  if(tab==='chat'){S.chatUnread=0;updateChatBadge();}
  render();
  if(tab==='chat')scrollChatBottom();
}

function render(){
  const v=$('view');
  if(S.partDetail)return void(v.innerHTML=renderPartDetail());
  if(S.countDetail)return void(v.innerHTML=renderCountDetail());
  switch(S.tab){
    case 'home':   v.innerHTML=renderHome();break;
    case 'orders': v.innerHTML=renderOrders();break;
    case 'parts':  v.innerHTML=renderParts();break;
    case 'tasks':  v.innerHTML=renderTasks();break;
    case 'chat':   v.innerHTML=renderChat();scrollChatBottom();break;
    default:       v.innerHTML=renderHome();
  }
}

// ── HOME ──────────────────────────────────────────────────────

// ── ORDERS ────────────────────────────────────────────────────
function renderOrders(){
  const grouped={};
  S.sales.forEach(s=>{
    if(!s.order_number&&!s.id)return;
    const k=s.order_number||('__'+s.id);
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(s);
  });
  let orders=Object.entries(grouped).map(([k,lines])=>{
    const fs=lines.some(l=>l.fulfillment_status==='Packed')?'Packed':
              lines.some(l=>(l.fulfillment_status||'Open')==='Open')?'Open':
              lines[0].fulfillment_status||'Open';
    return{key:k,lines,fs,date:lines[0].sale_date||'',customer:lines[0].customer_name||'Unknown',order_number:lines[0].order_number||''};
  });
  if(S.orderFilter==='open')orders=orders.filter(o=>o.fs==='Open');
  else if(S.orderFilter==='packed')orders=orders.filter(o=>o.fs==='Packed');
  orders.sort((a,b)=>b.date.localeCompare(a.date));
  const rows=orders.length?orders.map(o=>{
    const exp=S.orderExpanded===o.key;
    const pillCls=o.fs==='Packed'?'pill-packed':o.fs==='Shipped'?'pill-shipped':'pill-open';
    const lines=o.lines.map(l=>{
      const asm=findAsm(l.pn);const pt=findPart(l.pn);
      const stock=asm?(asm.total_on_hand||0):pt?(pt.total_unpckgd||0):null;
      const canFill=stock===null||stock>=(l.qty||1);
      return`<div class="order-line">
        <div>
          <div style="font-size:13px;font-family:var(--mono);color:var(--teal)">${esc(l.pn)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:1px">Qty: ${l.qty||1}</div>
        </div>
        <div style="text-align:right">
          ${stock!==null?`<div style="font-size:13px;font-weight:700;color:${canFill?'var(--green)':'var(--red)'}">${stock} in stock</div>`:'<div style="font-size:12px;color:var(--text3)">Drop-ship</div>'}
        </div>
      </div>`;
    }).join('');
    const actionBtns=o.fs==='Open'?`<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();markAllPacked('${esc(o.key)}')">Mark Packed</button>`:
      o.fs==='Packed'?`<button class="btn btn-orange btn-sm" onclick="event.stopPropagation();openShipForm('${esc(o.key)}')">🚚 Ship</button>`:''
    return`<div class="order-card ${exp?'open':''}">
      <div class="order-card-hd" onclick="toggleOrder('${esc(o.key)}')">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-weight:700;font-family:var(--mono)">${esc(o.order_number||o.key)}</span>
            ${o.lines.length>1?`<span style="font-size:11px;background:var(--bg4);color:var(--text3);border-radius:10px;padding:1px 6px">${o.lines.length} items</span>`:''}
          </div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${esc(o.customer)} &middot; ${o.date||'—'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="pill ${pillCls}">${o.fs}</span>
          <span style="font-size:18px;color:var(--text3)">${exp?'▲':'▼'}</span>
        </div>
      </div>
      ${exp?`<div class="order-card-body">${lines}<div style="margin-top:12px;display:flex;gap:8px">${actionBtns}</div></div>`:''}
    </div>`;
  }).join(''):
  `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No orders here</div><div class="empty-sub">Switch filters to see other orders</div></div>`;
  return`
  <div class="page-title">Orders</div>
  <div class="chips">
    <div class="chip ${S.orderFilter==='open'?'active':''}" onclick="S.orderFilter='open';render()">Open (${orders.filter?grouped:0})</div>
    <div class="chip ${S.orderFilter==='open'?'active':''}" onclick="S.orderFilter='open';render()">To Pack</div>
    <div class="chip ${S.orderFilter==='packed'?'active':''}" onclick="S.orderFilter='packed';render()">Packed</div>
    <div class="chip ${S.orderFilter==='all'?'active':''}" onclick="S.orderFilter='all';render()">All</div>
  </div>
  ${rows}`;
}

function toggleOrder(key){S.orderExpanded=S.orderExpanded===key?null:key;render();}

async function markAllPacked(orderKey){
  const lines=S.sales.filter(s=>(s.order_number||('__'+s.id))===orderKey&&(s.fulfillment_status||'Open')==='Open');
  if(!lines.length)return;
  if(!confirm(`Mark ${lines.length===1?'this order':'all '+lines.length+' lines'} as Packed?`))return;
  try{
    await Promise.all(lines.map(l=>db.from('sales').update({fulfillment_status:'Packed',updated_at:new Date().toISOString()}).eq('id',l.id)));
    lines.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s)s.fulfillment_status='Packed';});
    toast('✓ Marked as Packed');render();
  }catch(e){toast('Error: '+e.message);}
}

function openShipForm(orderKey){
  const tracking=prompt('Tracking number (optional):','');
  const carrier=tracking?(prompt('Carrier (UPS, USPS, FedEx…):','')||''):'';
  markAllShipped(orderKey,tracking||'',carrier);
}

async function markAllShipped(orderKey,tracking,carrier){
  const lines=S.sales.filter(s=>(s.order_number||('__'+s.id))===orderKey&&s.fulfillment_status==='Packed');
  if(!lines.length)return;
  const now=new Date().toISOString();
  try{
    await Promise.all(lines.map(l=>db.from('sales').update({fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now,updated_at:now}).eq('id',l.id)));
    lines.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s){s.fulfillment_status='Shipped';s.tracking_number=tracking;s.shipped_at=now;}});
    toast('📦 Shipped!');render();
  }catch(e){toast('Error: '+e.message);}
}

// ── PARTS ─────────────────────────────────────────────────────

  let list=S.parts.filter(p=>!p.discontinued);

function adjDelta(d){
  const el=$('adj-qty');
  if(!el)return;
  const cur=parseInt(el.value)||0;
  el.value=Math.max(0,cur+d);
  S.adjustQty=parseInt(el.value);
}

async function submitAdjust(pn,prevQty){
  const newQty=parseInt($('adj-qty')?.value)||0;
  const reason=$('adj-reason')?.value||'Manual correction';
  const notes=$('adj-notes')?.value||'';
  const adj=newQty-prevQty;
  if(adj===0){toast('No change');return;}
  if(!confirm(`Change ${pn} from ${prevQty} → ${newQty} (${adj>0?'+':''}${adj})?`))return;
  try{
    await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('pn',pn);
    await db.from('inv_corrections').insert({pn,previous_qty:prevQty,new_qty:newQty,adjustment:adj,reason,source:'Mobile App'+(notes?' — '+notes:''),user_email:S.email,created_at:new Date().toISOString()});
    const pt=S.parts.find(p=>p.pn===pn);if(pt)pt.total_unpckgd=newQty;
    toast('✓ Inventory updated');
    S.partDetail=null;render();
  }catch(e){toast('Error: '+e.message);}
}

async function submitCount(id){
  const c=S.cycleCounts.find(x=>x.id===id);
  if(!c)return;
  const items=JSON.parse(c.items||'[]');
  const vals=window._countVals||{};
  const filled=items.filter(i=>vals[i.pn]!==undefined);
  if(filled.length===0){toast('Enter at least one count');return;}
  if(!confirm(`Submit count for ${filled.length} of ${items.length} parts?`))return;
  const now=new Date().toISOString();
  try{
    await Promise.all(filled.map(async item=>{
      const newQty=vals[item.pn];
      const p=findPart(item.pn);
      const prevQty=p?.total_unpckgd??0;
      if(newQty===prevQty)return;
      await db.from('parts').update({total_unpckgd:newQty,updated_at:now}).eq('pn',item.pn);
      await db.from('inv_corrections').insert({pn:item.pn,previous_qty:prevQty,new_qty:newQty,adjustment:newQty-prevQty,reason:'Cycle count',source:'Mobile Cycle Count',user_email:S.email,created_at:now,reference_id:id});
      if(p)p.total_unpckgd=newQty;
    }));
    await db.from('cycle_counts').update({status:'Completed',completed_at:now,updated_at:now}).eq('id',id);
    S.cycleCounts=S.cycleCounts.filter(x=>x.id!==id);
    window._countVals={};
    toast('✓ Count submitted');
    S.countDetail=null;render();
  }catch(e){toast('Error: '+e.message);}
}

function renderReceiving(){
  if(!S.purchases.length)return`<div class="empty"><div class="empty-icon">📥</div><div class="empty-title">No open POs</div><div class="empty-sub">All purchase orders have been received</div></div>`;
  const rows=S.purchases.map(po=>{
    const exp=S.poExpanded===po.id;
    const statusColor=po.status==='On Order'||po.status==='Ordered'?'var(--teal)':po.status==='In Transit'?'var(--orange)':'var(--text3)';
    return`<div class="order-card ${exp?'open':''}">
      <div class="order-card-hd" onclick="S.poExpanded=S.poExpanded==='${po.id}'?null:'${po.id}';render()">
        <div style="flex:1">
          <div style="font-weight:700;font-family:var(--mono)">${esc(po.pn)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${esc(po.vendor||'—')} &middot; Qty: ${po.qty||0}</div>
          ${po.order_date?`<div style="font-size:11px;color:var(--text3)">Ordered ${po.order_date}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span style="font-size:12px;font-weight:700;color:${statusColor}">${esc(po.status||'Draft')}</span>
          <span style="font-size:18px;color:var(--text3)">${exp?'▲':'▼'}</span>
        </div>
      </div>
      ${exp?`<div class="order-card-body">
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Receiving ${esc(po.pn)} from ${esc(po.vendor||'Unknown')}</div>
        <div style="margin-bottom:10px">
          <label class="label">Qty Received</label>
          <input class="input" type="number" id="recv-qty-${po.id}" placeholder="${po.qty||0}" min="0" max="${po.qty||999}" value="${po.qty||0}">
        </div>
        <button class="btn btn-primary btn-sm" onclick="receivePO('${po.id}',${po.qty||0})">Mark Received</button>
      </div>`:''}
    </div>`;
  }).join('');
  return`<div style="padding-bottom:8px">${rows}</div>`;
}

async function receivePO(poId,totalQty){
  const po=S.purchases.find(x=>x.id===poId);
  if(!po)return;
  const qtyRecv=parseInt($(`recv-qty-${poId}`)?.value||totalQty);
  if(isNaN(qtyRecv)||qtyRecv<1){toast('Enter a valid quantity');return;}
  if(!confirm(`Receive ${qtyRecv} × ${po.pn} from ${po.vendor||'vendor'}?`))return;
  const now=new Date().toISOString();
  try{
    const p=findPart(po.pn)||S.parts.find(x=>x.pn===po.pn);
    const prevQty=p?.total_unpckgd||0;
    const newQty=prevQty+qtyRecv;
    if(p){
      await db.from('parts').update({total_unpckgd:newQty,updated_at:now}).eq('pn',po.pn);
      p.total_unpckgd=newQty;
    }
    const status=qtyRecv>=totalQty?'Received':'Partial';
    await db.from('purchases').update({status,updated_at:now}).eq('id',poId);
    await db.from('inv_corrections').insert({pn:po.pn,previous_qty:prevQty,new_qty:newQty,adjustment:qtyRecv,reason:'Received shipment',source:'Mobile PO Receive',user_email:S.email,created_at:now,reference_id:poId});
    if(status==='Received')S.purchases=S.purchases.filter(x=>x.id!==poId);
    else{const pox=S.purchases.find(x=>x.id===poId);if(pox)pox.status='Partial';}
    S.poExpanded=null;
    toast(`✓ Received ${qtyRecv} × ${po.pn}`);render();
  }catch(e){toast('Error: '+e.message);}
}

// ── CHAT ──────────────────────────────────────────────────────
function renderChat(){
  const msgs=S.chatMessages.map(m=>{
    const mine=m.user_email===S.email||m.sender_email===S.email;
    const name=m.sender_name||m.user_email||'?';
    return`<div class="msg-row ${mine?'mine':''}">
      ${!mine?`<div class="msg-avatar">${initials(name)}</div>`:''}
      <div>
        ${!mine?`<div style="font-size:11px;color:var(--text3);margin-bottom:3px;padding-left:4px">${esc(name)}</div>`:''}
        <div class="msg-bubble">${esc(m.message||m.content||'')}</div>
        <div class="msg-time">${ago(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  return`
  <div style="padding:16px 16px 8px;font-size:20px;font-weight:700">Team Chat</div>
  <div id="chat-list" style="padding-bottom:80px">
    ${msgs||'<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">No messages yet</div>'}
  </div>
  <div class="chat-input-wrap">
    <textarea id="chat-input" rows="1" placeholder="Message the team…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
    <button id="chat-send" onclick="sendChat()">↑</button>
  </div>`;
}

function scrollChatBottom(){
  setTimeout(()=>{
    const list=$('chat-list');
    if(list)list.scrollIntoView({block:'end',behavior:'smooth'});
    $('view')?.scrollTo(0,99999);
  },100);
}

async function sendChat(){
  const inp=$('chat-input');
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg)return;
  inp.value='';
  try{
    const name=S.email.split('@')[0];
    await db.from('chat_messages').insert({
      message:msg,
      user_email:S.email,
      sender_email:S.email,
      sender_name:name,
      created_at:new Date().toISOString()
    });
  }catch(e){toast('Send failed: '+e.message);}
}

// ── SCANNER STUB ──────────────────────────────────────────────
function openScanner(){
  if(navigator.mediaDevices?.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
      .then(stream=>{stream.getTracks().forEach(t=>t.stop());})
      .catch(()=>{});
  }
  $('scan-overlay').style.display='flex';
}
function closeScanner(){$('scan-overlay').style.display='none';}

// ── KEYBOARD HANDLING ─────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement?.id==='l-pass')doLogin();
});

// ── START ─────────────────────────────────────────────────────
init();
</script>
