<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TGK Mobile">
<meta name="theme-color" content="#141618">
<title>TGK Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#2ABFAA;--td:rgba(42,191,170,.12);--tb:rgba(42,191,170,.25);
  --orange:#E07B28;--od:rgba(224,123,40,.1);
  --red:#dc2626;--rd:rgba(220,38,38,.1);
  --purple:#7c3aed;--pd:rgba(124,58,237,.1);
  --green:#16a34a;--gd:rgba(22,163,74,.1);
  --bg:#F0F2F5;--b2:#ffffff;--b3:#f5f7fa;--b4:#edf0f4;
  --br:rgba(0,0,0,.08);--br2:rgba(0,0,0,.14);
  --tx:#1a2332;--t2:#4a5568;--t3:#9aa5b4;
  --mono:"JetBrains Mono",monospace;
  --nav:60px;--hdr:52px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:10px;--rs:7px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--tx);-webkit-appearance:none}

/* ── SHELL ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;gap:20px;background:var(--bg)}
#app{display:none;flex-direction:column;height:100dvh;height:100svh}
#hdr{height:calc(var(--hdr) + var(--st));padding-top:var(--st);background:#141618;border-bottom:1px solid var(--br);display:flex;align-items:center;padding-left:12px;padding-right:16px;gap:10px;flex-shrink:0;position:relative}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(var(--nav) + var(--sb) + 12px)}
#bot-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:#141618;border-top:1px solid var(--br);display:flex;z-index:100}

/* ── HEADER ── */
.hdr-back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--rs);background:var(--b3);border:1px solid var(--br2);cursor:pointer;flex-shrink:0;color:var(--teal)}
.hdr-back:active{background:var(--b4)}
.hdr-logo{height:28px;width:auto;object-fit:contain;cursor:pointer}
#hdr-title{font-size:14px;font-weight:700;color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-home{font-size:11px;font-weight:600;color:var(--t3);padding:6px 10px;border-radius:var(--rs);background:var(--b3);border:1px solid var(--br);cursor:pointer;flex-shrink:0}
.hdr-home:active{background:var(--b4)}

/* ── BOTTOM NAV ── */
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--t3);cursor:pointer;padding:6px 2px;position:relative}
.nb.on{color:var(--teal)}
.nb svg{width:22px;height:22px;stroke-width:1.7}
.nb-line{height:2px;width:22px;border-radius:2px;background:var(--teal);opacity:0;margin-top:1px}
.nb.on .nb-line{opacity:1}
.nb-dot{position:absolute;top:7px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #141618;display:none}

/* ── PAGE ── */
.pg{padding:18px 16px 6px;font-size:22px;font-weight:700;letter-spacing:-.3px}
.pg-sub{padding:0 16px 12px;font-size:13px;color:var(--t3)}
.sec-hd{padding:14px 16px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--t3)}

/* ── KPI ── */
.kpi-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 16px}
.kpi{background:var(--b2);border:1px solid var(--br);border-radius:var(--r);padding:14px 13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpi:active{border-color:var(--br2)}
.kl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:5px}
.kv{font-size:28px;font-weight:700;line-height:1}
.ks{font-size:11px;color:var(--t3);margin-top:3px}
.c-teal{color:var(--teal)}.c-org{color:var(--orange)}.c-red{color:var(--red)}.c-pur{color:var(--purple)}.c-grn{color:var(--green)}

/* ── INPUTS ── */
.inp{width:100%;background:var(--b3);border:1.5px solid var(--br2);border-radius:var(--rs);padding:11px 14px;color:var(--tx);outline:none}
.inp:focus{border-color:var(--teal)}
.inp::placeholder{color:var(--t3)}
.lbl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;display:block}
.srch-w{padding:10px 16px 6px;position:relative}
.srch-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:16px;pointer-events:none}
.srch-w .inp{padding-left:36px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--rs);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s;white-space:nowrap}
.btn:active{opacity:.7}
.btn-p{background:var(--teal);color:#0d0f10}.btn-o{background:var(--orange);color:#fff}
.btn-s{background:var(--b3);border:1.5px solid var(--br2);color:var(--tx)}
.btn-g{background:transparent;border:1.5px solid var(--br2);color:var(--t2)}
.btn-sm{padding:8px 13px;font-size:13px}.btn-w{width:100%}

/* ── CHIPS ── */
.chips{display:flex;gap:7px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;background:var(--b3);border:1.5px solid var(--br2);color:var(--t3);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--td);border-color:var(--tb);color:var(--teal)}

/* ── LIST ── */
.lst{background:var(--b2);border:1px solid var(--br);border-radius:var(--r);margin:0 16px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--br);cursor:pointer}
.li:last-child{border-bottom:none}
.li:active{background:var(--b3)}
.li-t{font-weight:600;font-size:14px;line-height:1.25}
.li-s{font-size:12px;color:var(--t3);margin-top:2px}
.arr{color:var(--t3);font-size:18px;flex-shrink:0;margin-left:auto}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.p-open{background:var(--td);color:var(--teal);border:1px solid var(--tb)}
.p-pack{background:var(--od);color:var(--orange);border:1px solid rgba(224,123,40,.3)}
.p-ship{background:var(--gd);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.p-hold{background:var(--b4);color:var(--t3);border:1px solid var(--br2)}
.p-part{background:var(--pd);color:var(--purple);border:1px solid rgba(124,58,237,.3)}

/* ── CARDS (expandable) ── */
.card{background:var(--b2);border:1px solid var(--br);border-radius:var(--r);margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.c-hd{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c-hd:active{background:var(--b3)}
.c-body{border-top:1px solid var(--br);padding:14px;display:none}
.card.exp .c-body{display:block}
.chev{font-size:11px;color:var(--t3);transition:transform .2s;flex-shrink:0;margin-left:auto}
.card.exp .chev{transform:rotate(180deg)}
.o-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)}
.o-line:last-child{border-bottom:none}

/* ── DETAIL ── */
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--br);border:1px solid var(--br);border-radius:var(--r);margin:0 16px 14px;overflow:hidden}
.dg{background:var(--b2);padding:13px}
.dl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:4px}
.dv{font-size:16px;font-weight:700}
.f-card{background:var(--b2);border:1px solid var(--br);border-radius:var(--r);margin:0 16px 14px;padding:15px;display:flex;flex-direction:column;gap:13px}

/* ── ADJ ── */
.adj-r{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.q-btn{width:46px;height:46px;border-radius:var(--rs);background:var(--b3);border:1.5px solid var(--br2);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.q-btn:active{background:var(--b4)}
.q-inp{flex:1;text-align:center;font-size:22px;font-weight:700;background:var(--b3);border:1.5px solid var(--br2);border-radius:var(--rs);padding:10px;height:46px;width:100%;color:var(--tx)}
.q-inp:focus{border-color:var(--teal);outline:none}

/* ── QUICK ACTIONS ── */
.qa-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 16px}
.qa{background:var(--b2);border:1px solid var(--br);border-radius:var(--r);padding:15px 13px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.qa:active{border-color:var(--br2)}
.qa-i{font-size:22px;line-height:1}
.qa-l{font-size:13px;font-weight:600;color:var(--t2)}

/* ── CHAT ── */
.chat-l{padding:12px 16px 80px;display:flex;flex-direction:column;gap:10px}
.msg-r{display:flex;gap:8px;align-items:flex-end;max-width:90%}
.msg-r.me{flex-direction:row-reverse;margin-left:auto}
.m-av{width:28px;height:28px;border-radius:50%;background:var(--b4);border:1px solid var(--br2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0}
.m-b{background:var(--b2);border:1px solid var(--br);border-radius:12px;padding:9px 13px;font-size:14px;line-height:1.45;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.msg-r.me .m-b{background:var(--td);border-color:var(--tb)}
.m-nm{font-size:11px;color:var(--t3);margin-bottom:3px;padding:0 4px}
.m-ts{font-size:10px;color:var(--t3);padding:2px 4px}
.chat-ft{position:fixed;bottom:calc(var(--nav) + var(--sb));left:0;right:0;background:#141618;border-top:1px solid var(--br);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;z-index:50}
#c-inp{flex:1;background:var(--b3);border:1.5px solid var(--br2);border-radius:20px;padding:10px 15px;color:var(--tx);resize:none;max-height:100px;outline:none;font-size:14px;line-height:1.4}
#c-inp:focus{border-color:var(--teal)}
#c-send{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#0d0f10;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-weight:700}
#c-send:active{opacity:.75}

/* ── PARTS TABLE ── */
.pt-hdr{display:flex;padding:8px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);border-bottom:1px solid var(--br)}
.pt-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);cursor:pointer;background:var(--b2);transition:background .1s}
.pt-row:last-child{border-bottom:none}
.pt-row:active{background:var(--b3)}

/* ── FAB ── */
#scan-fab{position:fixed;right:18px;bottom:calc(var(--nav)+var(--sb)+14px);width:50px;height:50px;border-radius:50%;background:var(--teal);color:#0d0f10;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(42,191,170,.35);z-index:90;font-size:20px;cursor:pointer}
#scan-fab:active{opacity:.8}

/* ── SCAN OV ── */
#scan-ov{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
.sf{width:230px;height:230px;border-radius:16px;border:2px solid rgba(42,191,170,.3);position:relative;display:flex;align-items:center;justify-content:center}
.sc{position:absolute;width:22px;height:22px;border-color:var(--teal);border-style:solid}
.sc.tl{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:4px 0 0}
.sc.tr{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 4px 0}
.sc.bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.sc.br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 4px}

/* ── LOGIN ── */
.l-logo{height:44px;width:auto;object-fit:contain}
.l-card{width:100%;max-width:360px;background:var(--b2);border:1px solid var(--br2);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.l-err{background:var(--rd);border:1px solid rgba(224,85,85,.3);border-radius:var(--rs);padding:10px 14px;font-size:13px;color:var(--red);display:none}

/* ── STATES ── */
.empty{text-align:center;padding:52px 24px;color:var(--t3)}
.ei{font-size:36px;margin-bottom:14px}.et{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:6px}.es{font-size:13px;line-height:1.5}
.spin{width:26px;height:26px;border:2px solid var(--br2);border-top-color:var(--teal);border-radius:50%;animation:sp .65s linear infinite;display:block;margin:56px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{position:fixed;top:calc(var(--st)+var(--hdr)+10px);left:50%;transform:translateX(-50%) translateY(-16px);background:var(--b3);border:1px solid var(--br2);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
const SB_URL='https://piamamighqiielfztgic.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA';
let db=null,_rt=null;

// ── STATE ────────────────────────────────────────────────────────────────
const S={
  user:null,email:'',name:'',
  tab:'home',detail:null,detailId:null,  // detail: null|'part'|'count'
  tasksTab:'counts',orderFilter:'open',
  orderExp:null,poExp:null,
  partSearch:'',partCat:'',partsMode:'parts',asmSearch:'',
  chatUnread:0,dataReady:false,
  // data
  sales:[],assemblies:[],parts:[],purchases:[],cycleCounts:[],chatMessages:[],
  boms:{},partCorr:{},partCats:[],
  loaded:{},countVals:{},
  // nav stack
  nav:[],
};

// ── UTILS ────────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,d=2600){const el=$('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),d);}
function fmt(n){return Number(n||0).toLocaleString();}
function cur(n){return n>0?'$'+Number(n).toFixed(2):'—';}
function ago(ts){if(!ts)return'';const s=(Date.now()-new Date(ts))/1e3;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function ini(n){return(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function pn(p){return(p.use_new_sku&&p.new_sku)?p.new_sku:p.pn;}
function fA(pn){return S.assemblies.find(a=>a.pn===pn||(a.use_new_sku&&a.new_sku===pn));}
function fP(pn){return S.parts.find(p=>p.pn===pn||p.new_sku===pn);}
function spin(){return '<div class="spin"></div>';}

// ── NAV STACK ────────────────────────────────────────────────────────────
function saveNav(){
  S.nav.push({tab:S.tab,detail:S.detail,detailId:S.detailId,
    tasksTab:S.tasksTab,orderFilter:S.orderFilter,
    orderExp:S.orderExp,poExp:S.poExp,
    partSearch:S.partSearch,partCat:S.partCat});
}
function goBack(){
  if(S.nav.length){
    const p=S.nav.pop();
    Object.assign(S,p);
    syncNav();render();$('view').scrollTo(0,0);
  } else {
    goHome();
  }
}
function goHome(){
  S.nav=[];S.detail=null;S.detailId=null;
  S.orderExp=null;S.poExp=null;
  setTab('home');
}
function updateHdr(){
  const back=S.nav.length>0||S.detail;
  $('hdr-back').style.display=back?'flex':'none';
  $('hdr-home').style.display=(back&&S.tab!=='home')?'block':'none';
  const titles={home:'TGK Mobile',orders:'Orders',parts:'Parts',tasks:'Tasks',chat:'Team Chat'};
  const detailTitles={part:'Part Detail',count:'Cycle Count',order:'Order Detail',asm:'Assembly BOM'};
  $('hdr-title').textContent=S.detail?detailTitles[S.detail]:(titles[S.tab]||'TGK Mobile');
}
function syncNav(){
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const nb=$('nb-'+S.tab);if(nb)nb.classList.add('on');
  $('scan-fab').style.display=(S.tab==='parts'||S.tab==='orders')?'flex':'none';
}

// ── INIT ─────────────────────────────────────────────────────────────────
async function init(){
  db=supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(session)await onLogin(session);
  db.auth.onAuthStateChange(async(ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess)await onLogin(sess);
    if(ev==='SIGNED_OUT'){$('app').style.display='none';$('login').style.display='flex';}
  });
}
async function onLogin(sess){
  S.user=sess.user;S.email=sess.user.email;
  S.name=sess.user.user_metadata?.name||sess.user.email.split('@')[0];
  $('hdr-user').textContent=S.name;
  $('login').style.display='none';$('app').style.display='flex';
  $('view').innerHTML=spin();
  await loadAll();
  render();setupRT();
}
async function doLogin(){
  const em=$('l-em').value.trim(),pw=$('l-pw').value;
  const err=$('l-err'),btn=$('l-btn');
  err.style.display='none';
  if(!em||!pw){err.textContent='Email and password required.';err.style.display='block';return;}
  btn.textContent='Signing in…';btn.disabled=true;
  const{error}=await db.auth.signInWithPassword({email:em,password:pw});
  if(error){err.textContent=error.message;err.style.display='block';}
  btn.textContent='Sign In';btn.disabled=false;
}
async function doLogout(){if(!confirm('Sign out?'))return;if(_rt)db.removeChannel(_rt);await db.auth.signOut();}

// ── DATA ─────────────────────────────────────────────────────────────────
async function loadAll(){
  // Load everything at once on login — no per-tab flag races
  try{
    const[sales,asms,parts,pos,cts,chat,bomRows]=await Promise.all([
      db.from('sales').select('id,order_number,pn,fulfillment_status,qty,customer_name,sale_date,tracking_number,carrier,shipped_at').order('created_at',{ascending:false}).limit(800),
      db.from('assemblies').select('pn,description,total_on_hand,new_sku,use_new_sku,discontinued,stage').order('pn'),
      db.from('parts').select('pn,description,category,vendor,total_unpckgd,unit_cost,location,min_qty,max_qty,new_sku,avg_sales_wk').order('pn'),
      db.from('purchases').select('*').not('status','in','("Received","Cancelled")').order('order_date',{ascending:false}),
      db.from('cycle_counts').select('*').eq('status','Open').order('created_at',{ascending:false}),
      db.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(80),
      db.from('bom_items').select('parent_pn,child_pn,qty,item_type,sort_order')
    ]);
    S.sales=sales.data||[];
    S.assemblies=(asms.data||[]).filter(a=>!a.discontinued&&a.stage!=='discontinued');
    S.parts=parts.data||[];
    S.partCats=[...new Set(S.parts.map(p=>p.category||'').filter(Boolean))].sort();
    S.purchases=pos.data||[];
    S.cycleCounts=cts.data||[];
    S.chatMessages=(chat.data||[]).reverse();
    S.boms={};
    (bomRows.data||[]).forEach(i=>{if(!S.boms[i.parent_pn])S.boms[i.parent_pn]=[];S.boms[i.parent_pn].push(i);});
    S.dataReady=true;
  }catch(e){console.error('[TGK load]',e);toast('Connection error — check network');}
}
async function loadData(tab){
  // Stub kept for realtime refresh paths
  if(tab==='chat'){
    const{data}=await db.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(80);
    S.chatMessages=(data||[]).reverse();S.chatUnread=0;updChatBadge();
  }
}

// ── REALTIME ─────────────────────────────────────────────────────────────
function setupRT(){
  _rt=db.channel('tgk-mob')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{
      S.chatMessages.push(p.new);
      if(S.tab==='chat'){renderChatMsgs();chatScroll();}
      else{S.chatUnread++;updChatBadge();}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},()=>{
      db.from('sales').select('id,order_number,pn,fulfillment_status,qty,customer_name,sale_date,tracking_number,carrier,shipped_at').order('created_at',{ascending:false}).limit(800).then(({data})=>{if(data){S.sales=data;if(S.tab==='home'||S.tab==='orders')render();}});
    })
    .subscribe();
}
function updChatBadge(){
  const d=$('chat-dot'),l=$('chat-lbl');
  if(d)d.style.display=S.chatUnread>0?'block':'none';
  if(l)l.textContent=S.chatUnread>0?`Chat (${S.chatUnread})`:'Chat';
}

// ── TABS ─────────────────────────────────────────────────────────────────
async function setTab(tab){
  S.tab=tab;S.detail=null;S.detailId=null;S.nav=[];
  S.orderExp=null;S.poExp=null;
  syncNav();updateHdr();
  if(tab==='chat'){await loadData(tab);S.chatUnread=0;updChatBadge();}
  render();$('view').scrollTo(0,0);
  if(tab==='chat')chatScroll();
}

// ── RENDER ───────────────────────────────────────────────────────────────
function render(){
  updateHdr();
  if(S.detail==='part'){$('view').innerHTML=renderPartDetail();return;}
  if(S.detail==='count'){$('view').innerHTML=renderCountDetail();return;}
  if(S.detail==='order'){$('view').innerHTML=renderOrderDetail();return;}
  if(S.detail==='asm'){$('view').innerHTML=renderAsmDetail();return;}
  switch(S.tab){

// ── ORDERS ───────────────────────────────────────────────────────────────
function grpOrders(){
  const byO={};
  S.sales.forEach(s=>{const k=s.order_number||'__'+s.id;if(!byO[k])byO[k]=[];byO[k].push(s);});
  return Object.entries(byO).map(([k,lines])=>{
    const shipped=lines.filter(l=>['Shipped','Delivered'].includes(l.fulfillment_status));
    const pend=lines.filter(l=>!['Shipped','Delivered','Cancelled','Refunded'].includes(l.fulfillment_status||'Open'));
    const allHold=pend.length>0&&pend.every(l=>l.fulfillment_status==='On Hold');
    const fs=allHold?'On Hold':shipped.length>0&&pend.length>0?'Partial':
      lines.reduce((b,x)=>{const r={'Shipped':5,'Delivered':4,'Packed':3,'On Hold':2,'Partial':2,'Open':1,'Cancelled':0};return(r[x.fulfillment_status||'Open']||0)>(r[b]||0)?x.fulfillment_status:b;},'Open');
    return{k,lines,fs,date:lines[0].sale_date||'',customer:lines[0].customer_name||'',orderNum:lines[0].order_number||k};
  });
}

function renderOrders(){
  const all=grpOrders();
  const nOpen=all.filter(o=>o.fs==='Open').length;
  const nPack=all.filter(o=>o.fs==='Packed').length;
  let list=all;
  if(S.orderFilter==='open')list=all.filter(o=>o.fs==='Open');
  else if(S.orderFilter==='packed')list=all.filter(o=>o.fs==='Packed');
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const rows=list.length?list.map(o=>orderCard(o)).join(''):`<div class="empty"><div class="ei">📭</div><div class="et">No orders here</div><div class="es">Try a different filter</div></div>`;
  return`
  <div class="pg">Orders</div>
  <div class="chips">
    <div class="chip ${S.orderFilter==='open'?'on':''}" onclick="S.orderFilter='open';render()">To Pack (${nOpen})</div>
    <div class="chip ${S.orderFilter==='packed'?'on':''}" onclick="S.orderFilter='packed';render()">Packed (${nPack})</div>
    <div class="chip ${S.orderFilter==='all'?'on':''}" onclick="S.orderFilter='all';render()">All Orders</div>
  </div>${rows}`;
}

function orderCard(o){
  const exp=S.orderExp===o.k;
  const pc=o.fs==='Packed'?'p-pack':o.fs==='Shipped'||o.fs==='Delivered'?'p-ship':o.fs==='On Hold'?'p-hold':'p-open';
  const lines=o.lines.map(l=>{
    const a=fA(l.pn),p=fP(l.pn);
    const st=a?(a.total_on_hand||0):p?(p.total_unpckgd||0):null;
    const ok=st===null||st>=(l.qty||1);
    return`<div class="o-line">
      <div><div style="font-family:var(--mono);font-size:13px;color:var(--teal)">${esc(l.pn)}</div><div style="font-size:12px;color:var(--t3);margin-top:1px">Qty: ${l.qty||1}</div></div>
      ${st!==null?`<div style="font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${st} in stock</div>`:'<div style="font-size:12px;color:var(--t3)">Drop-ship</div>'}
    </div>`;
  }).join('');
  const acts=o.fs==='Open'?`<button class="btn btn-p btn-sm" onclick="event.stopPropagation();markPacked('${esc(o.k)}')">Mark Packed</button>`:
    o.fs==='Packed'?`<button class="btn btn-o btn-sm" onclick="event.stopPropagation();shipForm('${esc(o.k)}')">🚚 Ship</button>`:'';
  return`<div class="card ${exp?'exp':''}">
    <div class="c-hd" onclick="openOrder('${esc(o.k)}','${esc(o.orderNum)}','${esc(o.customer)}')">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
          <span style="font-weight:700;font-family:var(--mono);font-size:14px">${esc(o.orderNum)}</span>
          ${o.lines.length>1?`<span style="font-size:11px;background:var(--b4);color:var(--t3);border-radius:8px;padding:1px 6px">${o.lines.length} items</span>`:''}
        </div>
        <div style="font-size:12px;color:var(--t3)">${esc(o.customer)||'Unknown'} &middot; ${o.date||'—'}</div>
      </div>
      <span class="pill ${pc}" style="flex-shrink:0">${o.fs}</span>
      <span class="chev">▼</span>
    </div>
    <div style="padding:0 14px 12px;display:flex;gap:8px;align-items:center">
      <div style="flex:1;font-size:12px;color:var(--t3)">${o.lines.map(l=>esc(l.pn)).join('  ·  ').slice(0,60)}</div>
      <span style="font-size:12px;color:var(--teal);font-weight:600">Details ›</span>
    </div>
  </div>`;

}

window._togOrd=function(k){S.orderExp=S.orderExp===k?null:k;render();};
async function markPacked(k){
  const ls=S.sales.filter(s=>(s.order_number||'__'+s.id)===k&&(s.fulfillment_status||'Open')==='Open');
  if(!ls.length)return;if(!confirm('Mark as Packed?'))return;
  const now=new Date().toISOString();
  try{
    await Promise.all(ls.map(l=>db.from('sales').update({fulfillment_status:'Packed',updated_at:now}).eq('id',l.id)));
    ls.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s)s.fulfillment_status='Packed';});
    toast('✓ Marked Packed');render();
  }catch(e){toast('Error: '+e.message);}
}
function shipForm(k){
  const tr=(prompt('Tracking number (leave blank to skip):','')||'').trim();
  const cr=tr?((prompt('Carrier (UPS, USPS, FedEx, DHL…):','')||'').trim()):'';
  markShipped(k,tr,cr);
}
async function markShipped(k,tr,cr){
  const ls=S.sales.filter(s=>(s.order_number||'__'+s.id)===k&&s.fulfillment_status==='Packed');
  if(!ls.length){toast('No packed lines found');return;}
  const now=new Date().toISOString();
  try{
    await Promise.all(ls.map(l=>db.from('sales').update({fulfillment_status:'Shipped',tracking_number:tr||null,carrier:cr||null,shipped_at:now,updated_at:now}).eq('id',l.id)));
    ls.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s){s.fulfillment_status='Shipped';s.tracking_number=tr;s.shipped_at=now;}});
    toast('📦 Shipped!');render();
  }catch(e){toast('Error: '+e.message);}
}

function adjD(d,id,orig){const el=$(id);if(el)el.value=Math.max(0,(parseInt(el.value)||orig)+d);}
async function doAdj(pn,prev){
  const nq=parseInt($('adj-q')?.value)||0;
  const reason=$('adj-r')?.value||'Manual correction';
  const notes=$('adj-n')?.value||'';
  const adj=nq-prev;
  if(adj===0){toast('No change');return;}
  if(!confirm(pn+': '+prev+' to '+nq+' ('+(adj>0?'+':'')+adj+'). Save?'))return;
  try{
    const now=new Date().toISOString();
    await db.from('parts').update({total_unpckgd:nq,updated_at:now}).eq('pn',pn);
    await db.from('inv_corrections').insert({pn,previous_qty:prev,new_qty:nq,adjustment:adj,reason,source:'Mobile App'+(notes?' — '+notes:''),user_email:S.email,created_at:now});
    const pt=S.parts.find(p=>p.pn===pn);if(pt)pt.total_unpckgd=nq;
    toast('✓ Inventory updated');goBack();
  }catch(e){toast('Error: '+e.message);}
}

function renderAsmDetail(){
  const a=S.assemblies.find(x=>x.pn===S.detailId);
  if(!a)return`<div class="empty"><div class="et">Assembly not found</div></div>`;
  const oh=a.total_on_hand||0;
  const bom=S.boms[a.pn]||[];

  let canBuild=Infinity;
  bom.forEach(i=>{
    if(i.item_type!=='part'&&i.item_type!=='assembly'&&i.item_type!=='subassembly')return;
    const p=fP(i.child_pn);if(!p)return;
    const avail=Math.max(0,p.total_unpckgd||0);
    const builds=i.qty>0?Math.floor(avail/i.qty):Infinity;
    canBuild=Math.min(canBuild,builds);
  });
  if(!isFinite(canBuild)||bom.length===0)canBuild=0;
  const bomRows=bom.map(i=>{
    const p=fP(i.child_pn);
    const a2=S.assemblies.find(x=>x.pn===i.child_pn);
    const oh2=p?(p.total_unpckgd||0):a2?(a2.total_on_hand||0):null;
    const need=i.qty||1;
    const ok=oh2===null||oh2>=need;
    const isSub=i.item_type==='assembly'||i.item_type==='subassembly';
    return`<div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--br)">
      <div style="width:3px;height:36px;border-radius:2px;background:${ok?'var(--green)':'var(--red)'}; flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--mono);font-size:12px;color:${isSub?'var(--purple)':'var(--teal)'};font-weight:600">${esc(i.child_pn)}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p?.description||a2?.description||'—')}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:13px;font-weight:700;color:${ok?'var(--tx)':'var(--red)'}">${oh2!==null?fmt(oh2):'DS'}</div>
        <div style="font-size:11px;color:var(--t3)">need ${need}</div>
      </div>
      ${isSub?'<span class="pill p-part" style="flex-shrink:0;font-size:10px">SUB</span>':''}
    </div>`;
  }).join('');
  return`
  <div style="padding:14px 16px 10px">
    <div style="font-family:var(--mono);color:var(--teal);font-size:19px;font-weight:700;margin-bottom:4px">${esc(a.pn)}</div>
    <div style="font-size:15px;color:var(--t2)">${esc(a.description||'—')}</div>
  </div>
  <div class="d-grid">
    <div class="dg"><div class="dl">On Hand</div><div class="dv" style="font-size:28px;color:${oh<=0?'var(--red)':'var(--teal)'}">${fmt(oh)}</div></div>
    <div class="dg"><div class="dl">Can Build</div><div class="dv" style="font-size:28px;color:${canBuild<=0?'var(--red)':canBuild<5?'var(--orange)':'var(--green)'}">${canBuild}</div></div>
  </div>
  ${bom.length?`
  <div class="sec-hd">Bill of Materials (${bom.length} lines)</div>
  <div class="lst" style="margin-bottom:8px">${bomRows}</div>
  `:`<div class="empty" style="padding:24px"><div class="et">No BOM defined</div><div class="es">Add components in the ERP</div></div>`}`;
}

// ── ORDER DETAIL ──────────────────────────────────────────────────────────
function openOrder(k,num,cust){saveNav();S.detail='order';S.detailId=k;render();$('view').scrollTo(0,0);}

function renderOrderDetail(){
  const k=S.detailId;
  const lines=S.sales.filter(s=>(s.order_number||'__'+s.id)===k).sort((a,b)=>a.pn.localeCompare(b.pn));
  if(!lines.length)return`<div class="empty"><div class="et">Order not found</div></div>`;
  const lead=lines[0];
  const shipped=lines.filter(l=>['Shipped','Delivered'].includes(l.fulfillment_status));
  const pend=lines.filter(l=>!['Shipped','Delivered','Cancelled','Refunded'].includes(l.fulfillment_status||'Open'));
  const allHold=pend.length>0&&pend.every(l=>l.fulfillment_status==='On Hold');
  const fs=allHold?'On Hold':shipped.length>0&&pend.length>0?'Partial':
    lines.reduce((b,x)=>{const r={'Shipped':5,'Delivered':4,'Packed':3,'On Hold':2,'Open':1,'Cancelled':0};return(r[x.fulfillment_status||'Open']||0)>(r[b]||0)?x.fulfillment_status:b;},'Open');
  const pc=fs==='Packed'?'p-pack':fs==='Shipped'||fs==='Delivered'?'p-ship':fs==='On Hold'?'p-hold':'p-open';
  const trk=lines.find(l=>l.tracking_number)?.tracking_number||'';
  const cr=lines.find(l=>l.carrier)?.carrier||'';
  const lineRows=lines.map(l=>{
    const a=fA(l.pn),p=fP(l.pn);
    const st=a?(a.total_on_hand||0):p?(p.total_unpckgd||0):null;
    const ok=st===null||st>=(l.qty||1);
    const lfs=l.fulfillment_status||'Open';
    const lpc=lfs==='Packed'?'p-pack':lfs==='Shipped'||lfs==='Delivered'?'p-ship':lfs==='On Hold'?'p-hold':'p-open';
    return`<div style="padding:12px 16px;border-bottom:1px solid var(--br)">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--mono);font-size:13px;color:var(--teal);font-weight:600">${esc(l.pn)}</div>
          <div style="font-size:12px;color:var(--t2);margin-top:2px">${esc(a?.description||p?.description||'—')}</div>
          <div style="font-size:12px;color:var(--t3);margin-top:2px">Qty: <strong style="color:var(--tx)">${l.qty||1}</strong></div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${st!==null?`<div style="font-size:15px;font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${fmt(st)} in stock</div>`:'<div style="font-size:12px;color:var(--t3)">Drop-ship</div>'}
          <span class="pill ${lpc}" style="margin-top:5px">${lfs}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  const actions=fs==='Open'?`<button class="btn btn-p btn-w" onclick="markPacked('${esc(k)}')">📦 Mark All Packed</button>`:
    fs==='Packed'?`<button class="btn btn-o btn-w" onclick="shipForm('${esc(k)}')">🚚 Mark Shipped</button>`:'';
  return`
  <div style="padding:14px 16px 10px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-family:var(--mono);font-size:18px;font-weight:700">${esc(lead.order_number||k)}</span>
      <span class="pill ${pc}">${fs}</span>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:3px">${esc(lead.customer_name||'Unknown Customer')}</div>
    <div style="font-size:12px;color:var(--t3)">${lead.sale_date||'—'} &middot; ${lines.length} line${lines.length!==1?'s':''}</div>
    ${trk?`<div style="margin-top:8px;padding:8px 10px;background:var(--b3);border-radius:var(--rs);font-size:12px"><span style="color:var(--t3)">${esc(cr)||'Tracking'}: </span><strong style="font-family:var(--mono)">${esc(trk)}</strong></div>`:''}
  </div>
  <div class="sec-hd">Order Lines</div>
  <div class="lst" style="margin-bottom:12px">${lineRows}</div>
  ${actions?`<div style="padding:0 16px 24px">${actions}</div>`:''}`;
}

// ── PART HISTORY ──────────────────────────────────────────────────────────
async function openPart(pn){
  saveNav();S.detail='part';S.detailId=pn;
  render();$('view').scrollTo(0,0);
  // Fetch correction history in background
  try{
    const{data}=await db.from('inv_corrections')
      .select('adjustment,previous_qty,new_qty,reason,source,user_email,created_at')
      .eq('pn',pn).order('created_at',{ascending:false}).limit(12);
    S.partCorr[pn]=data||[];
    if(S.detail==='part'&&S.detailId===pn){render();$('view').scrollTo(0,0);}
  }catch(e){S.partCorr[pn]=[];}
}

// ── TASKS ─────────────────────────────────────────────────────────────────
function renderTasks(){
  return`
  <div class="pg">Tasks</div>
  <div class="chips">
    <div class="chip ${S.tasksTab==='counts'?'on':''}" onclick="S.tasksTab='counts';render()">Cycle Counts (${S.cycleCounts.length})</div>
    <div class="chip ${S.tasksTab==='receiving'?'on':''}" onclick="S.tasksTab='receiving';render()">PO Receiving (${S.purchases.length})</div>
  </div>
  ${S.tasksTab==='counts'?renderCounts():renderReceiving()}`;
}

function renderCounts(){
  if(!S.cycleCounts.length)return`<div class="empty"><div class="ei">✅</div><div class="et">No open counts</div><div class="es">All cycle counts are complete</div></div>`;
  const rows=S.cycleCounts.map(c=>{
    const items=JSON.parse(c.items||'[]');
    return`<div class="li" onclick="openCount('${esc(c.id)}')">
      <div style="flex:1"><div class="li-t">${esc(c.name||'Count #'+c.id.slice(0,8))}</div><div class="li-s">${items.length} parts &middot; ${ago(c.created_at)}</div></div>
      <div style="color:var(--teal);font-size:13px;font-weight:600;flex-shrink:0">Start ›</div>
    </div>`;
  }).join('');
  return`<div class="lst">${rows}</div>`;
}

function openCount(id){saveNav();S.detail='count';S.detailId=id;S.countVals={};render();$('view').scrollTo(0,0);}

function renderCountDetail(){
  const c=S.cycleCounts.find(x=>x.id===S.detailId);
  if(!c)return`<div class="empty"><div class="et">Count not found</div></div>`;
  const items=JSON.parse(c.items||'[]');
  const rows=items.map(item=>{
    const p=fP(item.pn);const sys=p?.total_unpckgd??'?';
    return`<div style="padding:13px 16px;border-bottom:1px solid var(--br)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px">
        <div><div style="font-family:var(--mono);font-size:13px;color:var(--teal);margin-bottom:2px">${esc(item.pn)}</div><div style="font-size:12px;color:var(--t3)">${esc(p?.description||item.pn)}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px"><div style="font-size:11px;color:var(--t3)">System</div><div style="font-size:18px;font-weight:700">${sys}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;color:var(--t2);flex-shrink:0">Counted:</span>
        <input class="inp" style="flex:1;text-align:center;padding:9px;font-size:16px;font-weight:600" type="number" min="0"
          value="${S.countVals[item.pn]!==undefined?S.countVals[item.pn]:''}" placeholder="qty"
          onchange="S.countVals['${esc(item.pn)}']=parseInt(this.value)||0">
      </div>
    </div>`;
  }).join('');
  return`
  <div style="padding:14px 16px 12px"><div style="font-size:18px;font-weight:700">${esc(c.name||'Cycle Count')}</div><div style="font-size:13px;color:var(--t3);margin-top:3px">${items.length} parts to count</div></div>
  <div class="lst" style="margin-bottom:14px">${rows}</div>
  <div style="padding:0 16px 24px"><button class="btn btn-p btn-w" onclick="doCount('${esc(c.id)}')">Submit Count</button></div>`;
}

async function doCount(id){
  const c=S.cycleCounts.find(x=>x.id===id);if(!c)return;
  const items=JSON.parse(c.items||'[]');
  const filled=items.filter(i=>S.countVals[i.pn]!==undefined);
  if(!filled.length){toast('Enter at least one count');return;}
  if(!confirm(`Submit ${filled.length} of ${items.length} parts?`))return;
  const now=new Date().toISOString();
  try{
    await Promise.all(filled.map(async i=>{
      const nq=S.countVals[i.pn];const p=fP(i.pn);const prev=p?.total_unpckgd||0;
      if(nq===prev)return;
      await db.from('parts').update({total_unpckgd:nq,updated_at:now}).eq('pn',i.pn);
      await db.from('inv_corrections').insert({pn:i.pn,previous_qty:prev,new_qty:nq,adjustment:nq-prev,reason:'Cycle count',source:'Mobile Cycle Count',user_email:S.email,created_at:now,reference_id:id});
      if(p)p.total_unpckgd=nq;
    }));
    await db.from('cycle_counts').update({status:'Completed',completed_at:now,updated_at:now}).eq('id',id);
    S.cycleCounts=S.cycleCounts.filter(x=>x.id!==id);S.countVals={};
    toast('✓ Count submitted');goBack();
  }catch(e){toast('Error: '+e.message);}
}

function renderReceiving(){
  if(!S.purchases.length)return`<div class="empty"><div class="ei">📥</div><div class="et">No open POs</div><div class="es">All purchase orders received</div></div>`;
  const rows=S.purchases.map(po=>poCard(po)).join('');
  return`<div style="padding-bottom:8px">${rows}</div>`;
}

function poCard(po){
  const exp=S.poExp===po.id;
  const sc=po.status==='On Order'||po.status==='Ordered'?'var(--teal)':po.status==='In Transit'?'var(--orange)':'var(--t3)';
  const pt=fP(po.pn);
  return`<div class="card ${exp?'exp':''}" data-poid="${esc(po.id)}">
    <div class="c-hd" onclick="window._togPO('${esc(po.id)}')">
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--mono);font-weight:700;margin-bottom:3px">${esc(po.pn)}</div>
        ${pt?`<div style="font-size:12px;color:var(--t2);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pt.description||'')}</div>`:''}
        <div style="font-size:12px;color:var(--t3)">${esc(po.vendor||'—')} &middot; Qty: ${po.qty||0}</div>
        ${po.order_date?`<div style="font-size:11px;color:var(--t3)">Ordered: ${po.order_date}</div>`:''}
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:10px">
        <span style="font-size:12px;font-weight:700;color:${sc}">${esc(po.status||'Draft')}</span>
        <div class="chev">▼</div>
      </div>
    </div>
    ${exp?`<div class="c-body">
      <div style="margin-bottom:12px"><label class="lbl">Qty Received</label>
        <input class="inp" type="number" id="rv-${esc(po.id)}" value="${po.qty||0}" min="0" max="${po.qty||999}">
      </div>
      <button class="btn btn-p btn-sm" onclick="doReceive('${esc(po.id)}',${po.qty||0})">Mark Received</button>
    </div>`:''}
  </div>`;
}

window._togPO=function(id){S.poExp=S.poExp===id?null:id;render();};

async function doReceive(id,total){
  const po=S.purchases.find(x=>x.id===id);if(!po)return;
  const qty=parseInt(document.getElementById('rv-'+id)?.value)||0;
  if(qty<1){toast('Enter qty');return;}
  if(!confirm(`Receive ${qty} × ${po.pn}?`))return;
  const now=new Date().toISOString();
  try{
    const pt=fP(po.pn);const prev=pt?.total_unpckgd||0;const nq=prev+qty;
    if(pt){await db.from('parts').update({total_unpckgd:nq,updated_at:now}).eq('pn',po.pn);pt.total_unpckgd=nq;}
    const st=qty>=total?'Received':'Partial';
    await db.from('purchases').update({status:st,updated_at:now}).eq('id',id);
    await db.from('inv_corrections').insert({pn:po.pn,previous_qty:prev,new_qty:nq,adjustment:qty,reason:'Received shipment',source:'Mobile PO Receive',user_email:S.email,created_at:now,reference_id:id});
    if(st==='Received')S.purchases=S.purchases.filter(x=>x.id!==id);
    else{const px=S.purchases.find(x=>x.id===id);if(px)px.status='Partial';}
    S.poExp=null;toast('✓ Received '+qty+' × '+po.pn);render();
  }catch(e){toast('Error: '+e.message);}
}

// ── CHAT ──────────────────────────────────────────────────────────────────
function renderChat(){
  return`
  <div class="pg" style="padding-bottom:4px">Team Chat</div>
  <div class="chat-l" id="chat-msgs">${buildMsgs()}</div>
  <div class="chat-ft">
    <textarea id="c-inp" rows="1" placeholder="Message the team…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doChat();}"></textarea>
    <div id="c-send" onclick="doChat()">↑</div>
  </div>`;
}
function renderChatMsgs(){const el=$('chat-msgs');if(el)el.innerHTML=buildMsgs();}
function buildMsgs(){
  if(!S.chatMessages.length)return`<div style="text-align:center;padding:32px;color:var(--t3);font-size:13px">No messages yet — say hi 👋</div>`;
  return S.chatMessages.map(m=>{
    const me=m.user_email===S.email||m.sender_email===S.email;
    const nm=m.sender_name||m.user_email||'?';
    return`<div class="msg-r ${me?'me':''}">
      ${!me?`<div class="m-av">${ini(nm)}</div>`:''}
      <div style="flex:1;min-width:0">
        ${!me?`<div class="m-nm">${esc(nm)}</div>`:''}
        <div class="m-b">${esc(m.message||m.content||'')}</div>
        <div class="m-ts">${ago(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
}
function chatScroll(){setTimeout(()=>{const v=$('view');if(v)v.scrollTo(0,v.scrollHeight);},80);}
async function doChat(){
  const inp=$('c-inp');if(!inp)return;
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  try{
    await db.from('chat_messages').insert({message:msg,user_email:S.email,sender_email:S.email,sender_name:S.name,created_at:new Date().toISOString()});
  }catch(e){toast('Send failed');}
}

// ── SCANNER ───────────────────────────────────────────────────────────────
function openScan(){
  if(navigator.mediaDevices?.getUserMedia)navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
  $('scan-ov').style.display='flex';
}
function closeScan(){$('scan-ov').style.display='none';}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='l-pw')doLogin();});
