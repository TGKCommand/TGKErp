<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TGK Mobile">
<meta name="theme-color" content="#141618">
<title>TGK Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#2ABFAA;--teal-dim:rgba(42,191,170,.13);--teal-border:rgba(42,191,170,.28);
  --orange:#E07B28;--orange-dim:rgba(224,123,40,.13);
  --red:#e05555;--red-dim:rgba(224,85,85,.13);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.13);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --bg:#0d0f10;--bg2:#161a1e;--bg3:#1e2329;--bg4:#252b33;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#edf0f4;--text2:#9ba4b0;--text3:#5c6470;
  --mono:'JetBrains Mono',monospace;
  --nav-h:60px;--hdr-h:56px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r:10px;--r-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;overscroll-behavior:none;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--text)}
a{color:inherit;text-decoration:none}

/* ── SHELL ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;gap:20px;background:var(--bg)}
#app{display:none;flex-direction:column;height:100dvh;height:100svh}
#hdr{height:var(--hdr-h);padding-top:var(--safe-t);background:#141618;border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:16px;padding-right:16px;gap:12px;flex-shrink:0}
#view{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:#141618;border-top:1px solid var(--border);display:flex;z-index:100}

/* ── NAV ── */
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--text3);padding:6px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nb.active{color:var(--teal)}
.nb svg{width:22px;height:22px;stroke-width:1.7;transition:transform .15s}
.nb.active svg{transform:translateY(-1px)}
.nb-bar{height:2px;width:24px;border-radius:2px;background:var(--teal);margin-top:2px;opacity:0;transition:opacity .15s}
.nb.active .nb-bar{opacity:1}
.nb-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center;line-height:1}

/* ── HEADER ── */
.hdr-logo{height:30px;width:auto;object-fit:contain}
.hdr-title{font-size:14px;font-weight:700;color:var(--text2);flex:1}
.hdr-user{font-size:11px;color:var(--text3);font-weight:500}

/* ── PAGE ── */
.pg-title{font-size:22px;font-weight:700;padding:20px 16px 6px;letter-spacing:-.3px}
.pg-sub{font-size:13px;color:var(--text3);padding:0 16px 14px}
.back-row{display:flex;align-items:center;gap:6px;padding:14px 16px 8px;cursor:pointer;color:var(--teal);font-size:14px;font-weight:600}
.back-row svg{flex-shrink:0}
.section-hd{padding:14px 16px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text3)}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 4px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 13px;cursor:pointer;transition:border-color .15s}
.kpi:active{border-color:var(--border2)}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:5px}
.kpi-val{font-size:28px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.kv-teal{color:var(--teal)}.kv-orange{color:var(--orange)}.kv-red{color:var(--red)}.kv-purple{color:var(--purple)}

/* ── INPUTS ── */
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px;color:var(--text);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--teal)}
.inp::placeholder{color:var(--text3)}
.lbl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.search-wrap{padding:10px 16px;position:relative}
.search-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:17px;pointer-events:none}
.search-wrap .inp{padding-left:38px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--r-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s;white-space:nowrap}
.btn:active{opacity:.72}
.btn-primary{background:var(--teal);color:#0d0f10}
.btn-secondary{background:var(--bg3);border:1.5px solid var(--border2);color:var(--text)}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}
.btn-danger{background:var(--red-dim);border:1px solid rgba(224,85,85,.3);color:var(--red)}
.btn-full{width:100%}
.btn-sm{padding:9px 14px;font-size:13px}

/* ── CHIPS ── */
.chips{display:flex;gap:7px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg3);border:1.5px solid var(--border2);color:var(--text3);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal-dim);border-color:var(--teal-border);color:var(--teal)}

/* ── LIST BLOCKS ── */
.list-blk{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
.li:last-child{border-bottom:none}
.li:active{background:var(--bg3)}
.li-title{font-weight:600;font-size:14px;line-height:1.3}
.li-sub{font-size:12px;color:var(--text3);margin-top:2px}
.li-arrow{color:var(--text3);font-size:18px;flex-shrink:0;margin-left:auto}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.02em}
.p-open{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-border)}
.p-packed{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(224,123,40,.3)}
.p-shipped{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.p-hold{background:var(--bg4);color:var(--text3);border:1px solid var(--border2)}

/* ── CARDS (expandable) ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 10px;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-hd:active{background:var(--bg3)}
.card-body{border-top:1px solid var(--border);padding:14px;display:none}
.card.exp .card-body{display:block}
.chevron{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.card.exp .chevron{transform:rotate(180deg)}
.order-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.order-line:last-child{border-bottom:none}

/* ── DETAIL GRID ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 14px;overflow:hidden}
.dg-cell{background:var(--bg2);padding:14px 13px}
.dg-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:5px}
.dg-val{font-size:16px;font-weight:700}

/* ── ADJUST QTY ── */
.adj-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.qty-btn{width:46px;height:46px;border-radius:var(--r-sm);background:var(--bg3);border:1.5px solid var(--border2);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.qty-btn:active{background:var(--bg4)}
.qty-inp{flex:1;text-align:center;font-size:22px;font-weight:700;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:10px;height:46px}
.qty-inp:focus{border-color:var(--teal);outline:none}

/* ── CHAT ── */
.chat-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:72px}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg-row.mine{flex-direction:row-reverse;margin-left:auto}
.msg-av{width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;align-self:flex-end}
.msg-b{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:9px 13px;font-size:14px;line-height:1.45;word-break:break-word}
.msg-row.mine .msg-b{background:var(--teal-dim);border-color:var(--teal-border)}
.msg-sender{font-size:11px;color:var(--text3);margin-bottom:3px;padding:0 4px}
.msg-time{font-size:10px;color:var(--text3);padding:2px 4px}
.chat-foot{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;background:#141618;border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
#chat-inp{flex:1;background:var(--bg3);border:1.5px solid var(--border2);border-radius:20px;padding:10px 15px;color:var(--text);resize:none;max-height:100px;outline:none;font-size:14px;line-height:1.4}
#chat-inp:focus{border-color:var(--teal)}
#chat-send-btn{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#0d0f10;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-weight:700}
#chat-send-btn:active{opacity:.75}

/* ── FAB ── */
#scan-fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);width:50px;height:50px;border-radius:50%;background:var(--teal);color:#0d0f10;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(42,191,170,.35);z-index:90;font-size:20px;cursor:pointer}
#scan-fab:active{opacity:.8}

/* ── SCAN OVERLAY ── */
#scan-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
.scan-frame{width:230px;height:230px;border-radius:16px;border:2px solid rgba(42,191,170,.3);position:relative;display:flex;align-items:center;justify-content:center}
.sc{position:absolute;width:22px;height:22px;border-color:var(--teal);border-style:solid}
.sc-tl{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:4px 0 0}
.sc-tr{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 4px 0}
.sc-bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.sc-br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 4px}

/* ── LOGIN ── */
.login-logo{height:44px;width:auto;object-fit:contain}
.login-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.login-err{background:var(--red-dim);border:1px solid rgba(224,85,85,.3);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--red);display:none}
.login-tagline{font-size:13px;color:var(--text3);letter-spacing:.02em}

/* ── QUICK ACTIONS ── */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 16px}
.qa-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;transition:border-color .15s;text-align:left}
.qa-btn:active{border-color:var(--border2)}
.qa-icon{font-size:22px;line-height:1}
.qa-label{font-size:13px;font-weight:600;color:var(--text2)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:52px 24px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:14px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;line-height:1.5}

/* ── SPINNER ── */
.spin{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:_sp .65s linear infinite;display:block;margin:48px auto}
@keyframes _sp{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{position:fixed;top:calc(var(--safe-t) + var(--hdr-h) + 10px);left:50%;transform:translateX(-50%) translateY(-20px);background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── FORM SECTION ── */
.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 14px;padding:16px;display:flex;flex-direction:column;gap:13px}
</style>
</head>

<script>
const SUPA_URL='https://piamamighqiielfztgic.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA';
let db=null,_rt=null;

const S={
  user:null,email:'',name:'',
  tab:'home',tasksTab:'counts',
  sales:[],assemblies:[],parts:[],purchases:[],cycleCounts:[],chatMessages:[],
  loaded:{},
  partSearch:'',partDetail:null,
  orderFilter:'open',orderExp:null,
  poExp:null,countDetail:null,
  chatUnread:0,
  countVals:{},
};

// ── UTILS ───────────────────────────────────────────────────
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,dur=2600){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function fmt(n){return Number(n||0).toLocaleString();}
function ago(ts){if(!ts)return'';const d=(Date.now()-new Date(ts))/1000;if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function findPart(pn){return S.parts.find(p=>p.pn===pn||p.new_sku===pn);}
function findAsm(pn){return S.assemblies.find(a=>a.pn===pn||(a.use_new_sku&&a.new_sku===pn));}
function spinner(){return '<div class="spin"></div>';}

// ── INIT ────────────────────────────────────────────────────
async function init(){
  db=supabase.createClient(SUPA_URL,SUPA_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(session)await onLogin(session);
  db.auth.onAuthStateChange(async(ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess)await onLogin(sess);
    if(ev==='SIGNED_OUT'){$('app').style.display='none';$('login').style.display='flex';}
  });
}

async function onLogin(sess){
  S.user=sess.user;S.email=sess.user.email;
  S.name=sess.user.user_metadata?.name||sess.user.email.split('@')[0];
  $('hdr-user').textContent=S.name;
  $('login').style.display='none';
  $('app').style.display='flex';
  await loadTabData('home');
  render();
  setupRT();
}

// ── AUTH ────────────────────────────────────────────────────
async function doLogin(){
  const email=$('l-email').value.trim();
  const pass=$('l-pass').value;
  const err=$('login-err');
  err.style.display='none';
  const btn=$('login-btn');
  btn.textContent='Signing in…';btn.disabled=true;
  if(!email||!pass){err.textContent='Email and password required.';err.style.display='block';btn.textContent='Sign In';btn.disabled=false;return;}
  const{error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent=error.message;err.style.display='block';}
  btn.textContent='Sign In';btn.disabled=false;
}
async function doLogout(){
  if(!confirm('Sign out?'))return;
  if(_rt)db.removeChannel(_rt);
  await db.auth.signOut();
}

// ── DATA ────────────────────────────────────────────────────
async function loadTabData(tab){
  if(S.loaded[tab])return;
  S.loaded[tab]=true;
  try{
    if(tab==='home'||tab==='orders'){
      if(!S.loaded._sales){
        const{data}=await db.from('sales').select('id,order_number,pn,fulfillment_status,qty,customer_name,sale_date,tracking_number,carrier,shipped_at,discount_code').order('created_at',{ascending:false}).limit(800);
        S.sales=data||[];S.loaded._sales=true;
      }
      if(!S.loaded._asms){
        const{data}=await db.from('assemblies').select('pn,description,total_on_hand,new_sku,use_new_sku,discontinued,stage').order('pn');
        S.assemblies=(data||[]).filter(a=>!a.discontinued&&a.stage!=='discontinued');S.loaded._asms=true;
      }
    }
    if(tab==='parts'){
      if(!S.loaded._parts){
        const{data}=await db.from('parts').select('pn,description,category,vendor,total_unpckgd,unit_cost,location,min_qty,max_qty,new_sku').order('pn');
        S.parts=(data||[]).filter(p=>!p.discontinued);S.loaded._parts=true;
      }
    }
    if(tab==='tasks'){
      const[pos,counts]=await Promise.all([
        db.from('purchases').select('*').not('status','in','("Received","Cancelled")').order('order_date',{ascending:false}),
        db.from('cycle_counts').select('*').eq('status','Open').order('created_at',{ascending:false})
      ]);
      S.purchases=pos.data||[];S.cycleCounts=counts.data||[];
      if(!S.loaded._parts){
        const{data}=await db.from('parts').select('pn,description,category,vendor,total_unpckgd,unit_cost,location,min_qty,max_qty,new_sku').order('pn');
        S.parts=(data||[]).filter(p=>!p.discontinued);S.loaded._parts=true;
      }
    }
    if(tab==='chat'){
      const{data}=await db.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(80);
      S.chatMessages=(data||[]).reverse();
      S.chatUnread=0;updateChatBadge();
    }
  }catch(e){console.error('[TGK]',e);}
}

// ── REALTIME ────────────────────────────────────────────────
function setupRT(){
  _rt=db.channel('tgk-mobile')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{
      S.chatMessages.push(p.new);
      if(S.tab==='chat'){renderChatMsgs();scrollChatBottom();}
      else{S.chatUnread++;updateChatBadge();}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},()=>{
      S.loaded._sales=false;
      if(S.tab==='home'||S.tab==='orders')loadTabData(S.tab).then(()=>render());
    })
    .subscribe();
}
function updateChatBadge(){
  const b=$('chat-badge'),l=$('chat-nav-lbl');
  if(S.chatUnread>0){if(b){b.textContent=S.chatUnread;b.style.display='flex';}if(l)l.textContent='Chat';}
  else{if(b)b.style.display='none';if(l)l.textContent='Chat';}
}

// ── NAV & RENDER ────────────────────────────────────────────
const TAB_TITLES={home:'Home',orders:'Orders',parts:'Parts',tasks:'Tasks',chat:'Team Chat'};

async function setTab(tab){
  if(S.tab===tab&&!S.partDetail&&!S.countDetail){$('view').scrollTo(0,0);return;}
  S.tab=tab;S.partDetail=null;S.countDetail=null;S.orderExp=null;S.poExp=null;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const nb=$('nb-'+tab);if(nb)nb.classList.add('active');
  $('hdr-title').textContent=TAB_TITLES[tab]||'TGK Mobile';
  $('scan-fab').style.display=(tab==='parts'||tab==='orders')?'flex':'none';
  if(!S.loaded[tab])$('view').innerHTML=spinner();
  await loadTabData(tab);
  if(tab==='chat'){S.chatUnread=0;updateChatBadge();}
  history.replaceState({tab},'',(tab==='home'?'#':'#'+tab));
  render();
  $('view').scrollTo(0,0);
  if(tab==='chat')scrollChatBottom();
}

function pushDetail(type,id){
  history.pushState({tab:S.tab,[type]:id},'','#detail');
}
function render(){
  const v=$('view');
  if(S.partDetail){v.innerHTML=renderPartDetail();return;}
  if(S.countDetail){v.innerHTML=renderCountDetail();return;}
  switch(S.tab){
    case 'home':   v.innerHTML=renderHome();break;
    case 'orders': v.innerHTML=renderOrders();break;
    case 'parts':  v.innerHTML=renderParts();break;
    case 'tasks':  v.innerHTML=renderTasks();break;
    case 'chat':   v.innerHTML=renderChat();scrollChatBottom();break;
    default:       v.innerHTML=renderHome();
  }
}

// Handle browser back
window.addEventListener('popstate',e=>{
  if(S.partDetail){S.partDetail=null;render();return;}
  if(S.countDetail){S.countDetail=null;render();return;}
  if(S.orderExp){S.orderExp=null;render();return;}
  const tab=(e.state&&e.state.tab)||'home';
  if(tab!==S.tab)setTab(tab);
});

// ── HOME ────────────────────────────────────────────────────
function renderHome(){
  const byOrd={};
  S.sales.forEach(s=>{const k=s.order_number||('__'+s.id);if(!byOrd[k])byOrd[k]=[];byOrd[k].push(s);});
  const orders=Object.values(byOrd);
  const toPack=orders.filter(lines=>lines.some(l=>(l.fulfillment_status||'Open')==='Open')).length;

// ── ORDERS ──────────────────────────────────────────────────
function renderOrders(){
  const byOrd={};
  S.sales.forEach(s=>{const k=s.order_number||('__'+s.id);if(!byOrd[k])byOrd[k]=[];byOrd[k].push(s);});
  let orders=Object.entries(byOrd).map(([k,lines])=>{
    const shipped=lines.filter(l=>l.fulfillment_status==='Shipped'||l.fulfillment_status==='Delivered');
    const pending=lines.filter(l=>!['Shipped','Delivered','Cancelled','Refunded'].includes(l.fulfillment_status||'Open'));
    const allHold=pending.length>0&&pending.every(l=>l.fulfillment_status==='On Hold');
    const fs=allHold?'On Hold':shipped.length>0&&pending.length>0?'Partial':
      lines.reduce((b,x)=>{const r={'Shipped':5,'Delivered':4,'Packed':3,'On Hold':2,'Open':1,'Cancelled':0};return(r[x.fulfillment_status||'Open']||0)>(r[b]||0)?x.fulfillment_status:b;},'Open');
    return{k,lines,fs,date:lines[0].sale_date||'',customer:lines[0].customer_name||'Unknown',orderNum:lines[0].order_number||k};
  });
  const allOpen=orders.filter(o=>o.fs==='Open').length;
  const allPacked=orders.filter(o=>o.fs==='Packed').length;
  if(S.orderFilter==='open')orders=orders.filter(o=>o.fs==='Open');
  else if(S.orderFilter==='packed')orders=orders.filter(o=>o.fs==='Packed');
  orders.sort((a,b)=>b.date.localeCompare(a.date));
  const rows=orders.length?orders.map(o=>{
    const exp=S.orderExp===o.k;
    const pillCls=o.fs==='Packed'?'p-packed':o.fs==='Shipped'||o.fs==='Delivered'?'p-shipped':o.fs==='On Hold'?'p-hold':'p-open';
    const lineRows=o.lines.map(l=>{
      const asm=findAsm(l.pn);const pt=findPart(l.pn);
      const stock=asm?(asm.total_on_hand||0):pt?(pt.total_unpckgd||0):null;
      const ok=stock===null||stock>=(l.qty||1);
      return`<div class="order-line">
        <div><div style="font-family:var(--mono);font-size:13px;color:var(--teal)">${esc(l.pn)}</div><div style="font-size:12px;color:var(--text3);margin-top:1px">Qty: ${l.qty||1}</div></div>
        <div style="text-align:right">${stock!==null?`<div style="font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${stock} in stock</div>`:'<div style="font-size:12px;color:var(--text3)">Drop-ship</div>'}</div>
      </div>`;
    }).join('');
    const actions=o.fs==='Open'?`<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();markPacked('${esc(o.k)}')">Mark Packed</button>`:
      o.fs==='Packed'?`<button class="btn btn-orange btn-sm" onclick="event.stopPropagation();openShipForm('${esc(o.k)}')">🚚 Ship</button>`:'';
    return`<div class="card ${exp?'exp':''}">
      <div class="card-hd" onclick="toggleOrd('${esc(o.k)}')">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
            <span style="font-weight:700;font-family:var(--mono);font-size:14px">${esc(o.orderNum)}</span>
            ${o.lines.length>1?`<span style="font-size:11px;background:var(--bg4);color:var(--text3);border-radius:8px;padding:1px 6px;font-family:var(--mono)">${o.lines.length} items</span>`:''}
          </div>
          <div style="font-size:12px;color:var(--text3)">${esc(o.customer)} &middot; ${o.date||'—'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0">
          <span class="pill ${pillCls}">${o.fs}</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      ${exp?`<div class="card-body">${lineRows}${actions?`<div style="margin-top:13px">${actions}</div>`:''}</div>`:''}
    </div>`;
  }).join(''):`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No orders here</div><div class="empty-sub">Try a different filter</div></div>`;
  return`
  <div class="pg-title">Orders</div>
  <div class="chips">
    <div class="chip ${S.orderFilter==='open'?'on':''}" onclick="S.orderFilter='open';render()">To Pack (${allOpen})</div>
    <div class="chip ${S.orderFilter==='packed'?'on':''}" onclick="S.orderFilter='packed';render()">Packed (${allPacked})</div>
    <div class="chip ${S.orderFilter==='all'?'on':''}" onclick="S.orderFilter='all';render()">All Orders</div>
  </div>
  ${rows}`;
}
function toggleOrd(k){S.orderExp=S.orderExp===k?null:k;render();}

async function markPacked(orderKey){
  const lines=S.sales.filter(s=>(s.order_number||('__'+s.id))===orderKey&&(s.fulfillment_status||'Open')==='Open');
  if(!lines.length)return;
  if(!confirm('Mark as Packed?'))return;
  try{
    const now=new Date().toISOString();
    await Promise.all(lines.map(l=>db.from('sales').update({fulfillment_status:'Packed',updated_at:now}).eq('id',l.id)));
    lines.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s)s.fulfillment_status='Packed';});
    toast('✓ Marked Packed');render();
  }catch(e){toast('Error: '+e.message);}
}
function openShipForm(orderKey){
  const tracking=(prompt('Tracking number (leave blank to skip):','')||'').trim();
  const carrier=tracking?((prompt('Carrier (UPS, USPS, FedEx, DHL…):','')||'').trim()):'';
  markShipped(orderKey,tracking,carrier);
}
async function markShipped(orderKey,tracking,carrier){
  const lines=S.sales.filter(s=>(s.order_number||('__'+s.id))===orderKey&&s.fulfillment_status==='Packed');
  if(!lines.length){toast('No packed lines found');return;}
  const now=new Date().toISOString();
  try{
    await Promise.all(lines.map(l=>db.from('sales').update({fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now,updated_at:now}).eq('id',l.id)));
    lines.forEach(l=>{const s=S.sales.find(x=>x.id===l.id);if(s){s.fulfillment_status='Shipped';s.tracking_number=tracking;s.shipped_at=now;}});
    toast('📦 Shipped!');render();
  }catch(e){toast('Error: '+e.message);}
}

function adjDelta(d,inputId,orig){
  const el=$(inputId);if(!el)return;
  el.value=Math.max(0,(parseInt(el.value)||orig)+d);
}

async function submitAdjust(pn,prevQty){
  const newQty=parseInt($('adj-qty-inp')?.value)||0;
  const reason=$('adj-reason')?.value||'Manual correction';
  const notes=$('adj-notes')?.value||'';
  const adj=newQty-prevQty;
  if(adj===0){toast('No change');return;}
  if(!confirm(`${pn}: ${prevQty} → ${newQty} (${adj>0?'+':''}${adj}). Save?`))return;
  try{
    const now=new Date().toISOString();
    await db.from('parts').update({total_unpckgd:newQty,updated_at:now}).eq('pn',pn);
    await db.from('inv_corrections').insert({pn,previous_qty:prevQty,new_qty:newQty,adjustment:adj,reason,source:'Mobile App'+(notes?' — '+notes:''),user_email:S.email,created_at:now});
    const pt=S.parts.find(p=>p.pn===pn);if(pt)pt.total_unpckgd=newQty;
    toast('✓ Inventory updated');
    S.partDetail=null;history.back();
  }catch(e){toast('Error: '+e.message);}
}

function openCount(id){S.countDetail=id;S.countVals={};pushDetail('countDetail',id);render();$('view').scrollTo(0,0);}

function renderCountDetail(){
  const c=S.cycleCounts.find(x=>x.id===S.countDetail);
  if(!c)return`<div class="back-row" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Tasks</div>`;

        <div><div style="font-family:var(--mono);font-size:13px;color:var(--teal);margin-bottom:2px">${esc(item.pn)}</div><div style="font-size:12px;color:var(--text3)">${esc(p?.description||item.pn)}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px"><div style="font-size:11px;color:var(--text3)">System qty</div><div style="font-size:18px;font-weight:700">${sys}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;color:var(--text2);flex-shrink:0">Counted:</span>
        <input class="inp" style="flex:1;text-align:center;padding:9px;font-size:16px;font-weight:600" type="number" min="0" id="cnt-${esc(item.pn)}"
          value="${S.countVals[item.pn]!==undefined?S.countVals[item.pn]:''}" placeholder="qty"
          onchange="S.countVals['${esc(item.pn)}']=parseInt(this.value)||0">
      </div>
    </div>`;
  }).join('');
  return`
  <div class="back-row" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Tasks</div>
  <div style="padding:0 16px 14px"><div style="font-size:18px;font-weight:700">${esc(c.name||'Cycle Count')}</div><div style="font-size:13px;color:var(--text3);margin-top:3px">${items.length} parts to count</div></div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 14px;overflow:hidden">${rows}</div>
  <div style="padding:0 16px 24px"><button class="btn btn-primary btn-full" onclick="submitCount('${esc(c.id)}')">Submit Count</button></div>`;

async function submitCount(id){
  const c=S.cycleCounts.find(x=>x.id===id);if(!c)return;
  const items=JSON.parse(c.items||'[]');
  const filled=items.filter(i=>S.countVals[i.pn]!==undefined);
  if(!filled.length){toast('Enter at least one count');return;}
  if(!confirm(`Submit ${filled.length} of ${items.length} parts?`))return;
  const now=new Date().toISOString();
  try{
    await Promise.all(filled.map(async item=>{
      const newQty=S.countVals[item.pn];const p=findPart(item.pn);const prev=p?.total_unpckgd||0;
      if(newQty===prev)return;
      await db.from('parts').update({total_unpckgd:newQty,updated_at:now}).eq('pn',item.pn);
      await db.from('inv_corrections').insert({pn:item.pn,previous_qty:prev,new_qty:newQty,adjustment:newQty-prev,reason:'Cycle count',source:'Mobile Cycle Count',user_email:S.email,created_at:now,reference_id:id});
      if(p)p.total_unpckgd=newQty;
    }));
    await db.from('cycle_counts').update({status:'Completed',completed_at:now,updated_at:now}).eq('id',id);
    S.cycleCounts=S.cycleCounts.filter(x=>x.id!==id);S.countVals={};
    toast('✓ Count submitted');S.countDetail=null;history.back();
  }catch(e){toast('Error: '+e.message);}
}

async function receivePO(poId,totalQty){
  const po=S.purchases.find(x=>x.id===poId);if(!po)return;
  const qty=parseInt($('rv-'+poId)?.value)||0;
  if(qty<1){toast('Enter quantity');return;}
  if(!confirm(`Receive ${qty} × ${po.pn}?`))return;
  const now=new Date().toISOString();
  try{
    const pt=S.parts.find(x=>x.pn===po.pn);const prev=pt?.total_unpckgd||0;const nq=prev+qty;
    if(pt){await db.from('parts').update({total_unpckgd:nq,updated_at:now}).eq('pn',po.pn);pt.total_unpckgd=nq;}
    const st=qty>=totalQty?'Received':'Partial';
    await db.from('purchases').update({status:st,updated_at:now}).eq('id',poId);
    await db.from('inv_corrections').insert({pn:po.pn,previous_qty:prev,new_qty:nq,adjustment:qty,reason:'Received shipment',source:'Mobile PO Receive',user_email:S.email,created_at:now,reference_id:poId});
    if(st==='Received')S.purchases=S.purchases.filter(x=>x.id!==poId);else{const px=S.purchases.find(x=>x.id===poId);if(px)px.status='Partial';}
    S.poExp=null;toast('✓ Received '+qty+' × '+po.pn);render();
  }catch(e){toast('Error: '+e.message);}
}

// ── CHAT ────────────────────────────────────────────────────
function renderChat(){
  return`
  <div class="pg-title">Team Chat</div>
  <div class="chat-list" id="chat-msgs">${buildChatMsgs()}</div>
  <div class="chat-foot">
    <textarea id="chat-inp" rows="1" placeholder="Message the team…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
    <div id="chat-send-btn" onclick="sendChat()">↑</div>
  </div>`;
}
function renderChatMsgs(){const el=$('chat-msgs');if(el)el.innerHTML=buildChatMsgs();}
function buildChatMsgs(){
  if(!S.chatMessages.length)return`<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">No messages yet — say hi 👋</div>`;
  return S.chatMessages.map(m=>{
    const mine=m.user_email===S.email||m.sender_email===S.email;
    const name=m.sender_name||m.user_email||'?';
    return`<div class="msg-row ${mine?'mine':''}">
      ${!mine?`<div class="msg-av">${initials(name)}</div>`:''}
      <div style="flex:1;min-width:0">
        ${!mine?`<div class="msg-sender">${esc(name)}</div>`:''}
        <div class="msg-b">${esc(m.message||m.content||'')}</div>
        <div class="msg-time">${ago(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
}
function scrollChatBottom(){setTimeout(()=>{const v=$('view');if(v)v.scrollTo(0,99999);},80);}
async function sendChat(){
  const inp=$('chat-inp');if(!inp)return;
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';inp.style.height='auto';
  try{
    await db.from('chat_messages').insert({message:msg,user_email:S.email,sender_email:S.email,sender_name:S.name,created_at:new Date().toISOString()});
  }catch(e){toast('Send failed');}
}

// ── SCANNER ─────────────────────────────────────────────────
function openScanner(){
  if(navigator.mediaDevices?.getUserMedia)
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
  $('scan-ov').style.display='flex';
}
function closeScanner(){$('scan-ov').style.display='none';}

// ── BACK NAV ────────────────────────────────────────────────
function goBack(){history.back();}
window.addEventListener('popstate',e=>{
  if(S.partDetail){S.partDetail=null;render();return;}
  if(S.countDetail){S.countDetail=null;S.countVals={};render();return;}
  if(S.orderExp){S.orderExp=null;render();return;}
});

// ── KEYBOARD ────────────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='l-pass')doLogin();});

// ── START ────────────────────────────────────────────────────
history.replaceState({tab:'home'},'','#home');
init();
</script>
