    <pre style="background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:10px;font-family:var(--mono);color:var(--text2);overflow-x:auto;max-height:280px">import { createClient } from 'npm:@supabase/supabase-js@2'
const db = createClient(Deno.env.get('SUPABASE_URL')!, Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!)

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type, x-shopify-topic, x-shopify-hmac-sha256',
}

Deno.serve(async (req) => {
  // CORS preflight
  if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS })

  // Ping check (GET or POST with ping:true)
  if (req.method === 'GET') return new Response('pong', { headers: CORS })

  let body: any = {}
  try { body = await req.json() } catch (_) {}

  if (body.ping) return new Response('pong', { headers: CORS })

  // OAuth code exchange: browser sends code, edge fn exchanges for permanent token using secret
  if (body.action === 'oauth_exchange') {
    const clientId = Deno.env.get('SHOPIFY_CLIENT_ID') || ''
    const clientSecret = Deno.env.get('SHOPIFY_CLIENT_SECRET') || ''
    if (!clientId || !clientSecret) return new Response(JSON.stringify({error:'SHOPIFY_CLIENT_ID or SHOPIFY_CLIENT_SECRET not set in edge function secrets'}), {status:400, headers:{...CORS,'Content-Type':'application/json'}})
    const shop = (body.shop || '').replace('https://','').replace('http://','')
    const code = body.code || ''
    if (!shop || !code) return new Response(JSON.stringify({error:'Missing shop or code'}), {status:400, headers:{...CORS,'Content-Type':'application/json'}})
    const tokenRes = await fetch('https://'+shop+'/admin/oauth/access_token', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({client_id: clientId, client_secret: clientSecret, code})
    })
    const tokenData = await tokenRes.json()
    if (!tokenRes.ok || !tokenData.access_token) {
      return new Response(JSON.stringify({error: tokenData.error_description || tokenData.error || 'Token exchange failed'}), {status:400, headers:{...CORS,'Content-Type':'application/json'}})
    }
    return new Response(JSON.stringify({access_token: tokenData.access_token, scope: tokenData.scope}), {headers:{...CORS,'Content-Type':'application/json'}})
  }

  // Sync proxy: browser calls this to pull orders from Shopify (avoids CORS)
  // Uses cursor-based page_info pagination — the deprecated page= param fails on Shopify 2024-01
  if (body.action === 'sync') {
    const store = (body.store || Deno.env.get('SHOPIFY_STORE') || '').replace('https://', '').replace('http://', '')
    const key = body.key || Deno.env.get('SHOPIFY_KEY') || ''
    if (!store || !key) {
      return new Response(JSON.stringify({error:'Missing credentials'}), {status:400, headers:{...CORS,'Content-Type':'application/json'}})
    }
    const since = body.since || new Date(Date.now() - 30*24*60*60*1000).toISOString()
    const page_info = body.page_info || ''
    // First call: filter by date. Subsequent calls: use cursor (cannot mix page_info with other params)
    const url = page_info
      ? 'https://' + store + '/admin/api/2024-01/orders.json?limit=250&page_info=' + page_info
      : 'https://' + store + '/admin/api/2024-01/orders.json?status=any&limit=250&updated_at_min=' + encodeURIComponent(since)
    const shopRes = await fetch(url, {headers:{'X-Shopify-Access-Token': key}})
    if (!shopRes.ok) {
      return new Response(JSON.stringify({error:'Shopify ' + shopRes.status}), {status:shopRes.status, headers:{...CORS,'Content-Type':'application/json'}})
    }
    // Parse next cursor from Link header so the client can fetch the next page
    const link = shopRes.headers.get('link') || ''
    let next_page_info = ''
    for (const part of link.split(',')) {
      if (part.includes('rel="next"')) {
        const m = part.match(/page_info=([^&>"]+)/)
        if (m) { next_page_info = m[1]; break }
      }
    }
    const payload = await shopRes.json()
    return new Response(JSON.stringify({...payload, next_page_info}), {headers:{...CORS,'Content-Type':'application/json'}})
  }

  // Image sync (single page): frontend calls repeatedly with page_info until done
  if (body.action === 'sync_images' || body.action === 'sync_images_page') {
    const store = (body.store || Deno.env.get('SHOPIFY_STORE') || '').replace('https://', '').replace('http://', '')
    const key = body.key || Deno.env.get('SHOPIFY_KEY') || ''
    if (!store || !key) return new Response(JSON.stringify({error:'Missing Shopify credentials'}), {status:400, headers:{...CORS,'Content-Type':'application/json'}})

    const page_info = body.page_info || ''
    // NOTE: cannot add &fields= when using page_info - Shopify rejects it
    const url = page_info
      ? 'https://' + store + '/admin/api/2024-01/products.json?limit=250&page_info=' + page_info
      : 'https://' + store + '/admin/api/2024-01/products.json?limit=250&fields=id,title,variants,images'
    const res = await fetch(url, {headers:{'X-Shopify-Access-Token': key}})
    if (!res.ok) return new Response(JSON.stringify({error:'Shopify ' + res.status + ' - check API key has read_products scope'}), {status:res.status, headers:{...CORS,'Content-Type':'application/json'}})
    const data = await res.json()
    const products = data.products || []

    const skuMap: any = {}
    for (const product of products) {
      const imgById: any = {}
      for (const img of (product.images || [])) {
        if (img.id && img.src) imgById[img.id] = img.src
      }
      const defaultImg = product.images?.[0]?.src || ''
      for (const variant of (product.variants || [])) {
        const sku = (variant.sku || '').trim()
        if (!sku) continue
        const img = (variant.image_id && imgById[variant.image_id]) ? imgById[variant.image_id] : defaultImg
        if (img) {
          skuMap[sku] = img
          skuMap[sku.toUpperCase()] = img
          skuMap[sku.toLowerCase()] = img
        }
      }
    }

    // Parse next page_info from Link header
    const link = res.headers.get('link') || ''
    let next_page_info = ''
    const linkParts = link.split(',')
    for (const part of linkParts) {
      if (part.includes('rel="next"')) {
        const m = part.match(/page_info=([^&>"]+)/)
        if (m) { next_page_info = m[1]; break }
      }
    }

    return new Response(JSON.stringify({skuMap, count: products.length, next_page_info}), {headers:{...CORS,'Content-Type':'application/json'}})
  }

  // Shopify webhook handling
  const topic = req.headers.get('x-shopify-topic') || ''
  if (!topic) return new Response('ok', { headers: CORS })

  try {
    const order = body
    const fin = (order.financial_status || '').toLowerCase()

    if (topic === 'orders/create') {
      const custName = (order.shipping_address?.name || order.billing_address?.name || (order.customer ? (order.customer.first_name||'')+' '+(order.customer.last_name||'') : '')).trim()
      const custEmail = order.email || order.customer?.email || ''
      for (const li of (order.line_items || [])) {
        const pn = li.sku || li.title
        if (!pn) continue
        // Dedup: skip if this (order_number, pn) already exists — prevents double-inserts on Shopify retries
        const { data: existing } = await db.from('sales').select('id').eq('order_number', order.name).eq('pn', pn).limit(1)
        if (existing?.length) { console.log('[shopify-orders] skipping duplicate', order.name, pn); continue }
        await db.from('sales').insert({
          order_number: order.name,
          pn,
          qty: li.quantity || 1,
          source: 'Shopify',
          fulfillment_status: 'Open',
          financial_status: order.financial_status || 'pending',
          sale_date: (order.created_at || new Date().toISOString()).slice(0, 10),
          customer_name: custName || null,
          customer_email: custEmail || null,
        })
      }
    } else if (topic === 'orders/cancelled') {
      await db.from('sales')
        .update({ fulfillment_status: 'Cancelled', cancelled_at: order.cancelled_at })
        .eq('order_number', order.name)
    } else if (topic === 'orders/updated') {
      if (fin === 'refunded' || fin === 'voided' || fin === 'partially_refunded') {
        await db.from('sales')
          .update({ fulfillment_status: 'Refunded', financial_status: fin })
          .eq('order_number', order.name)
      }
    }
  } catch (err) {
    console.error('[shopify-orders] webhook error:', err)
    // Return 200 so Shopify does not retry - log the error and move on
  }

  return new Response('ok', { headers: CORS })
})</pre>

    <div class="section-header" style="background:transparent;border:none;padding-left:0">3 — ShipStation ship webhook (split shipments, tracking, on-hold)</div>
    <div style="font-size:11px;color:var(--text3);margin:4px 0 6px">Replace <span class="pn">supabase/functions/shipstation-ship/index.ts</span> with:</div>
    <pre style="background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:10px;font-family:var(--mono);color:var(--text2);overflow-x:auto;max-height:280px">import { createClient } from 'npm:@supabase/supabase-js@2'
const db = createClient(Deno.env.get('SUPABASE_URL')!, Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!)

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
}
function ok(body: string) { return new Response(body, { headers: CORS }) }
function json(data: unknown, status = 200) {
  return new Response(JSON.stringify(data), { status, headers: { ...CORS, 'Content-Type': 'application/json' } })
}

// Normalize order number: strip leading # for map key comparison
function stripHash(s: string): string { return s.replace(/^#/, '') }

// Pre-fetch all open/packed/partial orders and build an in-memory lookup
// Returns map of normalized orderNum -> [{id, pn, order_number, fulfillment_status}]
async function buildOrderMap() {
  const { data } = await db.from('sales')
    .select('id,order_number,pn,fulfillment_status')
    .in('fulfillment_status', ['Open', 'Packed', 'Partial'])
    .limit(100000)
  const map: any = {}
  for (const line of (data || [])) {
    const key = stripHash(line.order_number || '')
    if (!map[key]) map[key] = []
    map[key].push(line)
  }
  return map
}

function ssAuth(): string {
  const k = Deno.env.get('SS_KEY') || '', s = Deno.env.get('SS_SECRET') || ''
  return btoa(k + ':' + s)
}

Deno.serve(async (req) => {
  if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS })

  const body = await req.json().catch(() => ({})) as any

  if (req.method === 'GET' || body.ping) return new Response('pong', { headers: CORS })

  // Secrets check
  if (body.check_secrets) {
    const k = Deno.env.get('SS_KEY') || '', s = Deno.env.get('SS_SECRET') || ''
    return json({ ss_key_set: k.length > 0, ss_key_length: k.length, ss_key_preview: k.length > 4 ? k.slice(0,2)+'...'+k.slice(-2) : '(empty)', ss_secret_set: s.length > 0, ss_secret_length: s.length, ss_secret_preview: s.length > 4 ? s.slice(0,2)+'...'+s.slice(-2) : '(empty)' })
  }

  // --- BULK SYNC: batch pre-fetch open orders then apply shipments in batch ---
  if (body.action === 'bulk_sync') {
    const auth = ssAuth()
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY or SS_SECRET not set' }, 400)
    const since = body.since || new Date(Date.now() - 30*24*60*60*1000).toISOString().slice(0,10)
    const until = body.until || new Date().toISOString().slice(0,10)

    // ONE query to get all open orders
    const orderMap = await buildOrderMap()
    const norm = (s: string) => s.trim().toUpperCase()

    // Collect all updates grouped by tracking number so we can batch .in() calls
    const updateGroups: any = {}
    let page = 1, totalPages = 1, synced = 0, skipped = 0, notFound = 0

    while (page <= totalPages) {
      const url = 'https://ssapi.shipstation.com/shipments?shipDateStart=' + since + '&shipDateEnd=' + until + '&pageSize=500&page=' + page + '&includeShipmentItems=true'
      const res = await fetch(url, { headers: { Authorization: 'Basic ' + auth } })
      if (!res.ok) return json({ error: 'ShipStation error ' + res.status }, 502)
      const data = await res.json()
      totalPages = data.pages || 1

      for (const ship of (data.shipments || [])) {
        if (ship.voided || !ship.trackingNumber) { skipped++; continue }
        const rawNum = stripHash(ship.orderNumber || '')
        const lines = orderMap[rawNum] || []
        if (!lines.length) { notFound++; continue }

        const rawSkus = (ship.shipmentItems || []).flatMap((i: any) => [i.sku, i.name].filter(Boolean))
        const allPns = lines.map((l: any) => l.pn as string)
        const matched = rawSkus.length > 0
          ? allPns.filter(p => rawSkus.some((s: string) => { const e=norm(p),k=norm(s); return e===k||e.includes(k)||k.includes(e) }))
          : allPns

        const tracking = ship.trackingNumber
        const carrier = (ship.carrierCode || '').toUpperCase()
        const shippedAt = ship.shipDate ? new Date(ship.shipDate).toISOString() : new Date().toISOString()
        const gKey = tracking + '|' + carrier + '|' + shippedAt.slice(0,10)

        if (!updateGroups[gKey]) updateGroups[gKey] = { ids: [], tracking, carrier, shippedAt }
        for (const pn of matched) {
          const line = lines.find((l: any) => l.pn === pn)
          if (line) updateGroups[gKey].ids.push(line.id)
        }
        synced++
      }
      page++
    }

    // Apply updates in batches - one .in() call per unique tracking number
    let applied = 0
    for (const g of Object.values(updateGroups)) {
      const deduped = [...new Set(g.ids)]
      for (let i = 0; i < deduped.length; i += 200) {
        await db.from('sales').update({
          fulfillment_status: 'Shipped', tracking_number: g.tracking,
          carrier: g.carrier, shipped_at: g.shippedAt
        }).in('id', deduped.slice(i, i+200))
        applied += Math.min(200, deduped.length - i)
      }
    }
    return json({ synced, skipped, notFound, applied, pages: totalPages, message: 'Synced ' + synced + ' shipments, applied ' + applied + ' line updates' })
  }

  // --- HOLD SYNC: fetch on-hold orders from ShipStation, update ERP ---
  if (body.action === 'hold_sync') {
    const auth = ssAuth()
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY or SS_SECRET not set' }, 400)
    const orderMap = await buildOrderMap()
    let page = 1, totalPages = 1, markedHold = 0, markedOpen = 0

    // Mark held orders
    while (page <= totalPages) {
      const res = await fetch('https://ssapi.shipstation.com/orders?orderStatus=on_hold&pageSize=500&page=' + page, { headers: { Authorization: 'Basic ' + auth } })
      if (!res.ok) return json({ error: 'ShipStation error ' + res.status }, 502)
      const data = await res.json()
      totalPages = data.pages || 1
      for (const order of (data.orders || [])) {
        const lines = orderMap[stripHash(order.orderNumber || '')] || []
        // Include Partial lines: a partially-shipped order can still be put on hold for the remaining items
        const ids = lines.filter((l: any) => ['Open','Packed','Partial'].includes(l.fulfillment_status)).map((l: any) => l.id as string)
        if (ids.length) {
          await db.from('sales').update({ fulfillment_status: 'On Hold' }).in('id', ids)
          markedHold += ids.length
        }
      }
      page++
    }

    // Release holds: fetch awaiting_shipment orders and restore On Hold -> Open
    const relRes = await fetch('https://ssapi.shipstation.com/orders?orderStatus=awaiting_shipment&pageSize=500', { headers: { Authorization: 'Basic ' + auth } })
    if (relRes.ok) {
      const relData = await relRes.json()
      const { data: heldLines } = await db.from('sales').select('id,order_number').eq('fulfillment_status', 'On Hold').limit(5000)
      for (const order of (relData.orders || [])) {
        const rawNum = stripHash(order.orderNumber || '')
        const toRelease = (heldLines || []).filter((l: any) => stripHash(l.order_number || '') === rawNum).map((l: any) => l.id as string)
        if (toRelease.length) {
          await db.from('sales').update({ fulfillment_status: 'Open' }).in('id', toRelease)
          markedOpen += toRelease.length
        }
      }
    }
    return json({ markedHold, markedOpen, message: markedHold + ' marked On Hold, ' + markedOpen + ' released to Open' })
  }

  // --- DELIVERY SYNC: check ShipStation for delivered shipments ---
  if (body.action === 'delivery_sync') {
    const auth = ssAuth()
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY or SS_SECRET not set' }, 400)
    const since = body.since || new Date(Date.now() - 45*24*60*60*1000).toISOString().slice(0,10)

    // Get all Shipped ERP lines with tracking
    const { data: shipped } = await db.from('sales')
      .select('id,order_number,tracking_number')
      .eq('fulfillment_status', 'Shipped')
      .not('tracking_number', 'is', null)
      .limit(2000)
    if (!shipped?.length) return json({ delivered: 0, message: 'No shipped orders to check' })

    // Build tracking -> id map
    const trackMap: any = {}
    for (const s of (shipped || [])) trackMap[(s.tracking_number || '').toUpperCase()] = s.id

    // Fetch SS shipments and look for deliveryDate
    const res = await fetch('https://ssapi.shipstation.com/shipments?shipDateStart=' + since + '&pageSize=500&includeShipmentItems=false', { headers: { Authorization: 'Basic ' + auth } })
    if (!res.ok) return json({ error: 'ShipStation error ' + res.status }, 502)
    const data = await res.json()

    const toDeliver: string[] = []
    for (const ship of (data.shipments || [])) {
      if (!ship.deliveryDate && ship.shipmentStatus !== 'delivered') continue
      const id = trackMap[(ship.trackingNumber || '').toUpperCase()]
      if (id) toDeliver.push(id)
    }

    let delivered = 0
    const now = new Date().toISOString()
    for (let i = 0; i < toDeliver.length; i += 200) {
      await db.from('sales').update({ fulfillment_status: 'Delivered', delivered_at: now }).in('id', toDeliver.slice(i, i+200))
      delivered += Math.min(200, toDeliver.length - i)
    }
    return json({ delivered, checked: shipped?.length || 0, message: delivered + ' orders marked Delivered' })
  }

  // --- SS ORDER AUDIT: find SS orders missing from ERP, optionally import them ---
  if (body.action === 'ss_order_audit') {
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY not set' }, 400)
    const auth = ssAuth()
    const days = body.days || 90
    const since = new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString().slice(0, 10)
    const doImport = body.import === true
    const stripH = (s: string) => (s || '').replace(/^#/, '')

    // Fetch active + recently shipped orders from ShipStation
    const allSSOrders: any[] = []
    for (const status of ['awaiting_shipment', 'on_hold', 'awaiting_payment', 'pending_fulfillment', 'shipped']) {
      let p = 1, pages = 1
      while (p <= pages && p <= 5) { // cap 5 pages per status = 2500 max per status
        const r = await fetch(
          'https://ssapi.shipstation.com/orders?orderStatus=' + status + '&pageSize=500&page=' + p + '&modifyDateStart=' + since,
          { headers: { Authorization: 'Basic ' + auth } }
        )
        if (!r.ok) break
        const d = await r.json()
        pages = d.pages || 1
        allSSOrders.push(...(d.orders || []))
        p++
      }
    }

    // Deduplicate by normalized order number (same order can appear in multiple status queries)
    const seenNums = new Set<string>()
    const uniqueSSOrders = allSSOrders.filter((o: any) => {
      const k = stripH(o.orderNumber || '')
      if (!k || seenNums.has(k)) return false
      seenNums.add(k)
      return true
    })

    // Batch-check ERP for each SS order number (check with and without # prefix)
    const erpFound = new Set<string>()
    const ssNums = uniqueSSOrders.map((o: any) => stripH(o.orderNumber || ''))
    for (let i = 0; i < ssNums.length; i += 100) {
      const chunk = ssNums.slice(i, i + 100)
      const bothForms = [...chunk, ...chunk.map((n: string) => '#' + n)]
      const { data: rows } = await db.from('sales').select('order_number').in('order_number', bothForms).limit(bothForms.length)
      for (const r of (rows || [])) erpFound.add(stripH(r.order_number || ''))
    }

    const missing = uniqueSSOrders.filter((o: any) => !erpFound.has(stripH(o.orderNumber || '')))

    // Import missing orders if requested
    let imported = 0
    if (doImport) {
      const fsMap: any = { awaiting_shipment: 'Open', on_hold: 'On Hold', shipped: 'Shipped', cancelled: 'Cancelled', awaiting_payment: 'Open', pending_fulfillment: 'Open' }
      for (const order of missing) {
        const fs = fsMap[order.orderStatus] || 'Open'
        for (const item of (order.items || [])) {
          const pn = item.sku || item.name
          if (!pn) continue
          const { data: ex } = await db.from('sales').select('id').in('order_number', [order.orderNumber, '#' + order.orderNumber]).eq('pn', pn).limit(1)
          if (ex?.length) continue
          await db.from('sales').insert({
            order_number: order.orderNumber, pn,
            qty: item.quantity || 1, fulfillment_status: fs,
            source: 'ShipStation Import',
            sale_date: (order.orderDate || new Date().toISOString()).slice(0, 10),
            customer_name: order.shipTo?.name || null,
            created_at: order.orderDate
              ? new Date(order.orderDate.slice(0, 10) + 'T12:00:00.000Z').toISOString()
              : new Date().toISOString(),
          })
          imported++
        }
      }
    }

    return json({
      ssTotal: uniqueSSOrders.length,
      erpFound: erpFound.size,
      missingCount: missing.length,
      imported,
      missing: missing.map((o: any) => ({
        orderNumber: o.orderNumber,
        date: (o.orderDate || '').slice(0, 10),
        customer: o.shipTo?.name || '',
        status: o.orderStatus,
        tracking: o.trackingNumber || '',
        carrier: (o.carrierCode || '').toUpperCase(),
        items: (o.items || []).map((i: any) => ({ sku: i.sku || i.name, qty: i.quantity || 1 }))
      }))
    })
  }

  // --- SS IMPORT BATCH: insert a pre-audited list of orders — no SS re-fetch needed ---
  if (body.action === 'ss_import_batch') {
    const orders = body.orders || []
    const fsMap: any = { awaiting_shipment: 'Open', on_hold: 'On Hold', shipped: 'Shipped', cancelled: 'Cancelled', awaiting_payment: 'Open', pending_fulfillment: 'Open' }
    let imported = 0
    for (const order of orders) {
      const fs = fsMap[order.status] || 'Open'
      for (const item of (order.items || [])) {
        const pn = item.sku
        if (!pn) continue
        const { data: ex } = await db.from('sales').select('id')
          .in('order_number', [order.orderNumber, '#' + order.orderNumber])
          .eq('pn', pn).limit(1)
        if (ex?.length) continue
        await db.from('sales').insert({
          order_number: order.orderNumber, pn,
          qty: item.qty || 1, fulfillment_status: fs,
          source: 'ShipStation Import',
          sale_date: order.date || new Date().toISOString().slice(0, 10),
          customer_name: order.customer || null,
          tracking_number: order.tracking || null,
          carrier: order.carrier || null,
          // Set created_at to the actual order date so it sorts correctly by timestamp
          // Use noon UTC to avoid timezone edge cases pushing it to the wrong calendar day
          created_at: order.date ? new Date(order.date + 'T12:00:00.000Z').toISOString() : new Date().toISOString(),
        })
        imported++
      }
    }
    return json({ imported })
  }

  const { resource_url, resource_type } = body
  console.log('[SS]', resource_type, resource_url)

  // --- CREATE ORDER: fire a new order into ShipStation ---
  if (body.action === 'create_order') {
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY not set' }, 400)
    const auth = ssAuth()
    const { orderNumber, customerName, customerEmail, pn, description, qty, shipTo, internalNotes, ssItems } = body
    if (!orderNumber || !pn) return json({ error: 'orderNumber and pn are required' }, 400)
    const items = (Array.isArray(ssItems) && ssItems.length)
      ? ssItems.map((it: any, i: number) => ({ lineItemKey: String(i + 1), sku: it.sku || it.pn || pn, name: it.name || it.description || it.sku || pn, quantity: it.quantity || it.qty || 1, unitPrice: 0 }))
      : [{ lineItemKey: '1', sku: pn, name: description || pn, quantity: qty || 1, unitPrice: 0 }]
    const safe = shipTo || {}
    const addrName = safe.name || customerName || 'Customer'
    const billToObj = { name: addrName, street1: safe.street1 || '', city: safe.city || '', state: safe.state || '', postalCode: safe.postal_code || '', country: safe.country || 'US' }
    const shipToObj = { ...billToObj, ...(safe.street2 ? { street2: safe.street2 } : {}) }
    const ssPayload = {
      orderNumber,
      orderDate: new Date().toISOString(),
      orderStatus: 'awaiting_shipment',
      customerUsername: customerEmail || undefined,
      customerEmail: customerEmail || undefined,
      billTo: billToObj,
      shipTo: shipToObj,
      items,
      internalNotes: internalNotes || ('TGK ERP order — ' + orderNumber),
      advancedOptions: { source: 'TGK ERP' }
    }
    const ssRes2 = await fetch('https://ssapi.shipstation.com/orders/createorder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Basic ' + auth },
      body: JSON.stringify(ssPayload)
    })
    const ssRaw2 = await ssRes2.text()
    let ssData2: any = {}
    try { ssData2 = JSON.parse(ssRaw2) } catch (_) {}
    if (!ssRes2.ok) return json({ error: 'ShipStation ' + ssRes2.status + ': ' + (ssData2.ExceptionMessage || ssData2.message || ssRaw2.slice(0, 300)) }, 502)
    return json({ orderId: ssData2.orderId, orderNumber: ssData2.orderNumber, status: ssData2.orderStatus })
  }

  // --- CHECK_TRACKING: poll SS for tracking on untracked resolution orders ---
  if (body.action === 'check_tracking') {
    if (!Deno.env.get('SS_KEY')) return json({ error: 'SS_KEY not set' }, 400)
    const auth = ssAuth()
    const orders = body.orders || []
    const results = []
    for (const ord of orders) {
      try {
        const res = await fetch('https://ssapi.shipstation.com/shipments?orderNumber=' + encodeURIComponent(ord.orderNumber) + '&pageSize=10', {
          headers: { Authorization: 'Basic ' + auth }
        })
        if (!res.ok) continue
        const payload = await res.json()
        const ship = (payload.shipments || [])[0]
        if (!ship?.trackingNumber) continue
        const tracking = ship.trackingNumber
        const carrier = (ship.carrierCode || '').toUpperCase()
        const shippedAt = ship.shipDate || new Date().toISOString()
        if (ord.type === 'warranty') {
          await db.from('warranty_claims').update({ tracking_number: tracking, carrier, shipped_at: shippedAt, status: 'Shipped' }).eq('id', ord.id)
        } else {
          await db.from('shipment_errors').update({ tracking_number: tracking, carrier, shipped_at: shippedAt }).eq('id', ord.id)
        }
        results.push({ id: ord.id, type: ord.type, tracking, carrier })
      } catch (_) { /* skip */ }
    }
    return json({ updated: results.length, results })
  }

  if (!resource_url) return new Response('no resource_url', { status: 400, headers: CORS })

  const ssKey = Deno.env.get('SS_KEY')!, ssSec = Deno.env.get('SS_SECRET')!
  const auth = btoa(ssKey + ':' + ssSec)
  // ShipStation's resource_url doesn't include item-level data by default.
  // Without items, rawSkus is empty → SKU matching fails → ALL open lines get marked Shipped.
  // Appending includeShipmentItems=true ensures split-shipment detection works correctly.
  const fetchUrl = resource_url.includes('includeShipmentItems') ? resource_url : resource_url + '&includeShipmentItems=true'
  const ssRes = await fetch(fetchUrl, { headers: { Authorization: 'Basic ' + auth } })
  if (!ssRes.ok) return new Response('SS fetch failed: ' + ssRes.status, { status: 502, headers: CORS })
  const data = await ssRes.json()

  if (resource_type === 'SHIP_NOTIFY' || resource_type === 'ORDER_SHIPPED'
      || resource_type === 'ITEM_SHIPPED' || resource_type === 'FULFILLMENT_SHIPPED') {
    const shipments = data.shipments ?? [data]
    for (const ship of shipments) {
      const orderNum = ship.orderNumber
      const tracking = ship.trackingNumber
      const carrier = ship.carrierCode?.toUpperCase() || ''
      const shippedAt = new Date().toISOString()
      const rawSkus = (ship.shipmentItems ?? []).flatMap((i: any) => [i.sku, i.name, i.lineItemKey].filter(Boolean))
      console.log('[SS] order', orderNum, 'tracking', tracking, 'rawSkus', JSON.stringify(rawSkus))

      // --- SHERROR: shipment error correction ---
      if (orderNum?.startsWith('SHERROR-')) {
        const errorId = orderNum.replace('SHERROR-', '')
        await db.from('shipment_errors').update({ tracking_number: tracking, carrier, shipped_at: shippedAt }).eq('id', errorId)
        console.log('[SS] SHERROR tracking saved for', errorId, tracking)
        continue
      }
      // --- WARRANTY: warranty replacement ---
      if (orderNum?.startsWith('WARRANTY-')) {
        const claimId = orderNum.replace('WARRANTY-', '')
        await db.from('warranty_claims').update({ tracking_number: tracking, carrier, shipped_at: shippedAt, status: 'Shipped' }).eq('id', claimId)
        console.log('[SS] WARRANTY tracking saved for', claimId, tracking)
        continue
      }

      const { data: orderLines } = await db.from('sales').select('id,pn,fulfillment_status').eq('order_number', orderNum)
      const erpLines = orderLines?.length ? orderLines : (await db.from('sales').select('id,pn,fulfillment_status').eq('order_number', '#' + orderNum)).data ?? []
      const resolvedOrderNum = erpLines.length && !orderLines?.length ? '#' + orderNum : orderNum
      const allErpPns = erpLines.map((l: any) => l.pn as string)
      const norm = (s: string) => s.trim().toUpperCase()
      const matchedPns = allErpPns.filter(erpPn => rawSkus.some((ssSku: string) => { const e=norm(erpPn),s=norm(ssSku); return e===s||e.includes(s)||s.includes(e) }))
      console.log('[SS] matchedPns', JSON.stringify(matchedPns), 'of', JSON.stringify(allErpPns))
      const isSplit = matchedPns.length > 0 && matchedPns.length < allErpPns.length

      if (matchedPns.length > 0) {
        for (const pn of matchedPns) {
          await db.from('sales').update({ fulfillment_status: 'Shipped', tracking_number: tracking, carrier, shipped_at: shippedAt, is_split_shipment: isSplit }).eq('order_number', resolvedOrderNum).eq('pn', pn)
        }
        if (isSplit) {
          const unshippedPns = allErpPns.filter((p: string) => !matchedPns.includes(p))
          for (const pn of unshippedPns) {
            const line = erpLines.find((l: any) => l.pn === pn)
            if (line && ['Open', 'Packed'].includes(line.fulfillment_status)) {
              await db.from('sales').update({ fulfillment_status: 'Partial', is_split_shipment: true }).eq('order_number', resolvedOrderNum).eq('pn', pn)
            }
          }
        }
      } else {
        console.warn('[SS] WARNING: no SKU match for order', resolvedOrderNum, '- updating all Open/Packed lines')
        await db.from('sales').update({ fulfillment_status: 'Shipped', tracking_number: tracking, carrier, shipped_at: shippedAt }).eq('order_number', resolvedOrderNum).in('fulfillment_status', ['Open', 'Packed', 'Partial'])
      }
    }
  }

  // New order created in ShipStation (manually or from a non-Shopify source)
  // Shopify orders already come in via shopify-orders webhook - skip those to avoid duplicates
  if (resource_type === 'NEW_ORDER') {
    const order = data
    const orderNum = order.orderNumber
    const source = (order.orderSource || order.advancedOptions?.source || '').toLowerCase()
    const isShopify = source.includes('shopify') || source.includes('api')

    // Only process manually-created ShipStation orders, not Shopify ones (already handled)
    if (!isShopify && orderNum) {
      const { data: existing } = await db.from('sales').select('id').eq('order_number', orderNum).limit(1)
      if (!existing?.length) {
        for (const item of (order.items || [])) {
          await db.from('sales').insert({
            order_number: orderNum,
            pn: item.sku || item.name,
            qty: item.quantity || 1,
            fulfillment_status: 'Open',
            source: 'ShipStation Manual',
            sale_date: (order.orderDate || new Date().toISOString()).slice(0, 10)
          })
        }
        console.log('[SS] NEW_ORDER: created', orderNum, 'from ShipStation (source:', source || 'manual', ')')
      }
    }
  }

  if (resource_type === 'ORDER_CANCELLED') {
    const rawNum = data.orderNumber
    const { data: ex } = await db.from('sales').select('id').eq('order_number', rawNum).limit(1)
    const rn = ex?.length ? rawNum : '#' + rawNum
    await db.from('sales').update({ fulfillment_status: 'Cancelled', cancelled_at: new Date().toISOString() }).eq('order_number', rn)
  }
  if (resource_type === 'ORDER_ON_HOLD') {
    const rawNum = data.orderNumber
    const { data: ex } = await db.from('sales').select('id').eq('order_number', rawNum).limit(1)
    await db.from('sales').update({ fulfillment_status: 'On Hold' }).eq('order_number', ex?.length ? rawNum : '#' + rawNum)
  }
  if (resource_type === 'ORDER_HOLD_RELEASED') {
    const rawNum = data.orderNumber
    const { data: ex } = await db.from('sales').select('id').eq('order_number', rawNum).limit(1)
    await db.from('sales').update({ fulfillment_status: 'Open' }).eq('order_number', ex?.length ? rawNum : '#' + rawNum)
  }

  return ok('ok')
})

async function syncShopifyImages(){
  if(!S.shopify.key){toast('Save Shopify credentials first');return;}
  const norm=function(s){return s.toUpperCase().replace(/[\s_]+/g,'-').replace(/[^A-Z0-9-]/g,'');};
  const skuMap={};
  let page_info='';
  let totalFetched=0;
  let pageNum=0;
  toast('Fetching product images from Shopify…');
  try{
    // Paginate through ALL Shopify products page by page
    while(true){
      pageNum++;
      const body={action:'sync_images_page',store:S.shopify.store,key:S.shopify.key};
      if(page_info)body.page_info=page_info;
      const res=await fetch(SUPA_URL+'/functions/v1/shopify-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok){toast('Error: '+(data.error||res.status));return;}
      const{skuMap:pageMap={},next_page_info='',count=0}=data;
      Object.assign(skuMap,pageMap);
      totalFetched+=count;
      if(pageNum>1)toast(`Scanning Shopify products… ${totalFetched} fetched`,1200);
      if(!next_page_info)break;
      page_info=next_page_info;
    }
    const normMap={};
    Object.keys(skuMap).forEach(function(sku){var k=norm(sku);if(!normMap[k])normMap[k]={img:skuMap[sku],sku:sku};});
    var updated=0,alreadyCurrent=0,colMissing=false;
    var unmatchedPns=[];
    // Sync assemblies
    for(var i=0;i<S.assemblies.length;i++){
      var asm=S.assemblies[i];
      var img=skuMap[asm.pn]||skuMap[asm.pn.toUpperCase()]||skuMap[asm.pn.toLowerCase()]||(normMap[norm(asm.pn)]&&normMap[norm(asm.pn)].img)||null;
      if(img){
        if(img===asm.image_url){alreadyCurrent++;}
        else{
          var r=await db.from('assemblies').update({image_url:img}).eq('id',asm.id);
          if(r.error){if(r.error.message.includes('image_url')||r.error.code==='42703'){colMissing=true;break;}}
          else{S.assemblies=S.assemblies.map(function(a){return a.id===asm.id?Object.assign({},a,{image_url:img}):a;});updated++;}
        }
      }else{unmatchedPns.push(asm.pn);}
    }
    if(colMissing){toast('Column missing - run: ALTER TABLE assemblies ADD COLUMN IF NOT EXISTS image_url text; in Supabase SQL Editor',8000);return;}
    // Also sync parts
    for(var j=0;j<S.parts.length;j++){
      var pt=S.parts[j];
      var pimg=skuMap[pt.pn]||skuMap[pt.pn.toUpperCase()]||skuMap[pt.pn.toLowerCase()]||(normMap[norm(pt.pn)]&&normMap[norm(pt.pn)].img)||null;
      if(pimg&&pimg!==pt.image_url){
        var pr=await db.from('parts').update({image_url:pimg}).eq('id',pt.id);
        if(!pr.error){S.parts=S.parts.map(function(p){return p.id===pt.id?Object.assign({},p,{image_url:pimg}):p;});updated++;}
      }
    }
    render();
    if(updated>0){
      toast(`✓ Saved ${updated} images (${totalFetched} Shopify products scanned). ${unmatchedPns.length} assemblies have no Shopify match.`,6000);
    }else if(alreadyCurrent>0){
      toast(`All images already current (${alreadyCurrent} matched, ${totalFetched} products scanned). ${unmatchedPns.length} have no Shopify match.`,5000);
    }else{
      const sampleSkus=Object.keys(skuMap).filter(function(k){return k.match(/^TGK/i);}).slice(0,5).join(', ')||Object.keys(skuMap).slice(0,5).join(', ');
      toast(`No matches. ${totalFetched} Shopify SKUs scanned. Examples: ${sampleSkus}. Check Shopify variant SKUs match your assembly part numbers.`,8000);
    }
    if(unmatchedPns.length>0){
      console.log('Unmatched assemblies (no Shopify image):',unmatchedPns);
      console.log('Sample Shopify SKUs found:',Object.keys(skuMap).slice(0,30));
    }
  }catch(e){toast('Image sync error: '+e.message);}
}

async function ssTestOrder(){
  const orderNum=(document.getElementById('ss-test-order')?.value||'').trim();
  if(!orderNum){toast('Enter an order number first');return;}
  const el=document.getElementById('ss-diag-result');
  el.style.display='block';
  el.textContent='Diagnosing order '+orderNum+'…';

  const edgeUrl=SUPA_URL+'/functions/v1/shipstation-ship';
  let out='ORDER DIAGNOSTIC: '+orderNum+'\n'+'─'.repeat(44)+'\n\n';

  // 1. ERP database check
  out+='[1] ERP DATABASE:\n';
  const nums=[orderNum,'#'+orderNum,orderNum.replace(/^#/,'')];
  let erpRows=[],matchedFmt='';
  for(const n of nums){
    const{data}=await db.from('sales').select('id,order_number,pn,fulfillment_status,qty,tracking_number,shipped_at').eq('order_number',n);
    if(data?.length){erpRows=data;matchedFmt=n;break;}
  }
  if(erpRows.length){
    out+='  ✓ Found '+erpRows.length+' line(s) as "'+matchedFmt+'":\n';
    erpRows.forEach(r=>{
      out+='    '+r.pn+' ×'+(r.qty||1)+' — '+r.fulfillment_status+(r.tracking_number?' — '+r.tracking_number:' — no tracking')+'\n';
    });
  }else{
    out+='  ✗ NOT FOUND in ERP (tried: '+nums.join(', ')+')\n';
    const{data:recent}=await db.from('sales').select('order_number').order('created_at',{ascending:false}).limit(5);
    out+='  Recent ERP order numbers: '+(recent||[]).map(r=>r.order_number).join(', ')+'\n';
    out+='  → Order number format in ShipStation must match ERP exactly\n';
  }

  // 2. Edge function ping
  out+='\n[2] EDGE FUNCTION PING:\n';
  try{
    const res=await fetch(edgeUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ping:true})});
    if(res.ok){out+='  ✓ Responding (deployed, JWT off)\n';out+='  Webhook URL: '+edgeUrl+'\n';}
    else{out+='  ✗ HTTP '+res.status+' — redeploy or toggle JWT off\n';}
  }catch(e){out+='  ! Network error — normal from browser (ShipStation calls server-to-server, no CORS issue)\n';}

  // 3. What ShipStation would send
  out+='\n[3] WHAT SHIPSTATION SENDS:\n';
  out+='  resource_type: SHIP_NOTIFY\n';
  out+='  resource_url:  https://ssapi.shipstation.com/shipments?orderNumber='+orderNum.replace(/^#/,'')+'\n';
  out+='  The edge function fetches that URL using SS_KEY + SS_SECRET secrets\n';
  out+='  Then matches shipmentItems[].sku → ERP pn (fuzzy: contains match)\n';

  // 4. Common failure reasons
  out+='\n[4] COMMON REASONS WEBHOOKS FAIL:\n';
  if(erpRows.length&&erpRows.every(r=>r.fulfillment_status==='Shipped'||r.fulfillment_status==='Delivered')){
    out+='  ✓ Order already Shipped/Delivered — webhook worked!\n';
  }else if(!erpRows.length){
    out+='  ✗ Order not in ERP — ShipStation sends webhooks using its own order number.\n';
    out+='    Check that the order number format matches (e.g. #9231 vs 9231)\n';
  }else{
    out+='  · SKU mismatch: ShipStation item SKU must contain or be contained by ERP pn\n';
    out+='    ERP pns on this order: '+erpRows.map(r=>r.pn).join(', ')+'\n';
    out+='    → In ShipStation, check the SKU field on each item matches the above\n';
    out+='  · SS_KEY / SS_SECRET secrets not set in edge function\n';
    out+='    → Supabase Dashboard → Edge Functions → shipstation-ship → Secrets\n';
    out+='  · SHIP_NOTIFY not registered\n';
    out+='    → ShipStation → Account Settings → Webhooks → must have SHIP_NOTIFY\n';
    out+='  · Logs: Supabase Dashboard → Edge Functions → shipstation-ship → Logs\n';
  }

  out+='\n[5] TO FORCE-UPDATE NOW:\n';
  out+='  Click "↺ Replay Webhook" above to manually trigger the edge function\n';
  out+='  for this order as if ShipStation had just fired the webhook.\n';

  el.textContent=out;
}

// Manually replay the ShipStation SHIP_NOTIFY webhook for an order
// Constructs the resource_url the same way ShipStation would and calls the edge function
// Check ShipStation for a specific order's shipment/tracking status
async function fetchOrderTracking(orderNum){
  const clean=orderNum.replace(/^#/,'');
  toast('Checking ShipStation for order '+orderNum+'...');
  const edgeUrl=SUPA_URL+'/functions/v1/shipstation-ship';

  // includeShipmentItems=true is critical — lets edge fn match per-SKU for split orders
  const resourceUrl='https://ssapi.shipstation.com/shipments?orderNumber='+encodeURIComponent(clean)+'&pageSize=10&sortBy=ShipDate&sortDir=DESC&includeShipmentItems=true';

  try{
    const res=await fetch(edgeUrl,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({resource_type:'SHIP_NOTIFY',resource_url:resourceUrl})
    });
    if(res.ok){
      await refreshSales();
      render();
      // Show per-line result
      const lines=S.sales.filter(s=>s.order_number===orderNum||s.order_number===clean||s.order_number==='#'+clean);
      const shipped=lines.filter(l=>l.fulfillment_status==='Shipped'&&l.tracking_number);
      const open=lines.filter(l=>['Open','Packed','Partial','On Hold'].includes(l.fulfillment_status||'Open'));
      if(shipped.length){
        const trackingSummary=shipped.map(l=>(l.pn||'')+(l.tracking_number?' — '+(l.carrier?l.carrier+' ':'')+l.tracking_number:'')).join(' | ');
        if(open.length){
          toast('Partial: '+shipped.length+' item'+(shipped.length!==1?'s':'')+' shipped, '+open.length+' still open. '+trackingSummary,6000);
        }else{
          toast('All items shipped! '+trackingSummary,5000);
        }
      }else{
        // Also try with # prefix
        const altUrl='https://ssapi.shipstation.com/shipments?orderNumber='+encodeURIComponent('#'+clean)+'&pageSize=10&sortBy=ShipDate&sortDir=DESC&includeShipmentItems=true';
        await fetch(edgeUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_type:'SHIP_NOTIFY',resource_url:altUrl})});
        await refreshSales();render();
        const shipped2=S.sales.filter(s=>(s.order_number===orderNum||s.order_number===clean||s.order_number==='#'+clean)&&s.fulfillment_status==='Shipped'&&s.tracking_number);
        if(shipped2.length){toast('Tracking found! '+shipped2.map(l=>(l.carrier?l.carrier+' ':'')+l.tracking_number).join(', '),5000);}
        else{toast('No shipment found for order '+orderNum+' in ShipStation. If it shipped recently, try Bulk Sync Shipments.',5000);}
      }
    }else{
      toast('ShipStation check failed — check edge function is deployed and SS_KEY/SS_SECRET are set');
    }
  }catch(e){toast('Error: '+e.message);}
}

async function ssReplayWebhook(){
  const rawNum=(document.getElementById('ss-test-order')?.value||'').trim();
  if(!rawNum){toast('Enter an order number first');return;}
  const orderNum=rawNum.replace(/^#/,''); // ShipStation uses numbers without #

  const el=document.getElementById('ss-diag-result');
  el.style.display='block';
  el.textContent='Replaying SHIP_NOTIFY for order '+rawNum+'…';

  const edgeUrl=SUPA_URL+'/functions/v1/shipstation-ship';
  const resourceUrl='https://ssapi.shipstation.com/shipments?orderNumber='+encodeURIComponent(orderNum)+'&pageSize=5&sortBy=ShipDate&sortDir=DESC';

  try{
    const res=await fetch(edgeUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({resource_type:'SHIP_NOTIFY',resource_url:resourceUrl})
    });
    const txt=await res.text().catch(()=>'');
    if(res.ok){
      el.textContent='✓ Webhook replayed for order '+rawNum+'\n\nEdge function responded: '+txt+'\n\nRefreshing orders…';
      await refreshSales();
      render();
      const lines=S.sales.filter(s=>s.order_number===rawNum||s.order_number===(rawNum.startsWith('#')?rawNum:'#'+rawNum));
      if(lines.length){
        el.textContent+= '\n\nOrder status now:\n'+lines.map(l=>'  '+l.pn+' — '+l.fulfillment_status+(l.tracking_number?' ('+l.tracking_number+')':' (no tracking)')).join('\n');
        if(lines.some(l=>l.fulfillment_status==='Shipped')){
          el.textContent+='\n\n✓ SUCCESS — lines are now Shipped!';
        }else{
          el.textContent+='\n\n⚠ Status unchanged. Check edge function logs in Supabase for details.\nLikely causes: SKU mismatch, or SS_KEY/SS_SECRET secrets not set.';
        }
      }
    }else{
      el.textContent='✗ Edge function returned '+res.status+':\n'+txt+'\n\nMake sure:\n· Function is deployed (shipstation-ship)\n· JWT verification is OFF\n· SS_KEY and SS_SECRET are set as secrets';
    }
  }catch(e){
    el.textContent='✗ Could not reach edge function: '+e.message+'\n\nThis may be a CORS block from the browser.\nShipStation calls this server-to-server which works fine.\nTry using the ↺ Replay via PowerShell approach instead.';
  }
}

  const ssSec=(S.shipstation?.secret||S.settings?.shipstation?.secret||'').trim();
  if(!ssKey||!ssSec){
    toast('⚠ ShipStation credentials not saved — go to Integrations to configure');
    return;
  }
  const edgeBase=SUPA_URL+'/functions/v1';

  // ── Show loading modal ──
  openModal('custom',{
    title:'📦 ShipStation Order Audit',
    html:`<div id="ss-audit-body" style="padding:8px 2px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px">Comparing ShipStation orders to ERP (last 90 days)…</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)">
        <div class="sync-dot busy" style="flex-shrink:0"></div> Fetching from ShipStation…

      body:JSON.stringify({action:'ss_order_audit',days:90})

async function ssImportMissing(){
  const missing=window._ssAuditMissing||[];
  if(!missing.length){closeModal();return;}

  const b=document.getElementById('ss-audit-body');
  const total=missing.length;
  const BATCH=50; // well within 60s edge function limit even for multi-item orders
  let imported=0,failed=0,done=0;

  function prog(){
    if(b)b.innerHTML=`
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px">
        ⬇ Importing ${total} orders into ERP…
      </div>
      <div style="background:var(--bg3);border-radius:20px;height:8px;overflow:hidden;margin-bottom:10px">
        <div style="height:100%;background:var(--teal);border-radius:20px;transition:width .3s;width:${Math.round(done/total*100)}%"></div>
      </div>
      <div style="font-size:11px;color:var(--text3)">${done} of ${total} orders processed · ${imported} lines inserted${failed?' · '+failed+' failed':''}</div>`;
  }
  prog();

  for(let i=0;i<missing.length;i+=BATCH){
    const batch=missing.slice(i,i+BATCH);
    try{
      const res=await fetch(SUPA_URL+'/functions/v1/shipstation-ship',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
        body:JSON.stringify({action:'ss_import_batch',orders:batch})
      });
      const data=await res.json().catch(()=>({}));
      if(res.ok){imported+=data.imported||0;}
      else{failed+=batch.length;}
    }catch(e){failed+=batch.length;}
    done=Math.min(i+BATCH,total);
    prog();
  }

  await refreshSales();render();
  if(b)b.innerHTML=`
    <div style="color:var(--green);font-size:13px;font-weight:700;margin-bottom:8px">
      ✓ Import complete — ${imported} line${imported!==1?'s':''} added across ${total} order${total!==1?'s':''}
    </div>
    ${failed?`<div style="color:var(--yellow);font-size:11px;margin-bottom:8px">⚠ ${failed} orders had errors — run SS Audit again to retry.</div>`:''}
    <div style="font-size:11px;color:var(--text3)">Orders are now visible in Sales Orders.</div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>`;
}

function handleShopifyFile(file){
  if(!file){return;}

}

function parseShopifyCSV(text){
  const el=document.getElementById('shopify-import-status');
  if(el){el.style.display='block';el.innerHTML='<div style="color:var(--text3);font-size:12px">Parsing CSV…</div>';}
  
  // Parse CSV respecting quoted fields
  function parseRow(line){
    const cols=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'&&!inQ){inQ=true;}
      else if(c==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;}
      else if(c==='"'&&inQ){inQ=false;}
      else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  }

  const lines=text.split('\n');
  if(lines.length<2){toast('CSV appears empty');return;}
  
  const headers=parseRow(lines[0]).map(h=>h.toLowerCase().trim());
  
  // Find key column indices — handle slight variations in Shopify export format
  const col=n=>{
    const idx=headers.indexOf(n.toLowerCase());
    return idx>=0?idx:null;
  };
  const C={
    name:       col('name'),
    created:    col('created at'),
    financial:  col('financial status'),
    fulfilled:  col('fulfillment status'),
    fulfilledAt:col('fulfilled at'),
    cancelledAt:col('cancelled at'),
    sku:        col('lineitem sku'),
    itemName:   col('lineitem name'),
    itemQty:    col('lineitem quantity'),
    itemStatus: col('lineitem fulfillment status'),
    total:      col('total'),
    email:      col('email'),
    billingName:col('billing name')||col('shipping name'),
  };

  if(C.name===null||C.sku===null){
    if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">❌ Could not find required columns (Name, Lineitem sku). Make sure this is a Shopify orders export.</div>';
    return;
  }

  // Parse rows — each Shopify row is one line item, orders span multiple rows
  const parsed=[]; // [{orderNum, pn, qty, status, financial, date, fulfilledAt, cancelledAt, email, isSplit, on_hold}]
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const r=parseRow(lines[i]);
    const pn=(r[C.sku]||'').trim();
    const orderNum=(r[C.name]||'').trim();
    if(!orderNum||!pn)continue;
    
    // Map Shopify status to ERP status — use PER-LINE status, not order-level
    const orderFs=(r[C.fulfilled]||'').toLowerCase();   // order-level: fulfilled/partial/null
    const lineFs =(r[C.itemStatus]||'').toLowerCase();  // per-line: fulfilled/unfulfilled/partial
    const financial=(r[C.financial]||'').toLowerCase(); // paid/refunded/partially_refunded/voided
    const cancelled=(r[C.cancelledAt]||'').trim();

    let erpStatus='Open';
    if(cancelled) erpStatus='Cancelled';
    else if(financial==='refunded'||financial==='voided') erpStatus='Refunded';
    else if(financial==='partially_refunded') erpStatus='Refunded';
    else if(lineFs==='fulfilled'||lineFs==='complete') {
      // This specific line shipped — was the whole order fulfilled or just this line?
      erpStatus = (orderFs==='fulfilled') ? 'Delivered' : 'Shipped';
    } else if(lineFs==='unfulfilled'||lineFs===''||!lineFs) {
      erpStatus = 'Open';
    }
    
    parsed.push({
      orderNum, pn,
      qty:parseInt(r[C.itemQty]||'1')||1,
      status:erpStatus,
      financial:financial||null,
      date:(r[C.created]||'').slice(0,10)||new Date().toISOString().slice(0,10),
      fulfilledAt:(r[C.fulfilledAt]||'').trim()||null,
      cancelledAt:cancelled||null,
      email:(r[C.email]||'').trim(),
      customerName:(C.billingName!==null?r[C.billingName]||'':'').trim(),
    });
  }

  // Post-process: detect split shipments (same order has both Open and Shipped lines)
  const orderStatuses={};
  parsed.forEach(p=>{
    if(!orderStatuses[p.orderNum])orderStatuses[p.orderNum]={hasOpen:false,hasShipped:false};
    if(p.status==='Open')orderStatuses[p.orderNum].hasOpen=true;
    if(p.status==='Shipped'||p.status==='Delivered')orderStatuses[p.orderNum].hasShipped=true;
  });
  parsed.forEach(p=>{
    const ost=orderStatuses[p.orderNum];
    p.isSplit=(ost.hasOpen&&ost.hasShipped)||false;
  });

  if(!parsed.length){
    if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">❌ No valid order lines found in CSV.</div>';
    return;
  }

  // Check against existing ERP orders
  const existing=new Set(S.sales.map(s=>s.order_number+'||'+s.pn));
  const newLines=parsed.filter(p=>!existing.has(p.orderNum+'||'+p.pn));
  const conflicts=parsed.filter(p=>existing.has(p.orderNum+'||'+p.pn));

  // Group conflicts by order for display
  const conflictOrders={};
  conflicts.forEach(c=>{
    const erpLine=S.sales.find(s=>s.order_number===c.orderNum&&s.pn===c.pn);
    (conflictOrders[c.orderNum]=conflictOrders[c.orderNum]||[]).push({csv:c,erp:erpLine});
  });

  S._shopifyImport={parsed,newLines,conflicts,conflictOrders,decisions:{}};
  renderShopifyImportPreview();
}

              <span class="pn" style="color:var(--teal)">${csv.pn}</span>

            </div>`).join('')}

    });
  }

  const readyToImport=newLines.length+Object.entries(decisions).filter(([,v])=>v==='update').length;
  html+=`<div style="margin-top:12px;display:flex;gap:8px;align-items:center">
    <button class="btn btn-primary" onclick="executeShopifyImport()" ${readyToImport===0&&!newLines.length?'disabled':''}>

    </button>
    <button class="btn" onclick="S._shopifyImport=null;document.getElementById('shopify-import-status').style.display='none'">Cancel</button>
    <span style="font-size:11px;color:var(--text3)">Existing orders with "Keep existing" are untouched</span>

function setAllConflictDecisions(decision){
  if(!S._shopifyImport)return;
  Object.keys(S._shopifyImport.conflictOrders).forEach(orderNum=>{
    S._shopifyImport.decisions[orderNum]=decision;
  });
  renderShopifyImportPreview();
}

async function executeShopifyImport(){
  if(!S._shopifyImport)return;
  const{parsed,decisions}=S._shopifyImport;
  const el=document.getElementById('shopify-import-status');
  if(el)el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px">⏳ Checking database for existing orders…</div>';

  // ── Step 1: Query ALL existing (order_number, pn) from DB — NOT limited to S.sales in memory ──
  // S.sales is capped at 5000 rows; the DB query gets everything
  let existing=new Set();
  try{
    const {data:existingRows,error}=await db.from('sales').select('order_number,pn').limit(500000);
    if(!error&&existingRows) existing=new Set(existingRows.map(s=>(s.order_number||'')+'||'+(s.pn||'')));
  }catch(e){
    // Fallback to in-memory if DB query fails (partial dedup)
    existing=new Set(S.sales.map(s=>(s.order_number||'')+'||'+(s.pn||'')));
    toast('⚠ Could not query full DB for dedup — using in-memory (may miss older records)');
  }

  // ── Step 2: Recompute new vs conflict against full DB set ──
  const newLines=parsed.filter(p=>!existing.has((p.orderNum||'')+'||'+(p.pn||'')));
  const conflicts=parsed.filter(p=>existing.has((p.orderNum||'')+'||'+(p.pn||'')));
  const conflictOrders={};
  conflicts.forEach(c=>{
    const erpLine=S.sales.find(s=>s.order_number===c.orderNum&&s.pn===c.pn);
    (conflictOrders[c.orderNum]=conflictOrders[c.orderNum]||[]).push({csv:c,erp:erpLine});
  });

  let imported=0,updated=0,skipped=0,errors=0;
  const errorMsgs=[];
  let _stripNewCols=false; // set true after first schema error so all subsequent chunks skip new cols

  // Strip columns that might not exist in older DB schemas
  const stripNewCols=row=>{
    const{financial_status,cancelled_at,is_split_shipment,customer_name,customer_email,...base}=row;
    return base;
  };

  // ── Step 3: Insert new lines in chunks ──
  const toInsert=newLines.map(l=>({
    order_number:l.orderNum, pn:l.pn, qty:l.qty,
    fulfillment_status:l.status,
    financial_status:l.financial||null,
    cancelled_at:l.cancelledAt?new Date(l.cancelledAt).toISOString():null,
    is_split_shipment:l.isSplit||false,
    source:'Shopify CSV',
    sale_date:l.date,
    shipped_at:l.fulfilledAt?new Date(l.fulfilledAt).toISOString():null,
    customer_name:l.customerName||null,
    customer_email:l.email||null,
  }));

  const CHUNK=100;
  for(let i=0;i<toInsert.length;i+=CHUNK){
    let chunk=toInsert.slice(i,i+CHUNK);
    if(_stripNewCols)chunk=chunk.map(stripNewCols);
    const{error}=await db.from('sales').insert(chunk);
    if(error){
      // Schema error (missing column)? Strip new cols and retry this chunk once
      const isSchemaErr=error.message.includes('column')||error.code==='42703'||error.message.includes('does not exist');
      if(isSchemaErr&&!_stripNewCols){
        _stripNewCols=true;
        const{error:e2}=await db.from('sales').insert(chunk.map(stripNewCols));
        if(e2){
          errors++;
          errorMsgs.push(`Chunk ${Math.floor(i/CHUNK)+1}: ${e2.message}`);
          console.error('Import chunk error (retry):', e2.message);
        } else {
          imported+=chunk.length;
          errorMsgs.push('⚠ DB missing new columns (financial_status, cancelled_at, is_split_shipment) — imported without them. Run the SQL migration when possible.');
        }
      } else {
        errors++;
        errorMsgs.push(`Chunk ${Math.floor(i/CHUNK)+1}: ${error.message}`);
        console.error('Import chunk error:', error.message);
      }
    }
    else imported+=chunk.length;
    const done=Math.min(i+CHUNK,toInsert.length);
    if(el)el.innerHTML=`<div style="color:var(--text3);font-size:12px;padding:10px">⏳ Importing… ${done}/${toInsert.length} new lines${errors?' (⚠ '+errors+' errors)':''}</div>`;
  }

  // ── Step 4: Handle conflict decisions ──
  for(const[orderNum,decision] of Object.entries(decisions)){
    if(decision==='skip'){skipped++;continue;}
    if(decision==='keep'){continue;}
    if(decision==='update'){
      const lines=conflictOrders[orderNum]||[];
      for(const{csv,erp} of lines){
        if(!erp){continue;}
        const{error}=await db.from('sales').update({
          fulfillment_status:csv.status,
          financial_status:csv.financial||null,
          cancelled_at:csv.cancelledAt?new Date(csv.cancelledAt).toISOString():erp.cancelled_at,
          is_split_shipment:csv.isSplit||erp.is_split_shipment||false,
          qty:csv.qty,
          sale_date:csv.date,
          shipped_at:csv.fulfilledAt?new Date(csv.fulfilledAt).toISOString():erp.shipped_at,
          // tracking_number and carrier are intentionally excluded — never overwrite with CSV data (CSV has no tracking)
        }).eq('id',erp.id);
        if(error){errors++;errorMsgs.push(`Update #${orderNum}: ${error.message}`);}
        else updated++;
      }
    }
  }

  S._shopifyImport=null;
  await refreshSales();
  render();

  const summaryLine=`✓ Import done — ${imported} new, ${updated} updated, ${skipped} skipped${errors?`, ⚠ ${errors} error${errors>1?'s':''}`:''}`; 
  toast(summaryLine, errors?5000:3500);

  let html=`<div style="color:${errors?'var(--yellow)':'var(--green)'};font-size:12px;padding:10px">${summaryLine}</div>`;
  if(errorMsgs.length){
    html+=`<div style="margin:6px 10px 0;padding:8px 12px;background:var(--red-dim);border:1px solid rgba(220,38,38,.2);border-radius:6px">
      <div style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px">⚠ Import Errors</div>
      ${errorMsgs.slice(0,10).map(m=>`<div style="font-size:10px;font-family:var(--mono);color:var(--red);padding:2px 0">${escHtml(m)}</div>`).join('')}
      ${errorMsgs.length>10?`<div style="font-size:10px;color:var(--text3)">${errorMsgs.length-10} more errors — check browser console (F12)</div>`:''}
      <div style="font-size:10px;color:var(--text3);margin-top:4px">Common cause: missing DB columns — run the SQL migration in <b>Integrations → Setup Guide</b></div>
    </div>`;
  }
  const dedupeTip=imported>0?`<div style="font-size:11px;color:var(--text3);margin-top:6px;padding:0 10px 8px">If any orders have duplicate lines, click <b>🧽 Dedupe &amp; Recover Tracking</b> on the Import Data page to clean them up.</div>`:'';
  if(el)el.innerHTML=html+dedupeTip;
}

async function syncOrdersNow(){
  const store=(S.shopify?.store||'').trim();
  const key=(S.shopify?.key||'').trim();
  if(!store||!key){
    toast('⚠ Shopify credentials not saved — go to Integrations to configure');
    return;
  }

  const edgeBase=SUPA_URL+'/functions/v1';

  // ── Step 1: Query FULL DB for existing (order_number, pn) → status map ──
  // Uses fetchAll() to paginate past Supabase's server-side max_rows cap.
  // Stores fulfillment_status so the update path can compare without touching S.sales.
  // Keys are # -normalized so webhook rows (#1001) and manual rows (1001) don't ghost each other.
  toast('🔄 Checking existing orders…');
  const normOrderNum=n=>(n||'').replace(/^#/,'');
  const existMapKey=(on,pn)=>normOrderNum(on)+'||'+(pn||'');
  let existingMap={};   // normalizedKey → fulfillment_status
  try{
    const existingRows=await fetchAll((f,t)=>db.from('sales').select('order_number,pn,fulfillment_status').range(f,t));
    for(const r of existingRows) existingMap[existMapKey(r.order_number,r.pn)]=r.fulfillment_status||'Open';
  }catch(e){
    toast('⚠ Could not paginate full DB for dedup check — using in-memory fallback (may miss older records)',5000);
    for(const r of S.sales) existingMap[existMapKey(r.order_number,r.pn)]=r.fulfillment_status||'Open';
  }

  // ── Step 2: Fetch orders via edge function (avoids browser CORS block on Shopify API) ──
  // Uses cursor-based page_info — the deprecated page= param fails on Shopify 2024-01 for page 2+
  toast('🔄 Fetching from Shopify via edge function…');
  const cutoff=new Date(Date.now()-90*24*60*60*1000).toISOString(); // 90-day window
  let newCount=0,updatedCount=0,page_info='',keepGoing=true;
  const addedOrders=[]; // collect details for the results modal

  while(keepGoing){
    let resp,orders=[],json={};
    try{
      resp=await fetch(edgeBase+'/shopify-orders',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
        body:JSON.stringify({action:'sync',store,key,since:cutoff,page_info})
      });
      if(!resp.ok){
        const txt=await resp.text().catch(()=>'');
        if(resp.status===401){
          toast('⚠ Shopify rejected the API key — go to Integrations → Shopify, re-enter your Admin API token (starts with shpat_) and save',7000);
          return;
        }
        if((resp.status===400&&txt.includes('Missing action'))||resp.status===404){
          toast('⚠ Edge function needs updating — copy the new shopify-orders code from Integrations → Setup Guide and redeploy',6000);
          return;
        }
        toast('Sync error '+resp.status+': '+txt.slice(0,200));
        break;
      }
      json=await resp.json().catch(()=>({}));
      if(json.error){
        if(json.error.includes('401')||json.error.includes('Unauthorized')){
          toast('⚠ Shopify rejected the API key — check your Admin API token in Integrations → Shopify',7000);
          return;
        }
        toast('Shopify error: '+json.error);break;
      }
      orders=json.orders||[];
    }catch(e){toast('Network error calling edge function: '+e.message);break;}

    if(!orders.length){keepGoing=false;break;}

    for(const order of orders){
      const orderNum=order.name;
      for(const li of (order.line_items||[])){
        const pn=li.sku||li.title;
        if(!pn)continue;
        const k=existMapKey(orderNum,pn);
        // Per-line status: Shopify tracks fulfillment at item level (li.fulfillment_status)
        // li.fulfillment_status === 'fulfilled' means THIS specific line shipped
        // order.fulfillment_status === 'partial' means some lines shipped, some didn't
        const fs=order.financial_status==='refunded'?'Cancelled':
          li.fulfillment_status==='fulfilled'?'Shipped':
          order.fulfillment_status==='partial'?'Partial':
          order.fulfillment_status==='fulfilled'?'Delivered':'Open';

        if(!Object.prototype.hasOwnProperty.call(existingMap,k)){
          // New row — insert it
          const custName=((order.shipping_address?.name||order.billing_address?.name||(order.customer?(order.customer.first_name||'')+' '+(order.customer.last_name||''):''))||'').trim()||null;
          const custEmail=(order.email||order.customer?.email||'')||null;
          const{data}=await db.from('sales').insert({
            order_number:orderNum,pn,qty:li.quantity||1,
            fulfillment_status:fs,source:'Shopify Sync',
            sale_date:(order.created_at||new Date().toISOString()).slice(0,10),
            customer_name:custName,
            customer_email:custEmail,
          }).select().single();
          if(data){
            existingMap[k]=fs;
            S.sales=[data,...S.sales];
            newCount++;
            addedOrders.push({orderNum,pn,qty:li.quantity||1,date:(order.created_at||'').slice(0,10),customer:custName||'—',status:fs});
            if(S.view!=='sales')showOrderAlert(orderNum,pn);
          }
        } else {
          // Row exists — update status if Shopify reports a more terminal state
          // Use existingMap (full DB) not S.sales (capped at 5000) for comparison
          const currentFs=existingMap[k]||'Open';
          if(currentFs!==fs&&['Open','Partial'].includes(currentFs)){
            const{error:upErr}=await db.from('sales').update({fulfillment_status:fs})
              .eq('order_number',orderNum).eq('pn',pn)
              .in('fulfillment_status',['Open','Partial']);
            if(!upErr){existingMap[k]=fs;updatedCount++;}
          }
        }
      }
    }
    // Advance to next page using cursor returned by edge function
    page_info=json.next_page_info||'';
    if(!page_info||!orders.length)keepGoing=false;
    if(newCount+updatedCount>0)toast(`🔄 ${newCount} new, ${updatedCount} updated so far…`,1500);
  }

  // ── Step 3: Check ShipStation for held orders (via edge function — browser→SS is CORS-blocked) ──
  const ssKey=(S.shipstation?.key||S.settings?.shipstation?.key||'').trim();
  const ssSec=(S.shipstation?.secret||S.settings?.shipstation?.secret||'').trim();
  if(ssKey&&ssSec){
    try{
      toast('🔄 Checking ShipStation for held orders…',1500);
      const ssHoldRes=await fetch(edgeBase+'/shipstation-ship',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
        body:JSON.stringify({action:'hold_sync'})
      });
      if(ssHoldRes.ok){
        const holdData=await ssHoldRes.json().catch(()=>({}));
        if((holdData.markedHold||0)+(holdData.markedOpen||0)>0)
          updatedCount+=(holdData.markedHold||0)+(holdData.markedOpen||0);
      }
    }catch(e){console.warn('ShipStation hold check skipped:',e.message);}
  }

  await refreshSales();render();

  if(newCount===0&&updatedCount===0){
    toast('✓ Sync done — all orders are up to date (90 days)');
    return;
  }
  if(newCount===0){
    toast(`✓ Sync done — ${updatedCount} status update${updatedCount!==1?'s':''}, no new orders`);
    return;
  }

  // ── Show results modal listing every newly added order ──
  const addedRows=addedOrders.map(o=>`<tr style="border-bottom:1px solid var(--border)">
    <td style="padding:6px 8px;font-family:var(--mono);font-size:11px;white-space:nowrap">${escHtml(o.orderNum)}</td>
    <td style="padding:6px 8px;font-size:11px">${escHtml(o.pn)}</td>
    <td style="padding:6px 8px;font-size:11px;text-align:center">${o.qty}</td>
    <td style="padding:6px 8px;font-size:11px;color:var(--text3)">${escHtml(o.customer)}</td>
    <td style="padding:6px 8px;font-size:11px;color:var(--text3);white-space:nowrap">${escHtml(o.date)}</td>
    <td style="padding:6px 8px">${fsPill(o.status)}</td>
  </tr>`).join('');
  openModal('custom',{
    title:`✓ Sync — ${newCount} Missing Order${newCount!==1?'s':''} Found & Added`,
    html:`
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px;padding:0 2px">
        Shopify (last 90 days) vs ERP — <b style="color:var(--teal)">${newCount}</b> new line${newCount!==1?'s':''} added
        ${updatedCount?` · <b>${updatedCount}</b> status update${updatedCount!==1?'s':''}`:''}.
      </div>
      <div style="overflow-y:auto;max-height:400px;border:1px solid var(--border);border-radius:var(--r)">
        <table style="width:100%;border-collapse:collapse">
          <thead style="position:sticky;top:0;background:var(--bg3)">
            <tr style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)">
              <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)">Order</th>
              <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)">SKU</th>
              <th style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--border)">Qty</th>
              <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)">Customer</th>
              <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)">Date</th>
              <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)">Status</th>
            </tr>
          </thead>
          <tbody>${addedRows}</tbody>
        </table>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>
    `
  });
}

async function importOrdersFromShopify(){
  const token=prompt('Paste your Shopify Admin API token (Settings → Apps → Private apps or API credentials):\nNeeded one-time to pull historical orders.');
  if(!token)return;
  const store=S.shopify?.store||prompt('Your store URL (e.g. mystore.myshopify.com):');
  if(!store)return;
  toast('Fetching orders from Shopify… this may take a moment');
  let imported=0,skipped=0,page=1,keepGoing=true;
  while(keepGoing){
    try{
      const res=await fetch(`https://${store.replace(/^https?:\/\//,'')}/admin/api/2024-01/orders.json?status=any&limit=250&page=${page}`,{
        headers:{'X-Shopify-Access-Token':token,'Content-Type':'application/json'}
      });
      if(!res.ok){toast('Shopify error '+res.status+' — check token and store URL');break;}
      const {orders=[]}=await res.json();
      if(!orders.length){keepGoing=false;break;}
      for(const order of orders){
        const orderNum=order.name;
        for(const li of (order.line_items||[])){
          const pn=li.sku||li.title;
          if(!pn)continue;
          // Check if already exists
          const exists=S.sales.some(s=>s.order_number===orderNum&&s.pn===pn);
          if(exists){skipped++;continue;}
          const fs=order.financial_status==='refunded'?'Cancelled':
            order.fulfillment_status==='fulfilled'?'Delivered':
            order.fulfillment_status==='partial'?'Shipped':'Open';
          const{data}=await db.from('sales').insert({
            order_number:orderNum,pn,qty:li.quantity||1,
            source:'Shopify Import',fulfillment_status:fs,
            sale_date:(order.created_at||new Date().toISOString()).slice(0,10)
          }).select().single();
          if(data){S.sales=[data,...S.sales];imported++;}
        }
      }
      page++;
      if(orders.length<250)keepGoing=false;
      toast(`Importing… ${imported} orders pulled so far (page ${page-1})`);
    }catch(e){toast('Error: '+e.message);keepGoing=false;}
  }
  await loadAll();render();
  toast(`✓ Shopify import done — ${imported} new orders, ${skipped} already existed`);
}

// Fill in missing customer_name / customer_email on all existing orders from Shopify
async function syncCustomerNames(){
  if(!S.shopify?.key){toast('Save Shopify credentials first (Integrations → Shopify)');return;}
  // Build a set of order numbers that need names
  const needsName=new Set(
    S.sales.filter(s=>!s.customer_name).map(s=>(s.order_number||'').replace(/^#/,''))
  );
  if(needsName.size===0){toast('All orders already have customer names ✓');return;}
  toast(`Looking up names for ${needsName.size} orders…`);
  let filled=0,page=1,keepGoing=true;
  const EDGE=SUPA_URL+'/functions/v1/shopify-orders';
  const since=new Date(Date.now()-365*24*60*60*1000).toISOString();// last 1 year
  while(keepGoing&&needsName.size>0){
    let orders=[];
    try{
      const resp=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'sync',store:S.shopify.store,key:S.shopify.key,since,page})});
      if(!resp.ok){toast('Shopify error '+resp.status);break;}
      const j=await resp.json();
      orders=j.orders||[];
    }catch(e){toast('Network error: '+e.message);break;}
    if(!orders.length)break;
    for(const order of orders){
      const num=(order.name||'').replace(/^#/,'');
      if(!needsName.has(num))continue;
      const custName=((order.shipping_address?.name||order.billing_address?.name||(order.customer?(order.customer.first_name||'')+' '+(order.customer.last_name||''):''))||'').trim()||null;
      const custEmail=(order.email||order.customer?.email||'')||null;
      if(!custName&&!custEmail)continue;
      // Update all lines for this order
      const{error}=await db.from('sales').update({
        ...(custName?{customer_name:custName}:{}),
        ...(custEmail?{customer_email:custEmail}:{})
      }).eq('order_number',order.name);
      if(!error){
        S.sales=S.sales.map(s=>s.order_number===order.name?{...s,...(custName?{customer_name:custName}:{}),...(custEmail?{customer_email:custEmail}:{})}:s);
        needsName.delete(num);
        filled++;
      }
    }
    page++;
    if(orders.length<250)keepGoing=false;
    if(filled>0)toast(`Syncing names… ${filled} filled so far`,1200);
  }
  render();
  toast(filled>0?`✓ Filled ${filled} customer names. ${needsName.size} orders still missing (not in Shopify last year).`:`No new names found — try Import All Shopify Orders for older history.`,6000);
}

async function ssManualSync(orderNum,tracking,carrier){
  if(!orderNum||!tracking){toast('Need order # and tracking');return;}
  const nums=[orderNum,'#'+orderNum,orderNum.replace(/^#/,'')];
  let rows=null;
  for(const n of nums){
    const{data}=await db.from('sales').select('*').eq('order_number',n).neq('fulfillment_status','Cancelled');
    if(data?.length){rows=data;break;}
  }
  if(!rows?.length){toast('Order '+orderNum+' not found in ERP');return;}
  const undoOps=[];
  for(const sale of rows){
    undoOps.push({action:'update',table:'sales',data:{...sale,fulfillment_status:'Shipped',tracking_number:tracking,carrier:carrier},prev:{...sale}});
    await db.from('sales').update({fulfillment_status:'Shipped',tracking_number:tracking,carrier:carrier||'',shipped_at:new Date().toISOString()}).eq('id',sale.id);
    S.sales=S.sales.map(s=>s.id===sale.id?{...s,fulfillment_status:'Shipped',tracking_number:tracking,carrier:carrier||''}:s);
    const{data:asms}=await db.from('assemblies').select('*').eq('pn',sale.pn);
    if(asms?.[0]){
      const newOh=Math.max(0,(asms[0].total_on_hand||0)-(sale.qty||1));
      await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',asms[0].id);
      S.assemblies=S.assemblies.map(a=>a.pn===sale.pn?{...a,total_on_hand:newOh}:a);
      await db.from('inv_corrections').insert({pn:sale.pn,previous_qty:asms[0].total_on_hand||0,new_qty:newOh,adjustment:-(sale.qty||1),reason:'Manual ship — order '+orderNum+' tracking '+tracking,source:'shipment'});
    }
  }
  if(!rows.length){toast('No lines updated — check order number');return;}
  await refreshSales();
  pushUndoMulti('Manual ship order '+orderNum,undoOps);
  toast('✓ Order '+orderNum+' marked Shipped · tracking: '+tracking);
  render();
}

async function ssBulkSyncRun(){
  const el=document.getElementById('ss-diag-result');
  const since=(document.getElementById('bsync-from')?.value||'').trim();
  const until=(document.getElementById('bsync-to')?.value||'').trim();
  if(!since||!until){toast('Enter both dates');return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(since)||!/^\d{4}-\d{2}-\d{2}$/.test(until)){toast('Use YYYY-MM-DD format');return;}
  if(since>until){toast('Start date must be before end date');return;}

  el.innerHTML=`<div style="color:var(--text3);font-size:11px">⏳ Fetching shipments ${since} → ${until}…<br>This may take 30-60 seconds for large ranges.</div>`;
  const edgeUrl=SUPA_URL+'/functions/v1/shipstation-ship';

  // 90s client-side timeout — edge function limit is 60s, this gives a clean error message
  const controller=new AbortController();
  const tOut=setTimeout(()=>controller.abort(),90000);

  try{
    const res=await fetch(edgeUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'bulk_sync',since:since.trim(),until:until.trim()}),
      signal:controller.signal
    });
    clearTimeout(tOut);
    const data=await res.json().catch(()=>({}));

    if(!res.ok){
      if(res.status===504||res.status===524){
        el.innerHTML='<div style="color:var(--yellow)">⏱ Sync timed out (edge function 60s limit).<br><br>Try a shorter date range — split into 30-day chunks and run each separately.</div>';
        return;
      }
      el.innerHTML='<div style="color:var(--red)">Error '+res.status+':<br>'+(data.error||JSON.stringify(data))+'<br><br>Make sure the edge function is deployed with latest code and SS_KEY/SS_SECRET are set.</div>';
      return;
    }

    let out='<div style="color:var(--green);font-size:11px;font-weight:700;margin-bottom:8px">✓ Bulk Sync Complete — '+since+' to '+until+'</div>';
    out+='<div style="font-size:11px;font-family:var(--mono);color:var(--text2)">';
    out+='Shipments synced:  '+data.synced+'<br>';
    out+='Skipped (voided/no tracking): '+data.skipped+'<br>';
    out+='Order not in ERP:  '+data.notFound+'<br>';
    out+='Pages fetched:     '+(data.pages||1)+'<br>';
    out+='</div>';
    if(data.notFound>0){
      out+='<div style="font-size:10px;color:var(--text3);margin-top:6px">Orders not in ERP: run 🔄 Sync Orders first, then bulk sync again.</div>';
    }
    el.innerHTML=out;

    await refreshSales();
    render();
    toast('✓ Bulk sync done — '+data.synced+' shipments applied');
  }catch(e){
    clearTimeout(tOut);
    if(e.name==='AbortError'){
      el.innerHTML='<div style="color:var(--yellow)">⏱ Sync timed out after 90 seconds.<br><br>Try a shorter date range — 30-day chunks work well for catching up.</div>';
    }else{
      el.innerHTML='<div style="color:var(--red)">Network error: '+escHtml(e.message)+'<br><br>Redeploy the edge function and try again.</div>';
    }
  }
}
