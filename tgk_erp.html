<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGK Motorsport ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111314;--bg2:#181a1c;--bg3:#1e2022;--bg4:#252729;--bg5:#2c2f31;
  --border:#2a2d30;--border2:#343739;
  --text:#ffffff;--text2:#c8c8c4;--text3:#8a8a86;
  --teal:#2ABFAA;--teal-d:#1a8f7d;--teal-dim:rgba(42,191,170,.10);
  --orange:#E07B28;--orange-d:#c46820;--orange-dim:rgba(224,123,40,.10);
  --red:#e05555;--red-dim:rgba(224,85,85,.12);
  --green:#4caf7d;--green-dim:rgba(76,175,125,.12);
  --yellow:#d4a843;--yellow-dim:rgba(212,168,67,.12);
  --r:6px;--r-lg:10px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
input,button,select,textarea{font-family:var(--font)}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar-wrap{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:relative}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--teal),var(--teal-d));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;letter-spacing:.02em}
.logo-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.2}
.logo-sub{font-size:10px;color:var(--text3);font-weight:400}
.sidebar-section{padding:14px 14px 4px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 11px;margin:2px 8px;border-radius:20px;cursor:pointer;transition:all .15s;border:1px solid transparent;background:transparent;width:calc(100% - 16px);text-align:left;color:var(--text2);font-size:12px;font-weight:500;outline:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(42,191,170,.2)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .15s}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:1px 6px;border-radius:10px;min-width:22px;text-align:center;margin-left:auto}
.nav-item.active .nav-badge{color:var(--teal);background:var(--teal-dim);border-color:rgba(42,191,170,.25)}
.nav-item.alert-nav .nav-badge{color:var(--red);background:var(--red-dim);border-color:rgba(224,85,85,.25)}

/* ── SIDEBAR FOOTER ── */
.sidebar-footer{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--border);flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--green)}
.sync-dot.busy{background:var(--orange);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:var(--text2);flex:1;font-weight:500}
.sync-sub{font-size:10px;color:var(--text3)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;z-index:10}
.topbar-title{font-size:14px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:11px;color:var(--text3);margin-left:4px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:20px 24px;position:relative}
.content-inner{position:relative;z-index:1}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;font-weight:600;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--bg5);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(42,191,170,.25)}
.btn-teal:hover{background:rgba(42,191,170,.18);border-color:rgba(42,191,170,.4)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.25)}
.btn-danger:hover{background:rgba(224,85,85,.2)}
.btn-sm{padding:4px 10px;font-size:11px}
.action-btn{background:none;border:1px solid var(--border);color:var(--text3);border-radius:var(--r);padding:3px 8px;font-size:11px;cursor:pointer;transition:all .12s;font-family:var(--font)}
.action-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg4)}
.action-btn.del:hover{border-color:rgba(224,85,85,.3);color:var(--red);background:var(--red-dim)}

/* ── PANELS ── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.panel-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-title-left{display:flex;align-items:center;gap:8px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;gap:10px;margin-bottom:18px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;line-height:1.1;font-family:var(--mono)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}
.kpi-teal .kpi-value{color:var(--teal)}
.kpi-orange .kpi-value{color:var(--orange)}
.kpi-red .kpi-value{color:var(--red)}
.kpi-green .kpi-value{color:var(--green)}
.kpi-yellow .kpi-value{color:var(--yellow)}

/* ── GRID LAYOUTS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2-lg{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg3);padding:9px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:9px 12px;color:var(--text2);vertical-align:middle}
td.main-col{color:var(--text);font-weight:500}
.pn{font-family:var(--mono);font-size:11px;color:var(--text3)}
.money{font-family:var(--mono);color:var(--text)}
.money-cost{font-family:var(--mono);color:var(--orange)}
.money-retail{font-family:var(--mono);color:var(--teal)}
.money-vendor{font-family:var(--mono);color:var(--green)}
.money-neutral{font-family:var(--mono);color:var(--text2)}

/* ── STATUS PILLS ── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;font-size:10px;font-weight:600;border-radius:10px;border:1px solid transparent}
.pill-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(42,191,170,.2)}
.pill-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(224,123,40,.2)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(76,175,125,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(212,168,67,.2)}
.pill-muted{background:var(--bg4);color:var(--text3);border-color:var(--border)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--teal)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.filter-chip{display:inline-flex;align-items:center;padding:5px 11px;font-size:11px;font-weight:600;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;transition:all .12s;white-space:nowrap}
.filter-chip:hover,.filter-chip.on{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.filter-chip.on-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(42,191,170,.25)}
.filter-count{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:4px}
.form-input{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:12px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
.form-input::placeholder{color:var(--text3)}
select.form-input{cursor:pointer}

/* ── STOCK BAR ── */
.stock-bar-wrap{display:flex;align-items:center;gap:6px}
.stock-bar{width:60px;height:4px;background:var(--bg5);border-radius:2px;overflow:hidden}
.stock-fill{height:100%;border-radius:2px;transition:width .3s}
.wk-label{font-size:10px;font-family:var(--mono);min-width:28px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:24px}
.modal-title{font-size:14px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ── BOM ── */
.bom-row{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px}
.bom-row:last-child{border-bottom:none}
.bom-row:hover{background:var(--bg3)}
.type-accent{width:2px;height:28px;border-radius:2px;flex-shrink:0}

/* ── ALERT ROWS ── */
.alert-row{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:var(--r);font-size:12px;margin-bottom:7px;border-left:2px solid transparent}
.alert-row-red{background:var(--red-dim);border-left-color:var(--red);color:#f87171}
.alert-row-yellow{background:var(--yellow-dim);border-left-color:var(--yellow);color:#fbbf24}
.alert-row-green{background:var(--green-dim);border-left-color:var(--green);color:#86efac}
.alert-row b{color:var(--text)}

/* ── INT CARDS ── */
.int-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.int-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.int-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.int-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--green)}
.dot-err{background:var(--red)}
.int-title{font-size:13px;font-weight:700;color:var(--text)}
.int-sub{font-size:11px;color:var(--text3)}

/* ── TABS ── */
.tabs-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}

/* ── AI ── */
.ai-bubble{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.6;color:var(--text2)}
.ai-user-bubble{background:var(--orange-dim);border-color:rgba(224,123,40,.25);color:var(--text)}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
.ai-input-row input:focus{border-color:var(--teal)}
.ai-chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:var(--r);font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:500}
#toast.show{opacity:1}

/* ── LOADING ── */
.loading-state{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);gap:10px;font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SHOPIFY BAR ── */
.shopify-bar{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.shopify-icon{width:30px;height:30px;background:#96bf48;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}

/* ── MISC ── */
.section-empty{text-align:center;padding:40px;color:var(--text3);font-size:12px}
.margin-analysis-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.margin-analysis-row:last-child{border-bottom:none}
.inline-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
</style>
</head>

<div class="shell">

<!-- ── SIDEBAR ── -->
<div class="sidebar-wrap">
  <div class="sidebar">
    <div class="sidebar-logo">

</div>

<!-- ── MAIN ── -->
<div class="main">

    </div>
    <div class="topbar-actions">
      <div class="search-wrap" style="max-width:220px">

</div>

</div><!-- end shell -->

const $  = id => document.getElementById(id);
const fc = (v,d=2) => '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fn = v => Number(v||0).toLocaleString();
const wks = p => p.avg_sales_wk>0 ? Math.round((p.total_unpckgd||0)/p.avg_sales_wk) : null;
const wkColor = w => w===null?'var(--green)':w<2?'var(--red)':w<6?'var(--yellow)':'var(--green)';
const wkPct  = w => w===null?100:Math.min(100,Math.round(w/12*100));

function statusPill(s){
  const m={ok:'pill-teal',low:'pill-yellow',critical:'pill-red'};
  const l={ok:'In Stock',low:'Low',critical:'Critical'};
  return `<span class="pill ${m[s]||'pill-muted'}">${l[s]||s}</span>`;
}
function poPill(s){
  const m={'On Order':'pill-orange','In Transit':'pill-yellow','Received':'pill-teal','Cancelled':'pill-red'};
  return `<span class="pill ${m[s]||'pill-muted'}">${s}</span>`;
}

function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
function setSyncState(state){
  const d=$('sync-dot'),l=$('sync-label');
  d.className='sync-dot '+state;
  l.textContent={ok:'Live',busy:'Connecting…',err:'Connection Error'}[state]||state;
}

function updateBadge(){
  const cnt=S.parts.filter(p=>p.avg_sales_wk>0&&wks(p)!==null&&wks(p)<4).length;
  const b=$('low-badge');
  if(!b)return;
  b.textContent=cnt;b.style.display=cnt?'inline':'none';
  const navEl=$('nav-inventory');
  if(navEl){navEl.classList.toggle('alert-nav',cnt>0);}
}

async function loadAll(){
  try{
    const [parts,assemblies,sales,purchases,dealers,settings,bomItems]=await Promise.all([
      db.from('parts').select('*').order('pn'),
      db.from('assemblies').select('*').order('pn'),
      db.from('sales').select('*').order('sale_date',{ascending:false}).limit(200),
      db.from('purchases').select('*').order('order_date',{ascending:false}),
      db.from('dealers').select('*').order('name'),
      db.from('settings').select('*'),
      db.from('bom_items').select('*').order('parent_pn').order('sort_order'),
    ]);
    if(parts.error)throw parts.error;
    S.parts=parts.data||[];
    S.assemblies=assemblies.data||[];
    S.sales=sales.data||[];
    S.purchases=purchases.data||[];
    S.dealers=dealers.data||[];
    (settings.data||[]).forEach(s=>S.settings[s.key]=s.value);
    if(S.settings.shopify)Object.assign(S.shopify,S.settings.shopify);
    if(S.settings.shipstation)Object.assign(S.shipstation,S.settings.shipstation);
    S.boms={};
    (bomItems.data||[]).forEach(i=>{if(!S.boms[i.parent_pn])S.boms[i.parent_pn]=[];S.boms[i.parent_pn].push(i);});
    if(!S.selBOM&&Object.keys(S.boms).length)S.selBOM=Object.keys(S.boms)[0];
    setSyncState('ok');
    updateBadge();
    render();
  }catch(e){
    setSyncState('err');
    $('content').innerHTML=`<div class="loading-state" style="color:var(--red)">⚠ Database error: ${e.message}. Run the SQL migration first.</div>`;
    console.error(e);
  }
}

function setupRealtime(){
  db.channel('erp-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'parts'},p=>{
      if(p.eventType==='INSERT')S.parts=[...S.parts,p.new].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(p.eventType==='UPDATE')S.parts=S.parts.map(x=>x.id===p.new.id?p.new:x);
      else if(p.eventType==='DELETE')S.parts=S.parts.filter(x=>x.id!==p.old.id);
      updateBadge();if(['parts','inventory','dashboard'].includes(S.view))render();
      toast('Parts updated');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'assemblies'},p=>{
      if(p.eventType==='INSERT')S.assemblies=[...S.assemblies,p.new].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(p.eventType==='UPDATE')S.assemblies=S.assemblies.map(x=>x.id===p.new.id?p.new:x);
      else if(p.eventType==='DELETE')S.assemblies=S.assemblies.filter(x=>x.id!==p.old.id);
      if(['assemblies','dashboard'].includes(S.view))render();
      toast('Assemblies updated');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},p=>{
      if(p.eventType==='INSERT')S.sales=[p.new,...S.sales];
      if(['sales','dashboard'].includes(S.view))render();
      toast('New sale recorded');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'purchases'},p=>{
      if(p.eventType==='INSERT')S.purchases=[p.new,...S.purchases];
      else if(p.eventType==='UPDATE')S.purchases=S.purchases.map(x=>x.id===p.new.id?p.new:x);
      if(['purchases','dashboard'].includes(S.view))render();
    })
    .subscribe();
}

  $('page-title').textContent=PAGE_TITLES[v]||v;
  render();
}
function onSearch(q){S.searchQ=q;render();}
function setFilter(ns,k,val){if(!S.filters[ns])S.filters[ns]={};S.filters[ns][k]=val;render();}
function addAction(){const m={parts:'addPart',assemblies:'addAsm',purchases:'addPO',dealers:'addDealer',sales:'addSale'};if(m[S.view])openModal(m[S.view],{});}

function renderParts(){
  let list=S.parts;
  const cats=[...new Set(list.map(p=>p.category||'').filter(Boolean))].sort();
  const sf=S.filters.parts||{};
  const q=(sf.search||S.searchQ||'').toLowerCase();
  if(q)list=list.filter(p=>p.pn.toLowerCase().includes(q)||((p.description||'').toLowerCase().includes(q)));
  if(sf.cat)list=list.filter(p=>p.category===sf.cat);
  if(sf.vendor)list=list.filter(p=>(p.vendor||'').toLowerCase().includes(sf.vendor.toLowerCase()));
  return `
  <div class="filter-bar">
    <div class="search-wrap"><span class="search-icon">⌕</span>
      <input placeholder="Search PN or description…" value="${sf.search||''}" oninput="setFilter('parts','search',this.value)">
    </div>
    <input class="form-input" style="width:130px" placeholder="Vendor…" value="${sf.vendor||''}" oninput="setFilter('parts','vendor',this.value)">
    <select class="form-input" style="width:160px" onchange="setFilter('parts','cat',this.value)">
      <option value="">All Categories</option>
      ${cats.map(c=>`<option value="${c}" ${sf.cat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <span class="filter-count">${list.length} parts</span>
  </div>
  <div class="tbl-wrap">
  <table><thead><tr><th>Part #</th><th>Description</th><th>Vendor</th><th>Unit Cost</th><th>On Hand</th><th>Avg / Wk</th><th>Wks Stock</th><th>Lead</th><th></th></tr></thead><tbody>
  ${list.map(p=>{
    const w=wks(p);const col=wkColor(w);const pct=wkPct(w);
    return `<tr>
      <td class="pn" style="color:var(--text)">${p.pn}</td>
      <td class="main-col" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description||''}</td>
      <td style="font-size:11px;color:var(--text3)">${p.vendor||''}</td>
      <td class="money-cost">${fc(p.unit_cost||0,4)}</td>
      <td class="money" style="color:${(p.total_unpckgd||0)<0?'var(--red)':'var(--text)'};font-weight:700">${fn(p.total_unpckgd||0)}</td>
      <td class="money-neutral">${p.avg_sales_wk>0?p.avg_sales_wk.toFixed(1):'-'}</td>
      <td><div class="stock-bar-wrap"><div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:${col}"></div></div><span class="wk-label" style="color:${col}">${w!==null?w+'w':'N/A'}</span></div></td>
      <td style="font-size:11px;color:var(--text3)">${p.lead_time_weeks||1}w</td>
      <td style="display:flex;gap:4px">
        <button class="action-btn" onclick='openModal("editPart",${JSON.stringify(p)})'>Edit</button>
        ${w!==null&&w<(p.lead_time_weeks+2)?`<button class="action-btn" style="color:var(--orange);border-color:rgba(224,123,40,.3)" onclick='openModal("addPO",{item:"${p.pn}",desc:${JSON.stringify(p.description||'')},vendor:"${p.vendor||''}",qty:${Math.ceil((p.avg_sales_wk||1)*12)},unitCost:${p.unit_cost||0}})'>Order</button>`:''}
      </td>
    </tr>`;}).join('')}
  </tbody></table></div>`;

async function sendAI(){
  const inp=$('ai-input');const msg=inp.value.trim();
  if(!msg||S.aiLoading)return;
  inp.value='';
  S.aiHistory.push({role:'user',text:msg});
  S.aiLoading=true;render();
  const c=$('ai-chat');if(c)c.scrollTop=c.scrollHeight;
  const lowParts=S.parts.filter(p=>p.avg_sales_wk>0&&wks(p)!==null&&wks(p)<4).map(p=>`${p.pn}(${wks(p)}wk)`).join(', ');
  const critAsm=S.assemblies.filter(a=>a.status==='critical').map(a=>`${a.pn}(${a.total_on_hand||0}oh)`).join(', ');
  const openPOs=S.purchases.filter(p=>p.status!=='Received').map(p=>`${p.pn}@${p.vendor}(${p.status})`).join(', ');
  const ctx=`You are the AI assistant for TGK Motorsport ERP. TGK builds performance Audi/Tesla parts. Live Supabase data: ${S.parts.length} parts, ${S.assemblies.length} assemblies. Low stock (under 4wks): ${lowParts||'none'}. Critical (zero/negative stock): ${critAsm||'none'}. Open POs: ${openPOs||'none'}. 7-day orders: ${S.sales.filter(s=>s.sale_date>='2026-06-02').length}. Be specific, actionable, concise.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:ctx,messages:S.aiHistory.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});
    const data=await res.json();
    S.aiHistory.push({role:'assistant',text:data.content?.[0]?.text||'Sorry, try again.'});
  }catch(e){S.aiHistory.push({role:'assistant',text:'Connection error.'});}
  S.aiLoading=false;render();
  setTimeout(()=>{const c=$('ai-chat');if(c)c.scrollTop=c.scrollHeight;},50);
}

async function updatePOStatus(id,ns){
  const{error}=await db.from('purchases').update({status:ns,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.purchases=S.purchases.map(p=>p.id===id?{...p,status:ns}:p);
  toast(`PO → ${ns}`);render();
}
async function deletePO(id){
  if(!confirm('Delete this PO?'))return;
  const{error}=await db.from('purchases').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.purchases=S.purchases.filter(p=>p.id!==id);
  toast('PO deleted');render();
}
async function deleteSale(id){
  if(!confirm('Delete this sale?'))return;
  const{error}=await db.from('sales').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.sales=S.sales.filter(s=>s.id!==id);
  toast('Sale deleted');render();
}
async function deleteDealer(id){
  if(!confirm('Delete this dealer?'))return;
  const{error}=await db.from('dealers').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.dealers=S.dealers.filter(d=>d.id!==id);
  toast('Dealer deleted');render();
}
async function delBOMItem(id,parentPn){
  const{error}=await db.from('bom_items').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  if(S.boms[parentPn])S.boms[parentPn]=S.boms[parentPn].filter(i=>i.id!==id);
  toast('BOM item removed');render();
}
async function saveBOMItem(){
  const parent=$('bom-parent').value,child=$('bom-child').value.trim();
  const qty=parseFloat($('bom-qty').value)||1,type=$('bom-type').value,cost=parseFloat($('bom-cost').value)||0;
  if(!parent||!child){toast('Parent and Child PN required');return;}
  const{data,error}=await db.from('bom_items').insert({parent_pn:parent,child_pn:child,qty,item_type:type,unit_cost:cost,sort_order:(S.boms[parent]||[]).length+1}).select().single();
  if(error){toast('Error: '+error.message);return;}
  if(!S.boms[parent])S.boms[parent]=[];
  S.boms[parent].push(data);S.selBOM=parent;
  toast('BOM item added');render();
}
async function recordPack(pn,asmId){
  const{error}=await db.from('pack_log').insert({pn,qty:1,pack_date:new Date().toISOString()});
  if(error){toast('Error: '+error.message);return;}
  const asm=S.assemblies.find(a=>a.pn===pn);
  if(asm){
    const oh=(asm.total_on_hand||0)+1;
    await db.from('assemblies').update({total_on_hand:oh,total_assembled:(asm.total_assembled||0)+1,updated_at:new Date().toISOString()}).eq('id',asm.id);
    S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:oh}:a);
  }
  toast(`Packed 1 × ${pn}`);render();
}
async function saveShopify(){
  const store=$('sh-store').value.trim(),key=$('sh-key').value.trim(),webhook=$('sh-wh').value.trim();
  S.shopify={connected:!!(store&&key),store,key,webhook};
  await db.from('settings').upsert({key:'shopify',value:S.shopify,updated_at:new Date().toISOString()});
  toast(S.shopify.connected?'Shopify connected!':'Settings saved');render();
}
async function saveShipStation(){
  const key=$('ss-key').value.trim(),secret=$('ss-secret').value.trim();
  S.shipstation={connected:!!(key&&secret),key,secret};
  await db.from('settings').upsert({key:'shipstation',value:S.shipstation,updated_at:new Date().toISOString()});
  toast(S.shipstation.connected?'ShipStation connected!':'Settings saved');render();
}

// ============================================================
// MODALS
// ============================================================
function openModal(type,data){
  const overlay=$('modal-overlay'),box=$('modal-box');
  let title='',body='';
  const fi=(id,label,val,extra='')=>`<div class="form-group"><label class="form-label">${label}</label><input id="${id}" class="form-input" value="${String(val||'').replace(/"/g,'&quot;')}" ${extra}></div>`;
  const fs=(id,label,opts,sel)=>`<div class="form-group"><label class="form-label">${label}</label><select id="${id}" class="form-input">${opts.map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('')}</select></div>`;

  if(type==='addPO'||type==='editPO'){
    title=type==='addPO'?'Create Purchase Order':'Edit PO';
    body=`<div class="form-row cols-2">${fi('m-vendor','Vendor',data.vendor||'')} ${fi('m-pn','Part #',data.item||data.pn||'')}</div>
    <div class="form-row">${fi('m-desc','Description',data.desc||data.description||'')}</div>
    <div class="form-row cols-2">${fi('m-qty','Quantity',data.qty||1,'type="number" min="1"')} ${fi('m-cost','Unit Cost',data.unitCost||data.unit_cost||0,'type="number" step="0.0001"')}</div>
    <div class="form-row cols-2">${fi('m-arrival','Expected Arrival',data.arrival_date||'','type="date"')} ${fi('m-notes','Notes',data.notes||'')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitPO('${data.id||''}')">Save PO</button></div>`;
  }
  else if(type==='addSale'){
    title='Record Sale';
    body=`<div class="form-row cols-2">${fi('m-date','Date',new Date().toISOString().slice(0,10),'type="date"')} ${fi('m-order','Order #','')}</div>
    <div class="form-row cols-2">${fi('m-pn','SKU','','placeholder="TGK-XXX-XX"')} ${fi('m-qty','Qty',1,'type="number" min="1"')}</div>
    <div class="form-row">${fi('m-source','Source','TGK Motorsport')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitSale()">Record Sale</button></div>`;
  }
  else if(type==='addDealer'||type==='editDealer'){
    title=type==='addDealer'?'Add Dealer':'Edit Dealer';
    body=`<div class="form-row cols-2">${fi('m-name','Dealer Name',data.name||'')} ${fi('m-contact','Contact Name',data.contact_name||'')}</div>
    <div class="form-row">${fi('m-email','Email',data.email||'','type="email"')}</div>
    <div class="form-row cols-2">${fi('m-disc','Discount %',Math.round((data.discount_pct||0.2)*100),'type="number" min="0" max="100"')} ${fs('m-status','Status',[['Active','Active'],['Inactive','Inactive']],data.status||'Active')}</div>
    <div class="form-row">${fi('m-notes','Notes',data.notes||'')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitDealer('${data.id||''}')">Save Dealer</button></div>`;
  }
  else if(type==='addPart'||type==='editPart'){
    title=type==='addPart'?'Add Part':'Edit Part';
    body=`<div class="form-row cols-2">${fi('m-pn','Part #',data.pn||'',data.id?'readonly':'')} ${fi('m-vendor','Vendor',data.vendor||'')}</div>
    <div class="form-row">${fi('m-desc','Description',data.description||'')}</div>
    <div class="form-row cols-2">${fi('m-cat','Category',data.category||'')} ${fi('m-cost','Unit Cost',data.unit_cost||0,'type="number" step="0.0001"')}</div>
    <div class="form-row cols-2">${fi('m-lead','Lead Time (wks)',data.lead_time_weeks||1,'type="number" min="1"')} ${fi('m-avg','Avg Sales / Wk',data.avg_sales_wk||0,'type="number" step="0.01"')}</div>
    <div class="form-row cols-2">${fi('m-unpckgd','On Hand (Unpacked)',data.total_unpckgd||0,'type="number"')} ${fi('m-min','Min Qty',data.min_qty||0,'type="number" step="0.1"')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitPart('${data.id||''}')">Save Part</button></div>`;
  }
  else if(type==='addAsm'||type==='editAsm'){
    title=type==='addAsm'?'Add Assembly':'Edit Assembly';
    body=`<div class="form-row cols-2">${fi('m-pn','SKU',data.pn||'',data.id?'readonly':'')} ${fi('m-cat','Category',data.category||'')}</div>
    <div class="form-row">${fi('m-desc','Description',data.description||'')}</div>
    <div class="form-row cols-2">${fi('m-msrp','MSRP',data.msrp||0,'type="number" step="0.01"')} ${fi('m-ship','Shipping Cost',data.shipping_cost||10,'type="number" step="0.01"')}</div>
    <div class="form-row cols-2">${fi('m-oh','On Hand',data.total_on_hand||0,'type="number"')} ${fs('m-status','Status',[['ok','In Stock'],['low','Low'],['critical','Critical']],data.status||'ok')}</div>
    <div class="form-row">${fi('m-avg','Avg Sales / Wk',data.avg_sales_wk||0,'type="number" step="0.01"')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAsm('${data.id||''}')">Save Assembly</button></div>`;
  }
  else return;

  box.innerHTML=`<div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">✕</button></div>${body}`;
  overlay.classList.remove('hidden');
}
function closeModal(){$('modal-overlay').classList.add('hidden');}

async function submitPO(eid){
  const vendor=$('m-vendor').value.trim(),pn=$('m-pn').value.trim(),desc=$('m-desc').value.trim();
  const qty=parseInt($('m-qty').value)||1,unit_cost=parseFloat($('m-cost').value)||0;
  const arrival=$('m-arrival').value||null,notes=$('m-notes').value;
  if(!vendor||!pn){toast('Vendor and Part # required');return;}
  const payload={vendor,pn,description:desc,qty,unit_cost,arrival_date:arrival,notes,status:'On Order',updated_at:new Date().toISOString()};
  let error,data;
  if(eid){({error}=await db.from('purchases').update(payload).eq('id',eid));}
  else{({data,error}=await db.from('purchases').insert({...payload,order_date:new Date().toISOString().slice(0,10)}).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data)S.purchases=[data,...S.purchases];
  else S.purchases=S.purchases.map(p=>p.id===eid?{...p,...payload}:p);
  closeModal();toast('PO saved');render();
}
async function submitSale(){
  const pn=$('m-pn').value.trim();if(!pn){toast('SKU required');return;}
  const{data,error}=await db.from('sales').insert({sale_date:$('m-date').value,order_number:$('m-order').value.trim(),pn,qty:parseInt($('m-qty').value)||1,source:$('m-source').value.trim(),status:'Fulfilled'}).select().single();
  if(error){toast('Error: '+error.message);return;}
  S.sales=[data,...S.sales];closeModal();toast('Sale recorded');render();
}
async function submitDealer(eid){
  const name=$('m-name').value.trim();if(!name){toast('Name required');return;}
  const payload={name,contact_name:$('m-contact').value.trim(),email:$('m-email').value.trim(),discount_pct:parseFloat($('m-disc').value)/100||0.2,status:$('m-status').value,notes:$('m-notes').value};
  let error,data;
  if(eid){({error}=await db.from('dealers').update(payload).eq('id',eid));}
  else{({data,error}=await db.from('dealers').insert(payload).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data)S.dealers=[...S.dealers,data].sort((a,b)=>a.name.localeCompare(b.name));
  else S.dealers=S.dealers.map(d=>d.id===eid?{...d,...payload}:d);
  closeModal();toast('Dealer saved');render();
}
async function submitPart(eid){
  const pn=$('m-pn').value.trim();if(!pn){toast('Part # required');return;}
  const payload={pn,vendor:$('m-vendor').value.trim(),description:$('m-desc').value.trim(),category:$('m-cat').value.trim(),unit_cost:parseFloat($('m-cost').value)||0,lead_time_weeks:parseInt($('m-lead').value)||1,avg_sales_wk:parseFloat($('m-avg').value)||0,total_unpckgd:parseInt($('m-unpckgd').value)||0,min_qty:parseFloat($('m-min').value)||0,updated_at:new Date().toISOString()};
  let error,data;
  if(eid){({error}=await db.from('parts').update(payload).eq('id',eid));}
  else{({data,error}=await db.from('parts').insert(payload).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data)S.parts=[...S.parts,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.parts=S.parts.map(p=>p.id===eid?{...p,...payload}:p);
  closeModal();updateBadge();toast('Part saved');render();
}
async function submitAsm(eid){
  const pn=$('m-pn').value.trim();if(!pn){toast('SKU required');return;}
  const payload={pn,description:$('m-desc').value.trim(),category:$('m-cat').value.trim(),msrp:parseFloat($('m-msrp').value)||0,shipping_cost:parseFloat($('m-ship').value)||10,total_on_hand:parseInt($('m-oh').value)||0,status:$('m-status').value,avg_sales_wk:parseFloat($('m-avg').value)||0,updated_at:new Date().toISOString()};

  if(eid){({error}=await db.from('assemblies').update(payload).eq('id',eid));}

  if(error){toast('Error: '+error.message);return;}
  if(data)S.assemblies=[...S.assemblies,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.assemblies=S.assemblies.map(a=>a.id===eid?{...a,...payload}:a);

}
