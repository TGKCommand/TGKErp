async function sendAI(){
  const inp=$('ai-input');const msg=inp.value.trim();
  if(!msg||S.aiLoading)return;
  inp.value='';
  S.aiHistory.push({role:'user',text:msg});
  S.aiLoading=true;render();
  const c=$('ai-chat');if(c)c.scrollTop=c.scrollHeight;
  const lowParts=S.parts.filter(p=>avgWk(p)>0&&wks(p)!==null&&wks(p)<4).map(p=>`${p.pn}(${wks(p)}wk)`).join(', ');
  const critAsm=S.assemblies.filter(a=>!a.discontinued&&liveStatus(a)==='critical').map(a=>`${a.pn}(${a.total_on_hand||0}oh)`).join(', ');
  const openPOs=S.purchases.filter(p=>p.status!=='Received').map(p=>`${p.pn}@${p.vendor}(${p.status})`).join(', ');
  const ctx=`You are the AI assistant for TGK Motorsport ERP. TGK builds performance Audi/Tesla parts. Live Supabase data: ${S.parts.length} parts, ${S.assemblies.length} assemblies. Low stock (under 4wks): ${lowParts||'none'}. Critical (zero/negative stock): ${critAsm||'none'}. Open POs: ${openPOs||'none'}. 7-day orders: ${S.sales.filter(s=>s.sale_date>=daysAgo(7)).length}. Be specific, actionable, concise.`;
  try{
    const apiKey=S.settings.anthropic_api_key||'';
    if(!apiKey){
      S.aiHistory.push({role:'assistant',text:'No API key configured. Click "Set API Key" above, paste your Anthropic API key (starts with sk-ant-), and try again. Get a key at console.anthropic.com → API Keys.'});
      S.aiLoading=false;render();return;
    }
    let data=null;
    for(let attempt=0;attempt<3;attempt++){
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:ctx,messages:S.aiHistory.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});
      data=await res.json();
      if(data.error&&(data.error.type==='overloaded_error'||res.status===529||res.status===429)){
        if(attempt<2){await new Promise(r=>setTimeout(r,(attempt+1)*2000));continue;}
      }
      break;
    }
    if(data.error){
      const friendly=data.error.type==='overloaded_error'?'Anthropic servers are busy right now — tried 3 times. Wait a moment and ask again.':
        data.error.type==='authentication_error'?'Invalid API key. Click "Change API Key" above and re-paste it.':
        'API error: '+(data.error.message||data.error.type);
      S.aiHistory.push({role:'assistant',text:friendly});
    } else {
      S.aiHistory.push({role:'assistant',text:data.content?.[0]?.text||'Sorry, try again.'});
    }
  }catch(e){S.aiHistory.push({role:'assistant',text:'Connection error: '+e.message});}
  S.aiLoading=false;render();
  setTimeout(()=>{const c=$('ai-chat');if(c)c.scrollTop=c.scrollHeight;},50);
}

function startShopifyOAuth(){

  db.from('settings').upsert({key:'shopify',value:S.shopify},{onConflict:'key'});
  const redirect=encodeURIComponent('https://tgkcommand.github.io/TGKErp/tgk_erp.html');
  const scopes='read_orders,write_orders,read_products,read_inventory';
  const state=Math.random().toString(36).slice(2);
  localStorage.setItem('shopify_oauth_state',state);
  const url='https://'+store+'/admin/oauth/authorize?client_id='+clientId
    +'&scope='+scopes+'&redirect_uri='+redirect+'&state='+state;
  window.location.href=url;

async function handleShopifyOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const shop=params.get('shop');
  const state=params.get('state');
  if(!code||!shop)return;
  // Clean URL without reloading
  history.replaceState({},'','#dashboard');
  const saved=localStorage.getItem('shopify_oauth_state');
  if(saved&&state!==saved){toast('OAuth state mismatch — try again');return;}
  localStorage.removeItem('shopify_oauth_state');
  toast('Exchanging OAuth code for access token…');
  try{
    const res=await fetch(SUPA_URL+'/functions/v1/shopify-orders',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'oauth_exchange',code,shop})
    });
    const data=await res.json().catch(()=>({}));
    if(data.access_token){
      S.shopify.key=data.access_token;
      S.shopify.store=shop.replace('https://','');
      S.shopify.connected=true;
      await db.from('settings').upsert({key:'shopify',value:S.shopify},{onConflict:'key'});
      toast('✓ Shopify connected! Access token saved.',5000);
      nav('integrations');render();
    }else{
      toast('OAuth error: '+(data.error||'could not exchange code'));
    }
  }catch(e){toast('OAuth error: '+e.message);}
}

  else if(type==='manageVendors'){
    const vendors=getVendors();
    title='Manage Vendors';
    const rows=vendors.map(v=>{
      const partCount=S.parts.filter(p=>p.vendor===v).length;
      const poCount=S.purchases.filter(p=>p.vendor===v).length;
      const isCustom=(S.customVendors||[]).includes(v);
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);margin-bottom:4px">
        <span style="flex:1;font-size:12px;font-weight:600;color:var(--text)">${escHtml(v)}</span>
        <span style="font-size:10px;color:var(--text3)">${partCount} part${partCount!==1?'s':''}</span>

async function submitPO(eid){
  const vendor=$('m-vendor').value.trim(),pn=$('m-pn').value.trim(),desc=$('m-desc').value.trim();
  const qty=parseInt($('m-qty').value)||1,unit_cost=parseFloat($('m-cost').value)||0;
  const arrival=$('m-arrival').value||null,notes=$('m-notes').value;
  if(!vendor||!pn){toast('Vendor and Part # required');return;}
  const payload={vendor,pn,description:desc,qty,unit_cost,arrival_date:arrival,notes,status:'On Order',updated_at:new Date().toISOString()};
  let error,data;
  if(eid){({error}=await db.from('purchases').update(payload).eq('id',eid));}
  else{({data,error}=await db.from('purchases').insert({...payload,order_date:new Date().toISOString().slice(0,10)}).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data){
    S.purchases=[data,...S.purchases];
    // Create a po_line so the list view shows correct cost/pn
    if(!(S.poLines[data.id]||[]).length){
      const {data:ld}=await db.from('po_lines').insert({po_id:data.id,pn,description:desc,qty_ordered:qty,unit_cost,qty_received:0,status:'Pending'}).select().single();
      S.poLines[data.id]=ld?[ld]:[{po_id:data.id,pn,description:desc,qty_ordered:qty,unit_cost,qty_received:0,status:'Pending'}];
    }
  } else {
    S.purchases=S.purchases.map(p=>p.id===eid?{...p,...payload}:p);
    // Update existing line if present
    if(S.poLines[eid]?.length===1){S.poLines[eid]=[{...S.poLines[eid][0],pn,description:desc,qty_ordered:qty,unit_cost}];}
  }
  closeModal();toast('PO saved');render();
}

async function submitDealer(eid){

  const payload={name,contact_name:$('m-contact').value.trim(),email:$('m-email').value.trim(),discount_pct:parseFloat($('m-disc').value)/100||0.2,status:$('m-status').value,notes:$('m-notes').value};

async function submitPart(eid){
  const pn=$('m-pn').value.trim();if(!pn){toast('Part # required');return;}
  const breaks=(S.pendingPriceBreaks||[]).filter(Boolean).sort(function(a,b){return a.qty-b.qty;}).map(function(b){return{qty:b.qty,price:b.price};});
  const payload={pn,vendor:$('m-vendor').value.trim(),description:$('m-desc').value.trim(),category:$('m-cat').value.trim(),unit_cost:parseFloat($('m-cost').value)||0,lead_time_weeks:parseInt($('m-lead').value)||1,avg_sales_wk:parseFloat($('m-avg').value)||0,total_unpckgd:parseInt($('m-unpckgd').value)||0,min_qty:parseFloat($('m-min').value)||0,moq:parseFloat($('m-moq').value)||0,price_breaks:breaks,location:$('m-loc').value.trim(),drawing_url:$('m-drawing').value.trim(),discontinued:$('m-disc').checked,updated_at:new Date().toISOString()};
  let error,data;
  if(eid){const prev=S.parts.find(p=>p.id===eid);({error}=await db.from('parts').update(payload).eq('id',eid));if(!error&&prev)pushUndo('update','parts',{...prev,...payload},prev,'Edit part: '+payload.pn);}
  else{({data,error}=await db.from('parts').insert(payload).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data)S.parts=[...S.parts,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.parts=S.parts.map(p=>p.id===eid?{...p,...payload}:p);
  S.pendingPriceBreaks=[];
  closeModal();updateBadge();toast('Part saved');render();
}

async function deletePart(pn, id){
  // Check if part is used in any BOM
  const inBOMs=Object.entries(S.boms).filter(([,lines])=>lines.some(l=>l.child_pn===pn)).map(([k])=>k);
  const hasStock=(S.parts.find(p=>p.id===id)?.total_unpckgd||0)>0;
  let msg=`Delete part ${pn}?`;
  if(inBOMs.length)msg+=`\n\n⚠ This part is used in ${inBOMs.length} BOM(s): ${inBOMs.slice(0,3).join(', ')}${inBOMs.length>3?' …':''}. BOM references will remain but the part will be gone.`;
  if(hasStock)msg+=`\n\n⚠ This part has stock on hand. Deleting it will remove the inventory record.`;
  msg+='\n\nThis cannot be undone.';
  if(!confirm(msg))return;
  const{error}=await db.from('parts').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.parts=S.parts.filter(p=>p.id!==id);
  toast('Part '+pn+' deleted');render();
}

function bulkDiscontinue(table){
  const isParts=table==='parts';
  const ids=[...(isParts?S.selectedParts:S.selectedAsms)];
  if(!ids.length){toast('Nothing selected');return;}
  const items=isParts?S.parts.filter(p=>ids.includes(p.id)):S.assemblies.filter(a=>ids.includes(a.id));
  const noun=isParts?'part':'assembl';const nounPlural=isParts?'parts':'assemblies';
  const preview=items.slice(0,8).map(x=>x.pn);
  const overflow=items.length>8?' <span style="color:var(--text3)">and '+(items.length-8)+' more…</span>':'';
  const existing=document.getElementById('bulk-disc-modal');if(existing)existing.remove();
  const modal=document.createElement('div');modal.id='bulk-disc-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:22px 24px;max-width:440px;width:92%;box-shadow:0 16px 48px rgba(0,0,0,.18)">
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px">🗄 Discontinue ${items.length} ${items.length===1?noun:nounPlural}?</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">They will be hidden from Inventory, Planning &amp; Production. Restore via the Discontinued filter.</div>
    <div style="font-size:11px;background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:160px;overflow-y:auto;line-height:1.8">
      ${preview.map(pn=>'<span style="color:var(--text2)">'+pn+'</span>').join(' · ')}${overflow}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button class="btn btn-sm" onclick="document.getElementById('bulk-disc-modal').remove()">Cancel</button>
      <button class="btn btn-sm" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="confirmBulkDiscontinue('${table}')">Yes, Discontinue ${items.length}</button>
    </div></div>`;
  document.body.appendChild(modal);
}
async function confirmBulkDiscontinue(table){
  document.getElementById('bulk-disc-modal')?.remove();
  const isParts=table==='parts';
  const ids=[...(isParts?S.selectedParts:S.selectedAsms)];
  const dbTable=isParts?'parts':'assemblies';
  const noun=isParts?'part':'assembl';
  toast('Discontinuing…');
  let failed=0;
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100);
    const{error}=await db.from(dbTable).update({discontinued:true,updated_at:new Date().toISOString()}).in('id',chunk);
    if(error){failed+=chunk.length;console.error('bulkDiscontinue error:',error);}
  }
  if(isParts){S.parts=S.parts.map(p=>ids.includes(p.id)?{...p,discontinued:true}:p);S.selectedParts=new Set();}
  else{S.assemblies=S.assemblies.map(a=>ids.includes(a.id)?{...a,discontinued:true}:a);S.selectedAsms=new Set();}
  render();
  if(failed)toast('⚠ '+failed+' items failed — check console',5000);
  else toast('🗄 '+ids.length+' '+(ids.length===1?noun+'y':noun+(isParts?'s':'ies'))+' discontinued.',4000);
}

async function saveBulkEdit(table){
  const isParts=table==='parts';
  const ids=isParts?[...S.selectedParts]:[...S.selectedAsms];
  let saved=0,errors=0;
  const btn=event?.target;if(btn){btn.disabled=true;btn.textContent='Saving…';}

  for(const id of ids){
    let payload={updated_at:new Date().toISOString()};
    const desc=document.querySelector('.be-desc[data-id="'+id+'"]')?.value.trim()||'';
    const cat=document.querySelector('.be-cat[data-id="'+id+'"]')?.value||'';
    payload.description=desc;payload.category=cat;
    if(isParts){
      payload.vendor=document.querySelector('.be-vendor[data-id="'+id+'"]')?.value||'';
      payload.unit_cost=parseFloat(document.querySelector('.be-cost[data-id="'+id+'"]')?.value)||0;
      payload.location=document.querySelector('.be-loc[data-id="'+id+'"]')?.value.trim()||'';
      payload.lead_time_weeks=parseInt(document.querySelector('.be-lead[data-id="'+id+'"]')?.value)||1;
    }else{
      payload.msrp=parseFloat(document.querySelector('.be-msrp[data-id="'+id+'"]')?.value)||0;
      payload.shipping_cost=parseFloat(document.querySelector('.be-ship[data-id="'+id+'"]')?.value)||10;
      payload.status=document.querySelector('.be-status[data-id="'+id+'"]')?.value||'ok';
    }
    const{error}=await db.from(isParts?'parts':'assemblies').update(payload).eq('id',id);
    if(error)errors++;
    else{
      if(isParts)S.parts=S.parts.map(x=>x.id===id?{...x,...payload}:x);
      else S.assemblies=S.assemblies.map(x=>x.id===id?{...x,...payload}:x);
      saved++;
    }
  }

  if(errors)toast('Saved '+saved+', '+errors+' errors');
  else{
    toast('\u2713 '+saved+' '+(isParts?'parts':'assemblies')+' updated');
    S.bulkEditMode=null;
    if(isParts)S.selectedParts=new Set();
    else S.selectedAsms=new Set();
  }
  render();
}
async function addCategory(table){
  const name=(document.getElementById('new-cat-name')?.value||'').trim();
  if(!name){toast('Enter a category name');return;}
  const parent=(document.getElementById('new-cat-parent')?.value||'').trim();
  const full=parent?parent+'/'+name:name;
  // Check for duplicate
  if(getCats(table).includes(full)){toast(`"${full}" already exists`);return;}
  // Add to in-memory custom list
  if(!S.customCats[table])S.customCats[table]=[];
  if(!S.customCats[table].includes(full))S.customCats[table].push(full);
  // Persist to settings
  S.settings.custom_cats=S.customCats;
  const{error}=await db.from('settings').upsert({key:'custom_cats',value:S.customCats},{onConflict:'key'});
  if(error){toast('Saved in session only — DB error: '+error.message);} 
  else toast(`✓ Category "${full}" created`);
  // Re-open modal to show updated list
  openModal('manageCategories',{table});
}

async function addVendor(){

async function renameVendor(oldName){
  const newName=prompt('Rename vendor "'+oldName+'" to:',oldName);
  if(!newName||newName===oldName)return;
  // Update all parts
  const partsToUpdate=S.parts.filter(p=>p.vendor===oldName);
  if(partsToUpdate.length){
    const{error}=await db.from('parts').update({vendor:newName}).eq('vendor',oldName);
    if(error){toast('Error updating parts: '+error.message);return;}
    S.parts=S.parts.map(p=>p.vendor===oldName?{...p,vendor:newName}:p);
  }
  // Update all POs
  const posToUpdate=S.purchases.filter(p=>p.vendor===oldName);
  if(posToUpdate.length){
    await db.from('purchases').update({vendor:newName}).eq('vendor',oldName);
    S.purchases=S.purchases.map(p=>p.vendor===oldName?{...p,vendor:newName}:p);
  }
  // Update customVendors
  if(S.customVendors){
    S.customVendors=S.customVendors.map(v=>v===oldName?newName:v);
    S.settings.custom_vendors=S.customVendors;
    await db.from('settings').upsert({key:'custom_vendors',value:S.customVendors},{onConflict:'key'});
  }
  toast(`Renamed "${oldName}" → "${newName}"${partsToUpdate.length?' ('+partsToUpdate.length+' parts, '+posToUpdate.length+' POs updated)':''}`);
  openModal('manageVendors',{});
}

async function deleteVendor(name){
  const partsCount=S.parts.filter(p=>p.vendor===name).length;
  if(partsCount>0){toast(`Cannot delete — ${partsCount} part${partsCount!==1?'s':''} use "${name}". Reassign them first.`);return;}
  if(!confirm(`Remove vendor "${name}" from the list?`))return;
  S.customVendors=(S.customVendors||[]).filter(v=>v!==name);
  S.settings.custom_vendors=S.customVendors;
  await db.from('settings').upsert({key:'custom_vendors',value:S.customVendors},{onConflict:'key'});
  toast(`Vendor "${name}" removed`);
  openModal('manageVendors',{});
}

async function deleteCategory(table,name){
  const count=(table==='parts'?S.parts:S.assemblies).filter(x=>x.category===name).length;
  if(count>0){
    const action=prompt(count+' items are in "'+name+'". Move them to (leave blank to clear category):','');
    if(action===null)return;
    const into=action.trim();
    const dbTable=table==='parts'?'parts':'assemblies';

    if(error){toast('Error: '+error.message);return;}
    if(table==='parts')S.parts=S.parts.map(p=>p.category===name?{...p,category:into||null}:p);
    else S.assemblies=S.assemblies.map(a=>a.category===name?{...a,category:into||null}:a);
    toast('Category "'+name+'" deleted — '+count+' items '+(into?'moved to "'+into+'"':'uncategorised'));

    S.customCats[table]=S.customCats[table].filter(c=>c!==name);
    S.settings.custom_cats=S.customCats;
    await db.from('settings').upsert({key:'custom_cats',value:S.customCats},{onConflict:'key'});

async function deleteAsm(pn, id){
  const inBOMs=Object.entries(S.boms).filter(([,lines])=>lines.some(l=>l.child_pn===pn)).map(([k])=>k);
  const openOrders=S.sales.filter(s=>s.pn===pn&&!['Delivered','Cancelled','Refunded','Returned'].includes(s.fulfillment_status||'Open'));
  let msg=`Delete assembly ${pn}?`;
  if(openOrders.length)msg+=`\n\n⚠ There are ${openOrders.length} open/in-progress orders for this assembly.`;
  if(inBOMs.length)msg+=`\n\n⚠ Used as a subassembly in: ${inBOMs.slice(0,3).join(', ')}${inBOMs.length>3?' …':''}`;
  msg+='\n\nThis cannot be undone.';
  if(!confirm(msg))return;
  const{error}=await db.from('assemblies').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.assemblies=S.assemblies.filter(a=>a.id!==id);
  if(S.boms[pn])delete S.boms[pn];
  toast('Assembly '+pn+' deleted');render();
}
async function submitManualSale(){

  }).select().single();

        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
        body:JSON.stringify({
          action:'create_order',
          orderNumber:'Manual_'+orderNum,
          customerName:customerName||'Customer',
          customerEmail:customerEmail||undefined,
          pn,
          description:asm?.description||pn,
          qty,
          shipTo,
          internalNotes:'Manual ERP order — '+orderNum+(customerName?' — '+customerName:'')
        })

      if(resp.ok&&(json.orderId||json.orderNumber)){
        toast('✓ ShipStation order created — Manual_'+orderNum,4000);
      } else {
        toast('⚠ ERP order saved, but ShipStation failed: '+(json.error||'Check SS credentials'),5000);

function wtyLookupOrder(orderNum){
  const q=(orderNum||'').trim().replace(/^#/,'');
  if(!q){toast('Enter an order number first');return;}
  // Search sales for a matching order (try exact then partial)
  const match=S.sales.find(s=>{
    const n=(s.order_number||'').replace(/^#/,'');
    return n===q||n===(('#'+q).replace(/^#+/,'#'));
  })||S.sales.find(s=>(s.order_number||'').replace(/^#/,'').includes(q));
  if(!match){toast('Order not found in ERP');return;}
  const nameEl=document.getElementById('wty-name');
  const emailEl=document.getElementById('wty-email');
  const shipNameEl=document.getElementById('wty-ship-name');
  const custName=match.customer_name||S.sales.find(s=>s.order_number===match.order_number&&s.customer_name)?.customer_name||'';
  const custEmail=match.customer_email||S.sales.find(s=>s.order_number===match.order_number&&s.customer_email)?.customer_email||'';
  if(nameEl)nameEl.value=custName||nameEl.value;
  if(emailEl)emailEl.value=custEmail||emailEl.value;
  if(shipNameEl&&!shipNameEl.value&&custName)shipNameEl.value=custName;
  toast(custName?`✓ Loaded: ${custName}`:'Order found — no customer name on file',2500);
}

    };
  }

function wtyAsmFilter(q){
  const dd=document.getElementById('wty-asm-dd');if(!dd)return;
  const lq=(q||'').toLowerCase().trim();
  const active=S.assemblies.filter(function(a){return !a.discontinued;}).map(function(a){return a.pn;}).sort();
  const disc=S.assemblies.filter(function(a){return a.discontinued;}).map(function(a){return a.pn;}).sort();
  const pool=lq?[...active,...disc]:[...active,...disc]; // show all when searching
  const filtered=lq?pool.filter(function(k){
    const a=S.assemblies.find(function(x){return x.pn===k;});
    return k.toLowerCase().includes(lq)||(a?.description||'').toLowerCase().includes(lq);
  }):active; // only active when no search
  if(!filtered.length){dd.innerHTML='<div style="padding:10px;font-size:12px;color:var(--text3)">No assemblies found</div>';return;}
  dd.innerHTML=filtered.map(function(k){
    const a=S.assemblies.find(function(x){return x.pn===k;});
    const isDisc=a?.discontinued;
    return '<div class="_wty-asm-opt" onclick="wtyAsmPick(\''+k+'\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);opacity:'+(isDisc?'.5':'1')+'" onmouseenter="this.style.background=\'var(--bg3)\'" onmouseleave="this.style.background=\'transparent\'">'
      +'<div style="font-family:var(--mono);font-size:12px;color:'+(isDisc?'var(--text3)':'var(--teal)')+'">'+k+(isDisc?' <span style="font-size:9px">🗄</span>':'')+'</div>'

function wtyAsmKey(e){
  const dd=document.getElementById('wty-asm-dd');
  if(!dd||dd.style.display==='none')return;
  const opts=Array.from(dd.querySelectorAll('._wty-asm-opt'));
  const cur=dd.querySelector('._wty-asm-opt[data-active]');
  let idx=cur?opts.indexOf(cur):-1;
  if(e.key==='ArrowDown'){e.preventDefault();if(cur)cur.removeAttribute('data-active');idx=Math.min(idx+1,opts.length-1);opts[idx]?.setAttribute('data-active','1');opts[idx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();if(cur)cur.removeAttribute('data-active');idx=Math.max(idx-1,0);opts[idx]?.setAttribute('data-active','1');opts[idx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();const act=dd.querySelector('._wty-asm-opt[data-active]')||opts[0];if(act)wtyAsmPick(act.querySelector('[style*="mono"]')?.textContent||'');}
  else if(e.key==='Escape'){dd.style.display='none';}
}

async function submitAsm(eid){
  const pn=$('m-pn').value.trim();if(!pn){toast('SKU required');return;}
  const payload={pn,description:$('m-desc').value.trim(),category:$('m-cat').value.trim(),msrp:parseFloat($('m-msrp').value)||0,shipping_cost:parseFloat($('m-ship').value)||10,total_on_hand:parseInt($('m-oh').value)||0,status:$('m-status').value,avg_sales_wk:parseFloat($('m-avg').value)||0,drawing_url:$('m-drawing').value.trim(),discontinued:$('m-disc').checked,new_sku:($('m-new-sku')?.value||'').trim()||null,use_new_sku:!!($('m-use-new-sku')?.checked),updated_at:new Date().toISOString()};
  let error,data;
  if(eid){const prev=S.assemblies.find(a=>a.id===eid);({error}=await db.from('assemblies').update(payload).eq('id',eid));if(!error&&prev)pushUndo('update','assemblies',{...prev,...payload},prev,'Edit assembly: '+payload.pn);}
  else{({data,error}=await db.from('assemblies').insert(payload).select().single());}
  if(error){toast('Error: '+error.message);return;}
  if(data)S.assemblies=[...S.assemblies,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.assemblies=S.assemblies.map(a=>a.id===eid?{...a,...payload}:a);

  // Save any pending BOM lines
  const pending=(S.pendingBOMLines||[]).filter(Boolean);
  if(pending.length>0){
    const finalPn=data?data.pn:pn;
    const existing=S.boms[finalPn]||[];
    const bomInserts=pending.map(function(item,i){
      return{parent_pn:finalPn,child_pn:item.pn,qty:item.qty,item_type:item.type,unit_cost:0,sort_order:existing.length+i+1};
    });
    const{data:bomData,error:bomErr}=await db.from('bom_items').insert(bomInserts).select();
    if(bomErr){toast('Assembly saved but BOM error: '+bomErr.message);}
    else{
      if(!S.boms[finalPn])S.boms[finalPn]=[];
      S.boms[finalPn]=[...S.boms[finalPn],...(bomData||[])];
      if(!S.selBOM)S.selBOM=finalPn;
    }
    S.pendingBOMLines=[];
  }
  closeModal();
  toast(pending.length>0?'Assembly saved with '+pending.length+' BOM line'+(pending.length!==1?'s':''):'Assembly saved');
  render();
}

async function fixAssemblyClassification(){
  // Write the correct is_subassembly value back to the DB for all misclassified records
  const mismatched=S.assemblies.filter(a=>a._classificationMismatch);
  if(!mismatched.length){toast('No mismatches to fix');return;}
  if(!confirm(`Fix is_subassembly flag for ${mismatched.length} assemblies in the database?\n\nRule: only XX-XXXX numeric patterns (e.g. 01-0001) are subassemblies. All others become Finished Goods.`))return;
  let fixed=0,failed=0;
  for(const a of mismatched){
    const{error}=await db.from('assemblies').update({is_subassembly:a.is_subassembly}).eq('id',a.id);
    if(error){failed++;console.error(a.pn,error.message);}
    else{fixed++;a._classificationMismatch=false;}
  }
  render();
  toast(failed?`Fixed ${fixed}, failed ${failed} — check console`:`✓ Fixed ${fixed} assemblies — Subassemblies and Finished Goods now correctly classified`);
}

function pushUndo(action, table, data, prev, desc) {
  S.undoStack.push({action, table, data, prev, desc, ts:new Date()});
  if(S.undoStack.length > 50) S.undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  const btn = document.getElementById('undo-btn');
  if(!btn) return;
  if(S.undoStack.length) {
    btn.disabled = false;
    btn.title = 'Undo: ' + S.undoStack[S.undoStack.length-1].desc;
    btn.textContent = '↩ Undo (' + S.undoStack.length + ')';
  } else {
    btn.disabled = true;
    btn.title = 'Nothing to undo';
    btn.textContent = '↩ Undo';
  }
}

function pushUndoMulti(desc, ops){
  S.undoStack.push({action:'multi', ops, desc, ts:new Date()});
  if(S.undoStack.length > 50) S.undoStack.shift();
  updateUndoBtn();
}

function stripMeta(row){
  const {created_at, updated_at, ...rest} = row || {};
  return rest;
}

async function applyUndoOp(op){
  if(op.action === 'delete') {
    await db.from(op.table).insert(op.data);
  } else if(op.action === 'insert') {
    await db.from(op.table).delete().eq('id', op.data.id);
  } else if(op.action === 'update') {
    const prev = stripMeta(op.prev);
    const {error} = await db.from(op.table).update(prev).eq('id', op.data.id);
    if(error) throw error;
  } else if(op.action === 'bom_delete') {
    await db.from('bom_items').insert(op.data);
  }
}

async function undo() {
  const last = S.undoStack.pop();
  if(!last) return;
  updateUndoBtn();
  try {
    if(last.action === 'multi') {
      for(const op of [...last.ops].reverse()) await applyUndoOp(op);
    } else {
      await applyUndoOp(last);
    }
    await loadAll();
    toast('Undone: ' + last.desc);
  } catch(e) {
    toast('Undo failed: ' + e.message);
    S.undoStack.push(last);
    updateUndoBtn();
  }
}

async function createBackup(label) {
  const data = {
    parts: S.parts,
    assemblies: S.assemblies,
    dealers: S.dealers,
    purchases: S.purchases,
    sales: S.sales.slice(0,200),
    boms: S.boms,
    ts: new Date().toISOString()
  };
  const lbl = label || ('Auto ' + new Date().toLocaleString());
  const {error} = await db.from('backups').insert({label:lbl, data});
  if(!error) {
    S.lastBackup = new Date();
    S.backupTableOk = true;
    S.backupError = null;
    // Update sidebar footer backup time
    const el = document.getElementById('backup-ts');
    if(el) el.textContent = 'Backed up ' + timeAgo(S.lastBackup);
    if(!label || label.startsWith('Auto')) {} else toast('✅ Backup saved: ' + lbl);
    if(S.view==='backups') loadBackups().then(render);
  } else {
    S.backupError = error.message || String(error);
    // Detect missing table (Postgres code 42P01 or message contains "does not exist")
    const isMissingTable = S.backupError.includes('42P01') || S.backupError.includes('does not exist') || S.backupError.includes('relation') || error.code === '42P01';
    if(isMissingTable){
      S.backupTableOk = false;
      if(S.view==='backups') render();
      else toast('⚠ Backups table not set up — go to Backups page for the SQL', 6000);
    } else {
      toast('Backup failed: ' + S.backupError, 5000);
      if(S.view==='backups') render();
    }
  }
}

async function checkBackupTable(){
  // Quick probe — list with limit 0 to test table existence
  const {error} = await db.from('backups').select('id').limit(1);
  if(!error){
    S.backupTableOk = true;
  } else {
    const msg = error.message || String(error);
    S.backupTableOk = !(msg.includes('does not exist') || msg.includes('42P01') || msg.includes('relation'));
    if(!S.backupTableOk) S.backupError = 'Table not found';
  }
  return S.backupTableOk;
}

async function loadBackups() {
  const {data,error} = await db.from('backups').select('id,label,created_at').order('created_at',{ascending:false}).limit(20);
  if(!error) S.backups = data||[];
}

async function restoreBackup(id) {
  if(!confirm('Restore this backup? Current data will be overwritten.')) return;
  const {data,error} = await db.from('backups').select('data').eq('id',id).single();
  if(error){toast('Failed to load backup');return;}
  const d = data.data;
  // Restore parts, assemblies, dealers
  setSyncState('busy');
  try {
    if(d.parts?.length){await db.from('parts').delete().neq('id','00000000-0000-0000-0000-000000000000');await db.from('parts').insert(d.parts);}
    if(d.assemblies?.length){await db.from('assemblies').delete().neq('id','00000000-0000-0000-0000-000000000000');await db.from('assemblies').insert(d.assemblies);}
    if(d.dealers?.length){await db.from('dealers').delete().neq('id','00000000-0000-0000-0000-000000000000');await db.from('dealers').insert(d.dealers);}
    await loadAll();
    toast('Backup restored successfully');
  } catch(e) {
    toast('Restore error: ' + e.message);
    setSyncState('err');
  }
}

function downloadBackup() {
  const data = {
    parts: S.parts, assemblies: S.assemblies, dealers: S.dealers,
    purchases: S.purchases, sales: S.sales, boms: S.boms,
    exported: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tgk_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Backup downloaded');
}

async function startAutoBackup() {
  if(S.autoBackupTimer) clearInterval(S.autoBackupTimer);
  // Check table exists before scheduling
  const ok = await checkBackupTable();
  if(ok){
    // Run one initial backup after 2 minutes, then every 30 min
    setTimeout(()=>createBackup('Auto'), 2 * 60 * 1000);
    S.autoBackupTimer = setInterval(()=>createBackup('Auto'), 30 * 60 * 1000);
  }
  // Update sidebar status regardless
  const el = document.getElementById('backup-ts');
  if(el) el.textContent = ok ? 'Auto-backup ready' : '⚠ Backups not set up';
}

    </div>`;
  }

  // Date range picker
  const dr=rs.dateRange||'all';
  const customFrom=rs.from||'';
  const customTo=rs.to||'';
  const now=new Date();
  const DATE_PRESETS=[
    {key:'all',label:'All Time'},
    {key:'today',label:'Today'},
    {key:'7d',label:'Last 7 days'},
    {key:'30d',label:'Last 30 days'},
    {key:'90d',label:'Last 90 days'},
    {key:'ytd',label:'Year to Date'},
    {key:'thismonth',label:'This Month'},
    {key:'lastmonth',label:'Last Month'},
    {key:'custom',label:'Custom Range'},
  ];
  const salesCats=['Sales','Inventory','Counts','Warranty'];
  const hasDates=['sales_orders','sales_shipped','sales_by_sku','sales_by_month','sales_by_customer','sales_by_dealer','sales_open','sales_on_hold','inv_movements','inv_receipts','cycle_counts','corrections_log','warranty_claims','po_all','po_open','po_draft','po_received','po_by_vendor','po_lines'].includes(def.id);

  // Generate preview rows
  const preview=rs.preview;
  const rows=preview||buildReportRows(def.id,dr,customFrom,customTo);
  if(!rs.preview){S.rptState={...S.rptState,preview:rows};}

  const hasRows=rows&&rows.data&&rows.data.length>0;
  const previewData=hasRows?rows.data.slice(0,50):[];
  const cols=hasRows?rows.cols:[];

  return `<div style="display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:500px;align-items:start">
    <div style="overflow-y:auto;max-height:calc(100vh - 100px);padding-right:4px;position:sticky;top:0">${selectorHtml}</div>
    <div>
      <!-- Header -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <span style="font-size:26px">${def.icon}</span>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700;color:var(--text)">${def.label}</div>
            <div style="font-size:11px;color:var(--text3)">${def.desc}</div>
          </div>
          ${hasRows?`<div style="font-size:11px;color:var(--text3)">${rows.data.length.toLocaleString()} rows</div>`:''}
          <button class="btn btn-teal" onclick="runExport('csv','${def.id}','${dr}','${customFrom}','${customTo}')">⬇ CSV</button>
          <button class="btn btn-primary" onclick="runExport('xlsx','${def.id}','${dr}','${customFrom}','${customTo}')">⬇ Excel</button>
        </div>
        ${hasDates?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;color:var(--text3)">Range:</span>
          ${DATE_PRESETS.map(p=>`<button class="filter-chip ${dr===p.key?'on-teal':''}" onclick="S.rptState={...S.rptState,dateRange:'${p.key}',preview:null};render()">${p.label}</button>`).join('')}
          ${dr==='custom'?`<input type="date" class="form-input" style="width:130px;padding:4px 8px;font-size:11px" value="${customFrom}" onchange="S.rptState={...S.rptState,from:this.value,preview:null};render()">
          <span style="color:var(--text3)">→</span>
          <input type="date" class="form-input" style="width:130px;padding:4px 8px;font-size:11px" value="${customTo||new Date().toISOString().slice(0,10)}" onchange="S.rptState={...S.rptState,to:this.value,preview:null};render()">
          <button class="btn btn-teal btn-sm" onclick="S.rptState={...S.rptState,preview:null};render()">Apply</button>`:''}
        </div>`:''}
      </div>

      <!-- Preview table -->
      ${!hasRows?`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text3)">No data for this report with the current filters</div>`:`
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:11px;color:var(--text3)">Preview — first ${Math.min(50,rows.data.length)} of ${rows.data.length.toLocaleString()} rows</span>
          <span style="font-size:11px;color:var(--teal);font-weight:600">Export includes all rows</span>
        </div>
        <div class="tbl-wrap" style="max-height:calc(100vh - 340px);overflow-y:auto">
        <table><thead class="sticky-header"><tr>${cols.map(c=>`<th style="white-space:nowrap">${c}</th>`).join('')}</tr></thead><tbody>
        ${previewData.map(row=>`<tr>${cols.map(c=>{
          const v=row[c];
          const isNum=typeof v==='number';
          const isMoney=typeof c==='string'&&(c.includes('$')||c.toLowerCase().includes('revenue')||c.toLowerCase().includes('cost')||c.toLowerCase().includes('value')||c.toLowerCase().includes('price')||c.toLowerCase().includes('extended')||c.toLowerCase().includes('spend'));
          return `<td style="white-space:nowrap;${isNum?'text-align:right;font-family:var(--mono);font-size:11px':'font-size:11px'}">${v===null||v===undefined?'<span style="color:var(--text3)">—</span>':isMoney&&isNum?'<span class="money-cost">'+fc(v)+'</span>':escHtml(String(v))}</td>`;
        }).join('')}</tr>`).join('')}
        </tbody></table></div>
      </div>`}
    </div>
  </div>`;
}

function getDateRange(preset, customFrom, customTo){
  const now=new Date();
  if(preset==='all')return{from:null,to:null};
  if(preset==='today'){const d=now.toISOString().slice(0,10);return{from:d,to:d};}
  if(preset==='7d')return{from:daysAgo(7),to:now.toISOString().slice(0,10)};
  if(preset==='30d')return{from:daysAgo(30),to:now.toISOString().slice(0,10)};
  if(preset==='90d')return{from:daysAgo(90),to:now.toISOString().slice(0,10)};
  if(preset==='ytd'){const y=now.getFullYear();return{from:y+'-01-01',to:now.toISOString().slice(0,10)};}
  if(preset==='thismonth'){const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0');return{from:y+'-'+m+'-01',to:now.toISOString().slice(0,10)};}
  if(preset==='lastmonth'){const d=new Date(now.getFullYear(),now.getMonth()-1,1);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');const last=new Date(now.getFullYear(),now.getMonth(),0).toISOString().slice(0,10);return{from:y+'-'+m+'-01',to:last};}
  if(preset==='custom')return{from:customFrom||null,to:customTo||null};
  return{from:null,to:null};
}

function filterByDate(rows, dateField, from, to){
  if(!from&&!to)return rows;
  return rows.filter(r=>{
    const v=r[dateField];if(!v)return!from; // no date → include only if no start filter
    const s=String(v).slice(0,10);
    if(from&&s<from)return false;
    if(to&&s>to)return false;
    return true;
  });
}

function buildReportRows(id, preset, customFrom, customTo){
  const{from,to}=getDateRange(preset,customFrom,customTo);
  const fd=(rows,field)=>filterByDate(rows,field,from,to);

  switch(id){

        const asm=S.assemblies.find(a=>a.pn===s.pn);

      });
      return{cols,data};
    }

    case 'sales_shipped':{
      const rows=fd(S.sales.filter(s=>s.fulfillment_status==='Shipped'||s.fulfillment_status==='Delivered'),'sale_date');
      const cols=['Order #','Date','Customer','SKU','Qty','Status','Carrier','Tracking #'];
      const data=rows.map(s=>({'Order #':s.order_number||'','Date':(s.sale_date||'').slice(0,10),'Customer':s.customer_name||'','SKU':s.pn,'Qty':s.qty||1,'Status':s.fulfillment_status,'Carrier':s.carrier||'','Tracking #':s.tracking_number||''}));
      return{cols,data};
    }

    case 'sales_by_sku':{
      const rows=fd(S.sales.filter(s=>s.fulfillment_status!=='Cancelled'),'sale_date');
      const map={};
      rows.forEach(s=>{
        if(!map[s.pn])map[s.pn]={SKU:s.pn,Description:'',Units:0,'Revenue ($)':0,Orders:new Set()};
        const asm=S.assemblies.find(a=>a.pn===s.pn);
        map[s.pn].Description=asm?.description||'';
        map[s.pn].Units+=(s.qty||1);
        map[s.pn]['Revenue ($)']+=(s.qty||1)*(asm?.msrp||0);
        map[s.pn].Orders.add(s.order_number||s.id);
      });
      const cols=['SKU','Description','Units Sold','Order Count','Revenue ($)'];
      const data=Object.values(map).sort((a,b)=>b.Units-a.Units).map(r=>({'SKU':r.SKU,'Description':r.Description,'Units Sold':r.Units,'Order Count':r.Orders.size,'Revenue ($)':r['Revenue ($)']}));
      return{cols,data};
    }

    case 'sales_by_month':{
      const rows=fd(S.sales.filter(s=>s.fulfillment_status!=='Cancelled'),'sale_date');
      const map={};
      rows.forEach(s=>{
        const mo=(s.sale_date||'').slice(0,7);if(!mo)return;
        if(!map[mo])map[mo]={Month:mo,Orders:new Set(),Units:0,'Revenue ($)':0};
        map[mo].Orders.add(s.order_number||s.id);
        map[mo].Units+=(s.qty||1);
        const asm=S.assemblies.find(a=>a.pn===s.pn);
        map[mo]['Revenue ($)']+=(s.qty||1)*(asm?.msrp||0);
      });
      const cols=['Month','Order Count','Units Sold','Revenue ($)'];
      const data=Object.values(map).sort((a,b)=>a.Month.localeCompare(b.Month)).map(r=>({'Month':r.Month,'Order Count':r.Orders.size,'Units Sold':r.Units,'Revenue ($)':r['Revenue ($)']}));
      return{cols,data};
    }

    case 'sales_by_customer':{
      const rows=fd(S.sales.filter(s=>s.fulfillment_status!=='Cancelled'),'sale_date');
      const map={};
      rows.forEach(s=>{
        const k=s.customer_name||'(no name)';
        if(!map[k])map[k]={Customer:k,Orders:new Set(),Units:0,'Revenue ($)':0,'First Order':'','Last Order':''};
        map[k].Orders.add(s.order_number||s.id);
        map[k].Units+=(s.qty||1);
        const asm=S.assemblies.find(a=>a.pn===s.pn);
        map[k]['Revenue ($)']+=(s.qty||1)*(asm?.msrp||0);
        const d=(s.sale_date||'').slice(0,10);
        if(d){if(!map[k]['First Order']||d<map[k]['First Order'])map[k]['First Order']=d;if(!map[k]['Last Order']||d>map[k]['Last Order'])map[k]['Last Order']=d;}
      });
      const cols=['Customer','Order Count','Units','Revenue ($)','First Order','Last Order'];
      const data=Object.values(map).sort((a,b)=>b['Revenue ($)']-a['Revenue ($)']).map(r=>({...r,'Order Count':r.Orders.size}));
      return{cols,data};
    }

    case 'sales_by_dealer':{
      const dealerNames=new Set(S.dealers.map(d=>d.name));
      const rows=fd(S.sales.filter(s=>s.customer_name&&dealerNames.has(s.customer_name)),'sale_date');
      const cols=['Dealer','Order #','Date','SKU','Qty','Status'];
      const data=rows.map(s=>({'Dealer':s.customer_name||'','Order #':s.order_number||'','Date':(s.sale_date||'').slice(0,10),'SKU':s.pn,'Qty':s.qty||1,'Status':s.fulfillment_status||'Open'}));
      return{cols,data};
    }

    case 'sales_open':{
      const rows=S.sales.filter(s=>!s.fulfillment_status||s.fulfillment_status==='Open'||s.fulfillment_status==='Packed');
      const cols=['Order #','Date','Customer','SKU','Qty','Status','Days Open'];
      const data=rows.map(s=>{
        const open=s.sale_date?Math.floor((Date.now()-new Date(s.sale_date))/(86400000)):null;
        return{'Order #':s.order_number||'','Date':(s.sale_date||'').slice(0,10),'Customer':s.customer_name||'','SKU':s.pn,'Qty':s.qty||1,'Status':s.fulfillment_status||'Open','Days Open':open};
      }).sort((a,b)=>(b['Days Open']||0)-(a['Days Open']||0));
      return{cols,data};
    }

    case 'sales_on_hold':{
      const rows=S.sales.filter(s=>s.fulfillment_status==='On Hold');
      const cols=['Order #','Date','Customer','SKU','Qty'];
      const data=rows.map(s=>({'Order #':s.order_number||'','Date':(s.sale_date||'').slice(0,10),'Customer':s.customer_name||'','SKU':s.pn,'Qty':s.qty||1}));
      return{cols,data};
    }

    case 'inv_snapshot':{
      const cols=['Part #','Description','Category','Vendor','On Hand','Unit Cost ($)','Total Value ($)','Location','Min','Max','Safety','Lead Time (wks)'];
      const data=S.parts.filter(p=>!p.discontinued).map(p=>({'Part #':p.pn,'Description':p.description||'','Category':p.category||'','Vendor':p.vendor||'','On Hand':p.total_unpckgd||0,'Unit Cost ($)':p.unit_cost||0,'Total Value ($)':(p.total_unpckgd||0)*(p.unit_cost||0),'Location':p.location||'','Min':p.min_qty||0,'Max':p.max_qty||0,'Safety':p.safety_stock||0,'Lead Time (wks)':p.lead_time_weeks||0})).sort((a,b)=>a['Part #'].localeCompare(b['Part #']));
      return{cols,data};
    }

    case 'inv_valuation':{
      const cols=['Part #','Description','Vendor','On Hand','Unit Cost ($)','Total Value ($)'];
      const data=S.parts.filter(p=>!p.discontinued&&(p.total_unpckgd||0)>0).map(p=>({'Part #':p.pn,'Description':p.description||'','Vendor':p.vendor||'','On Hand':p.total_unpckgd||0,'Unit Cost ($)':+(p.unit_cost||0).toFixed(4),'Total Value ($)':+((p.total_unpckgd||0)*(p.unit_cost||0)).toFixed(2)})).sort((a,b)=>b['Total Value ($)']-a['Total Value ($)']);
      const total=data.reduce((s,r)=>s+r['Total Value ($)'],0);
      data.push({'Part #':'— TOTAL —','Description':'','Vendor':'','On Hand':'','Unit Cost ($)':'','Total Value ($)':+total.toFixed(2)});
      return{cols,data};
    }

    case 'inv_reorder':{
      const cols=['Part #','Description','Vendor','On Hand','Reorder Point','Shortage','Suggested Order','Unit Cost ($)'];
      const data=S.parts.filter(p=>!p.discontinued).filter(p=>(p.total_unpckgd||0)<=calcReorderPoint(p)).map(p=>{
        const rp=calcReorderPoint(p);const oh=p.total_unpckgd||0;const sq=calcSuggestedQty(p);
        return{'Part #':p.pn,'Description':p.description||'','Vendor':p.vendor||'','On Hand':oh,'Reorder Point':rp,'Shortage':Math.max(0,rp-oh),'Suggested Order':sq,'Unit Cost ($)':+(p.unit_cost||0).toFixed(4)};
      }).sort((a,b)=>a['On Hand']-b['On Hand']);
      return{cols,data};
    }

    case 'inv_overstock':{
      const cols=['Part #','Description','Vendor','On Hand','Max Qty','Excess','Value Excess ($)'];
      const data=S.parts.filter(p=>!p.discontinued&&p.max_qty>0&&(p.total_unpckgd||0)>p.max_qty).map(p=>{
        const excess=(p.total_unpckgd||0)-p.max_qty;
        return{'Part #':p.pn,'Description':p.description||'','Vendor':p.vendor||'','On Hand':p.total_unpckgd||0,'Max Qty':p.max_qty,'Excess':excess,'Value Excess ($)':+(excess*(p.unit_cost||0)).toFixed(2)};
      }).sort((a,b)=>b['Value Excess ($)']-a['Value Excess ($)']);
      return{cols,data};
    }

    case 'inv_movements':{
      const rows=fd(S.corrections,'created_at');
      const cols=['Date','Part #','Source','Adjustment','Previous Qty','New Qty','Reason'];
      const data=rows.map(c=>({'Date':new Date(c.created_at).toLocaleString(),'Part #':c.pn,'Source':c.source||'manual','Adjustment':c.adjustment,'Previous Qty':c.previous_qty,'New Qty':c.new_qty,'Reason':c.reason||''}));
      return{cols,data};
    }

    case 'inv_receipts':{
      const rows=fd(S.corrections.filter(c=>c.source==='po_receipt'),'created_at');
      const cols=['Date','Part #','Qty Received','New Stock Level','PO Reference','Notes'];
      const data=rows.map(c=>{
        const poMatch=c.reason&&c.reason.match(/\[(.+?)\]/);
        return{'Date':new Date(c.created_at).toLocaleDateString(),'Part #':c.pn,'Qty Received':c.adjustment,'New Stock Level':c.new_qty,'PO Reference':poMatch?poMatch[1]:'','Notes':(c.reason||'').replace(/\[.+?\]/,'').trim()};
      });
      return{cols,data};
    }

    case 'inv_velocity':{
      const cols=['Part #','Description','Vendor','On Hand','Avg/Wk (4w)','Avg/Wk (12w)','Weeks of Stock','Unit Cost ($)'];
      const data=S.parts.filter(p=>!p.discontinued).map(p=>{
        const w=wks(p);return{'Part #':p.pn,'Description':p.description||'','Vendor':p.vendor||'','On Hand':p.total_unpckgd||0,'Avg/Wk (4w)':+avgWk4(p).toFixed(3),'Avg/Wk (12w)':+avgWk(p).toFixed(3),'Weeks of Stock':w,'Unit Cost ($)':+(p.unit_cost||0).toFixed(4)};
      }).sort((a,b)=>(b['Avg/Wk (12w)']||0)-(a['Avg/Wk (12w)']||0));
      return{cols,data};
    }

    case 'assemblies_stock':{
      const cols=['Assembly','Description','Type','On Hand','Sold 30d','Sold 90d','MSRP ($)','BOM Cost ($)'];
      const data=S.assemblies.filter(a=>!a.discontinued).map(a=>{
        const s30=S.sales.filter(s=>s.pn===a.pn&&s.sale_date>=daysAgo(30)).reduce((t,s)=>t+(s.qty||1),0);
        const s90=S.sales.filter(s=>s.pn===a.pn&&s.sale_date>=daysAgo(90)).reduce((t,s)=>t+(s.qty||1),0);
        return{'Assembly':a.pn,'Description':a.description||'','Type':a.is_subassembly?'Subassembly':'Finished Good','On Hand':a.total_on_hand||0,'Sold 30d':s30,'Sold 90d':s90,'MSRP ($)':a.msrp||0,'BOM Cost ($)':+bomCostOf(a.pn,0).toFixed(2)};
      }).sort((a,b)=>a.Assembly.localeCompare(b.Assembly));

    case 'po_all':{

      });
      return{cols,data};
    }

    case 'po_by_vendor':{
      const rows=fd(S.purchases,'order_date');
      const map={};
      rows.forEach(p=>{
        if(!map[p.vendor])map[p.vendor]={Vendor:p.vendor,'Total POs':0,'Open POs':0,'Total Spend ($)':0,'Received ($)':0};

        if(p.status==='Received'){const lines=S.poLines[p.id]||[];map[p.vendor]['Received ($)']+=lines.reduce((s,l)=>s+(l.qty_received||0)*(l.unit_cost||0),0);}
      });

      const data=Object.values(map).sort((a,b)=>b['Total Spend ($)']-a['Total Spend ($)']).map(r=>({...r,'Total Spend ($)':+r['Total Spend ($)'].toFixed(2),'Received ($)':+r['Received ($)'].toFixed(2)}));

    case 'po_lines':{

    case 'bom_cost_rollup':{

      const data=S.assemblies.filter(a=>!a.discontinued&&S.boms[a.pn]?.length).map(a=>{

      }).sort((a,b)=>b['Gross Margin %']-a['Gross Margin %']);

    case 'cycle_counts':{

      });

    }

    case 'corrections_log':{
      const rows=fd(S.corrections,'created_at');
      const cols=['Date','Part #','Source','Adjustment','Previous Qty','New Qty','Reason'];
      const data=rows.map(c=>({'Date':new Date(c.created_at).toLocaleString(),'Part #':c.pn,'Source':c.source||'manual','Adjustment':c.adjustment,'Previous Qty':c.previous_qty,'New Qty':c.new_qty,'Reason':c.reason||''}));

      return{cols,data};
    }

    default:return{cols:[],data:[]};
  }
}

function runExport(fmt, reportId, preset, customFrom, customTo){
  const def=REPORT_DEFS.find(d=>d.id===reportId);
  if(!def)return;
  const{cols,data}=buildReportRows(reportId,preset,customFrom,customTo);
  if(!data.length){toast('No data to export');return;}
  const filename=def.label.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'_'+new Date().toISOString().slice(0,10);
  if(fmt==='csv'){
    const esc=v=>{const s=String(v===null||v===undefined?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
    const lines=[cols.map(esc).join(','),...data.map(row=>cols.map(c=>esc(row[c]??'')).join(','))];
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename+'.csv';a.click();
    toast('✅ Downloaded '+filename+'.csv ('+data.length.toLocaleString()+' rows)');
    return;
  }
  // Excel via SheetJS (loaded on demand)
  function doXlsx(XLSX){
    const wsData=[cols,...data.map(row=>cols.map(c=>row[c]??''))];
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    // Column widths
    ws['!cols']=cols.map(c=>({wch:Math.max(c.length,12,Math.min(40,...data.slice(0,20).map(r=>String(r[c]??'').length)))}));
    // Style header row bold
    cols.forEach((_,ci)=>{const cell=XLSX.utils.encode_cell({r:0,c:ci});if(ws[cell]){ws[cell].s={font:{bold:true},fill:{fgColor:{rgb:'1F3864'}}};}});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,def.label.slice(0,31));
    // Add a metadata sheet
    const meta=[['Report','Date Generated','Date Range','Total Rows'],[def.label,new Date().toLocaleString(),preset==='all'?'All Time':preset==='custom'?customFrom+' to '+(customTo||'today'):preset,data.length]];
    const wsMeta=XLSX.utils.aoa_to_sheet(meta);
    XLSX.utils.book_append_sheet(wb,wsMeta,'Info');
    XLSX.writeFile(wb,filename+'.xlsx');
    toast('✅ Downloaded '+filename+'.xlsx ('+data.length.toLocaleString()+' rows)');
  }
  if(window.XLSX){doXlsx(window.XLSX);return;}
  toast('Loading Excel library…');
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=()=>doXlsx(window.XLSX);
  s.onerror=()=>toast('Failed to load Excel library — try CSV instead');
  document.head.appendChild(s);
}

function buildActivityFeed(limit){
  const events=[];
  // 1. Live activity events (realtime-pushed, most recent first)
  S.liveActivity.forEach(e=>events.push(e));

  // 2. Recent inv_corrections (receipts, packs, counts, manual adjustments)
  S.corrections.slice(0,40).forEach(c=>{
    const src=c.source||'manual';
    const icon={po_receipt:'📦',pack:'🔧',unpack:'↩',cycle_count:'📋',shipment:'🚚',manual:'✎'}[src]||'✎';
    const cls=c.adjustment>0?'var(--green)':'var(--red)';
    const label={po_receipt:'PO Receipt',pack:'Packed',unpack:'Unpacked',cycle_count:'Cycle Count',shipment:'Shipped',manual:'Adjustment'}[src]||src;
    events.push({ts:c.created_at,icon,type:'stock_movement',
      text:c.pn+' '+(c.adjustment>0?'+':'')+c.adjustment+' ('+fn(c.new_qty)+' on hand)',
      sub:c.reason||(label+' · '+src),cls,isNew:false});
  });

  // 3. Recent sales orders (new orders + shipped)
  const recentSales=[...S.sales].sort((a,b)=>new Date(b.sale_date||0)-new Date(a.sale_date||0)).slice(0,20);
  recentSales.forEach(s=>{
    const fs=s.fulfillment_status||'Open';
    if(fs==='Shipped'||fs==='Delivered'){
      events.push({ts:s.sale_date,icon:fs==='Delivered'?'✅':'📦',type:'order_status',
        text:'#'+(s.order_number||'')+' '+fs,
        sub:s.pn+(s.qty>1?' ×'+s.qty:'')+(s.customer_name?' — '+s.customer_name:''),
        cls:fs==='Delivered'?'var(--green)':'var(--teal)'});
    } else if(fs==='Open'||!fs){
      events.push({ts:s.sale_date,icon:'🛒',type:'order',
        text:'Order #'+(s.order_number||''),
        sub:s.pn+(s.qty>1?' ×'+s.qty:'')+(s.customer_name?' — '+s.customer_name:''),
        cls:'var(--teal)'});
    }
  });

  // 4. Recent PO events
  S.purchases.slice(0,15).forEach(p=>{
    const icon={Received:'✅','In Transit':'🚢',Ordered:'📋',Draft:'📝','On Order':'📦'}[p.status]||'📄';
    const cls={Received:'var(--teal)','In Transit':'var(--yellow)',Ordered:'var(--orange)'}[p.status]||'var(--text3)';
    events.push({ts:p.order_date||p.updated_at,icon,type:'po',
      text:'PO — '+p.vendor+(p.status?' · '+p.status:''),
      sub:p.description||p.pn,cls});
  });

  // Dedupe by ts+text, sort by time, return top N
  const seen=new Set();
  const deduped=events.filter(e=>{
    const k=(e.ts||'')+'|'+(e.text||'');
    if(seen.has(k))return false;seen.add(k);return true;
  });
  deduped.sort((a,b)=>new Date(b.ts||0)-new Date(a.ts||0));
  return deduped.slice(0,limit||12);
}

// UNIVERSAL TABLE SORTING — click any column header
// ============================================================
function parseCellVal(td){
  const t=(td.textContent||'').trim();
  if(t==='—'||t==='-'||t==='')return{n:null,s:''};
  const num=parseFloat(t.replace(/[$,%]/g,'').replace(/,/g,'').replace(/w$/,'').replace(/\/wk$/,''));
  return isNaN(num)?{n:null,s:t.toLowerCase()}:{n:num,s:t.toLowerCase()};
}
document.addEventListener('click',function(e){
  const th=e.target.closest('thead th');
  if(!th)return;
  if(e.target.closest('button,input,select,a'))return;
  const table=th.closest('table');const tbody=table&&table.querySelector('tbody');
  if(!tbody||tbody.rows.length<2)return;
  const idx=Array.from(th.parentNode.children).indexOf(th);
  const dir=th.dataset.sortDir==='asc'?'desc':'asc';
  table.querySelectorAll('thead th').forEach(h=>{h.dataset.sortDir='';h.classList.remove('sorted-asc','sorted-desc');});
  th.dataset.sortDir=dir;th.classList.add(dir==='asc'?'sorted-asc':'sorted-desc');
  const rows=Array.from(tbody.rows);
  rows.sort((a,b)=>{
    const av=parseCellVal(a.cells[idx]||{textContent:''}),bv=parseCellVal(b.cells[idx]||{textContent:''});
    let r;
    if(av.n!==null&&bv.n!==null)r=av.n-bv.n;
    else if(av.n!==null)r=-1;else if(bv.n!==null)r=1;
    else r=av.s<bv.s?-1:av.s>bv.s?1:0;
    return dir==='asc'?r:-r;
  });
  rows.forEach(r=>tbody.appendChild(r));
});

function tierPrices(a){
  // For subassemblies/hardware packs with no MSRP, use BOM cost * 1.5 (50% markup default)
  const bomEstimate = (!a.msrp && a.is_subassembly) ? bomCostOf(a.pn,0)*1.5 : 0;
  const msrp = a.msrp || bomEstimate;
  const isBomEstimate = !a.msrp && bomEstimate > 0;
  const t1=a.discount_t1??0.10, t2=a.discount_t2??0.20, t3=a.discount_t3??0.25;
  return [[(isBomEstimate?'MSRP (BOM×1.5 est.)':'MSRP'),msrp],
    ['Tier 1 ('+Math.round(t1*100)+'%)',msrp*(1-t1)],
    ['Tier 2 ('+Math.round(t2*100)+'%)',msrp*(1-t2)],
    ['Tier 3 ('+Math.round(t3*100)+'%)',msrp*(1-t3)]];
}

// ============================================================
// MIN/MAX SUGGESTION ENGINE — statistical + AI
// ============================================================
function weeklySeries(pn, weeks){
  const buckets=new Array(weeks).fill(0);
  const now=new Date();
  S.sales.forEach(s=>{
    if(s.pn!==pn||!s.sale_date)return;
    const d=new Date(s.sale_date);
    const wk=Math.floor((now-d)/(7*24*3600*1000));
    if(wk>=0&&wk<weeks)buckets[wk]+=(s.qty||1);
  });
  return buckets;
}

function statSuggest(p){
  const weeks=26;
  const series=weeklySeries(p.pn,weeks);
  // Primary demand: use live engine avgWk (handles BOM explosions + imported avg_sales_wk fallback)
  const liveAvg=avgWk(p);
  const seriesAvg=series.reduce((a,b)=>a+b,0)/weeks;
  // Prefer live engine; if zero (no recent sales, no spreadsheet data), try series directly
  const avg=liveAvg>0?liveAvg:(seriesAvg>0?seriesAvg:0);
  // SD from series (variance around the live avg for accurate safety stock)
  const sd=avg>0?Math.sqrt(series.reduce((a,b)=>a+(b-avg)*(b-avg),0)/weeks):0;
  const L=Math.max(1,p.lead_time_weeks||2);
  const safety=avg>0?Math.ceil(1.65*sd*Math.sqrt(L)):0;  // ~95% service level
  const min=avg>0?Math.ceil(avg*L+safety):(p.min_qty||0);// reorder point
  const max=avg>0?Math.ceil(min+avg*(S.forecastWeeks||8)):(p.max_qty||0); // cover next cycle
  return{min,max,safety,avg:+avg.toFixed(3),sd:+sd.toFixed(3)};
}

async function aiSuggestMinMax(singlePn){
  // Include parts with ANY demand signal: live sales, spreadsheet avg, or series data
  const tracked=singlePn
    ? S.parts.filter(p=>p.pn===singlePn)
    : S.parts.filter(p=>!p.discontinued&&(avgWk(p)>0||(p.avg_sales_wk||0)>0||weeklySeries(p.pn,26).some(x=>x>0)));
  if(!tracked.length){toast('No items with demand history to analyze');return;}

  // Statistical baseline for every item (always available)
  const base=tracked.map(p=>{
    const st=statSuggest(p);
    const importedAvg=p.avg_sales_wk||0;
    // If both live and imported are 0, still include for AI with context
    const effectiveAvg=st.avg>0?st.avg:importedAvg;
    return{pn:p.pn,desc:p.description||'',curMin:p.min_qty||0,curMax:p.max_qty||0,curSafety:p.safety_stock||0,
      lead:p.lead_time_weeks||2,onHand:p.total_unpckgd||0,moq:p.moq||0,importedAvg,...st,
      avg:effectiveAvg>0?+effectiveAvg.toFixed(3):st.avg,
      note:st.avg>0?('Live: '+st.avg+'/wk avg, σ'+st.sd+', '+(p.lead_time_weeks||2)+'w lead'):importedAvg>0?('Spreadsheet avg: '+importedAvg+'/wk'):'No sales data'};
  });

  const apiKey=S.settings.anthropic_api_key||'';
  if(!apiKey){
    S.mmSuggest=base;
    toast('No API key set — using statistical suggestions (95% service level). Set a key in AI Assistant for AI-refined values.');
    render();return;
  }

  toast('Asking Claude to analyze '+tracked.length+' items…');
  S.mmLoading=true;render();
  const results=[];
  const chunkSize=40;
  try{
    for(let i=0;i<base.length;i+=chunkSize){
      const chunk=base.slice(i,i+chunkSize);
      const lines=chunk.map(b=>b.pn+(b.desc?' ('+b.desc.slice(0,30)+')':'')+' | avg/wk:'+b.avg+' | stdev:'+b.sd+' | lead:'+b.lead+'w | moq:'+b.moq+' | onhand:'+b.onHand+' | curMin:'+b.curMin+' | curMax:'+b.curMax+' | statMin:'+b.min+' | statMax:'+b.max).join('\n');
      const prompt='You are an inventory planning expert for a motorsport parts manufacturer. For each part below, recommend min_qty (reorder point) and max_qty (order-up-to level) and safety_stock. The statistical baseline (95% service) is given as statMin/statMax; adjust with judgment: round to sensible order quantities (respect MOQ), raise mins for volatile items (high stdev vs avg), keep slow movers lean, raise if curMin/curMax was already higher (may reflect business rules). Respond with ONLY a JSON array, no markdown: [{"pn":"...","min":N,"max":N,"safety":N,"note":"max 8 words"}]\n\nPARTS:\n'+lines;
      let data=null;
      for(let attempt=0;attempt<3;attempt++){
        const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:prompt}]})});
        data=await res.json();
        if(data.error&&data.error.type==='overloaded_error'&&attempt<2){await new Promise(r=>setTimeout(r,(attempt+1)*2000));continue;}
        break;
      }
      if(data&&!data.error){
        const txt=(data.content&&data.content[0]&&data.content[0].text)||'[]';
        const clean=txt.replace(/```json|```/g,'').trim();
        try{
          const arr=JSON.parse(clean);
          arr.forEach(a=>{
            const b=chunk.find(x=>x.pn===a.pn);
            if(b)results.push({...b,min:Math.max(0,Math.round(a.min)),max:Math.max(0,Math.round(a.max)),safety:Math.max(0,Math.round(a.safety||b.safety)),note:a.note||b.note,ai:true});
          });
        }catch(e){chunk.forEach(b=>results.push(b));}
      }else{
        chunk.forEach(b=>results.push(b));
      }
      if(base.length>chunkSize)toast('Analyzed '+Math.min(i+chunkSize,base.length)+' / '+base.length+'…');
    }
  }catch(e){
    base.forEach(b=>{if(!results.find(r=>r.pn===b.pn))results.push(b);});
    toast('AI partially unavailable — statistical values used where needed');
  }
  S.mmSuggest=results;
  S.mmLoading=false;
  toast(results.length+' suggestions ready — review below');
  render();
}

async function applyMMSuggestions(onlyPn){
  const toApply=(S.mmSuggest||[]).filter(s=>!onlyPn||s.pn===onlyPn);
  if(!toApply.length)return;
  if(!onlyPn&&!confirm('Apply min/max/safety to '+toApply.length+' parts?'))return;
  let applied=0;
  for(const s of toApply){
    const part=S.parts.find(p=>p.pn===s.pn);
    if(!part)continue;
    const prev={...part};
    const payload={min_qty:s.min,max_qty:s.max,safety_stock:s.safety,updated_at:new Date().toISOString()};
    const{error}=await db.from('parts').update(payload).eq('id',part.id);
    if(!error){
      S.parts=S.parts.map(p=>p.pn===s.pn?{...p,...payload}:p);
      pushUndo('update','parts',{...part,...payload},prev,'AI min/max: '+s.pn);
      applied++;
    }
  }
  S.mmSuggest=(S.mmSuggest||[]).filter(s=>onlyPn?s.pn!==onlyPn:false);
  if(!S.mmSuggest.length)S.mmSuggest=null;
  toast(applied+' part'+(applied!==1?'s':'')+' updated');
  render();
}

function nextBreakHint(p, qty){
  const breaks=(Array.isArray(p.price_breaks)?p.price_breaks:[]).filter(b=>b&&b.qty&&b.price>0).sort((a,b)=>a.qty-b.qty);
  const nxt=breaks.find(b=>b.qty>qty);
  if(!nxt)return '';
  const cur=costForQty(p,qty);
  if(nxt.price>=cur)return '';
  return '+'+(nxt.qty-qty)+' more → '+fc(nxt.price,4)+'/ea';
}

function addToCart(pn, qty){
  qty=Math.max(1,parseInt(qty)||1);
  const ex=S.poCart.find(c=>c.pn===pn);
  if(ex)ex.qty+=qty; else S.poCart.push({pn,qty});
  toast(qty+'× '+pn+' added to PO cart');
  render();
}
function setCartQty(pn, qty){
  qty=parseInt(qty)||0;
  if(qty<=0){S.poCart=S.poCart.filter(c=>c.pn!==pn);}
  else{const ex=S.poCart.find(c=>c.pn===pn);if(ex)ex.qty=qty;}
  render();
}
function addAllReorder(vendorFilter){
  let added=0;
  S.parts.forEach(p=>{
    if(p.discontinued)return;
    if(vendorFilter&&(p.vendor||'')!==vendorFilter)return;
    const rp=calcReorderPoint(p);
    if((p.total_unpckgd||0)>rp)return;
    const sq=calcSuggestedQty(p);const moq=p.moq||0;
    if(moq>0&&sq<moq)return;
    const oq=Math.max(sq,moq);
    if(oq<=0)return;
    if(!S.poCart.find(c=>c.pn===p.pn)){S.poCart.push({pn:p.pn,qty:oq});added++;}
  });
  toast(added?added+' parts added to cart':'Nothing new to add');
  render();
}

async function submitPOCart(){
  if(!S.poCart.length)return;
  const pm={};S.parts.forEach(p=>pm[p.pn]=p);
  const groups={};
  S.poCart.forEach(c=>{
    const v=(pm[c.pn]?.vendor)||'TBD';
    (groups[v]=groups[v]||[]).push(c);
  });
  const vendors=Object.keys(groups);

// ============================================================
// INVENTORY PLANNING
// ============================================================
function calcForecast(pn) {
  const weeks = S.forecastWeeks;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeks*7);
  const cutStr = cutoff.toISOString().slice(0,10);
  const count = S.sales.filter(s=>s.pn===pn && s.sale_date>=cutStr).reduce((a,s)=>a+(s.qty||1),0);
  return count/weeks; // weekly demand
}

// ── BOM category color-coding: Supplies / Hardware / Hardware Pack / Subassembly ──
const HW_CATS=['Bolts/Washers/Nuts','Orings','Fittings','Heims & Sphericals','Suspension Hardware','Hardware'];
const SUPPLY_CATS=['Shipping','Bulk Pieces'];
function bomCostOf(pn, depth){
  // True rolled-up cost of an assembly from its BOM (recursive through subassemblies)
  if((depth||0)>6)return 0;
  const items=S.boms[pn]||[];
  let t=0;
  for(const i of items){
    if(i.item_type==='assembly'){t+=bomCostOf(i.child_pn,(depth||0)+1)*(i.qty||1);}
    else{const p=S.parts.find(x=>x.pn===i.child_pn);t+=(p?costForQty(p,i.qty||1):0)*(i.qty||1);}
  }
  return t;
}
function lineCost(item){
  if(item.item_type==='assembly')return bomCostOf(item.child_pn,0)*(item.qty||1);
  const p=S.parts.find(x=>x.pn===item.child_pn);
  return (p?(p.unit_cost||0):0)*(item.qty||1);
}

// Hardware Pack check: TGK-P + digits (TGK-P01…TGK-P100). TGK-PCV etc. are NOT packs.
function isHWPack(pn){ return /^TGK-P\d/i.test(pn||''); }

function bomBucket(childPn,itemType){
  const pnU=(childPn||'').toUpperCase();
  if(isHWPack(childPn))return{label:'HARDWARE PACK',cls:'bomtag-hwp'};
  // Subassemblies: numeric XX-XXXX pattern only (01-0001, 05-0002)
  if(/^\d{2}-\d{4}/.test(pnU))return{label:'SUBASSEMBLY',cls:'bomtag-sub'};
  // Non-subassembly assembly component = finished good
  if(itemType==='assembly'){
    const a=S.assemblies.find(x=>x.pn===childPn);
    if(a&&a.is_subassembly)return{label:'SUBASSEMBLY',cls:'bomtag-sub'};
    return{label:'FINISHED GOOD',cls:'bomtag-comp'};
  }
  const p=S.parts.find(x=>x.pn===childPn);
  const cat=p?.category||'';
  const txt=((p?.description||'')+' '+childPn).toLowerCase();
  if(txt.includes('hardware pack')||txt.includes('hdwr pack'))return{label:'HARDWARE PACK',cls:'bomtag-hwp'};
  if(HW_CATS.includes(cat))return{label:'HARDWARE',cls:'bomtag-hw'};
  if(SUPPLY_CATS.includes(cat))return{label:'SUPPLIES',cls:'bomtag-sup'};
  return{label:cat?cat.toUpperCase().slice(0,16):'COMPONENT',cls:'bomtag-comp'};
}
function bomTag(childPn,itemType){
  const b=bomBucket(childPn,itemType);
  return '<span class="bomtag '+b.cls+'">'+b.label+'</span>';
}

function costForQty(p, qty){
  const breaks=Array.isArray(p.price_breaks)?p.price_breaks:[];
  let cost=p.unit_cost||0, best=0;
  for(const b of breaks){
    if(b&&b.qty&&qty>=b.qty&&b.qty>=best&&b.price>0){best=b.qty;cost=b.price;}
  }
  return cost;
}

function calcReorderPoint(p) {
  const wkDemand = avgWk(p) || calcForecast(p.pn);
  const lt = p.lead_time_weeks || 1;
  const safety = p.safety_stock || 0;
  return Math.ceil(wkDemand * lt + safety);
}

function calcSuggestedQty(p) {
  const max = p.max_qty || 0;
  const curr = p.total_unpckgd || 0;
  if(max > 0) return Math.max(0, Math.ceil(max - curr));
  const wkDemand = avgWk(p) || calcForecast(p.pn);
  return Math.ceil(wkDemand * S.forecastWeeks);
}

async function savePlanField(id, field, value, pn) {
  const prev = S.parts.find(p=>p.id===id);
  if(typeof value==='number'&&isNaN(value))value=0;
  const {error} = await db.from('parts').update({[field]:value, updated_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.parts = S.parts.map(p=>p.id===id?{...p,[field]:value}:p);
  if(prev) pushUndo('update','parts',{...prev,[field]:value},prev,'Edit '+field+' for '+pn);
}

async function quickAdjustStock(partId,pn,delta){
  const part=S.parts.find(p=>p.id===partId);if(!part)return;
  const prev=part.total_unpckgd||0;const newQty=prev+delta;
  const{error}=await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',partId);
  if(error){toast('Error: '+error.message);return;}
  await db.from('inv_corrections').insert({pn,previous_qty:prev,new_qty:newQty,adjustment:delta,reason:'Quick adjust (±1)',source:'quick_adjust'});
  S.parts=S.parts.map(p=>p.id===partId?{...p,total_unpckgd:newQty}:p);
  pushUndo('update','parts',{...part,total_unpckgd:newQty},part,(delta>0?'+':'')+delta+'× '+pn);
  render();
}

async function createPOFromSuggestion(pn, vendor, qty, cost, desc) {
  // MOQ check — warn if qty is below the part's minimum order quantity
  const part=S.parts.find(function(p){return p.pn===pn;});
  const moq=part?.moq||0;
  if(moq>0&&qty<moq){
    const proceed=confirm('⚠ MOQ Warning\n\nPart '+pn+' has a minimum order quantity of '+moq+'.\nYou\'re about to order '+qty+' unit'+(qty!==1?'s':'')+'.\n\nOrder '+moq+' instead (recommended), or continue with '+qty+'?');
    if(proceed===false)return; // user cancelled
    // If they pressed OK, ask which qty to use
    const bump=confirm('OK = order '+moq+' (MOQ)\nCancel = keep '+qty);
    if(bump)qty=moq;
  }
  const{data,error}=await db.from('purchases').insert({
    vendor:vendor||'TBD', pn, description:desc, qty, unit_cost:cost,
    status:'Draft', order_date:new Date().toISOString().slice(0,10),
    updated_at:new Date().toISOString()
  }).select().single();
  if(error){toast('Error: '+error.message);return;}
  // Add PO line and cache locally
  const{data:lineData}=await db.from('po_lines').insert({po_id:data.id,pn,description:desc,qty_ordered:qty,unit_cost:cost,qty_received:0,status:'Pending'}).select().single();
  S.poLines[data.id]=lineData?[lineData]:[{po_id:data.id,pn,description:desc,qty_ordered:qty,unit_cost:cost,qty_received:0,status:'Pending'}];
  S.purchases=[data,...S.purchases];
  toast('PO created for '+pn+(moq>0&&qty>=moq?' ✓ meets MOQ':''));
}

async function deduplicatePOs(){
  // Find POs with same vendor + order_date — keep lowest id, delete rest + their lines
  const groups={};
  S.purchases.forEach(p=>{
    const k=(p.vendor||'')+'|'+(p.order_date||'');
    (groups[k]=groups[k]||[]).push(p);
  });
  const dupes=Object.values(groups).filter(g=>g.length>1);
  if(!dupes.length){toast('No duplicate POs found ✓');return;}
  const count=dupes.reduce((t,g)=>t+g.length-1,0);
  if(!confirm('Found '+count+' duplicate PO'+(count>1?'s':'')+' (same vendor + date). Delete them, keeping the oldest?'))return;
  let deleted=0;
  for(const group of dupes){
    group.sort((a,b)=>a.id.localeCompare(b.id)); // keep first (oldest)
    for(const po of group.slice(1)){
      await db.from('po_lines').delete().eq('po_id',po.id);
      await db.from('purchases').delete().eq('id',po.id);
      S.purchases=S.purchases.filter(p=>p.id!==po.id);
      deleted++;
    }
  }
  toast(deleted+' duplicate PO'+(deleted>1?'s':'')+' removed');render();
}

async function createVendorPO(vendor){
  const need=S.parts.filter(p=>!p.discontinued&&(p.vendor||'')===vendor&&(p.total_unpckgd||0)<=calcReorderPoint(p)).map(p=>{
    const sq=calcSuggestedQty(p);const moq=p.moq||0;
    return {p,qty:Math.max(sq,moq),skip:(moq>0&&sq<moq)||Math.max(sq,moq)<=0};
  }).filter(x=>!x.skip);
  if(!need.length){toast('Nothing needs ordering from '+vendor);return;}
  if(!confirm('Create ONE PO for '+vendor+' with '+need.length+' line items?'))return;
  const total=need.reduce((t,x)=>t+x.qty*costForQty(x.p,x.qty),0);
  const {data:po,error}=await db.from('purchases').insert({
    vendor,pn:need[0].p.pn+(need.length>1?' +'+(need.length-1)+' more':''),
    description:need.length+'-line PO',qty:need.reduce((t,x)=>t+x.qty,0),
    unit_cost:0,status:'Draft',order_date:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()
  }).select().single();
  if(error){toast('Error: '+error.message);return;}
  const lines=need.map(x=>({po_id:po.id,pn:x.p.pn,description:x.p.description||'',qty_ordered:x.qty,unit_cost:costForQty(x.p,x.qty),qty_received:0,status:'Pending'}));
  await db.from('po_lines').insert(lines);
  S.purchases=[po,...S.purchases];

async function submitQuickReceive(poId){
  const lines=(S.poLines[poId]||[]).filter(l=>(l.qty_received||0)<(l.qty_ordered||0));
  const markTransit=document.getElementById('qr-mark-transit')?.checked;
  let received=0,skipped=0;
  for(const line of lines){
    const chk=document.getElementById('qr-chk-'+line.id);
    if(!chk||!chk.checked){skipped++;continue;}
    const qty=parseFloat(document.getElementById('qr-qty-'+line.id)?.value)||0;
    if(qty<=0){skipped++;continue;}
    await checkInLineQuick(line.id,poId,line.pn,line.qty_ordered,line.qty_received||0,qty);
    received++;
  }
  await loadPOLines(poId);
  const updated=S.poLines[poId]||[];
  const allDone=updated.length>0&&updated.every(l=>(l.qty_received||0)>=(l.qty_ordered||0));
  const po=S.purchases.find(p=>p.id===poId);
  let newStatus=po?.status;
  if(allDone) newStatus='Received';
  else if(markTransit&&(po?.status==='Ordered'||po?.status==='Draft')) newStatus='In Transit';
  if(newStatus&&newStatus!==po?.status){
    await db.from('purchases').update({status:newStatus,updated_at:new Date().toISOString()}).eq('id',poId);
    S.purchases=S.purchases.map(p=>p.id===poId?{...p,status:newStatus}:p);
  }
  document.getElementById('quick-recv-modal')?.remove();
  render();
  toast(`✓ Received ${received} line${received!==1?'s':''}${skipped?' ('+skipped+' skipped)':''}${allDone?' — PO complete!':''}`);
}
