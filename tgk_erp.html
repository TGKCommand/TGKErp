async function checkInLine(lineId, poId, pn, qtyOrdered, qtyAlreadyReceived) {
  const inp = document.getElementById('checkin-'+lineId);
  const noteInp = document.getElementById('checkin-note-'+lineId);
  const qty = parseFloat(inp.value)||0;
  if(qty<=0){toast('Enter a quantity');return;}
  const note = noteInp?noteInp.value.trim():'';
  const newReceived = qtyAlreadyReceived + qty;
  const remaining = Math.max(0, qtyOrdered - newReceived);
  const surplus = Math.max(0, newReceived - qtyOrdered);
  const undoOps=[];
  const lineBefore=(S.poLines[poId]||[]).find(l=>l.id===lineId);
  const poBefore=S.purchases.find(p=>p.id===poId);

  // Receive into stock (whatever arrived — surplus included)
  const part = S.parts.find(p=>p.pn===pn);
  if(part){
    const newQty = (part.total_unpckgd||0) + qty;
    undoOps.push({action:'update',table:'parts',data:{...part,total_unpckgd:newQty},prev:{...part}});
    await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',part.id);
    S.parts = S.parts.map(p=>p.pn===pn?{...p,total_unpckgd:newQty}:p);
    const po=S.purchases.find(p=>p.id===poId);
    const poRef=po?(' ['+po.vendor+(po.order_date?' '+po.order_date:'')+']'):'';
    const reason='PO Receipt'+poRef+(surplus>0?' (+'+surplus+' surplus)':'')+(remaining>0?' ('+remaining+' auto-backordered)':'')+(note?' — '+note:'');
    const {data:corrRow}=await db.from('inv_corrections').insert({pn,previous_qty:part.total_unpckgd||0,new_qty:newQty,adjustment:qty,reason,source:'po_receipt'}).select().single();
    if(corrRow)undoOps.push({action:'insert',table:'inv_corrections',data:corrRow});
    S.corrections = [{pn,previous_qty:part.total_unpckgd||0,new_qty:newQty,adjustment:qty,reason,source:'po_receipt',created_at:new Date().toISOString()},...S.corrections];
  }

  if(remaining>0){
    // SHORT: close this line and auto-create a backorder PO for the remainder
    if(lineBefore)undoOps.push({action:'update',table:'po_lines',data:{id:lineId},prev:{...stripMeta(lineBefore)}});
    await db.from('po_lines').update({qty_received:newReceived,status:'Backordered',notes:remaining+' backordered',updated_at:new Date().toISOString()}).eq('id',lineId);
    const po=S.purchases.find(p=>p.id===poId);
    const line=(S.poLines[poId]||[]).find(l=>l.id===lineId);
    const {data:newPO,error}=await db.from('purchases').insert({
      vendor:po?.vendor||'TBD',pn,description:'BACKORDER — '+(line?.description||pn),
      qty:remaining,unit_cost:line?.unit_cost||0,status:'Ordered',
      order_date:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()
    }).select().single();
    if(!error&&newPO){
      const {data:boLine}=await db.from('po_lines').insert({po_id:newPO.id,pn,description:'BACKORDER — '+(line?.description||''),qty_ordered:remaining,unit_cost:line?.unit_cost||0,qty_received:0,status:'Pending'}).select().single();
      S.purchases=[newPO,...S.purchases];
      if(boLine)undoOps.push({action:'insert',table:'po_lines',data:boLine});
      undoOps.push({action:'insert',table:'purchases',data:newPO});
    }
    toast('Received '+qty+'× '+pn+' — short '+remaining+' → backorder PO created automatically');
  } else {
    // EXACT or SURPLUS: line complete
    if(lineBefore)undoOps.push({action:'update',table:'po_lines',data:{id:lineId},prev:{...stripMeta(lineBefore)}});
    await db.from('po_lines').update({qty_received:newReceived,status:'Complete',updated_at:new Date().toISOString()}).eq('id',lineId);
    toast('Received '+qty+'× '+pn+(surplus>0?' (+'+surplus+' surplus into stock)':'')+' ✓');
  }

  // Refresh + auto-close PO when every line is settled
  await loadPOLines(poId);
  const lines = S.poLines[poId]||[];
  if(lines.every(l=>l.qty_received>=l.qty_ordered||l.status==='Backordered')){
    if(poBefore)undoOps.push({action:'update',table:'purchases',data:{id:poId},prev:{...stripMeta(poBefore)}});
    await db.from('purchases').update({status:'Received',updated_at:new Date().toISOString()}).eq('id',poId);
    S.purchases = S.purchases.map(p=>p.id===poId?{...p,status:'Received'}:p);
  }
  pushUndoMulti('Receive '+qty+'× '+pn+' on PO',undoOps);
  updateBadge();
  render();
}

async function closeShortBackorder(lineId, poId, pn, qtyOrdered, qtyAlreadyReceived){
  const inp=document.getElementById('checkin-'+lineId);
  const recvNow=parseFloat(inp?.value)||0;
  const totalReceived=qtyAlreadyReceived+recvNow;
  const remaining=Math.max(0,qtyOrdered-totalReceived);
  if(remaining<=0){toast('Nothing remaining — use Receive instead');return;}
  if(!confirm('Receive '+recvNow+' now, close this line, and create a backorder PO for the remaining '+remaining+'?'))return;
  // receive what arrived (if any)
  if(recvNow>0){
    const part=S.parts.find(p=>p.pn===pn);
    if(part){
      const newQty=(part.total_unpckgd||0)+recvNow;
      await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',part.id);
      S.parts=S.parts.map(p=>p.pn===pn?{...p,total_unpckgd:newQty}:p);
      await db.from('inv_corrections').insert({pn,previous_qty:part.total_unpckgd||0,new_qty:newQty,adjustment:recvNow,reason:'PO Receipt (closed short, '+remaining+' backordered)',source:'po_receipt'});
    }
  }
  // close the line as backordered
  await db.from('po_lines').update({qty_received:totalReceived,status:'Backordered',notes:remaining+' backordered',updated_at:new Date().toISOString()}).eq('id',lineId);
  // create the backorder PO with the remainder
  const po=S.purchases.find(p=>p.id===poId);
  const line=(S.poLines[poId]||[]).find(l=>l.id===lineId);
  const {data:newPO,error}=await db.from('purchases').insert({
    vendor:po?.vendor||'TBD',pn,description:'BACKORDER — '+(line?.description||pn),
    qty:remaining,unit_cost:line?.unit_cost||0,status:'Ordered',
    order_date:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()
  }).select().single();
  if(!error&&newPO){
    await db.from('po_lines').insert({po_id:newPO.id,pn,description:'BACKORDER — '+(line?.description||''),qty_ordered:remaining,unit_cost:line?.unit_cost||0,qty_received:0,status:'Pending'});
    S.purchases=[newPO,...S.purchases];
  }
  // if all lines settled, mark original PO received
  await loadPOLines(poId);
  const lines=S.poLines[poId]||[];
  if(lines.every(l=>l.qty_received>=l.qty_ordered||l.status==='Backordered')){
    await db.from('purchases').update({status:'Received',updated_at:new Date().toISOString()}).eq('id',poId);
    S.purchases=S.purchases.map(p=>p.id===poId?{...p,status:'Received'}:p);
  }
  updateBadge();
  toast('Line closed — backorder PO created for '+remaining+'× '+pn);
  render();
}

async function receiveAllLines(poId) {
  const lines = S.poLines[poId]||[];
  const pending = lines.filter(l=>l.qty_received<l.qty_ordered);
  if(!pending.length){toast('All lines already received');return;}
  for(const line of pending){
    const remaining = (line.qty_ordered||0)-(line.qty_received||0);
    if(remaining>0) await checkInLineQuick(line.id, poId, line.pn, line.qty_ordered, line.qty_received||0, remaining);
  }
  toast('All lines received');
}

async function unreceiveLine(lineId, poId){
  const line=(S.poLines[poId]||[]).find(l=>l.id===lineId);
  if(!line||!(line.qty_received>0)){toast('Nothing received on this line');return;}
  if(!confirm('Reverse this receipt? '+line.qty_received+'× '+line.pn+' will be REMOVED from stock and the line reset to Pending.'))return;
  const undoOps=[];
  const part=S.parts.find(p=>p.pn===line.pn);
  if(part){
    const newQty=(part.total_unpckgd||0)-line.qty_received;
    undoOps.push({action:'update',table:'parts',data:{...part,total_unpckgd:newQty},prev:{...part}});
    await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',part.id);
    S.parts=S.parts.map(p=>p.pn===line.pn?{...p,total_unpckgd:newQty}:p);
    const {data:corrRow}=await db.from('inv_corrections').insert({pn:line.pn,previous_qty:part.total_unpckgd||0,new_qty:newQty,adjustment:-line.qty_received,reason:'Receipt reversed (received in error)',source:'po_receipt'}).select().single();
    if(corrRow)undoOps.push({action:'insert',table:'inv_corrections',data:corrRow});
  }
  undoOps.push({action:'update',table:'po_lines',data:{id:lineId},prev:{...stripMeta(line)}});
  await db.from('po_lines').update({qty_received:0,status:'Pending',notes:null,updated_at:new Date().toISOString()}).eq('id',lineId);
  const po=S.purchases.find(p=>p.id===poId);
  if(po&&po.status==='Received'){
    undoOps.push({action:'update',table:'purchases',data:{id:poId},prev:{...stripMeta(po)}});
    await db.from('purchases').update({status:'Ordered',updated_at:new Date().toISOString()}).eq('id',poId);
    S.purchases=S.purchases.map(p=>p.id===poId?{...p,status:'Ordered'}:p);
  }
  await loadPOLines(poId);
  pushUndoMulti('Un-receive '+line.qty_received+'× '+line.pn,undoOps);
  if(line.status==='Backordered')toast('Receipt reversed. Note: the auto-created backorder PO still exists — delete it if not needed.');
  else toast('Receipt reversed — '+line.qty_received+'× '+line.pn+' removed from stock, line reset');
  updateBadge();render();
}

function buildability(pn){
  // Components = part children AND subassembly children (uses their on-hand)
  const bom=(S.boms[pn]||[]);
  if(!bom.length)return{maxBuild:Infinity,checks:[],hasBOM:false};
  const pm={};S.parts.forEach(p=>pm[p.pn]=p);
  const am={};S.assemblies.forEach(a=>am[a.pn]=a);
  const checks=bom.map(i=>{
    const isSub=i.item_type==='assembly';
    const src=isSub?am[i.child_pn]:pm[i.child_pn];
    const avail=src?(isSub?(src.total_on_hand||0):(src.total_unpckgd||0)):0;
    return{pn:i.child_pn,desc:src?.description||'',need:i.qty,avail,isSub,
      maxFromThis:i.qty>0?Math.floor(avail/i.qty):Infinity,ok:avail>=i.qty,
      loc:isSub?'SUB-ASSY':(src?.location||'')};
  });
  const maxBuild=checks.length?Math.max(0,Math.min(...checks.map(c=>c.maxFromThis))):0;
  return{maxBuild,checks,hasBOM:true};
}

function openOrderDemand(pn){
  return S.sales.filter(s=>s.pn===pn&&(!s.fulfillment_status||s.fulfillment_status==='Open')).reduce((t,s)=>t+(s.qty||1),0);
}

function renderPackQueue(){
  if(S.activeBuild){const asm=S.assemblies.find(a=>a.pn===S.activeBuild);if(asm)return renderBuildPlanner(asm);}
  if(S.workOrderMode)return renderWorkOrder();

  const cov=S.buildCoverage||4;
  const sf=S.filters.production||{};
  const qSearch=(sf.search||'').toLowerCase();

  const allRows=S.assemblies.filter(a=>!a.discontinued).map(a=>{
    const b=buildability(a.pn);
    const demand=openOrderDemand(a.pn);
    const fcDemand=Math.ceil(asmAvgWk(a)*cov);
    const suggested=Math.max(0,Math.max(demand,fcDemand)-(a.total_on_hand||0));
    const type=isHWPack(a.pn)?'hwp':a.is_subassembly?'sub':'fg';
    let st,stCls;
    if(suggested<=0){st='covered';stCls='pill-teal';}
    else if(!b.hasBOM){st='build';stCls='pill-green';}
    else if(b.maxBuild>=suggested){st='build';stCls='pill-green';}
    else if(b.maxBuild>0){st='partial';stCls='pill-yellow';}
    else{st='blocked';stCls='pill-red';}
    if(demand>0&&suggested>0) st='orders';
    return{...a,b,demand,fcDemand,suggested,st,stCls,type,canCover:(b.maxBuild===Infinity||b.maxBuild>=suggested)};
  }).sort((x,y)=>(y.suggested-x.suggested)||((x.total_on_hand||0)-(y.total_on_hand||0)));

  let rows=allRows;
  if(qSearch) rows=rows.filter(r=>r.pn.toLowerCase().includes(qSearch)||(r.description||'').toLowerCase().includes(qSearch));
  if(sf.status) rows=rows.filter(r=>r.st===sf.status);
  const typeCounts={fg:rows.filter(r=>r.type==='fg').length,sub:rows.filter(r=>r.type==='sub').length,hwp:rows.filter(r=>r.type==='hwp').length};
  if(sf.type) rows=rows.filter(r=>r.type===sf.type);

  const needBuild=allRows.filter(r=>r.suggested>0);
  const blocked=needBuild.filter(r=>r.b.hasBOM&&r.b.maxBuild<1);
  const ready=needBuild.filter(r=>!r.b.hasBOM||r.b.maxBuild>=r.suggested);
  const withOrders=allRows.filter(r=>r.demand>0);

// ─── WORK ORDER MODE ────────────────────────────────────────────────────────
function startWorkOrder(){
  // Pre-populate with all assemblies that have suggested > 0
  S.workOrderBuilds=S.workOrderBuilds||{};
  const cov=S.buildCoverage||4;
  S.assemblies.filter(a=>!a.discontinued).forEach(a=>{
    const demand=openOrderDemand(a.pn);
    const fcDemand=Math.ceil(asmAvgWk(a)*cov);
    const suggested=Math.max(0,Math.max(demand,fcDemand)-(a.total_on_hand||0));
    const b=buildability(a.pn);
    const buildable=b.maxBuild===Infinity?suggested:Math.min(suggested,b.maxBuild);
    if(suggested>0&&buildable>0&&!S.workOrderBuilds[a.pn])S.workOrderBuilds[a.pn]=buildable;
  });
  S.workOrderMode=true;
  render();
}

function consolidateComponents(builds){
  // builds = [{pn, qty}]
  const comps={};
  for(const{pn,qty}of builds){
    const bom=S.boms[pn]||[];
    for(const line of bom){
      const need=line.qty*qty;
      if(!comps[line.child_pn]){
        const part=S.parts.find(p=>p.pn===line.child_pn);
        const sub=S.assemblies.find(a=>a.pn===line.child_pn);
        const item=part||sub;
        comps[line.child_pn]={pn:line.child_pn,desc:item?.description||'',bin:part?.location||'',have:part?(part.total_unpckgd||0):(sub?.total_on_hand||0),need:0,isSub:!!sub};
      }
      comps[line.child_pn].need+=need;
    }
  }
  return Object.values(comps).map(c=>({...c,short:Math.max(0,c.need-c.have)}))
    .sort((a,b)=>b.short-a.short||a.bin.localeCompare(b.bin)||a.pn.localeCompare(b.pn));
}

  const builds=Object.entries(S.workOrderBuilds||{}).map(([pn,qty])=>({pn,qty:parseInt(qty)||1}));
  const components=consolidateComponents(builds);
  const totalShort=components.filter(c=>c.short>0).length;

  return `

      <div style="font-size:14px;font-weight:700;color:var(--text)">📋 Work Order — ${today}</div>
      <div style="font-size:11px;color:var(--text3)">${builds.length} assemblies · ${components.length} unique components${totalShort>0?` · <span style="color:var(--red)">${totalShort} shortages</span>`:' · all components available'}</div>
    </div>
    <button class="btn btn-sm" onclick="woAddAssembly()" title="Add an assembly to this work order">+ Add Assembly</button>

  </div>

  <div class="grid-2">
  <div>
    <div class="panel" style="padding:0">
      <div class="section-header" style="display:flex;align-items:center;justify-content:space-between">
        <span>Assemblies to Build</span>
        <button class="btn btn-sm" style="font-size:10px" onclick="woClearAll()">Clear All</button>
      </div>
      ${builds.length===0?'<div class="section-empty">No assemblies selected — click + Add Assembly</div>':''}
      <table><thead><tr><th>SKU</th><th>Description</th><th>Qty to Build</th><th>Max</th><th></th></tr></thead><tbody>
      ${builds.map(({pn,qty})=>{
        const a=S.assemblies.find(x=>x.pn===pn)||{};

        </tr>`;}).join('')}
      </tbody></table>
    </div>
  </div>
  <div>
    <div class="panel" style="padding:0">

      ${components.map(c=>`<tr style="${c.short>0?'background:rgba(220,38,38,.04)':''}">
        <td class="pn" style="color:${c.isSub?'var(--orange)':'var(--teal)'}">${c.pn}</td>

        <td style="font-size:10px;font-family:var(--mono);color:var(--text3)">${c.bin||'—'}</td>
        <td class="money-neutral" style="font-weight:700">${c.need}</td>
        <td class="money" style="color:${c.have>=c.need?'var(--green)':'var(--red)'};font-weight:700">${c.have}</td>
        <td class="money" style="color:${c.short>0?'var(--red)':'var(--text3)'};font-weight:700">${c.short||'—'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>
  </div>
  </div>`;
}

function woAddAssembly(){
  const pn=prompt('Enter assembly SKU to add to this work order:','');
  if(!pn)return;
  const a=S.assemblies.find(x=>x.pn===pn.trim().toUpperCase());
  if(!a){toast('Assembly not found: '+pn);return;}
  if(!S.workOrderBuilds)S.workOrderBuilds={};
  const b=buildability(a.pn);
  S.workOrderBuilds[a.pn]=b.maxBuild===Infinity?1:Math.max(1,b.maxBuild);
  render();
}

function woClearAll(){
  if(!confirm('Clear all assemblies from this work order?'))return;
  S.workOrderBuilds={};
  render();
}

async function woPackAll(){
  const builds=Object.entries(S.workOrderBuilds||{}).map(([pn,qty])=>({pn,qty:parseInt(qty)||1}));
  if(!builds.length){toast('No assemblies in work order');return;}
  if(!confirm('Pack all '+builds.length+' assemblies?\n\n'+builds.map(b=>b.pn+' × '+b.qty).join('\n')))return;
  for(const{pn,qty}of builds){
    const asm=S.assemblies.find(a=>a.pn===pn);
    if(asm)await packUnits(pn,asm.id,false,qty);
  }
  S.workOrderBuilds={};
  S.workOrderMode=false;
  await refreshSales();
  render();
  toast('✓ Work order complete — all assemblies packed');
}

      const part=S.parts.find(p=>p.pn===line.child_pn);
      const sub=S.assemblies.find(a=>a.pn===line.child_pn);

    </tbody></table></div>`;

  const html=`<!DOCTYPE html><html><head><title>TGK Build Sheet &mdash; ${today}</title>
<style>

h2{font-size:16px;margin:0 0 4px}

@media print{body{margin:8px} button{display:none} .asm-block{page-break-inside:avoid}}
</style></head><body>
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #000">
<div><h2>TGK Motorsport &mdash; Build Sheet</h2><div style="color:#666">${today}</div></div>
<div style="text-align:right;font-size:10px;color:#666">Print time: ${new Date().toLocaleTimeString()}</div>
</div>

<div class="section-title">Assemblies</div>
<table><thead><tr><th class="check">&#10003;</th><th>SKU</th><th>Description</th><th>Qty to Build</th></tr></thead><tbody>
${builds.map(({pn,qty})=>{const a=S.assemblies.find(x=>x.pn===pn)||{};return`<tr><td class="check">&#9744;</td><td><b>${pn}</b></td><td>${escHtml(a.description||'')}</td><td><b>${qty}</b></td></tr>`;}).join('')}

            +'<span style="flex:1"></span>'
            +'<span style="font-size:11px;color:'+(d.covers?'var(--green)':'var(--yellow)')+';font-weight:600">frees '+d.frees+(d.covers?' ✓':' (partial)')+'</span>'
            +'<button class="btn btn-sm" style="margin-left:8px" data-dpn="'+d.pn+'" data-did="'+d.id+'" data-du="'+d.units+'" onclick="unpackPlanned(this.dataset.dpn,this.dataset.did,+this.dataset.du)">↩ Unpack '+d.units+'</button>'
            +'</div>';
        });
      });
      if(!any)out+='<div class="section-empty">No other in-stock products contain the missing parts</div>';
      out+='</div>';
      return out;
    })()}
  </div>
  </div>`;
}

function donorOptions(partPn, shortQty, excludePn){
  // Which in-stock assemblies could be unpacked to free this part?
  const donors=[];
  Object.entries(S.boms).forEach(([parent,items])=>{
    if(parent===excludePn)return;
    const line=items.find(i=>i.item_type==='part'&&i.child_pn===partPn);
    if(!line)return;
    const asm=S.assemblies.find(a=>a.pn===parent&&!a.discontinued);
    if(!asm||(asm.total_on_hand||0)<=0)return;
    const perUnit=line.qty||1;
    const unitsNeeded=Math.ceil(shortQty/perUnit);
    const unitsAvail=asm.total_on_hand||0;
    const units=Math.min(unitsNeeded,unitsAvail);
    const frees=units*perUnit;
    const demand=asmAvgWk(asm);
    donors.push({pn:parent,id:asm.id,desc:asm.description||'',onHand:unitsAvail,perUnit,units,frees,covers:frees>=shortQty,wkDemand:demand});
  });
  // best donors first: covers the shortage, then lowest sales demand (least painful to unpack)
  donors.sort((a,b)=>(b.covers-a.covers)||(a.wkDemand-b.wkDemand));
  return donors.slice(0,4);
}

async function unpackPlanned(pn,asmId,qty){
  const fakeInput=document.createElement('input');fakeInput.id='unpack-qty-'+asmId;fakeInput.value=qty;
  document.body.appendChild(fakeInput);
  await packUnits(pn,asmId,true);
  fakeInput.remove();
}

async function packPlanned(pn,asmId,qty){
  // If we came from a parent build, restore it after packing — otherwise go to production list
  const returnToPn=S.parentBuild;
  const returnQty=S.parentBuildQty;
  S.parentBuild=null;
  S.parentBuildQty=null;
  // Set activeBuild to the parent (or null) so packUnits' render() lands in the right place
  S.activeBuild=returnToPn||null;
  S.buildQty=returnToPn?returnQty:null;
  const fakeInput=document.createElement('input');fakeInput.id='pack-qty-'+asmId;fakeInput.value=qty;
  document.body.appendChild(fakeInput);
  await packUnits(pn,asmId,false);
  fakeInput.remove();
}

async function orderShortages(pn,want){
  const b=buildability(pn);
  const shorts=b.checks.map(c=>({...c,short:Math.max(0,c.need*want-c.avail)})).filter(c=>c.short>0);
  if(!shorts.length){toast('No shortages for this quantity');return;}
  if(!confirm('Create '+shorts.length+' draft PO(s) for missing components?'))return;
  const pm={};S.parts.forEach(p=>pm[p.pn]=p);
  for(const c of shorts){
    const part=pm[c.pn];
    await createPOFromSuggestion(c.pn,part?.vendor||'TBD',c.short,part?.unit_cost||0,part?.description||'');
  }
  toast(shorts.length+' draft POs created for shortages');
}

async function packUnits(pn, asmId, isUnpack) {
  const inpId = isUnpack ? 'unpack-qty-'+asmId : 'pack-qty-'+asmId;
  const inp = document.getElementById(inpId);
  const qty = parseInt(inp?.value)||1;
  if(qty<1){toast('Enter qty >= 1');return;}

  const asm = S.assemblies.find(a=>a.pn===pn);
  if(!asm){toast('Assembly not found');return;}

  const bom = S.boms[pn]||[];
  const partMap={};S.parts.forEach(p=>partMap[p.pn]=p);

  const asmMap={};S.assemblies.forEach(a=>asmMap[a.pn]=a);
  // Check components if packing (parts AND subassemblies)
  if(!isUnpack && bom.length>0) {
    for(const item of bom){
      const isSub=item.item_type==='assembly';
      const src=isSub?asmMap[item.child_pn]:partMap[item.child_pn];
      const avail=src?(isSub?(src.total_on_hand||0):(src.total_unpckgd||0)):0;
      const need=item.qty*qty;
      if(avail<need){
        toast('Not enough '+item.child_pn+(isSub?' (subassembly)':'')+' — need '+need+', have '+avail);
        return;
      }
    }
  }

  // Apply BOM component changes — parts AND subassemblies (tracked for undo)
  const undoOps=[];
  if(bom.length>0){
    for(const item of bom){
      const delta = isUnpack ? item.qty*qty : -(item.qty*qty);
      if(item.item_type==='assembly'){
        const sa=asmMap[item.child_pn];
        if(!sa) continue;
        const newOhS=(sa.total_on_hand||0)+delta;
        undoOps.push({action:'update',table:'assemblies',data:{...sa,total_on_hand:newOhS},prev:{...sa}});
        await db.from('assemblies').update({total_on_hand:newOhS,updated_at:new Date().toISOString()}).eq('id',sa.id);
        S.assemblies=S.assemblies.map(x=>x.pn===item.child_pn?{...x,total_on_hand:newOhS}:x);
        await db.from('inv_corrections').insert({pn:item.child_pn,previous_qty:sa.total_on_hand||0,new_qty:newOhS,adjustment:delta,reason:(isUnpack?'Unpack':'Pack')+' '+qty+'×'+pn+' (subassembly)',source:isUnpack?'unpack':'pack'});
      } else {
        const p=partMap[item.child_pn];
        if(!p) continue;
        const newQty = (p.total_unpckgd||0)+delta;
        undoOps.push({action:'update',table:'parts',data:{...p,total_unpckgd:newQty},prev:{...p}});
        await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',p.id);
        S.parts=S.parts.map(x=>x.pn===item.child_pn?{...x,total_unpckgd:newQty}:x);
        await db.from('inv_corrections').insert({pn:item.child_pn,previous_qty:p.total_unpckgd||0,new_qty:newQty,adjustment:delta,reason:(isUnpack?'Unpack':'Pack')+' '+qty+'×'+pn,source:isUnpack?'unpack':'pack'});
      }
    }
  }

  // Update assembly stock
  const delta2 = isUnpack ? -qty : qty;
  const newOh = (asm.total_on_hand||0)+delta2;
  const newAssembled = (asm.total_assembled||0)+(isUnpack?0:qty);
  undoOps.push({action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm}});
  await db.from('assemblies').update({total_on_hand:newOh,total_assembled:newAssembled,updated_at:new Date().toISOString()}).eq('id',asm.id);
  S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newOh,total_assembled:newAssembled}:a);

  // Log pack
  await db.from('pack_log').insert({pn,qty:isUnpack?-qty:qty,pack_date:new Date().toISOString(),type:isUnpack?'unpack':'pack',notes:qty+'x '+(isUnpack?'unpacked':'packed')});

  pushUndoMulti((isUnpack?'Unpack':'Pack')+' '+qty+'×'+pn+' (incl. components)',undoOps);
  updateBadge();
  toast((isUnpack?'Unpacked':'Packed')+' '+qty+'× '+pn);
  render();
}

async function createCycleCount(cat) {
  // cat: 'all' (all parts) | 'fg' | 'sub' | 'everything' | a part category name
  let items=[];
  const liveParts=S.parts.filter(p=>!p.discontinued);
  const liveAsm=S.assemblies.filter(a=>!a.discontinued);
  if(cat==='all') items=liveParts.map(p=>({pn:p.pn,desc:p.description||'',exp:p.total_unpckgd||0,type:'part'}));
  else if(cat==='fg') items=liveAsm.filter(a=>!a.is_subassembly&&!isHWPack(a.pn)).map(a=>({pn:a.pn,desc:a.description||'',exp:a.total_on_hand||0,type:'assembly'}));
  else if(cat==='sub') items=liveAsm.filter(a=>a.is_subassembly).map(a=>({pn:a.pn,desc:a.description||'',exp:a.total_on_hand||0,type:'assembly'}));
  else if(cat==='hwp') items=liveAsm.filter(a=>isHWPack(a.pn)).map(a=>({pn:a.pn,desc:a.description||'',exp:a.total_on_hand||0,type:'assembly'}));
  else if(cat==='everything') items=[
    ...liveAsm.map(a=>({pn:a.pn,desc:a.description||'',exp:a.total_on_hand||0,type:'assembly'})),
    ...liveParts.map(p=>({pn:p.pn,desc:p.description||'',exp:p.total_unpckgd||0,type:'part'}))
  ];
  else if(cat&&cat.startsWith('bom:')){
    // BOM-based: count the FG + every component in its BOM
    const bomPn=cat.slice(4);
    const fgAsm=S.assemblies.find(a=>a.pn===bomPn);
    if(fgAsm) items.push({pn:bomPn,desc:fgAsm.description||'',exp:fgAsm.total_on_hand||0,type:'assembly',section:'Finished Good'});
    const bomLines=S.boms[bomPn]||[];
    bomLines.forEach(line=>{
      if(line.item_type==='assembly'){
        const sa=S.assemblies.find(a=>a.pn===line.child_pn);
        if(sa) items.push({pn:line.child_pn,desc:sa.description||'',exp:sa.total_on_hand||0,type:'assembly',section:'Subassemblies',bomQty:line.qty});
      } else {
        const p=S.parts.find(x=>x.pn===line.child_pn);
        items.push({pn:line.child_pn,desc:p?.description||'',exp:p?.total_unpckgd||0,type:'part',section:'Components',bomQty:line.qty});
      }
    });
    const seen=new Set(); items=items.filter(i=>{if(seen.has(i.pn))return false;seen.add(i.pn);return true;});
  }
  else items=liveParts.filter(p=>(p.category||'Uncategorized')===cat).map(p=>({pn:p.pn,desc:p.description||'',exp:p.total_unpckgd||0,type:'part'}));

  if(!items.length){toast('Nothing in that selection');return;}

  const {data,error}=await db.from('cycle_counts').insert({status:'Open',notes:'',category_filter:cat}).select().single();
  if(error){toast('Error creating count: '+error.message);return;}

  // Build lines payload — try with item_type first, fall back without if column missing
  const makeLines=(withType)=>items.map(i=>{
    const row={count_id:data.id,pn:i.pn,description:i.desc,expected_qty:i.exp,notes:i.bomQty?'BOM qty/unit: '+i.bomQty:''};
    if(withType)row.item_type=i.type;
    return row;
  });

  // Insert in chunks of 200 to avoid row limits
  const CHUNK=200;
  let insertError=null;
  let lines=makeLines(true);
  for(let i=0;i<lines.length;i+=CHUNK){
    const chunk=lines.slice(i,i+CHUNK);
    const{error:e}=await db.from('cycle_count_lines').insert(chunk);
    if(e){insertError=e;break;}
  }

  // If item_type column doesn't exist yet, retry without it
  if(insertError&&(insertError.message.includes('item_type')||insertError.code==='42703')){
    await db.from('cycle_count_lines').delete().eq('count_id',data.id); // clean partial inserts
    lines=makeLines(false);
    insertError=null;
    for(let i=0;i<lines.length;i+=CHUNK){
      const chunk=lines.slice(i,i+CHUNK);
      const{error:e}=await db.from('cycle_count_lines').insert(chunk);
      if(e){insertError=e;break;}
    }
  }

  if(insertError){
    // Clean up the cycle_counts header row too
    await db.from('cycle_counts').delete().eq('id',data.id);
    toast('Error creating count lines: '+insertError.message+'\n\nYou may need to run the DB migration — see Integrations → Setup Guide');
    return;
  }

  S.cycleCounts=[data,...S.cycleCounts];
  S.countMode='home';
  S.activeCount=data.id;
  S.countLines=lines.map((l,i)=>({...l,id:'temp-'+i,actual_qty:null}));
  await loadCountLines(data.id);
  render();
  toast('Cycle count created — '+items.length+' items');
}

async function loadCountLines(countId) {
  const {data}=await db.from('cycle_count_lines').select('*').eq('count_id',countId).order('pn');
  S.countLines=data||[];
}

function spotCountLookup(val){
  const pn=val.trim();
  const matchEl=document.getElementById('spot-pn-match');
  const expEl=document.getElementById('spot-expected');
  if(!pn){matchEl.textContent='';expEl.textContent='—';return;}
  // Try parts first, then assemblies
  const p=S.parts.find(x=>x.pn.toLowerCase()===pn.toLowerCase());
  const a=S.assemblies.find(x=>x.pn.toLowerCase()===pn.toLowerCase());
  if(p){matchEl.textContent='✓ '+p.description;matchEl.style.color='var(--teal)';expEl.textContent=p.total_unpckgd||0;}
  else if(a){matchEl.textContent='✓ '+a.description+' (assembly)';matchEl.style.color='var(--teal)';expEl.textContent=a.total_on_hand||0;}
  else{matchEl.textContent='Not found — will be skipped';matchEl.style.color='var(--text3)';expEl.textContent='—';}
}

async function applySpotCount(){
  const pn=document.getElementById('spot-pn').value.trim();
  const qtyInput=document.getElementById('spot-qty').value;
  const reason=document.getElementById('spot-reason').value.trim()||'Spot Count';
  if(!pn){toast('Enter a part number');document.getElementById('spot-pn').focus();return;}
  if(qtyInput===''){toast('Enter the counted quantity');document.getElementById('spot-qty').focus();return;}
  const newQty=parseFloat(qtyInput);
  const p=S.parts.find(x=>x.pn.toLowerCase()===pn.toLowerCase());
  const a=S.assemblies.find(x=>x.pn.toLowerCase()===pn.toLowerCase());
  if(!p&&!a){toast('Part/SKU not found: '+pn);return;}
  if(p){
    const prev=p.total_unpckgd||0;
    const adj=newQty-prev;
    await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',p.id);
    S.parts=S.parts.map(x=>x.pn===p.pn?{...x,total_unpckgd:newQty}:x);
    await db.from('inv_corrections').insert({pn:p.pn,previous_qty:prev,new_qty:newQty,adjustment:adj,reason,source:'spot_count'});
    S.corrections=[{pn:p.pn,previous_qty:prev,new_qty:newQty,adjustment:adj,reason,source:'spot_count',created_at:new Date().toISOString()},...S.corrections];
    const histEl=document.getElementById('spot-history');
    if(histEl){histEl.innerHTML=`<div class="panel" style="padding:10px 14px;border-left:3px solid ${adj===0?'var(--teal)':adj>0?'var(--green)':'var(--red)'}"><div style="font-size:12px;font-weight:600">${p.pn} — ${adj===0?'No change':adj>0?'+'+adj+' added':adj+' removed'}</div><div style="font-size:11px;color:var(--text3)">${prev} → ${newQty} · ${reason}</div></div>`;}
    toast(p.pn+': '+prev+' → '+newQty+(adj===0?' (no change)':(adj>0?' (+'+adj+')':' ('+adj+')')));
  } else {
    const prev=a.total_on_hand||0;
    const adj=newQty-prev;
    await db.from('assemblies').update({total_on_hand:newQty}).eq('id',a.id);
    S.assemblies=S.assemblies.map(x=>x.pn===a.pn?{...x,total_on_hand:newQty}:x);
    await db.from('inv_corrections').insert({pn:a.pn,previous_qty:prev,new_qty:newQty,adjustment:adj,reason:reason+' (assembly)',source:'spot_count'});
    toast(a.pn+': '+prev+' → '+newQty);
  }
  // Clear for next item
  document.getElementById('spot-pn').value='';
  document.getElementById('spot-qty').value='';
  document.getElementById('spot-pn-match').textContent='';
  document.getElementById('spot-expected').textContent='—';
  document.getElementById('spot-pn').focus();
}

// ── WALK COUNT: one item at a time, keyboard driven ──
function startWalkCount(){
  // Build list of all active items sorted by location/pn
  const items=[
    ...S.assemblies.filter(a=>!a.discontinued).map(a=>({pn:a.pn,desc:a.description||'',exp:a.total_on_hand||0,type:'assembly',loc:a.location||''})),
    ...S.parts.filter(p=>!p.discontinued).map(p=>({pn:p.pn,desc:p.description||'',exp:p.total_unpckgd||0,type:'part',loc:p.location||''}))
  ].sort((a,b)=>(a.loc||'zzz').localeCompare(b.loc||'zzz')||a.pn.localeCompare(b.pn));
  S.walkItems=items.map(i=>({...i,counted:null,skip:false}));
  S.walkIdx=0;
  S.countMode='walk';
  render();
  setTimeout(()=>document.getElementById('walk-qty')?.focus(),100);
}

  const variances=countedItems.filter(i=>i.counted!==i.exp);
  const pct=Math.round(idx/items.length*100);

  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-sm" onclick="if(confirm('Exit walk count? Progress is saved in your browser.'))S.countMode='home';render()">✕ Exit</button>

      <div style="height:6px;background:var(--bg4);border-radius:3px;margin-top:4px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--teal);border-radius:3px;transition:width .3s"></div>
      </div>
    </div>
    <div style="text-align:right;font-size:11px;color:var(--text3)">${countedItems.length} counted · ${variances.length} variances</div>
    ${countedItems.length?`<button class="btn btn-primary btn-sm" onclick="applyWalkCount()">✓ Apply ${variances.length} corrections</button>`:''}
  </div>

  <!-- Current item -->
  <div class="panel" style="max-width:520px;padding:20px;border:2px solid var(--teal)">
    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">${current?.type==='assembly'?'Assembly':'Part'} ${current?.loc?'· Bin: '+current.loc:''}</div>
    <div style="font-size:20px;font-weight:800;font-family:var(--mono);color:var(--teal);margin-bottom:4px">${current?.pn||'Done'}</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">${current?.desc||''}</div>
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:16px">
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">System qty</div>
        <div style="font-size:28px;font-weight:700;font-family:var(--mono);color:var(--text3)">${current?.exp??'—'}</div>
      </div>
      <div style="font-size:24px;color:var(--border2)">→</div>
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Counted qty</div>
        <input id="walk-qty" class="form-input" type="number" min="0" placeholder="Count…"
          value="${current?.counted??''}"
          style="font-size:28px;font-family:var(--mono);font-weight:700;padding:8px;text-align:center;width:100%;color:var(--text)"
          onkeydown="walkKeyHandler(event)">
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="walkNav(-1)" ${idx===0?'disabled':''}>← Prev</button>
      <button class="btn btn-sm" onclick="walkSkip()" style="color:var(--text3)">Skip</button>
      <button class="btn btn-primary" style="flex:1" onclick="walkNext()">Next → <span style="font-size:10px;opacity:.7">(Enter)</span></button>
    </div>
  </div>

  <!-- Recent counts -->
  ${countedItems.length?`
  <div style="margin-top:14px;max-width:520px">
    <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Recently counted</div>
    ${[...countedItems].reverse().slice(0,4).map(i=>`
    <div class="check-row" style="padding:6px 10px">
      <span class="pn text-mono" style="min-width:120px">${i.pn}</span>
      <span style="font-size:11px;color:var(--text3)">expected ${i.exp}</span>
      <span style="flex:1"></span>
      <span class="money" style="color:${i.counted===i.exp?'var(--teal)':i.counted>i.exp?'var(--green)':'var(--red)'};font-weight:700">${i.counted} ${i.counted!==i.exp?'('+(i.counted-i.exp>0?'+':'')+(i.counted-i.exp)+')':''}</span>
    </div>`).join('')}
  </div>`:''}`;
}

function walkKeyHandler(e){
  if(e.key==='Enter'){e.preventDefault();walkNext();}
  if(e.key==='ArrowRight'){e.preventDefault();walkNext();}
  if(e.key==='ArrowLeft'){e.preventDefault();walkNav(-1);}
  if(e.key==='Escape'){e.preventDefault();walkSkip();}
}

function walkNext(){
  const qtyEl=document.getElementById('walk-qty');
  const val=qtyEl?.value;
  if(val!==''&&val!==null&&val!==undefined){
    S.walkItems[S.walkIdx].counted=parseFloat(val);
  }
  if(S.walkIdx<S.walkItems.length-1){S.walkIdx++;render();}
  else{
    // End of list
    const variances=S.walkItems.filter(i=>i.counted!==null&&i.counted!==i.exp).length;
    if(confirm('End of list! Apply '+variances+' corrections now?')){applyWalkCount();}
  }
  setTimeout(()=>document.getElementById('walk-qty')?.focus(),50);
}

function walkNav(dir){
  const qtyEl=document.getElementById('walk-qty');
  if(qtyEl?.value!=='')S.walkItems[S.walkIdx].counted=parseFloat(qtyEl.value);
  S.walkIdx=Math.max(0,Math.min(S.walkItems.length-1,S.walkIdx+dir));
  render();
  setTimeout(()=>document.getElementById('walk-qty')?.focus(),50);
}

function walkSkip(){
  S.walkItems[S.walkIdx].skip=true;
  S.walkItems[S.walkIdx].counted=null;
  if(S.walkIdx<S.walkItems.length-1){S.walkIdx++;render();}
  setTimeout(()=>document.getElementById('walk-qty')?.focus(),50);
}

async function applyWalkCount(){
  const toApply=S.walkItems.filter(i=>i.counted!==null&&i.counted!==i.exp);
  if(!toApply.length){toast('No variances to apply');return;}
  let applied=0,errors=0;
  for(const item of toApply){
    if(item.type==='assembly'){
      const a=S.assemblies.find(x=>x.pn===item.pn);
      if(!a){errors++;continue;}
      const{error}=await db.from('assemblies').update({total_on_hand:item.counted}).eq('id',a.id);
      if(error){errors++;continue;}
      S.assemblies=S.assemblies.map(x=>x.pn===item.pn?{...x,total_on_hand:item.counted}:x);
      await db.from('inv_corrections').insert({pn:item.pn,previous_qty:item.exp,new_qty:item.counted,adjustment:item.counted-item.exp,reason:'Walk Count',source:'walk_count'});
    } else {
      const p=S.parts.find(x=>x.pn===item.pn);
      if(!p){errors++;continue;}
      const{error}=await db.from('parts').update({total_unpckgd:item.counted,updated_at:new Date().toISOString()}).eq('id',p.id);
      if(error){errors++;continue;}
      S.parts=S.parts.map(x=>x.pn===item.pn?{...x,total_unpckgd:item.counted}:x);
      await db.from('inv_corrections').insert({pn:item.pn,previous_qty:item.exp,new_qty:item.counted,adjustment:item.counted-item.exp,reason:'Walk Count',source:'walk_count'});
      applied++;
    }
    applied++;
  }
  S.walkItems=[]; S.walkIdx=0; S.countMode='home';
  toast(applied+' corrections applied'+(errors?' ('+errors+' errors)':''));
  render();
}

async function deleteCycleCount(countId){
  if(!confirm('Delete this cycle count and all its lines? This cannot be undone.'))return;
  if(S.activeCount===countId){S.activeCount=null;S.countLines=[];}
  await db.from('cycle_count_lines').delete().eq('count_id',countId);
  await db.from('cycle_counts').delete().eq('id',countId);
  S.cycleCounts=S.cycleCounts.filter(c=>c.id!==countId);
  toast('Cycle count deleted');render();
}

async function deleteAllCompletedCounts(){
  const done=S.cycleCounts.filter(c=>c.status==='Complete');
  if(!done.length){toast('No completed counts to clear');return;}
  if(!confirm('Delete all '+done.length+' completed counts and their lines? Corrections already applied are not affected.'))return;
  for(const c of done){
    await db.from('cycle_count_lines').delete().eq('count_id',c.id);
    await db.from('cycle_counts').delete().eq('id',c.id);
  }
  S.cycleCounts=S.cycleCounts.filter(c=>c.status!=='Complete');
  toast(done.length+' completed counts cleared');render();
}

  S.activeCount=id;

}

function renderCountDetail(count) {

async function updateCountLine(lineId, qty) {
  await db.from('cycle_count_lines').update({actual_qty:qty,counted_at:new Date().toISOString()}).eq('id',lineId);
  S.countLines=S.countLines.map(l=>l.id===lineId?{...l,actual_qty:qty,counted_at:new Date().toISOString()}:l);
  render(); // show variance + update KPIs immediately
}
async function updateCountLineNote(lineId, note) {
  await db.from('cycle_count_lines').update({notes:note}).eq('id',lineId);
  S.countLines=S.countLines.map(l=>l.id===lineId?{...l,notes:note}:l);
}

async function applyCountCorrections(countId) {
  let _corrErrors=0;
  const variances=S.countLines.filter(l=>l.actual_qty!=null&&l.actual_qty!==(l.expected_qty||0));
  if(!variances.length){
    await db.from('cycle_counts').update({status:'Complete',completed_at:new Date().toISOString()}).eq('id',countId);
    S.cycleCounts=S.cycleCounts.map(c=>c.id===countId?{...c,status:'Complete'}:c);
    toast('No variances — count closed');render();return;
  }
  if(!confirm('Apply '+variances.length+' inventory corrections?')) return;
  for(const line of variances){
    const newQty=line.actual_qty;
    if(line.item_type==='assembly'){
      // Counting a finished good / subassembly adjusts ONLY that item.
      // BOM components are NEVER touched by a count — only Unpack returns components.
      const asm=S.assemblies.find(a=>a.pn===line.pn);
      if(!asm) continue;
      const prev=asm.total_on_hand||0;
      await db.from('assemblies').update({total_on_hand:newQty,updated_at:new Date().toISOString()}).eq('id',asm.id);
      S.assemblies=S.assemblies.map(a=>a.pn===line.pn?{...a,total_on_hand:newQty}:a);
      await db.from('inv_corrections').insert({pn:line.pn,previous_qty:prev,new_qty:newQty,adjustment:newQty-prev,reason:'Cycle Count (finished/sub — components untouched)'+(line.notes?' — '+line.notes:''),source:'cycle_count',reference_id:countId});
      S.corrections=[{pn:line.pn,previous_qty:prev,new_qty:newQty,adjustment:newQty-prev,reason:'Cycle Count',source:'cycle_count',created_at:new Date().toISOString()},...S.corrections];
    } else {
      const part=S.parts.find(p=>p.pn===line.pn);
      if(!part){_corrErrors++;continue;}
      const prev=part.total_unpckgd||0;
      const{error:_pe}=await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',part.id);
      if(_pe){_corrErrors++;continue;}
      S.parts=S.parts.map(p=>p.pn===line.pn?{...p,total_unpckgd:newQty}:p);
      await db.from('inv_corrections').insert({pn:line.pn,previous_qty:prev,new_qty:newQty,adjustment:newQty-prev,reason:'Cycle Count '+(line.notes?'— '+line.notes:''),source:'cycle_count',reference_id:countId});
      S.corrections=[{pn:line.pn,previous_qty:prev,new_qty:newQty,adjustment:newQty-prev,reason:'Cycle Count',source:'cycle_count',created_at:new Date().toISOString()},...S.corrections];
    }
  }
  await db.from('cycle_counts').update({status:'Complete',completed_at:new Date().toISOString()}).eq('id',countId);
  S.cycleCounts=S.cycleCounts.map(c=>c.id===countId?{...c,status:'Complete'}:c);
  updateBadge();
  toast(variances.length+' corrections applied');
  render();
}

async function deleteCorrection(id){
  if(!id){toast('Cannot delete — no ID on this entry');return;}
  if(!confirm('Delete this correction log entry? This only removes the log record, not any stock changes.'))return;
  const{error}=await db.from('inv_corrections').delete().eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.corrections=S.corrections.filter(c=>c.id!==id);
  toast('Entry deleted');render();
}

async function submitManualCorrection(pn, newQty, reason) {
  const part=S.parts.find(p=>p.pn===pn);
  if(!part){toast('Part not found');return;}
  const prev=part.total_unpckgd||0;
  const adj=newQty-prev;
  await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',part.id);
  S.parts=S.parts.map(p=>p.pn===pn?{...p,total_unpckgd:newQty}:p);
  await db.from('inv_corrections').insert({pn,previous_qty:prev,new_qty:newQty,adjustment:adj,reason:reason||'Manual adjustment',source:'manual'});
  S.corrections=[{pn,previous_qty:prev,new_qty:newQty,adjustment:adj,reason:reason||'Manual adjustment',source:'manual',created_at:new Date().toISOString()},...S.corrections];
  pushUndo('update','parts',{...part,total_unpckgd:newQty},part,'Correction: '+pn+' → '+newQty);
  closeModal();updateBadge();toast('Correction applied');render();
}

        ${canShip?`<button class="btn btn-teal btn-sm" onclick="shipShipmentError('${e.id}')">🚚 Ship</button>`:''}
        ${!canShip&&nextStatus[e.status]?`<button class="action-btn" onclick="advanceShipmentError('${e.id}','${nextStatus[e.status]}')">→ ${nextStatus[e.status]}</button>`:''}
        <button class="action-btn" onclick="openModal('addShipmentError',{id:'${e.id}'})">✎</button>
        <button class="action-btn del" onclick="deleteShipmentError('${e.id}')">×</button>
      </td>
    </tr>`;
  }).join('')}
  </tbody></table></div>`;
}

async function deleteWarranty(id) {

function seToggleActual(){
  const t=document.getElementById('se-type')?.value;
  const col=document.getElementById('se-actual-col');
  if(col)col.style.opacity=t==='missing_item'?'0.4':'1';
}

function seLookupOrder(){
  const q=(document.getElementById('se-order')?.value||'').trim().replace(/^#/,'');
  if(!q){toast('Enter an order number first');return;}
  const match=S.sales.find(s=>(s.order_number||'').replace(/^#/,'')===q)
    ||S.sales.find(s=>(s.order_number||'').replace(/^#/,'').includes(q));
  if(!match){toast('Order not found in ERP');return;}
  const custName=match.customer_name||S.sales.find(s=>s.order_number===match.order_number&&s.customer_name)?.customer_name||'';
  const custEmail=match.customer_email||S.sales.find(s=>s.order_number===match.order_number&&s.customer_email)?.customer_email||'';
  const cEl=document.getElementById('se-customer');
  const eEl=document.getElementById('se-email');
  const pEl=document.getElementById('se-exp-pn');
  const qEl=document.getElementById('se-exp-qty');
  if(cEl)cEl.value=custName||cEl.value;
  if(eEl)eEl.value=custEmail||eEl.value;
  if(pEl&&!pEl.value&&match.pn)pEl.value=match.pn;
  if(qEl&&(parseInt(qEl.value)||1)===1&&match.qty)qEl.value=match.qty;
  toast(custName?`✓ Loaded: ${custName}`:'Order found — no customer name on file',2000);
}

async function submitShipmentError(editId){
  const order_number=(document.getElementById('se-order')?.value||'').trim();
  const customer_name=(document.getElementById('se-customer')?.value||'').trim();
  const customer_email=(document.getElementById('se-email')?.value||'').trim();
  const error_type=document.getElementById('se-type')?.value||'wrong_item';
  const expected_pn=(document.getElementById('se-exp-pn')?.value||'').trim();
  const expected_qty=parseInt(document.getElementById('se-exp-qty')?.value)||1;
  const actual_pn=(document.getElementById('se-act-pn')?.value||'').trim()||null;
  const actual_qty=parseInt(document.getElementById('se-act-qty')?.value)||0;
  const resolution=document.getElementById('se-resolution')?.value||'none';
  const status=document.getElementById('se-status')?.value||'Open';
  const notes=(document.getElementById('se-notes')?.value||'').trim();
  if(!expected_pn){toast('Expected SKU is required');return;}
  const payload={order_number,customer_name,customer_email,error_type,expected_pn,expected_qty,
    actual_pn:error_type==='missing_item'?null:actual_pn,
    actual_qty:error_type==='missing_item'?0:actual_qty,
    resolution,notes,
    status:editId?(status||'Open'):'Open'};
  if(editId&&status==='Resolved') payload.resolved_at=new Date().toISOString();
  if(editId){
    const{error}=await db.from('shipment_errors').update({...payload}).eq('id',editId);
    if(error){toast('Error: '+error.message);return;}
    S.shipmentErrors=(S.shipmentErrors||[]).map(e=>e.id===editId?{...e,...payload}:e);
    document.getElementById('se-overlay')?.remove();
    toast('Shipment error updated');render();
  }else{
    const{data,error}=await db.from('shipment_errors').insert(payload).select().single();
    if(error){toast('Error: '+error.message);return;}
    S.shipmentErrors=[data,...(S.shipmentErrors||[])];
    document.getElementById('se-overlay')?.remove();
    toast('Shipment error logged');updateBadge();render();
  }
}

async function advanceShipmentError(id,newStatus){
  const updates={status:newStatus};
  if(newStatus==='Resolved')updates.resolved_at=new Date().toISOString();
  const{error}=await db.from('shipment_errors').update(updates).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  S.shipmentErrors=(S.shipmentErrors||[]).map(e=>e.id===id?{...e,...updates}:e);
  toast('Status → '+newStatus);updateBadge();render();
}

async function deleteShipmentError(id){

async function checkResolutionTracking(){
  const wtyOrders=(S.warrantyClaims||[])
    .filter(w=>w.ss_order_id&&!w.tracking_number&&w.status!=='Resolved')
    .map(w=>({type:'warranty',id:w.id,orderNumber:'Warranty_'+(w.order_number||w.id)}));
  const seOrders=(S.shipmentErrors||[])
    .filter(e=>e.ss_order_id&&!e.tracking_number&&e.status!=='Resolved')
    .map(e=>({type:'shiperror',id:e.id,orderNumber:'SHError_'+(e.order_number||e.id)}));
  const orders=[...wtyOrders,...seOrders];
  if(!orders.length){toast('No untracked orders to check');return;}
  toast('Checking '+orders.length+' order'+(orders.length!==1?'s':'')+' in ShipStation…',3000);
  try{
    const resp=await fetch(SUPA_URL+'/functions/v1/shipstation-ship',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'check_tracking',orders})
    });
    const raw=await resp.text();
    let json;
    try{json=JSON.parse(raw);}catch(_){toast('Edge function error — redeploy shipstation-ship');return;}
    if(!resp.ok||json.error){toast('Error: '+(json.error||'HTTP '+resp.status));return;}
    const updated=json.results||[];
    if(!updated.length){toast('No new tracking found yet');return;}
    updated.forEach(function(r){
      if(r.type==='warranty'){
        S.warrantyClaims=(S.warrantyClaims||[]).map(function(w){return w.id===r.id?{...w,tracking_number:r.tracking,carrier:r.carrier,status:'Shipped'}:w;});
      } else {
        S.shipmentErrors=(S.shipmentErrors||[]).map(function(e){return e.id===r.id?{...e,tracking_number:r.tracking,carrier:r.carrier}:e;});
      }
    });
    toast('Found tracking for '+updated.length+' order'+(updated.length!==1?'s':''),4000);
    render();
  }catch(err){
    toast('Network error: '+err.message);
  }
}

async function confirmShipShipmentError(id){
  const e=(S.shipmentErrors||[]).find(function(x){return x.id===id;});
  if(!e){toast('Record not found');return;}
  const name=(document.getElementById('se-ship-name')?.value||'').trim();
  const addr1=(document.getElementById('se-ship-addr1')?.value||'').trim();
  const city=(document.getElementById('se-ship-city')?.value||'').trim();
  const zip=(document.getElementById('se-ship-zip')?.value||'').trim();
  if(!addr1||!city||!zip){toast('Address, city and ZIP required');return;}
  const shipTo={name:name,street1:addr1,street2:(document.getElementById('se-ship-addr2')?.value||'').trim(),city:city,state:(document.getElementById('se-ship-state')?.value||'').trim(),postal_code:zip,country:(document.getElementById('se-ship-country')?.value||'US').trim()};
  const statusEl=document.getElementById('se-ship-status');
  const submitBtn=document.getElementById('se-ship-submit');
  if(statusEl){statusEl.style.display='block';statusEl.style.background='var(--bg3)';statusEl.style.color='var(--text2)';statusEl.textContent='Creating order in ShipStation…';}
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Creating…';}
  try{
    const resp=await fetch(SUPA_URL+'/functions/v1/shipstation-ship',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'create_order',
        orderNumber:'SHError_'+(e.order_number||id),
        customerName:e.customer_name||name,
        customerEmail:e.customer_email||'',
        pn:e.expected_pn,
        description:e.expected_pn,
        qty:e.expected_qty||1,
        shipTo:shipTo,
        internalNotes:'Shipment error correction — Original order '+(e.order_number||'N/A')+' — '+(e.error_type||'').replace(/_/g,' ')
      })
    });
    const rawText=await resp.text();
    let json;
    try{json=JSON.parse(rawText);}catch(_){
      if(statusEl){
        statusEl.style.background='rgba(220,38,38,.1)';statusEl.style.color='var(--red)';
        statusEl.innerHTML='<b>✗ HTTP '+resp.status+' — Non-JSON response</b><br><br>'
          +'<div style="font-size:10px;color:var(--text3);margin-bottom:4px">Raw response from edge function:</div>'
          +'<pre style="font-size:9px;white-space:pre-wrap;background:var(--bg2);padding:6px;border-radius:4px;border:1px solid var(--border);max-height:120px;overflow-y:auto">'+escHtml(rawText.slice(0,600))+'</pre>'
          +'<div style="font-size:10px;color:var(--text3);margin-top:6px">Common fixes: redeploy <b>shipstation-ship</b> from Setup Guide · check SS_KEY/SS_SECRET secrets are set</div>';
      }
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
      return;
    }
    if(!resp.ok||json.error){
      if(statusEl){statusEl.style.background='rgba(220,38,38,.1)';statusEl.style.color='var(--red)';statusEl.textContent='Error: '+(json.error||'HTTP '+resp.status);}
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
      return;
    }
    const ssOrderId=json.orderId||json.orderNumber||'(created)';
    const{error:dbErr}=await db.from('shipment_errors').update({ss_order_id:String(ssOrderId),status:'Reshipping'}).eq('id',id);
    if(!dbErr)S.shipmentErrors=(S.shipmentErrors||[]).map(function(x){return x.id===id?{...x,ss_order_id:String(ssOrderId),status:'Reshipping'}:x;});
    document.getElementById('se-ship-overlay')?.remove();
    toast('ShipStation correction order created — SS#'+ssOrderId+'. Tracking will appear automatically when shipped.',6000);
    updateBadge();render();
  }catch(err){
    if(statusEl){statusEl.style.background='rgba(220,38,38,.1)';statusEl.style.color='var(--red)';statusEl.textContent='Network error: '+err.message;}
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
  }
}

async function confirmShipWarranty(claimId, pn){
  const name=(document.getElementById('ws-name')?.value||'').trim();
  const addr1=(document.getElementById('ws-addr1')?.value||'').trim();
  const city=(document.getElementById('ws-city')?.value||'').trim();
  const zip=(document.getElementById('ws-zip')?.value||'').trim();
  if(!addr1||!city||!zip){toast('Address, city and ZIP are required');return;}
  const shipTo={name,street1:addr1,street2:(document.getElementById('ws-addr2')?.value||'').trim(),city,state:(document.getElementById('ws-state')?.value||'').trim(),postal_code:zip,country:(document.getElementById('ws-country')?.value||'US').trim()};
  const claim=S.warrantyClaims.find(function(w){return w.id===claimId;});

  // Resolve items to ship — use claim_items if available, otherwise fall back to legacy single pn
  const claimItems=(claim?.claim_items&&claim.claim_items.length)?claim.claim_items:[{pn,qty:1,type:S.assemblies.find(function(a){return a.pn===pn;})?'assembly':'part',description:S.assemblies.find(function(a){return a.pn===pn;})?.description||pn}];

  const statusEl=document.getElementById('wty-ship-status');
  const submitBtn=document.getElementById('ws-submit');
  if(statusEl){statusEl.style.display='block';statusEl.style.background='var(--bg3)';statusEl.style.color='var(--text2)';statusEl.textContent='⏳ Creating order in ShipStation…';}
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Creating…';}

  try{
    // Build SS items array from claim_items
    const ssItems=claimItems.map(function(item,i){
      return{lineItemKey:String(i+1),sku:item.pn,name:item.description||item.pn,quantity:item.qty||1,unitPrice:0};
    });
    const resp=await fetch(SUPA_URL+'/functions/v1/shipstation-ship',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'create_order',
        orderNumber:'Warranty_'+(claim?.order_number||claimId),
        customerName:claim?.customer_name||name,
        customerEmail:claim?.customer_email||'',
        // pass first item for legacy compat, but edge function uses ssItems if present
        pn:claimItems[0]?.pn||pn,
        description:claimItems[0]?.description||pn,
        qty:claimItems[0]?.qty||1,
        ssItems,
        shipTo,
        internalNotes:'Warranty replacement ('+claimItems.length+' item'+(claimItems.length!==1?'s':'')+') — Claim #'+claimId+'. Issue: '+(claim?.issue||'')
      })
    });
    // Read as text first so we get a useful error message even if it's not JSON
    const rawText=await resp.text();
    let json;
    try{json=JSON.parse(rawText);}
    catch(e){
      const preview=rawText?rawText.slice(0,400).replace(/</g,'&lt;'):'(empty response body)';
      const hint=resp.status===400
        ?'HTTP 400 with no JSON usually means the edge function crashed before it could respond — often because ShipStation returned a non-JSON error that wasn\'t caught. Redeploy the updated <b>shipstation-ship</b> function from the Setup Guide (the create_order block now handles this).'
        :'This usually means the <b>create_order</b> action hasn\'t been deployed yet. Copy the updated code from <b>Integrations → Setup Guide</b> and redeploy.';
      if(statusEl){
        statusEl.style.display='block';
        statusEl.style.background='rgba(220,38,38,.1)';
        statusEl.style.color='var(--red)';
        statusEl.innerHTML='<b>✗ Edge function returned non-JSON (HTTP '+resp.status+')</b><br><br>'+hint
          +(preview?'<br><br><div style="font-size:10px;color:var(--text3);margin-top:4px">Raw response from server:</div><pre style="font-size:9px;margin-top:4px;white-space:pre-wrap;background:var(--bg2);padding:6px;border-radius:4px;border:1px solid var(--border)">'+preview+'</pre>':'');
      }
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
      return;
    }
    if(!resp.ok||json.error){
      if(statusEl){statusEl.style.display='block';statusEl.style.background='rgba(220,38,38,.1)';statusEl.style.color='var(--red)';statusEl.textContent='✗ '+(json.error||'Edge function error (HTTP '+resp.status+')');}
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
      return;
    }
    const ssOrderId=json.orderId||json.orderNumber||'(created)';

    // Deduct inventory for each claim item
    for(const item of claimItems){
      const qty=item.qty||1;
      if(item.type==='assembly'){
        const a=S.assemblies.find(function(x){return x.pn===item.pn;});
        if(a){
          const newOh=Math.max(0,(a.total_on_hand||0)-qty);
          await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',a.id);
          S.assemblies=S.assemblies.map(function(x){return x.pn===item.pn?{...x,total_on_hand:newOh}:x;});
          await db.from('inv_corrections').insert({pn:item.pn,previous_qty:a.total_on_hand||0,new_qty:newOh,adjustment:-qty,reason:'Warranty replacement shipped (SS#'+ssOrderId+')',source:'warranty'});
        }
      } else {
        const p=S.parts.find(function(x){return x.pn===item.pn;});
        if(p){
          const newQty=Math.max(0,(p.total_unpckgd||0)-qty);
          await db.from('parts').update({total_unpckgd:newQty,updated_at:new Date().toISOString()}).eq('id',p.id);
          S.parts=S.parts.map(function(x){return x.pn===item.pn?{...x,total_unpckgd:newQty}:x;});
          await db.from('inv_corrections').insert({pn:item.pn,previous_qty:p.total_unpckgd||0,new_qty:newQty,adjustment:-qty,reason:'Warranty part shipped (SS#'+ssOrderId+')',source:'warranty'});
        }
      }
    }

    // Save SS order ID and advance status
    const{error:dbErr}=await db.from('warranty_claims').update({ss_order_id:String(ssOrderId),status:'Shipped',resolved_at:new Date().toISOString(),shipping_details:shipTo}).eq('id',claimId);
    if(!dbErr){S.warrantyClaims=S.warrantyClaims.map(function(w){return w.id===claimId?{...w,ss_order_id:String(ssOrderId),status:'Shipped',shipping_details:shipTo}:w;});}
    document.getElementById('wty-ship-overlay')?.remove();
    toast('✓ ShipStation order created — SS#'+ssOrderId+'. Inventory updated for '+claimItems.length+' item'+(claimItems.length!==1?'s':''),5000);
    render();
  }catch(err){
    if(statusEl){statusEl.style.background='rgba(220,38,38,.1)';statusEl.style.color='var(--red)';statusEl.textContent='✗ Network error: '+err.message;}
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='🚚 Create ShipStation Order';}
  }
}

async function diagnoseTracking(){
  const el=document.getElementById('tracking-diag-result');
  if(el){el.style.display='block';el.innerHTML='<div style="color:var(--text3);font-size:12px">⏳ Scanning database…</div>';}
  toast('Scanning all order rows…');

  // Query full DB for tracking status
  const {data:allRows,error}=await db.from('sales')
    .select('id,order_number,pn,fulfillment_status,tracking_number,carrier,shipped_at')
    .not('order_number','is',null)
    .order('order_number').order('pn');
  if(error){if(el)el.innerHTML=`<div style="color:var(--red);font-size:12px">Error: ${error.message}</div>`;return;}

  const rows=allRows||[];
  const withTracking=rows.filter(r=>r.tracking_number);
  const withoutTracking=rows.filter(r=>!r.tracking_number&&(r.fulfillment_status==='Shipped'||r.fulfillment_status==='Delivered'));

  // Find duplicates
  const groups={};
  rows.forEach(r=>{const k=(r.order_number||'')+'||'+(r.pn||'');(groups[k]=groups[k]||[]).push(r);});
  const dupGroups=Object.values(groups).filter(g=>g.length>1);
  const dupCount=dupGroups.reduce((t,g)=>t+g.length-1,0);

  // Of duplicates, how many groups have tracking on at least one row?
  const rescuable=dupGroups.filter(g=>g.some(r=>r.tracking_number)).length;
  const trackingOnlyInDupe=dupGroups.filter(g=>{
    // The "winner" (highest status) lacks tracking but a duplicate has it
    const ranked=[...g].sort((a,b)=>(({'Delivered':5,'Shipped':4,'Packed':3,'Open':1})[b.fulfillment_status||'Open']||0)-(({'Delivered':5,'Shipped':4,'Packed':3,'Open':1})[a.fulfillment_status||'Open']||0));
    return !ranked[0].tracking_number && ranked.some(r=>r.tracking_number);
  }).length;

  // Sample of orders missing tracking
  const missingOrders=[...new Set(withoutTracking.map(r=>r.order_number))].slice(0,5);

  let html='';
  if(withTracking.length>0){
    html+=`<div class="panel" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--green)">
      <div style="font-size:13px;font-weight:700;color:var(--green)">✓ ${withTracking.length} rows in DB still have tracking numbers</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">Your tracking data is NOT gone. It's in the database — it just may be on duplicate rows that aren't showing up correctly.</div>
    </div>`;
  } else {
    html+=`<div class="panel" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--red)">
      <div style="font-size:13px;font-weight:700;color:var(--red)">✗ No rows with tracking numbers found in DB</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">Tracking was fully removed. Use "Restore from ShipStation" below to recover it.</div>
    </div>`;
  }

  html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
    <div class="kpi"><div class="kpi-label">Total order rows</div><div class="kpi-value">${rows.length}</div></div>
    <div class="kpi ${withTracking.length>0?'kpi-green':'kpi-red'}"><div class="kpi-label">Rows with tracking</div><div class="kpi-value">${withTracking.length}</div></div>
    <div class="kpi ${dupCount>0?'kpi-orange':'kpi-teal'}"><div class="kpi-label">Duplicate rows</div><div class="kpi-value">${dupCount}</div></div>
  </div>`;

  if(dupCount>0&&rescuable>0){
    html+=`<div class="panel" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--orange)">
      <div style="font-size:13px;font-weight:700;color:var(--orange)">⚡ ${rescuable} order+SKU groups have tracking on a duplicate row</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">${trackingOnlyInDupe>0?`<b>${trackingOnlyInDupe} groups</b> where the "winning" row lacks tracking but a duplicate has it — the Dedupe step will copy tracking to the winner first.`:'Dedupe will clean these up safely.'}</div>
      <div style="margin-top:10px">
        <button class="btn btn-primary" onclick="dedupeOrders()">🧽 Run Dedupe &amp; Rescue Tracking Now</button>
      </div>
    </div>`;
  }

  if(withoutTracking.length>0&&dupCount===0){
    html+=`<div class="panel" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--yellow)">
      <div style="font-size:13px;font-weight:700;color:var(--yellow)">⚠ ${withoutTracking.length} Shipped/Delivered rows have no tracking</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">No duplicates found — these rows never had tracking in the ERP. Restore from ShipStation to fill them in.</div>
      ${missingOrders.length?`<div style="font-size:10px;color:var(--text3);margin-top:6px;font-family:var(--mono)">Sample: ${missingOrders.join(', ')}…</div>`:''}
      <div style="margin-top:10px">
        <button class="btn btn-teal" onclick="restoreTrackingFromShipStation()">⬇ Restore from ShipStation</button>
      </div>
    </div>`;
  }

  if(withTracking.length>0&&dupCount===0&&withoutTracking.length===0){
    html+=`<div class="panel" style="padding:12px 16px;border-left:3px solid var(--teal)">
      <div style="font-size:13px;font-weight:700;color:var(--teal)">✓ Everything looks good — no action needed</div>
    </div>`;
  }

  if(el){el.innerHTML=html;}
}

async function restoreTrackingFromShipStation(){
  const key=S.shipstation?.key, secret=S.shipstation?.secret;
  if(!key||!secret){
    toast('ShipStation credentials not saved — go to Integrations → ShipStation first');
    return;
  }
  const el=document.getElementById('tracking-diag-result');
  if(el){el.style.display='block';el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px">⏳ Fetching shipments from ShipStation… this may take a minute.</div>';}

  try{
    // Fetch via edge function (direct ShipStation API is CORS-blocked from browser)
    const res=await fetch('https://piamamighqiielfztgic.supabase.co/functions/v1/shipstation-ship',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'restore_tracking',ssKey:key,ssSecret:secret})
    });
    const data=await res.json().catch(()=>({}));
    if(data.restored!==undefined){
      await refreshSales();
      render();
      if(el)el.innerHTML=`<div style="color:var(--green);font-size:12px;padding:10px">✓ Restored tracking on ${data.restored} orders${data.skipped?', '+data.skipped+' already had tracking':''}.</div>`;
      toast('✓ Restored tracking on '+data.restored+' orders');
      return;
    }
  }catch(e){}

  // Edge function not available or doesn't support restore — show manual SQL approach
  if(el){el.innerHTML=`
    <div class="panel" style="padding:14px 16px;border-left:3px solid var(--yellow)">
      <div style="font-size:13px;font-weight:700;color:var(--yellow)">Edge Function doesn't support bulk restore yet</div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px;line-height:1.7">
        <b>Option A — ShipStation CSV:</b><br>
        In ShipStation: <b>Reports → Shipment Summary → Export CSV</b><br>
        Then paste it below to bulk-restore tracking numbers.
      </div>
      <div class="divider" style="margin:12px 0"></div>
      <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px">Paste ShipStation Shipments CSV</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Needs columns: Order Number, Tracking Number, Carrier — one row per shipment</div>
      <textarea id="ss-tracking-csv" class="form-input" rows="6" style="font-family:var(--mono);font-size:11px;resize:vertical" placeholder="Order #,Carrier,Tracking Number,Ship Date&#10;#1001,UPS,1Z999AA10123456784,2024-01-15&#10;#1002,USPS,9400111899223397657336,2024-01-16"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="applyTrackingCSV()">Apply Tracking from CSV</button>
        <span style="font-size:11px;color:var(--text3)">Only updates rows that currently have no tracking — won't overwrite anything</span>
      </div>
      <div id="ss-csv-result" style="display:none;margin-top:8px"></div>
    </div>`;}
}

async function applyTrackingCSV(){
  const raw=document.getElementById('ss-tracking-csv')?.value?.trim();
  const resEl=document.getElementById('ss-csv-result');
  if(!raw){toast('Paste the CSV first');return;}

  // Parse CSV
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length<2){toast('Need at least a header row and one data row');return;}

  // Detect columns (flexible — just need order number and tracking number)
  const headers=lines[0].split(',').map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
  const findCol=(...names)=>{for(const n of names){const i=headers.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
  const orderCol=findCol('order','ordernumber','ordernum');
  const trackCol=findCol('tracking','trackingnumber','trackingnum','tracknumber');
  const carrierCol=findCol('carrier','carriername','shippingcarrier');
  const dateCol=findCol('shipdate','shippeddate','date');

  if(orderCol<0||trackCol<0){
    toast('Could not find Order Number and Tracking Number columns');
    if(resEl){resEl.style.display='block';resEl.innerHTML='<div style="color:var(--red);font-size:12px">Could not find required columns. Need: Order Number, Tracking Number (and optionally Carrier, Ship Date).<br>Found headers: '+headers.join(', ')+'</div>';}
    return;
  }

  const shipments=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const orderNum=cols[orderCol]?.trim();
    const tracking=cols[trackCol]?.trim();
    if(!orderNum||!tracking)continue;
    const carrier=carrierCol>=0?(cols[carrierCol]||''):'';
    const shipDate=dateCol>=0?(cols[dateCol]||''):'';
    shipments.push({orderNum,tracking,carrier,shipDate});
  }

  if(!shipments.length){toast('No valid shipment rows found');return;}
  if(resEl){resEl.style.display='block';resEl.innerHTML=`<div style="font-size:11px;color:var(--text3)">⏳ Updating ${shipments.length} shipments…</div>`;}

  let updated=0,skipped=0,notFound=0;
  for(const ship of shipments){
    // Find all ERP rows for this order number (try with and without #)
    const nums=[ship.orderNum, '#'+ship.orderNum.replace(/^#/,''), ship.orderNum.replace(/^#/,'')];
    let erpRows=[];
    for(const n of nums){
      const {data}=await db.from('sales').select('id,tracking_number').eq('order_number',n).in('fulfillment_status',['Shipped','Delivered']);
      if(data?.length){erpRows=data;break;}
    }
    if(!erpRows.length){notFound++;continue;}

    for(const row of erpRows){
      if(row.tracking_number){skipped++;continue;} // already has tracking — never overwrite
      const patch={tracking_number:ship.tracking,carrier:ship.carrier||null};
      if(ship.shipDate)patch.shipped_at=new Date(ship.shipDate).toISOString();
      await db.from('sales').update(patch).eq('id',row.id);
      updated++;
    }
  }

  await refreshSales();
  render();
  const msg=`✓ Restored ${updated} tracking entries · ${skipped} already had tracking (skipped) · ${notFound} order numbers not matched`;
  if(resEl){resEl.innerHTML=`<div style="color:var(--green);font-size:12px">${msg}</div>`;}
  toast(msg);
}

      <div class="panel-title"><span>Export Data</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" onclick="exportTable('parts')">⬇ Export Parts as CSV</button>
        <button class="btn" onclick="exportTable('assemblies')">⬇ Export Assemblies as CSV</button>
        <button class="btn" onclick="exportTable('purchases')">⬇ Export Purchase Orders as CSV</button>
        <button class="btn" onclick="exportTable('sales')">⬇ Export Sales as CSV</button>
      </div>
    </div>
    <div class="panel" id="import-preview" style="display:none">
      <div class="panel-title"><span>Import Preview</span></div>
      <div id="import-preview-content"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary" id="import-confirm-btn">Confirm Import</button>
        <button class="btn" onclick="document.getElementById('import-preview').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>
  </div>`;
}

async function importCSV() {
  const csv = document.getElementById('csv-input').value.trim();
  if(!csv){toast('Paste CSV data first');return;}
  const rows = csv.split('\n').map(r=>r.split(',').map(c=>c.trim()));
  const preview = rows.slice(0,5);
  const previewEl = document.getElementById('import-preview-content');
  previewEl.innerHTML = `<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${rows.length} rows to import (showing first 5):</div>` +
    rows.slice(0,5).map(r=>`<div style="font-size:11px;font-family:var(--mono);padding:3px 0;border-bottom:1px solid var(--border)">${r.join(' | ')}</div>`).join('');
  document.getElementById('import-preview').style.display='block';
  document.getElementById('import-confirm-btn').onclick = async ()=>{
    let imported=0,skipped=0;
    for(const r of rows){
      if(r.length<2) continue;
      const [pn,description,vendor,unit_cost,avg_sales_wk]=r;
      if(!pn) continue;
      const exists=S.parts.find(p=>p.pn===pn);
      if(exists){skipped++;continue;}
      const {data,error}=await db.from('parts').insert({pn,description:description||'',vendor:vendor||'',unit_cost:parseFloat(unit_cost)||0,avg_sales_wk:parseFloat(avg_sales_wk)||0,total_unpckgd:0,lead_time_weeks:2,updated_at:new Date().toISOString()}).select().single();
      if(!error&&data){S.parts.push(data);imported++;}
    }
    S.parts.sort((a,b)=>a.pn.localeCompare(b.pn));
    toast(imported+' imported, '+skipped+' skipped (existing)');
    document.getElementById('import-preview').style.display='none';
    render();
  };
}

function exportTable(table) {
  let data,headers,rows;
  if(table==='parts'){data=S.parts;headers=['pn','description','vendor','unit_cost','avg_sales_wk','total_unpckgd','min_qty','max_qty','lead_time_weeks','location'];}
  else if(table==='assemblies'){data=S.assemblies;headers=['pn','description','category','msrp','total_on_hand','avg_sales_wk','status'];}
  else if(table==='purchases'){data=S.purchases;headers=['order_date','vendor','pn','description','qty','unit_cost','status'];}
  else if(table==='sales'){data=S.sales;headers=['sale_date','order_number','pn','qty','source','status'];}
  rows=[headers.join(','),...data.map(r=>headers.map(h=>{const v=r[h]||'';return String(v).includes(',')?'"'+v+'"':v;}).join(','))];
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tgk_'+table+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('Exported '+data.length+' rows');
}
