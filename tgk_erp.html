// ============================================================
// SALES
// ============================================================
function renderSales(){
  if(S.activeSale){const s=S.sales.find(x=>x.id===S.activeSale);if(s)return renderSaleDetail(s);}

  // Group multi-line orders → one row per order number
  // isInternal() is a global helper — WARRANTY-/SHERROR- orders live in their own modules
  function groupSales(rows){
    const groups={},noNum=[];
    rows.forEach(s=>{
      if(isInternal(s.order_number))return; // skip warranty & shipment-error orders
      if(!s.order_number){noNum.push(s);return;}
      (groups[s.order_number]=groups[s.order_number]||[]).push(s);
    });
    const rank={'Shipped':5,'Delivered':4,'Packed':3,'On Hold':2,'Partial':2,'Open':1,'Cancelled':0,'Refunded':0};
    return [
      ...Object.values(groups).map(lines=>{
        if(lines.length===1)return lines[0];
        const lead=lines.reduce((a,b)=>(rank[b.fulfillment_status||'Open']||0)>(rank[a.fulfillment_status||'Open']||0)?b:a,lines[0]);
        const totalQty=lines.reduce((t,s)=>t+(s.qty||1),0);
        // Partial shipment: some lines shipped/delivered, others still pending
        const shippedLines=lines.filter(l=>l.fulfillment_status==='Shipped'||l.fulfillment_status==='Delivered');
        const pendingLines=lines.filter(l=>!['Shipped','Delivered','Cancelled','Refunded'].includes(l.fulfillment_status||'Open'));
        // If every pending item is On Hold the order is On Hold, not Partial —
        // it's a split that's blocked, not one that needs active fulfillment
        const allPendingOnHold=pendingLines.length>0&&pendingLines.every(l=>l.fulfillment_status==='On Hold');
        const isPartial=shippedLines.length>0&&pendingLines.length>0&&!allPendingOnHold;
        const effectiveStatus=allPendingOnHold?'On Hold':isPartial?'Partial':lead.fulfillment_status;
        // Use earliest created_at across all lines as the order timestamp
        // Use earliest sale_date (actual order date) across lines; fall back to created_at (DB insert time)
        const orderTs=lines.reduce((earliest,s)=>{const ts=s.sale_date||s.created_at;return ts&&(!earliest||ts<earliest)?ts:earliest;},'');
        return{...lead,_grouped:true,_lineCount:lines.length,_allLines:lines,qty:totalQty,pn:'Multiple',
          fulfillment_status:effectiveStatus,
          _isPartialShip:shippedLines.length>0&&pendingLines.length>0,_allPendingOnHold:allPendingOnHold,
          _shippedCount:shippedLines.length,_pendingCount:pendingLines.length,
          created_at:orderTs||lead.created_at};
      }),
      ...noNum
      // Sort by sale_date (actual order date) descending — fall back to created_at only for orders with no sale_date
    ].sort((a,b)=>new Date(b.sale_date||b.created_at||0)-new Date(a.sale_date||a.created_at||0));
  }

  // ── SINGLE SOURCE OF TRUTH: group once, derive everything from it ──────────
  // KPIs and the list BOTH come from allGrouped so the numbers always match.
  const allGrouped=groupSales(S.sales);

  const sf=S.filters.sales||{};
  const q=(sf.search||S.searchQ||'').toLowerCase();

  // Build filtered list — supports pipe-separated multi-status e.g. 'Open|Partial'
  let list=allGrouped;
  if(q)list=list.filter(s=>s.pn.toLowerCase().includes(q)||(s.order_number||'').toLowerCase().includes(q)||(s.source||'').toLowerCase().includes(q)||(s.customer_name||'').toLowerCase().includes(q));
  if(sf.fstatus){
    const allowed=new Set(sf.fstatus.split('|'));
    list=list.filter(s=>allowed.has(s.fulfillment_status||'Open'));
  }

  // KPIs — all derived from allGrouped (same as the list, just unfiltered)
  const openOrders   =allGrouped.filter(s=>(s.fulfillment_status||'Open')==='Open');
  const partialOrders=allGrouped.filter(s=>s.fulfillment_status==='Partial');
  const onHoldOrders =allGrouped.filter(s=>s.fulfillment_status==='On Hold');
  const packedOrders =allGrouped.filter(s=>s.fulfillment_status==='Packed');
  const preOrders    =allGrouped.filter(s=>s.fulfillment_status==='Pre-order');
  const freshOpen    =openOrders.filter(s=>!s.sale_date||s.sale_date>=daysAgo(60));
  const staleOpen    =openOrders.filter(s=>s.sale_date&&s.sale_date<daysAgo(60));
  const shipped7     =allGrouped.filter(s=>s.fulfillment_status==='Shipped'&&s.shipped_at&&s.shipped_at.slice(0,10)>=daysAgo(7));
  const delivered7   =allGrouped.filter(s=>s.fulfillment_status==='Delivered'&&s.shipped_at&&s.shipped_at.slice(0,10)>=daysAgo(7));
  // Revenue uses raw lines — each SKU line contributes its own value
  const rev7=S.sales.filter(s=>!isInternal(s.order_number)&&(s.sale_date||'')>=daysAgo(7))
    .reduce((t,s)=>{const a=S.assemblies.find(x=>x.pn===s.pn);return t+((a?.msrp||0)*(s.qty||1));},0);

  // "Needs action" = Open + Partial orders (has unfulfilled items)
  const needsActionStatuses='Open|Partial';

  const fstats=['Open','Pre-order','On Hold','Packed','Partial','Shipped','Delivered','Returned','Refunded','Cancelled'];

  // Detect split-shipped orders: any grouped order that has lines in different shipment states
  function isSplitOrder(orderNum){
    if(!orderNum)return false;
    const lines=S.sales.filter(x=>x.order_number===orderNum);
    if(lines.length<2)return false;
    const shipped=lines.some(x=>x.fulfillment_status==='Shipped'||x.fulfillment_status==='Delivered');
    const open=lines.some(x=>!x.fulfillment_status||x.fulfillment_status==='Open');
    return shipped&&open;
  }

  const awaitingSub=(()=>{
    const parts=[];
    if(staleOpen.length)parts.push(`<span style="color:var(--text3)">${staleOpen.length} stale</span>`);
    if(partialOrders.length)parts.push(`${partialOrders.length} partial`);
    if(packedOrders.length)parts.push(`${packedOrders.length} packed`);
    return parts.length?parts.join(' · '):'Ready to pack';
  })();

  // Filter chip active-state helper (handles single or multi-status filter values)
  function chipActive(status){
    if(!sf.fstatus)return false;
    return sf.fstatus.split('|').includes(status);
  }

  return `
  <div class="kpi-grid kpi-grid-4">
    <div class="kpi kpi-red" style="cursor:pointer" onclick="setFilter('sales','fstatus','${needsActionStatuses}')" title="Show Open + Partial orders">
      <div class="kpi-label">Awaiting Fulfillment</div>
      <div class="kpi-value">${freshOpen.length+partialOrders.length}</div>
      <div class="kpi-sub">${awaitingSub}</div>
    </div>
    <div class="kpi kpi-orange" style="cursor:pointer" onclick="setFilter('sales','fstatus','On Hold')">
      <div class="kpi-label">On Hold</div>
      <div class="kpi-value">${onHoldOrders.length}</div>
      <div class="kpi-sub">${preOrders.length?preOrders.length+' pre-order':'Awaiting release'}</div>
    </div>
    <div class="kpi kpi-teal"><div class="kpi-label">Shipped — 7 Days</div><div class="kpi-value">${shipped7.length}</div><div class="kpi-sub">${delivered7.length} delivered</div></div>
    <div class="kpi kpi-green"><div class="kpi-label">Est. Revenue — 7 Days</div><div class="kpi-value" style="font-size:17px">${fc(rev7)}</div></div>
  </div>
  ${staleOpen.length>10?`<div class="panel" style="padding:10px 18px;display:flex;gap:12px;align-items:center;border-left:3px solid var(--orange);flex-wrap:wrap">
    <span style="font-size:12px;font-weight:700;color:var(--orange)">⚠ ${staleOpen.length} orders open for 60+ days</span>
    <span style="font-size:11px;color:var(--text2);flex:1">These were likely fulfilled before the ERP was set up. Mark them as Delivered to clean up the queue.</span>
    <button class="btn btn-sm" style="color:var(--orange);border-color:rgba(234,88,12,.3)" onclick="closeHistoricalOrders()">🧹 Close old orders</button>
  </div>`:''}
  ${(S.fnStatus&&S.fnStatus.shopify===false)?`
  <div class="shopify-bar" style="border-color:var(--red);background:var(--red-dim)">
    <div class="shopify-icon" style="background:var(--red)">S</div>
    <div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--red)">⚠ Shopify Order Sync — Not Responding</div><div style="font-size:11px;color:var(--text2)">New orders may not be coming in automatically. Check the webhook function.</div></div>
    <button class="btn btn-sm" onclick="nav('integrations')">Fix →</button>
  </div>`:''}
  <div class="filter-bar">
    <div class="search-wrap"><span class="search-icon">⌕</span>
      <input placeholder="Order #, SKU or customer name…" value="${sf.search||''}" oninput="setFilter('sales','search',this.value)">
    </div>
    <button class="filter-chip ${!sf.fstatus?'on-teal':''}" onclick="setFilter('sales','fstatus','')">All</button>
    ${fstats.map(s=>`<button class="filter-chip ${chipActive(s)?'on-teal':''}" onclick="setFilter('sales','fstatus','${s}')">${s}</button>`).join('')}
    <button class="btn btn-sm" style="margin-left:auto" title="Remove duplicate order lines (same order # + SKU). Tracking numbers on surviving rows are always preserved — tracking is rescued from duplicates before they are deleted." onclick="dedupeOrders()">🧽 Dedupe & Recover Tracking</button>
    <button class="btn btn-sm" style="color:var(--teal);border-color:rgba(13,148,136,.3)" onclick="syncOrdersNow()" title="Pull new orders from Shopify + check ShipStation for holds/splits">🔄 Sync Orders</button>
    <button class="btn btn-sm" style="color:var(--orange);border-color:rgba(234,88,12,.3)" onclick="ssOrderAudit()" title="Find ShipStation orders missing from ERP and import them">📦 SS Audit</button>
    <button class="btn btn-primary btn-sm" onclick='openModal("addSale",{})'>+ Manual Order</button>
    <span class="filter-count">${list.length} orders</span>
  </div>
  <div class="tbl-wrap">
  <table><thead class="sticky-header"><tr><th>Date</th><th>Order #</th><th>Customer</th><th>SKU</th><th>Qty</th><th>Stock</th><th>Fulfillment</th><th>Tracking</th><th>Actions</th></tr></thead><tbody>
  ${list.map(s=>{
    const fs=s.fulfillment_status||'Open';
    const asm=S.assemblies.find(a=>a.pn===s.pn);
    const stock=asm?(asm.total_on_hand||0):null;
    const canFill=stock!==null&&stock>=(s.qty||1);
    const split=s._grouped&&isSplitOrder(s.order_number);
    const allOrderLines=s._grouped?S.sales.filter(x=>x.order_number===s.order_number):[];
    const dsLineCount=s._grouped?allOrderLines.filter(l=>!S.assemblies.find(a=>a.pn===l.pn)).length:0;
    const allDropShip=s._grouped&&allOrderLines.length>0&&dsLineCount===allOrderLines.length;
    const repTracking=s.tracking_number||(allOrderLines.find(x=>x.tracking_number)?.tracking_number)||'';
    const repCarrier=s.carrier||(allOrderLines.find(x=>x.tracking_number)?.carrier)||'';
    const multiTrack=s._grouped&&allOrderLines.filter(x=>x.tracking_number).map(x=>x.tracking_number).filter((v,i,a)=>a.indexOf(v)===i).length>1;
    const custName=s.customer_name||(s._grouped?S.sales.find(x=>x.order_number===s.order_number&&x.customer_name)?.customer_name:'');
    return `<tr class="rowlink" data-order="${escHtml(s.order_number||s.id)}" onclick="rowClick(event,function(){S.activeSale='${s.id}';pushHist();render()})">
    <td style="font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap">${(()=>{const ts=s.sale_date||s.created_at;if(!ts)return'—';const d=new Date(ts);const dt=d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'});const tm=(!s.sale_date&&s.created_at)?d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'';return dt+(tm?`<div style="font-size:9px;opacity:.65">${tm}</div>`:'');})()}</td>
    <td class="pn">${s.order_number||''}${s._grouped?` <span style="font-size:9px;background:var(--bg4);color:var(--text3);border:1px solid var(--border);padding:1px 5px;border-radius:8px;font-family:var(--mono);font-weight:600">${s._lineCount} items</span>`:''}</td>
    <td style="font-size:11px;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(custName||'—')}</td>
    <td class="pn" style="color:${s._grouped?'var(--text3)':'var(--teal)'}">${s._grouped?'Multiple SKUs':s.pn}</td>
    <td class="money-neutral" style="font-weight:700">${s._grouped?s.qty+' total':(s.qty||1)}</td>
    <td>${s._grouped?(allDropShip?`<span style="font-size:10px;color:var(--purple);font-weight:600">↓ Drop-ship</span>`:dsLineCount>0?`<span style="font-size:10px;color:var(--text3)">${dsLineCount} DS line${dsLineCount>1?'s':''}</span>`:`<span style="color:var(--text3)">—</span>`):stock===null?`<span style="font-size:10px;color:var(--purple);font-weight:600">↓ Drop-ship</span>`:`<span class="money" style="color:${canFill?'var(--green)':'var(--red)'};font-weight:700">${stock}</span>`}</td>
    <td>${fsPill(s.fulfillment_status||'Open')}${s._isPartialShip?` <span style="font-size:9px;color:${s._allPendingOnHold?'var(--orange)':'var(--yellow)'};font-weight:700">✂ ${s._shippedCount} shipped · ${s._pendingCount} ${s._allPendingOnHold?'on hold':'pending'}</span>`:''}${s.on_hold&&!s._isPartialShip?` <span style="font-size:9px;color:var(--orange);font-weight:700">⏸ Hold</span>`:''}</td>
    <td style="font-size:10px;font-family:var(--mono)">${multiTrack?`<span style="color:var(--yellow)" title="${allOrderLines.filter(x=>x.tracking_number).map(x=>(x.carrier?x.carrier+' ':'')+x.tracking_number).join('\n')}">🔀 ${allOrderLines.filter(x=>x.tracking_number).map(x=>x.tracking_number).filter((v,i,a)=>a.indexOf(v)===i).length} shipments</span>`:repTracking?`<a href="${trackingUrl(repCarrier,repTracking)}" target="_blank" style="color:var(--teal);text-decoration:none" title="Track ${repCarrier} ${repTracking}">${repCarrier?repCarrier+' ':''}${repTracking} ↗</a>`:'<span style="color:var(--text3)">—</span>'}</td>
    <td style="display:flex;gap:4px">
      ${fs==='Open'&&stock!==null?`<button class="btn btn-teal btn-sm" ${canFill?'':'disabled title="Insufficient stock"'} onclick="markPacked('${s.id}','${s.pn}',${s.qty||1})">Pack</button>`:''}
      ${fs==='Open'&&stock===null&&!s._grouped?`<button class="btn btn-sm" style="color:var(--purple);border-color:rgba(124,58,237,.3)" title="Drop-ship: no ERP stock record — mark shipped directly" onclick="openDropShipModal('${s.id}','${s.pn}',${s.qty||1})">↓ Drop Ship</button>`:''}
      ${fs==='Open'&&s._grouped&&allDropShip?`<button class="btn btn-sm" style="color:var(--purple);border-color:rgba(124,58,237,.3)" title="All lines are drop-ship — mark entire order as shipped" onclick="openDropShipAllModal('${s.order_number}')">↓ Drop Ship All</button>`:''}
      ${fs==='Packed'?`<button class="btn btn-primary btn-sm" onclick="openShipModal('${s.id}','${s.pn}',${s.qty||1})">🚚 Ship</button>`:''}
      ${fs==='Packed'?`<button class="action-btn" title="Undo pack — return stock, reset to Open" onclick="unpackSaleOrder('${s.id}','${s.pn}',${s.qty||1})">↩ Unpack</button>`:''}
      ${fs==='Shipped'?`<button class="action-btn" onclick="markDelivered('${s.id}')">✓ Delivered</button>`:''}
      ${fs==='Open'||fs==='On Hold'?`<button class="action-btn" onclick="cancelOrder('${s.id}')">Cancel</button>`:''}
      <button class="action-btn del" onclick="deleteSale('${s.id}')">×</button>
    </td>
  </tr>`;}).join('')}
  </tbody></table></div>`;
}

function saleMovements(pns){
  const moves=S.corrections.filter(c=>pns.includes(c.pn)).slice(0,10);
  if(!moves.length)return'<div class="section-empty">None</div>';
  return moves.map(c=>`<div class="check-row">
    <span class="text-xs text-mono text-muted" style="min-width:70px">${new Date(c.created_at).toLocaleDateString()}</span>
    <span class="pn text-mono" style="min-width:110px">${c.pn}</span>
    <span class="${c.adjustment>0?'money-vendor':'money-cost'}" style="font-weight:700;min-width:44px">${c.adjustment>0?'+':''}${c.adjustment}</span>
    <span class="text-sm ellipsis" style="flex:1;color:var(--text2)">${c.reason||c.source}</span>
  </div>`).join('');
}

function renderSaleDetail(s){
  // ALL lines on this order (including the lead line s)
  const allLines=s.order_number
    ? S.sales.filter(x=>x.order_number===s.order_number).sort((a,b)=>a.pn.localeCompare(b.pn))
    : [s];
  const isMulti=allLines.length>1;
  const fsMap=FS_MAP;
  const rank={'Delivered':5,'Shipped':4,'Packed':3,'On Hold':2,'Partial':2,'Open':1,'Refunded':0,'Cancelled':0};

  // Order-level status = most progressed line
  const orderFs=allLines.reduce((best,x)=>
    (rank[x.fulfillment_status||'Open']||0)>(rank[best]||0)?x.fulfillment_status:best,
    allLines[0].fulfillment_status||'Open');

  // Split shipment: at least one line shipped AND at least one still open/pending
  const shippedLines=allLines.filter(x=>x.fulfillment_status==='Shipped'||x.fulfillment_status==='Delivered');
  const openLines=allLines.filter(x=>(x.fulfillment_status||'Open')==='Open');
  const heldLines=allLines.filter(x=>x.fulfillment_status==='On Hold');
  const packedLines=allLines.filter(x=>x.fulfillment_status==='Packed');
  const pendingLines=allLines.filter(x=>!['Shipped','Delivered','Cancelled','Refunded'].includes(x.fulfillment_status||'Open'));
  const isSplit=shippedLines.length>0&&pendingLines.length>0;
  const detailOrderFs=isSplit?'Partial':allLines.reduce((best,x)=>
    (rank[x.fulfillment_status||'Open']||0)>(rank[best]||0)?x.fulfillment_status:best,
    allLines[0].fulfillment_status||'Open');

  // Multiple distinct tracking numbers = split shipment
  const uniqueTrackings=[...new Set(allLines.filter(x=>x.tracking_number).map(x=>x.tracking_number))];
  const uniqueCarriers=[...new Set(allLines.filter(x=>x.tracking_number).map(x=>x.carrier||''))];

  // Order-level: can we pack ALL open lines?
  const allCanPack=allLines.every(x=>{
    if((x.fulfillment_status||'Open')!=='Open')return true;
    const a=S.assemblies.find(a=>a.pn===x.pn);
    if(!a)return true; // drop-ship line — no stock to check, has its own fulfillment button
    return(a.total_on_hand||0)>=(x.qty||1);
  });

  // Financial / cancel info (from any line that has it set)
  const finLine=allLines.find(x=>x.financial_status)||allLines[0];
  const financial=finLine?.financial_status||'';
  const cancelledAt=allLines.find(x=>x.cancelled_at)?.cancelled_at;
  const cancelReason=allLines.find(x=>x.cancel_reason)?.cancel_reason;
  const refundAmt=allLines.reduce((t,x)=>t+(x.refund_amount||0),0);
  const onHold=allLines.some(x=>x.on_hold);

  const moves=S.corrections.filter(c=>allLines.some(l=>l.pn===c.pn)).slice(0,8);

  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-sm" onclick="S.activeSale=null;render()">← Sales</button>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700;color:var(--text)">
        Order ${s.order_number||'(no #)'}
        ${fsPill(detailOrderFs)}
        ${isMulti?`<span style="font-size:10px;background:var(--bg4);color:var(--text3);border:1px solid var(--border);padding:1px 7px;border-radius:8px;margin-left:6px;font-family:var(--mono)">${allLines.length} items</span>`:''}
        ${isSplit?`<span style="font-size:10px;background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(217,119,6,.25);padding:1px 7px;border-radius:8px;margin-left:4px;font-weight:700">✂ ${shippedLines.length} shipped · ${pendingLines.length} pending</span>`:''}
        ${onHold&&!isSplit?`<span style="font-size:10px;background:var(--orange-dim);color:var(--orange);border:1px solid rgba(234,88,12,.25);padding:1px 7px;border-radius:8px;margin-left:4px;font-weight:700">⏸ On Hold</span>`:''}
      </div>
      <div style="font-size:11px;color:var(--text3)">${s.sale_date?s.sale_date.slice(0,10):''} · ${s.source||'—'}${financial?' · <span style="color:var(--text2)">'+financial+'</span>':''}${allLines[0]?.customer_name?` · <span style="color:var(--text2);font-weight:600">${escHtml(allLines[0].customer_name)}</span>`:''}</div>
    </div>
    <button class="btn btn-sm" style="color:var(--teal);border-color:rgba(13,148,136,.3)" onclick="openEditOrderModal('${escHtml(s.order_number||s.id)}')">✏ Edit Order</button>
    ${openLines.length?`<button class="btn btn-teal" ${allCanPack?'':'disabled title="Insufficient stock on one or more items"'} onclick="packAllLines('${s.order_number||s.id}')">Pack All (${openLines.length})</button>`:''}
    ${packedLines.length?`<button class="btn btn-primary" onclick="openShipModal('${packedLines[0].id}','${packedLines[0].pn}',${packedLines[0].qty||1})">🚚 Ship</button>`:''}
    ${packedLines.length?`<button class="btn btn-sm" style="color:var(--orange)" onclick="unpackSaleOrder('${s.id}','${s.pn==='Multiple'?'':s.pn}',${s.qty||1})">↩ Unpack</button>`:''}
    ${detailOrderFs==='Shipped'?`<button class="btn btn-teal" onclick="markDelivered('${s.id}')">✓ Delivered</button>`:''}
    ${detailOrderFs==='Shipped'?`<button class="btn btn-sm" onclick="checkDelivery('${s.order_number||''}','${s.id}')">🔄 Check Delivery</button>`:''}
    <button class="btn btn-sm" style="color:var(--teal);border-color:rgba(13,148,136,.3)" onclick="fetchOrderTracking('${s.order_number||s.id}')" title="Ask ShipStation for this order's shipment status and tracking">📡 Get Tracking</button>
    ${['Open','Packed','On Hold','Partial'].includes(detailOrderFs)?`<button class="btn" onclick="cancelOrder('${s.id}')">Cancel</button>`:''}
  </div>

  ${(cancelledAt||financial==='refunded'||financial==='partially_refunded')?`
  <div class="panel" style="padding:10px 16px;margin-bottom:10px;border-left:3px solid ${financial==='refunded'?'var(--purple)':'var(--red)'}">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:16px">${financial==='refunded'||financial==='partially_refunded'?'↩':'🚫'}</div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text)">${financial==='refunded'?'Order Refunded':financial==='partially_refunded'?'Partially Refunded':'Order Cancelled'}</div>
        <div style="font-size:11px;color:var(--text3)">${cancelledAt?'Cancelled '+new Date(cancelledAt).toLocaleDateString():''}${cancelReason?' · Reason: '+cancelReason:''}${refundAmt>0?' · Refund: '+fc(refundAmt):''}</div>
      </div>
    </div>
  </div>`:''}

  ${uniqueTrackings.length>0?`
  <div class="panel" style="padding:0;margin-bottom:10px">
    <div class="section-header">📦 Shipments${uniqueTrackings.length>1?' — Split ('+uniqueTrackings.length+' packages)':''}</div>
    ${uniqueTrackings.map((tn,i)=>{
      const tLine=allLines.find(x=>x.tracking_number===tn);
      const cr=tLine?.carrier||uniqueCarriers[i]||'';
      // Which SKUs in this shipment?
      const skusInShipment=allLines.filter(x=>x.tracking_number===tn).map(x=>x.pn);
      return `<div class="check-row" style="cursor:pointer" onclick="window.open(trackingUrl('${cr}','${tn}'),'_blank')">
        <span class="pill pill-muted" style="min-width:52px;justify-content:center">${cr||'?'}</span>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:700;color:var(--teal)">${tn} ↗</div>
          ${skusInShipment.length?`<div style="font-size:10px;color:var(--text3)">${skusInShipment.join(', ')}</div>`:''}
        </div>
        ${tLine?.shipped_at?`<span style="font-size:10px;color:var(--text3)">${new Date(tLine.shipped_at).toLocaleDateString()}</span>`:''}
        ${tLine?.delivered_at?`<span class="pill pill-teal" style="font-size:9px">✓ Delivered</span>`:''}
      </div>`;
    }).join('')}
  </div>`:''}

  ${isSplit?`<div class="panel" style="padding:8px 14px;margin-bottom:10px;border-left:3px solid var(--yellow);background:var(--yellow-dim)">
    <div style="font-size:12px;font-weight:700;color:var(--yellow)">🔀 Split Shipment</div>
    <div style="font-size:11px;color:var(--text2);margin-top:2px">${shippedLines.length} item${shippedLines.length>1?'s':''} shipped · ${openLines.length} still awaiting fulfillment</div>
  </div>`:''}

  <div class="tbl-wrap" style="margin-bottom:14px">
  <table><thead class="sticky-header"><tr>
    <th>SKU</th><th>Description</th><th>Qty</th>
    <th>In Stock</th><th>Status</th><th>Tracking</th><th>Actions</th>
  </tr></thead><tbody>
  ${allLines.map(line=>{
    const la=S.assemblies.find(a=>a.pn===line.pn);
    const lstock=la?(la.total_on_hand||0):null;
    const lfs=line.fulfillment_status||'Open';
    const lcanFill=lstock!==null&&lstock>=(line.qty||1);
    return `<tr>
      <td class="pn rowlink" style="color:var(--teal)" onclick="lookupGo('assembly','${line.pn}')">${line.pn} ↗</td>
      <td style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${la?.description||''}</td>
      <td class="money-neutral" style="font-weight:700">${line.qty||1}</td>
      <td class="money" style="color:${lstock===null?'var(--text3)':lcanFill?'var(--green)':'var(--red)'};font-weight:700">
        ${lstock===null?'<span style="color:var(--purple);font-weight:600;font-size:10px">↓ Drop-ship</span>':lstock}
        ${lstock!==null&&!lcanFill?`<span style="font-size:9px;color:var(--red)"> (need ${(line.qty||1)-lstock} more)</span>`:''}
      </td>
      <td>${fsPill(lfs)}</td>
      <td style="font-size:10px;font-family:var(--mono)">${line.tracking_number?`<a href="${trackingUrl(line.carrier||'',line.tracking_number)}" target="_blank" style="color:var(--teal);text-decoration:none">${line.carrier?line.carrier+' ':''}${line.tracking_number} ↗</a>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td style="white-space:nowrap;display:flex;gap:4px">
        ${lfs==='Open'&&lstock!==null?`<button class="btn btn-teal btn-sm" ${lcanFill?'':'disabled'} onclick="markPacked('${line.id}','${line.pn}',${line.qty||1})">Pack</button>`:''}
        ${lfs==='Open'&&lstock===null?`<button class="btn btn-sm" style="color:var(--purple);border-color:rgba(124,58,237,.3)" title="Drop-ship: mark shipped directly — no inventory deduction" onclick="openDropShipModal('${line.id}','${line.pn}',${line.qty||1})">↓ Drop Ship</button>`:''}
        ${lfs==='Packed'?`<button class="btn btn-primary btn-sm" onclick="openShipModal('${line.id}','${line.pn}',${line.qty||1})">Ship</button>`:''}
        ${lfs==='Packed'?`<button class="action-btn" onclick="unpackSaleOrder('${line.id}','${line.pn}',${line.qty||1})">↩ Unpack</button>`:''}
        ${lfs==='Shipped'?`<button class="action-btn" onclick="markDelivered('${line.id}')">✓ Delivered</button>`:''}
        ${lfs==='Shipped'?`<button class="action-btn" style="color:var(--orange);border-color:rgba(234,88,12,.3)" title="Un-ship: restore inventory and revert this line to Open or On Hold" onclick="unshipLine('${line.id}','${line.pn}',${line.qty||1})">↩ Un-ship</button>`:''}
        ${(lfs==='Shipped'||lfs==='Delivered')?`<button class="action-btn" style="color:var(--red);border-color:rgba(220,38,38,.3)" title="Process a return for this item" onclick="openReturnModal('${line.id}','${line.pn}',${line.qty||1},'${escHtml(line.order_number||s.order_number||'')}')">↩ Return</button>`:''}
        ${lfs==='Open'?`<button class="action-btn" style="color:var(--purple);border-color:rgba(124,58,237,.3)" title="Mark as Pre-order — item not yet available" onclick="markPreorder('${line.id}')">Pre-order</button>`:''}

      </td>
    </tr>`;}).join('')}
  </tbody></table></div>

  <div class="panel" style="padding:0"><div class="section-header">Stock movements — this order</div>
  ${moves.length===0?'<div class="section-empty">None</div>':moves.map(c=>`<div class="check-row">
    <span style="font-size:10px;font-family:var(--mono);color:var(--text3);min-width:70px">${new Date(c.created_at).toLocaleDateString()}</span>
    <span class="pn" style="min-width:110px;color:var(--text)">${c.pn}</span>
    <span class="${c.adjustment>0?'money-vendor':'money-cost'}" style="font-weight:700;min-width:44px">${c.adjustment>0?'+':''}${c.adjustment}</span>
    <span style="flex:1;font-size:11px;color:var(--text2)">${c.reason||c.source}</span>
  </div>`).join('')}</div>`;
}

// Pack all open lines on an order at once
async function packAllLines(orderNumOrId){
  const lines=S.sales.filter(s=>s.order_number===orderNumOrId||(s.id===orderNumOrId)).filter(s=>(s.fulfillment_status||'Open')==='Open');
  if(!lines.length){toast('No open lines to pack');return;}
  for(const line of lines){
    await markPacked(line.id,line.pn,line.qty||1);
  }
}

async function unpackSaleOrder(saleId, pn, qty){
  const sale=S.sales.find(s=>s.id===saleId);

  // Resolve all lines to unpack: if grouped row (pn='Multiple'), get every line on this order
  let linesToUnpack=[];
  if(pn==='Multiple'||!pn){
    const orderNum=sale?.order_number;
    linesToUnpack=orderNum?S.sales.filter(s=>s.order_number===orderNum&&s.fulfillment_status==='Packed'):[sale].filter(Boolean);
  } else {
    linesToUnpack=[sale].filter(Boolean);
  }
  if(!linesToUnpack.length){toast('No packed lines found to unpack');return;}

  const lineDesc=linesToUnpack.length>1?linesToUnpack.length+' lines':'1× '+pn;
  if(!confirm('Unpack '+lineDesc+'?\nReturns finished goods to stock and resets order to Open.'))return;

  const undoOps=[];

  for(const line of linesToUnpack){
    const linePn=line.pn; const lineQty=line.qty||1;
    // Return assembly stock
    const asm=S.assemblies.find(a=>a.pn===linePn);
    if(asm){
      const newOh=(asm.total_on_hand||0)+lineQty;
      undoOps.push({action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm}});
      const{error:aErr}=await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',asm.id);
      if(aErr){toast('Error updating stock for '+linePn+': '+aErr.message);return;}
      S.assemblies=S.assemblies.map(a=>a.pn===linePn?{...a,total_on_hand:newOh}:a);
      const{data:corrRow}=await db.from('inv_corrections').insert({pn:linePn,previous_qty:asm.total_on_hand||0,new_qty:newOh,adjustment:lineQty,reason:'Order unpacked — '+(line.order_number||saleId),source:'unpack'}).select().single();
      if(corrRow)undoOps.push({action:'insert',table:'inv_corrections',data:corrRow});
    }
    // Reset sale line to Open
    undoOps.push({action:'update',table:'sales',data:{...line,fulfillment_status:'Open'},prev:{...line}});
    const{error:sErr}=await db.from('sales').update({fulfillment_status:'Open'}).eq('id',line.id);
    if(sErr){toast('Error resetting order: '+sErr.message);return;}
    S.sales=S.sales.map(s=>s.id===line.id?{...s,fulfillment_status:'Open'}:s);
  }

  pushUndoMulti('Unpack order '+(sale?.order_number||''),undoOps);
  toast('Unpacked '+lineDesc+' — stock returned, order Open');
  render();
}

async function processReturn(saleId, pn, qty, orderNum){
  const reason=document.getElementById('ret-reason')?.value||'Return';
  const condition=document.getElementById('ret-condition')?.value||'Resellable';
  const notes=document.getElementById('ret-notes')?.value.trim()||'';
  const createWarranty=document.getElementById('ret-create-warranty')?.checked||false;
  const line=S.sales.find(s=>s.id===saleId);
  if(!line){toast('Order line not found');return;}

  const undoOps=[];

  // 1. Restore inventory if resellable
  if(condition==='Resellable'){
    const asm=S.assemblies.find(a=>a.pn===pn);
    if(asm){
      const prev=asm.total_on_hand||0;
      const newOh=prev+qty;
      await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',asm.id);
      S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newOh}:a);
      undoOps.push({action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm}});
      const{data:corr}=await db.from('inv_corrections').insert({
        pn,previous_qty:prev,new_qty:newOh,adjustment:qty,
        reason:'Return — '+reason+' (order '+orderNum+')',
        source:'return'
      }).select().single();
      if(corr){S.corrections=[corr,...S.corrections];}
    }
  }

  // 2. Mark the sale line as Returned
  await db.from('sales').update({fulfillment_status:'Returned'}).eq('id',saleId);
  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:'Returned'}:s);
  undoOps.push({action:'update',table:'sales',data:{id:saleId,fulfillment_status:'Returned'},prev:{id:saleId,fulfillment_status:line.fulfillment_status}});

  // 3. Optionally create warranty claim
  if(createWarranty||(condition==='Defective'&&confirm('Create a warranty claim for this defective return?'))){
    const{data:wc}=await db.from('warranty_claims').insert({
      order_number:orderNum,pn,qty,
      issue:reason+(notes?': '+notes:''),
      status:'Open',
      created_at:new Date().toISOString()
    }).select().single();
    if(wc)S.warrantyClaims=[wc,...S.warrantyClaims];
    toast('Return processed + warranty claim created',4000);
  }else{
    toast('↩ Return processed — '+(condition==='Resellable'?qty+' unit(s) restored to stock':'no stock change'),4000);
  }

  pushUndoMulti('Return '+pn+' on order '+orderNum,undoOps);
  closeModal();
  await refreshSales();
  render();
}

// ── UN-SHIP: reverses a Shipped line — restores inventory, clears tracking, resets status ──
async function unshipLine(saleId, pn, qty){
  const line=S.sales.find(s=>s.id===saleId);
  if(!line||line.fulfillment_status!=='Shipped'){toast('Line is not Shipped');return;}

  const targetStatus=confirm(
    `Un-ship ${pn} × ${qty} on order ${line.order_number||''}?\n\n`+
    `• Restores ${qty} unit(s) to stock\n• Clears tracking from this line\n\n`+
    `OK → set back to Open\nCancel → set back to On Hold`
  )?'Open':'On Hold';

  const asm=S.assemblies.find(a=>a.pn===pn);
  const undoOps=[];

  // Restore assembly inventory
  if(asm){
    const prev=asm.total_on_hand||0;
    const newOh=prev+qty;
    undoOps.push({action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm}});
    await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',asm.id);
    S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newOh}:a);
    const{data:corr}=await db.from('inv_corrections').insert({
      pn,previous_qty:prev,new_qty:newOh,adjustment:qty,
      reason:`Un-ship — order ${line.order_number||saleId} reverted to ${targetStatus}`,
      source:'unship'
    }).select().single();
    if(corr){S.corrections=[corr,...S.corrections];undoOps.push({action:'insert',table:'inv_corrections',data:corr});}
  }

  // Reset the sale line: clear tracking + revert status
  undoOps.push({action:'update',table:'sales',
    data:{id:saleId},
    prev:{id:saleId,fulfillment_status:'Shipped',tracking_number:line.tracking_number,carrier:line.carrier,shipped_at:line.shipped_at}
  });
  const{error}=await db.from('sales').update({
    fulfillment_status:targetStatus,
    tracking_number:null,
    carrier:null,
    shipped_at:null
  }).eq('id',saleId);
  if(error){toast('Error reverting line: '+error.message);return;}

  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:targetStatus,tracking_number:null,carrier:null,shipped_at:null}:s);
  pushUndoMulti(`Un-ship ${pn} on order ${line.order_number||''}`,undoOps);
  await refreshSales();
  render();
  toast(`✓ ${pn} → ${targetStatus} · ${qty} unit${qty>1?'s':''} restored to stock`);
}

async function dedupeOrders(){
  const el=document.getElementById('shopify-import-status');
  function prog(t){toast(t,2000);console.log('[dedupe]',t);}

  // ── Step 1: Paginate through ALL sales rows (avoids Supabase 1000-row default cap) ──
  prog('🔍 Scanning full database for duplicates…');
  let allRows=[], from=0, batchSize=1000, keepFetching=true;
  while(keepFetching){
    const{data,error}=await db.from('sales')
      .select('id,order_number,pn,fulfillment_status,tracking_number,carrier,shipped_at,sale_date,qty,source,created_at')
      .not('order_number','is',null)
      .order('created_at',{ascending:true})
      .range(from,from+batchSize-1);
    if(error){toast('Error scanning: '+error.message);return;}
    if(!data||data.length===0)break;
    allRows=[...allRows,...data];
    if(data.length<batchSize)keepFetching=false;
    else from+=batchSize;
    if(allRows.length%5000===0)prog(`Scanned ${allRows.length} rows…`);
  }
  prog(`Scanned ${allRows.length} total rows`);

  // ── Step 2: Group by order_number+pn, find duplicates ──
  const rank={'Delivered':6,'Shipped':5,'Packed':4,'Partial':3,'On Hold':2,'Open':1,'Refunded':0,'Cancelled':0};
  const groups={};
  allRows.forEach(s=>{
    const k=(s.order_number||'')+'||'+(s.pn||'');
    (groups[k]=groups[k]||[]).push(s);
  });
  const dupes=Object.values(groups).filter(g=>g.length>1);

  if(!dupes.length){toast('✓ No duplicates found — all order lines are unique');return;}

  const totalExtra=dupes.reduce((t,g)=>t+g.length-1,0);
  const trackingGroups=dupes.filter(g=>g.some(r=>r.tracking_number)).length;

  if(!confirm(
    `Found ${totalExtra} duplicate line${totalExtra>1?'s':''} across ${dupes.length} order+SKU combinations.\n\n`+
    (trackingGroups?`📦 Tracking numbers will be rescued to the surviving row.\n\n`:'')+
    `The row with the highest fulfillment status (or tracking number) is kept.\nAll others are deleted.\n\n`+
    `Proceed? This will delete ${totalExtra} rows.`
  ))return;

  // ── Step 3: Determine winners, rescue tracking, collect IDs to delete ──
  const idsToDelete=[];
  const trackingPatches=[]; // [{id, tracking_number, carrier, shipped_at}]

  for(const g of dupes){
    // Sort: rows with tracking first, then by status rank, then keep oldest (created_at asc)
    g.sort((a,b)=>{
      const ta=a.tracking_number?1:0, tb=b.tracking_number?1:0;
      if(tb!==ta)return tb-ta;
      const ra=rank[a.fulfillment_status||'Open']||0, rb=rank[b.fulfillment_status||'Open']||0;
      if(rb!==ra)return rb-ra;
      return new Date(a.created_at)-new Date(b.created_at); // oldest wins (original record)
    });
    const winner=g[0];
    const losers=g.slice(1);

    // Rescue tracking from a loser if winner has none
    if(!winner.tracking_number){
      const donor=losers.find(l=>l.tracking_number);
      if(donor)trackingPatches.push({id:winner.id,tracking_number:donor.tracking_number,carrier:donor.carrier||null,shipped_at:donor.shipped_at||winner.shipped_at,fulfillment_status:donor.fulfillment_status||winner.fulfillment_status});
    }
    losers.forEach(l=>idsToDelete.push(l.id));
  }

  // ── Step 4: Apply tracking patches ──
  let rescued=0;
  for(const patch of trackingPatches){
    const{id,...fields}=patch;
    await db.from('sales').update(fields).eq('id',id);
    rescued++;
  }
  if(rescued)prog(`Rescued tracking on ${rescued} rows`);

  // ── Step 5: Batch delete in chunks of 200 ──
  prog(`Deleting ${idsToDelete.length} duplicate rows…`);
  const CHUNK=200;
  let deleted=0;
  for(let i=0;i<idsToDelete.length;i+=CHUNK){
    const batch=idsToDelete.slice(i,i+CHUNK);
    const{error}=await db.from('sales').delete().in('id',batch);
    if(error){toast('Delete error: '+error.message);break;}
    deleted+=batch.length;
    if(idsToDelete.length>500)prog(`Deleted ${deleted} of ${idsToDelete.length}…`);
  }

  // ── Step 6: Reload and re-render ──
  await refreshSales();
  render();
  toast(`✓ Cleaned up ${deleted} duplicate${deleted!==1?'s':''}${rescued?' · rescued tracking on '+rescued+' orders':''}`);
}

async function closeHistoricalOrders(){
  const cutoff=prompt('Mark all Open orders BEFORE this date as Delivered (pre-system orders).\nFormat: YYYY-MM-DD','2026-06-01');
  if(!cutoff)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(cutoff.trim())){toast('Use YYYY-MM-DD format');return;}
  const targets=S.sales.filter(s=>(!s.fulfillment_status||s.fulfillment_status==='Open')&&s.sale_date&&s.sale_date.slice(0,10)<cutoff.trim());
  if(!targets.length){toast('No open orders before '+cutoff);return;}
  if(!confirm('Mark '+targets.length+' historical orders as Delivered? (No stock changes — these were fulfilled before the system existed.)'))return;
  const{error}=await db.from('sales').update({fulfillment_status:'Delivered'}).lt('sale_date',cutoff.trim()).or('fulfillment_status.is.null,fulfillment_status.eq.Open');
  if(error){toast('Error: '+error.message);return;}
  S.sales=S.sales.map(s=>((!s.fulfillment_status||s.fulfillment_status==='Open')&&s.sale_date&&s.sale_date.slice(0,10)<cutoff.trim())?{...s,fulfillment_status:'Delivered'}:s);
  toast(targets.length+' historical orders closed as Delivered');render();
}

// ── Fulfillment actions ──
async function markPacked(saleId,pn,qty){
  const asm=S.assemblies.find(a=>a.pn===pn);
  if(!asm){toast('Assembly '+pn+' not found');return;}
  if((asm.total_on_hand||0)<qty){toast('Insufficient stock — have '+(asm.total_on_hand||0)+', need '+qty);return;}
  const sale=S.sales.find(s=>s.id===saleId);
  const newOh=(asm.total_on_hand||0)-qty;
  const{error:ae}=await db.from('assemblies').update({total_on_hand:newOh}).eq('id',asm.id);
  if(ae){toast('Stock update failed: '+ae.message);return;}
  S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newOh}:a);
  await db.from('inv_corrections').insert({pn,previous_qty:asm.total_on_hand||0,new_qty:newOh,adjustment:-qty,reason:'Packed — order '+(sale?.order_number||saleId),source:'pack'});
  const{error:se}=await db.from('sales').update({fulfillment_status:'Packed'}).eq('id',saleId);
  if(se){toast('Sale update failed: '+se.message);return;}
  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:'Packed'}:s);
  pushUndoMulti('Pack order '+(sale?.order_number||''),[
    {action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm}},
    {action:'update',table:'sales',data:{id:saleId,fulfillment_status:'Packed'},prev:{id:saleId,fulfillment_status:sale?.fulfillment_status||'Open'}}
  ]);
  toast('Packed '+qty+'× '+pn);render();
}

async function submitShipment(saleId,pn,qty){
  const tracking=document.getElementById('ship-tracking').value.trim();
  const carrier=document.getElementById('ship-carrier').value;
  const asm=S.assemblies.find(a=>a.pn===pn);
  if(!asm){toast('Assembly not found — cannot deduct stock');return;}
  const prev=asm.total_on_hand||0;
  const newOh=prev-qty;
  // Deduct assembly inventory
  await db.from('assemblies').update({total_on_hand:newOh,updated_at:new Date().toISOString()}).eq('id',asm.id);
  S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newOh}:a);
  // Log correction
  await db.from('inv_corrections').insert({pn,previous_qty:prev,new_qty:newOh,adjustment:-qty,reason:'Shipped order'+(tracking?' — '+tracking:''),source:'shipment',});
  S.corrections=[{pn,previous_qty:prev,new_qty:newOh,adjustment:-qty,reason:'Shipped order',source:'shipment',created_at:new Date().toISOString()},...S.corrections];
  // Update sale
  await db.from('sales').update({fulfillment_status:'Shipped',tracking_number:tracking,carrier,shipped_at:new Date().toISOString()}).eq('id',saleId);
  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:'Shipped',tracking_number:tracking,carrier,shipped_at:new Date().toISOString()}:s);
  const saleRow=S.sales.find(s=>s.id===saleId);
  pushUndoMulti('Ship '+qty+'×'+pn,[
    {action:'update',table:'assemblies',data:{...asm,total_on_hand:newOh},prev:{...asm,total_on_hand:prev}},
    {action:'update',table:'sales',data:{id:saleId},prev:{...stripMeta(saleRow||{}),id:saleId,fulfillment_status:saleRow?.fulfillment_status||'Packed',tracking_number:saleRow?.tracking_number||'',carrier:saleRow?.carrier||'',shipped_at:null}}
  ]);
  updateBadge();closeModal();
  toast('Shipped '+qty+'× '+pn+' — stock deducted'+(tracking?' · '+tracking:''));
  render();
}

async function submitDropShipAll(orderNum){

      fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now
    }).eq('id',line.id);

    S.sales=S.sales.map(s=>s.id===line.id?{...s,fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now}:s);

    });

  closeModal();
  if(errors)toast('↓ Shipped '+shipped+' lines, '+errors+' errors');

}

async function submitDropShipment(saleId,pn,qty){
  const tracking=document.getElementById('ds-tracking').value.trim();
  const carrier=document.getElementById('ds-carrier').value;
  const sale=S.sales.find(s=>s.id===saleId);
  const now=new Date().toISOString();
  // Mark shipped — no inventory deduction (supplier ships directly)
  const{error}=await db.from('sales').update({
    fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now
  }).eq('id',saleId);
  if(error){toast('Error: '+error.message);return;}
  // Audit trail — source 'dropship' so corrections log shows no stock movement
  await db.from('inv_corrections').insert({
    pn,previous_qty:0,new_qty:0,adjustment:0,
    reason:'Drop-ship — order '+(sale?.order_number||saleId)+(tracking?' · '+tracking:''),
    source:'dropship'
  });
  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:'Shipped',tracking_number:tracking||null,carrier:carrier||null,shipped_at:now}:s);
  pushUndoMulti('Drop-ship '+qty+'×'+pn,[
    {action:'update',table:'sales',data:{id:saleId,fulfillment_status:'Shipped'},prev:{id:saleId,fulfillment_status:sale?.fulfillment_status||'Open',tracking_number:sale?.tracking_number||null,carrier:sale?.carrier||null,shipped_at:null}}
  ]);
  updateBadge();closeModal();
  toast('↓ Drop-shipped '+qty+'× '+pn+(tracking?' · '+tracking:''));
  render();
}

async function markDelivered(saleId){
  const sale=S.sales.find(s=>s.id===saleId);
  const now=new Date().toISOString();
  const{error}=await db.from('sales').update({fulfillment_status:'Delivered',delivered_at:now}).eq('id',saleId);
  if(error){toast('Error: '+error.message);return;}
  S.sales=S.sales.map(s=>s.id===saleId?{...s,fulfillment_status:'Delivered',delivered_at:now}:s);

}

async function submitEditOrder(originalOrderNumOrId){
  const lines=S.sales.filter(function(s){return s.order_number===originalOrderNumOrId||s.id===originalOrderNumOrId;});
  if(!lines.length){toast('Order not found');return;}

  const newOrderNum=(document.getElementById('eo-ordernum')?.value||'').trim()||originalOrderNumOrId;
  const customer=(document.getElementById('eo-customer')?.value||'').trim();
  const email=(document.getElementById('eo-email')?.value||'').trim();
  const date=document.getElementById('eo-date')?.value||'';
  const source=(document.getElementById('eo-source')?.value||'').trim();
  const now=new Date().toISOString();
  const basePayload={order_number:newOrderNum,customer_name:customer,customer_email:email||null,sale_date:date||null,source,updated_at:now};

  const tbody=document.getElementById('eo-lines-body');
  const rows=tbody?[...tbody.querySelectorAll('tr[data-line-id]')]:[];

  let errors=0,saved=0,deleted=0,added=0;

  for(const row of rows){
    const lineId=row.dataset.lineId;
    const isNew=row.dataset.isNew==='1';
    const isDeleted=row.dataset.deleted==='1';

    const pn=(row.querySelector('[data-field="pn"]')?.value||'').trim();
    const qty=parseInt(row.querySelector('[data-field="qty"]')?.value)||1;
    const status=row.querySelector('[data-field="status"]')?.value||'Open';
    const tracking=(row.querySelector('[data-field="tracking"]')?.value||'').trim()||null;
    const carrier=row.querySelector('[data-field="carrier"]')?.value||null;

    if(isDeleted&&isNew){continue;} // new line deleted before saving — skip

    if(isDeleted&&!isNew){
      // Delete existing line from DB
      const{error}=await db.from('sales').delete().eq('id',lineId);
      if(error){errors++;console.error('Delete',lineId,error.message);}
      else{S.sales=S.sales.filter(function(s){return s.id!==lineId;});deleted++;}
    } else if(isNew){
      if(!pn)continue; // skip blank new lines
      const{data,error}=await db.from('sales').insert(Object.assign({},basePayload,{pn,qty,fulfillment_status:status,tracking_number:tracking,carrier:carrier||null})).select().single();
      if(error){errors++;console.error('Insert',error.message);}
      else{S.sales=[...S.sales,data];added++;}
    } else {
      // Update existing line
      const payload=Object.assign({},basePayload,{pn,qty,fulfillment_status:status,tracking_number:tracking,carrier:carrier||null});
      const{error}=await db.from('sales').update(payload).eq('id',lineId);
      if(error){errors++;console.error('Update',lineId,error.message);}
      else{S.sales=S.sales.map(function(s){return s.id===lineId?Object.assign({},s,payload):s;});saved++;}
    }
  }

  document.getElementById('edit-order-overlay')?.remove();
  if(errors)toast('Saved with '+errors+' error(s) — check console');
  else{
    const parts=[];
    if(saved)parts.push(saved+' updated');
    if(added)parts.push(added+' added');
    if(deleted)parts.push(deleted+' removed');
    toast('Order saved'+(parts.length?' — '+parts.join(', '):''));
  }
  render();
}

async function cancelOrder(saleId){

  if(sale)pushUndoMulti('Cancel order '+(sale.order_number||''),[{action:'update',table:'sales',data:{...sale,fulfillment_status:'Cancelled'},prev:{...sale}}]);
  toast('Order cancelled');render();
}

function renderVendors(){
  const sf=S.filters.vendors||{};
  const q=(sf.search||'').toLowerCase();

  // Build per-vendor stats
  const vendorStats={};
  (S.purchases||[]).forEach(p=>{
    if(!p.vendor)return;
    if(!vendorStats[p.vendor])vendorStats[p.vendor]={openPOs:0,totalPOs:0,spend:0,parts:new Set()};
    vendorStats[p.vendor].totalPOs++;
    if(p.status!=='Received'&&p.status!=='Cancelled')vendorStats[p.vendor].openPOs++;
    vendorStats[p.vendor].spend+=poExtended(p);
  });
  S.parts.forEach(p=>{if(p.vendor){if(!vendorStats[p.vendor])vendorStats[p.vendor]={openPOs:0,totalPOs:0,spend:0,parts:new Set()};vendorStats[p.vendor].parts.add(p.pn);}});

  // Full registered vendors
  const regNames=new Set((S.vendors||[]).map(v=>(v.name||'').toLowerCase()));
  // Unregistered vendors (from parts/POs with no full vendor record)
  const legacyNames=getVendors().filter(n=>n&&!regNames.has(n.toLowerCase()));

  // Combined list for display
  let registeredList=(S.vendors||[]);
  if(q){
    registeredList=registeredList.filter(v=>(v.name||'').toLowerCase().includes(q)||(v.city||'').toLowerCase().includes(q)||(v.contact_name||'').toLowerCase().includes(q)||(v.email||'').toLowerCase().includes(q)||(v.contact_email||'').toLowerCase().includes(q));

async function submitVendor(editId){
  const g=id=>document.getElementById(id)?.value?.trim()||null;
  const name=g('v-name');
  if(!name){toast('Vendor name is required');return;}
  const payload={
    name,website:g('v-website'),email:g('v-email'),phone:g('v-phone'),
    street1:g('v-street1'),street2:g('v-street2'),city:g('v-city'),state:g('v-state'),
    postal_code:g('v-zip'),country:g('v-country')||'US',
    contact_name:g('v-cname'),contact_title:g('v-ctitle'),
    contact_email:g('v-cemail'),contact_phone:g('v-cphone'),
    notes:g('v-notes'),updated_at:new Date().toISOString()
  };
  if(editId){
    const{error}=await db.from('vendors').update(payload).eq('id',editId);
    if(error){toast('Error: '+error.message);return;}
    S.vendors=(S.vendors||[]).map(v=>v.id===editId?{...v,...payload}:v);
    document.getElementById('vendor-overlay')?.remove();
    toast('Vendor updated');render();
  } else {
    const{data,error}=await db.from('vendors').insert(payload).select().single();
    if(error){toast('Error: '+error.message);return;}
    S.vendors=[...(S.vendors||[]),data].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    document.getElementById('vendor-overlay')?.remove();
    toast('Vendor added');render();
  }
}

async function deleteVendor(id){
  if(!confirm('Delete this vendor?'))return;
  await db.from('vendors').delete().eq('id',id);
  S.vendors=(S.vendors||[]).filter(v=>v.id!==id);
  document.getElementById('vendor-overlay')?.remove();
  toast('Vendor deleted');render();
}
