<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGK Motorsport ERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F12;--bg2:#161A1F;--bg3:#1E242C;
  --border:#2A2F38;--border2:#3A404B;
  --acc:#FF6B35;--acc2:#E85520;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;
  --green:#22C55E;--yellow:#EAB308;--red:#EF4444;--blue:#3B82F6;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}
/* LAYOUT */
.erp{display:flex;height:100vh}
.side{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--acc);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:#fff;flex-shrink:0}
.logo-name{font-size:13px;font-weight:600;line-height:1.2}
.logo-sub{font-size:10px;color:var(--text2)}
.nav-section{padding:10px 0 4px}
.nav-label{padding:4px 16px 6px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;font-size:12px;color:var(--text2);border-left:2px solid transparent;transition:all .12s;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{color:var(--acc);border-left-color:var(--acc);background:var(--bg3)}
.nav-item i{font-size:15px;width:18px;text-align:center}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center;line-height:1.6}
/* TOPBAR */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.page-title{font-size:14px;font-weight:600;flex:1}
.search-box{position:relative}
.search-box input{padding:6px 10px 6px 30px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text);width:210px}
.search-box input::placeholder{color:var(--text3)}
.search-box i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3)}
/* BUTTONS */
.btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;cursor:pointer;background:var(--bg3);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.btn:hover{background:var(--border);border-color:var(--border2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-primary:hover{background:var(--acc2);border-color:var(--acc2)}
.btn-danger{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.btn-sm{padding:4px 9px;font-size:11px}
/* CONTENT */
.content{flex:1;overflow-y:auto;padding:18px}
/* GRID */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
/* KPI CARDS */
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.kpi-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:600;line-height:1.1}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}
.kpi-orange .kpi-val{color:var(--acc)}
.kpi-red .kpi-val{color:var(--red)}
.kpi-green .kpi-val{color:var(--green)}
.kpi-amber .kpi-val{color:var(--yellow)}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600}
/* TABLES */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-weight:600;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px}
td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.mono{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--text2)}
/* TAGS */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.02em}
.tag-green{background:rgba(34,197,94,.15);color:#4ade80}
.tag-red{background:rgba(239,68,68,.15);color:#f87171}
.tag-amber{background:rgba(234,179,8,.15);color:#fbbf24}
.tag-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.tag-orange{background:rgba(255,107,53,.15);color:#fb923c}
.tag-gray{background:rgba(148,163,184,.1);color:var(--text2)}
.tag-purple{background:rgba(168,85,247,.15);color:#c084fc}
/* ALERTS */
.alert{padding:9px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:8px}
.alert i{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-red{background:rgba(239,68,68,.12);border-left:3px solid var(--red);color:#fca5a5}
.alert-amber{background:rgba(234,179,8,.12);border-left:3px solid var(--yellow);color:#fde047}
.alert-green{background:rgba(34,197,94,.12);border-left:3px solid var(--green);color:#86efac}
/* STOCK BAR */
.stock-bar{width:70px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.stock-fill{height:100%;border-radius:3px}
/* FILTER ROW */
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row input,.filter-row select{padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)}
.filter-row select option{background:var(--bg2)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:20px;width:520px;max-height:88vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:600}
/* FORMS */
.fg{margin-bottom:11px}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)}
.fg textarea{height:80px;resize:vertical}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* DIVIDER */
.divider{height:1px;background:var(--border);margin:14px 0}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab:hover{color:var(--text)}
/* BOM */
.bom-row{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px}
.bom-row:last-child{border-bottom:none}
.type-bar{width:3px;height:24px;border-radius:2px;flex-shrink:0}
/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--text2);gap:10px;font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* INT CARDS */
.int-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.int-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.int-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}
.dot-red{background:var(--red)}
/* AI */
.ai-bubble{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:8px;font-size:13px;line-height:1.6}
.ai-user{background:rgba(255,107,53,.12);border-color:rgba(255,107,53,.3);color:var(--text)}
.ai-row{display:flex;gap:8px;margin-top:8px}
.ai-row input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text)}
/* REALTIME TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:8px;z-index:300;animation:slideup .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast .dot{flex-shrink:0}
</style>
</head>
<body>

<div class="erp">
<nav class="side">
  <div class="logo">
    <div class="logo-mark">TGK</div>
    <div><div class="logo-name">TGK Motorsport</div><div class="logo-sub">ERP · Cloud Edition</div></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <div class="nav-item active" id="nav-dashboard" onclick="nav('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Products</div>
    <div class="nav-item" id="nav-parts" onclick="nav('parts')"><i class="ti ti-bolt"></i>Parts Catalog</div>
    <div class="nav-item" id="nav-assemblies" onclick="nav('assemblies')"><i class="ti ti-package"></i>Assemblies</div>
    <div class="nav-item" id="nav-boms" onclick="nav('boms')"><i class="ti ti-sitemap"></i>Bill of Materials</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Operations</div>
    <div class="nav-item" id="nav-inventory" onclick="nav('inventory')"><i class="ti ti-stack-2"></i>Inventory<span class="badge" id="low-badge" style="display:none">0</span></div>
    <div class="nav-item" id="nav-packqueue" onclick="nav('packqueue')"><i class="ti ti-packaged-box"></i>Pack Queue</div>
    <div class="nav-item" id="nav-purchases" onclick="nav('purchases')"><i class="ti ti-shopping-cart"></i>Purchase Orders</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Sales</div>
    <div class="nav-item" id="nav-sales" onclick="nav('sales')"><i class="ti ti-receipt"></i>Sales Orders</div>
    <div class="nav-item" id="nav-dealers" onclick="nav('dealers')"><i class="ti ti-building-store"></i>Dealers</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Tools</div>
    <div class="nav-item" id="nav-ai" onclick="nav('ai')"><i class="ti ti-sparkles"></i>AI Assistant</div>
    <div class="nav-item" id="nav-integrations" onclick="nav('integrations')"><i class="ti ti-plug"></i>Integrations</div>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <div class="page-title" id="page-title">Dashboard</div>
    <div class="search-box"><i class="ti ti-search"></i><input type="text" placeholder="Search…" id="gsearch" oninput="onSearch(this.value)"></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)">
      <div class="dot" id="conn-dot" style="background:var(--yellow)"></div>
      <span id="conn-label">Connecting…</span>
    </div>
    <button class="btn btn-sm" onclick="nav('ai')"><i class="ti ti-sparkles"></i>AI</button>
    <button class="btn btn-sm btn-primary" id="add-btn" onclick="addAction()"><i class="ti ti-plus"></i>Add</button>
  </div>
  <div class="content" id="content"><div class="loading"><div class="spinner"></div>Loading from Supabase…</div></div>
</div>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
const SUPA_URL = 'https://piamamighqielfztgic.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

// ============================================================
// STATE
// ============================================================
const S = {
  view: 'dashboard', parts: [], assemblies: [], boms: {}, sales: [],
  purchases: [], dealers: [], settings: {}, loading: false,
  selBOM: '', aiHistory: [{role:'assistant',text:"Hi! I'm your TGK ERP assistant. Ask me anything about inventory, reorders, BOMs, or pack planning."}],
  aiLoading: false, searchQ: '', filters: {},
  intTab: 'shopify',
  shopify: {connected:false,store:'',key:'',webhook:''},
  shipstation: {connected:false,key:'',secret:''},
};

// ============================================================
// HELPERS
// ============================================================
const $ = id => document.getElementById(id);
const fc = (v,d=2) => '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fn = v => Number(v||0).toLocaleString();
const wksStock = p => p.avg_sales_wk > 0 ? Math.round((p.total_unpckgd||0)/p.avg_sales_wk) : null;
const stockColor = w => w===null?'var(--green)':w<2?'var(--red)':w<6?'var(--yellow)':'var(--green)';
const asmStatus = a => a.status||'ok';
const statusTag = s => {
  const m={ok:'tag-green',low:'tag-amber',critical:'tag-red'};
  const l={ok:'In Stock',low:'Low',critical:'Critical'};
  return `<span class="tag ${m[s]||'tag-gray'}">${l[s]||s}</span>`;
};
const typeColor = t => ({part:'var(--blue)',subassembly:'var(--acc)',packaging:'var(--purple,#a855f7)'}[t]||'var(--text3)');

function toast(msg, ok=true) {
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<div class="dot ${ok?'dot-green':'dot-red'}"></div>${msg}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadAll() {
  try {
    const [parts, assemblies, sales, purchases, dealers, settings, bomItems] = await Promise.all([
      db.from('parts').select('*').order('pn'),
      db.from('assemblies').select('*').order('pn'),
      db.from('sales').select('*').order('sale_date',{ascending:false}).limit(200),
      db.from('purchases').select('*').order('order_date',{ascending:false}),
      db.from('dealers').select('*').order('name'),
      db.from('settings').select('*'),
      db.from('bom_items').select('*').order('parent_pn').order('sort_order'),
    ]);
    if(parts.error) throw parts.error;
    S.parts = parts.data||[];
    S.assemblies = assemblies.data||[];
    S.sales = sales.data||[];
    S.purchases = purchases.data||[];
    S.dealers = dealers.data||[];
    // Index settings
    (settings.data||[]).forEach(s=>S.settings[s.key]=s.value);
    if(S.settings.shopify) Object.assign(S.shopify,S.settings.shopify);
    if(S.settings.shipstation) Object.assign(S.shipstation,S.settings.shipstation);
    // Index BOMs
    S.boms = {};
    (bomItems.data||[]).forEach(item=>{
      if(!S.boms[item.parent_pn]) S.boms[item.parent_pn]=[];
      S.boms[item.parent_pn].push(item);
    });
    if(!S.selBOM && Object.keys(S.boms).length) S.selBOM=Object.keys(S.boms)[0];
    // Update connection indicator
    $('conn-dot').style.background='var(--green)';
    $('conn-label').textContent='Live';
    updateBadge();
    render();
  } catch(e) {
    $('conn-dot').style.background='var(--red)';
    $('conn-label').textContent='Error';
    $('content').innerHTML=`<div class="loading" style="color:var(--red)"><i class="ti ti-alert-circle" style="font-size:20px"></i>Database error: ${e.message}. Check SQL migration was run.</div>`;
    console.error(e);
  }
}

function updateBadge() {
  const cnt = S.parts.filter(p=>p.avg_sales_wk>0&&wksStock(p)!==null&&wksStock(p)<4).length;
  const b=$('low-badge');
  if(b){b.textContent=cnt;b.style.display=cnt?'inline':'none';}
}

// ============================================================
// REALTIME SUBSCRIPTIONS
// ============================================================
function setupRealtime() {
  db.channel('erp-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'parts'},payload=>{
      if(payload.eventType==='INSERT') S.parts=[...S.parts,payload.new].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(payload.eventType==='UPDATE') S.parts=S.parts.map(p=>p.id===payload.new.id?payload.new:p);
      else if(payload.eventType==='DELETE') S.parts=S.parts.filter(p=>p.id!==payload.old.id);
      updateBadge();if(S.view==='parts'||S.view==='inventory'||S.view==='dashboard')render();
      toast('Parts updated by another user');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'assemblies'},payload=>{
      if(payload.eventType==='INSERT') S.assemblies=[...S.assemblies,payload.new].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(payload.eventType==='UPDATE') S.assemblies=S.assemblies.map(a=>a.id===payload.new.id?payload.new:a);
      else if(payload.eventType==='DELETE') S.assemblies=S.assemblies.filter(a=>a.id!==payload.old.id);
      if(S.view==='assemblies'||S.view==='dashboard')render();
      toast('Assemblies updated by another user');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},payload=>{
      if(payload.eventType==='INSERT') S.sales=[payload.new,...S.sales];
      if(S.view==='sales'||S.view==='dashboard')render();
      toast('New sale recorded');
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'purchases'},payload=>{
      if(payload.eventType==='INSERT') S.purchases=[payload.new,...S.purchases];
      else if(payload.eventType==='UPDATE') S.purchases=S.purchases.map(p=>p.id===payload.new.id?payload.new:p);
      if(S.view==='purchases'||S.view==='dashboard')render();
      toast('Purchase order updated');
    })
    .subscribe();
}

// ============================================================
// NAVIGATION
// ============================================================
const PAGE_TITLES = {dashboard:'Dashboard',parts:'Parts Catalog',assemblies:'Assemblies',boms:'Bill of Materials',inventory:'Inventory',purchases:'Purchase Orders',sales:'Sales Orders',dealers:'Dealers',ai:'AI Assistant',packqueue:'Pack Queue',integrations:'Integrations'};

function nav(view) {
  S.view=view;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=$('nav-'+view);if(el)el.classList.add('active');
  $('page-title').textContent=PAGE_TITLES[view]||view;
  render();
}

function onSearch(q){S.searchQ=q;render();}

function addAction(){
  const actions={parts:'addPart',assemblies:'addAsm',purchases:'addPO',dealers:'addDealer',sales:'addSale',boms:'addBOM'};
  const t=actions[S.view];if(t)openModal(t,{});
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const critical=S.assemblies.filter(a=>a.status==='critical').length;
  const lowStock=S.parts.filter(p=>p.avg_sales_wk>0&&wksStock(p)!==null&&wksStock(p)<4).length;
  const invVal=S.parts.reduce((s,p)=>s+Math.max(0,p.total_unpckgd||0)*p.unit_cost,0);
  const weekOrds=S.sales.filter(s=>s.sale_date>='2026-06-02').length;
  const readyPack=S.assemblies.filter(a=>a.status!=='critical'&&(a.total_on_hand||0)>0).length;
  return `
  <div class="grid-4">
    <div class="kpi kpi-orange"><div class="kpi-label">Orders (7 days)</div><div class="kpi-val">${weekOrds}</div></div>
    <div class="kpi kpi-red"><div class="kpi-label">Critical SKUs</div><div class="kpi-val">${critical}</div><div class="kpi-sub">Need immediate attention</div></div>
    <div class="kpi kpi-amber"><div class="kpi-label">Low Stock Parts</div><div class="kpi-val">${lowStock}</div><div class="kpi-sub">Under 4 wk supply</div></div>
    <div class="kpi"><div class="kpi-label">Raw Parts Value</div><div class="kpi-val" style="font-size:16px">${fc(invVal)}</div></div>
  </div>
  <div class="grid-2">
  <div>
    <div class="card">

// PARTS

function renderParts() {
  let list=S.parts;
  const cats=[...new Set(list.map(p=>p.category||'').filter(Boolean))].sort();
  const sf=S.filters.parts||{};
  if(sf.search||S.searchQ) {const q=(sf.search||S.searchQ).toLowerCase();list=list.filter(p=>p.pn.toLowerCase().includes(q)||((p.description||'').toLowerCase().includes(q)));}
  if(sf.cat) list=list.filter(p=>p.category===sf.cat);
  if(sf.vendor) list=list.filter(p=>(p.vendor||'').toLowerCase().includes(sf.vendor.toLowerCase()));
  return `
  <div class="filter-row">
    <input placeholder="Search PN or description…" value="${sf.search||''}" oninput="setFilter('parts','search',this.value)" style="width:240px">
    <input placeholder="Vendor…" value="${sf.vendor||''}" oninput="setFilter('parts','vendor',this.value)" style="width:130px">
    <select onchange="setFilter('parts','cat',this.value)">
      <option value="">All Categories</option>
      ${cats.map(c=>`<option value="${c}" ${sf.cat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <span style="font-size:11px;color:var(--text2)">${list.length} parts</span>
  </div>
  <div class="tbl-wrap">
  <table><thead><tr><th>Part #</th><th>Description</th><th>Vendor</th><th>Unit Cost</th><th>On Hand</th><th>Avg/Wk</th><th>Wks Stock</th><th>Lead</th><th></th></tr></thead><tbody>
  ${list.map(p=>{
    const w=wksStock(p);const col=stockColor(w);
    const pct=w===null?100:Math.min(100,Math.round(w/12*100));
    return `<tr>
      <td class="mono">${p.pn}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description||''}</td>
      <td style="font-size:11px">${p.vendor||''}</td>
      <td>${fc(p.unit_cost,4)}</td>
      <td style="font-weight:600;color:${(p.total_unpckgd||0)<0?'var(--red)':'inherit'}">${fn(p.total_unpckgd||0)}</td>
      <td>${p.avg_sales_wk>0?p.avg_sales_wk.toFixed(1):'-'}</td>
      <td><div style="display:flex;align-items:center;gap:5px"><div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:${col}"></div></div><span style="color:${col};font-size:10px">${w!==null?w+'w':'N/A'}</span></div></td>
      <td style="font-size:11px">${p.lead_time_weeks||1}w</td>
      <td style="display:flex;gap:4px">
        <button class="btn btn-sm" onclick='openModal("editPart",${JSON.stringify(p)})'>Edit</button>
        ${w!==null&&w<(p.lead_time_weeks+2)?`<button class="btn btn-sm btn-primary" onclick='openModal("addPO",{item:"${p.pn}",desc:${JSON.stringify(p.description)},vendor:"${p.vendor||''}",qty:${Math.ceil(p.avg_sales_wk*12)},unitCost:${p.unit_cost}})'>Order</button>`:''}
      </td>
    </tr>`;}).join('')}
  </tbody></table></div>`;
}

// ============================================================
// BOMs
// ============================================================
function renderBOMs() {
  const bomKeys=Object.keys(S.boms).sort();
  const sel=S.selBOM||bomKeys[0]||'';
  const items=sel?S.boms[sel]||[]:[];
  const totalCost=items.reduce((s,i)=>s+(i.unit_cost||0)*(i.qty||1),0);
  const asm=S.assemblies.find(a=>a.pn===sel);
  const margin=asm&&asm.msrp?((asm.msrp-totalCost-(asm.shipping_cost||10)-asm.msrp*0.03)/asm.msrp*100):null;
  const partMap={};S.parts.forEach(p=>partMap[p.pn]=p);

  return `
  <div class="grid-2">
  <div>
    <div class="card">
      <div class="card-head"><div class="card-title">Select Assembly</div><button class="btn btn-sm" onclick="openModal('addBOM',{})"><i class="ti ti-plus"></i>Add Line</button></div>
      <select class="fg" style="width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)" onchange="S.selBOM=this.value;render()">
        ${bomKeys.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${k} — ${S.assemblies.find(a=>a.pn===k)?.description||''}</option>`).join('')}
      </select>
    </div>
    ${sel?`<div class="card" style="padding:0">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border)"><div class="card-title">${sel}</div><div style="font-size:11px;color:var(--text2)">${asm?.description||''}</div></div>
      ${items.map(item=>{
        const part=partMap[item.child_pn];
        const col=typeColor(item.item_type);
        return `<div class="bom-row">
          <div class="type-bar" style="background:${col}"></div>
          <div style="flex:1">
            <span class="mono">${item.child_pn}</span>
            <span style="font-size:11px;color:var(--text2);margin-left:6px">${part?.description||item.child_pn}</span>
          </div>
          <span class="tag tag-gray" style="font-size:10px;margin-right:6px">${item.item_type}</span>
          <span style="font-size:11px;min-width:36px;text-align:right">×${item.qty}</span>
          <span style="font-size:11px;min-width:60px;text-align:right;color:var(--text2)">${fc(item.unit_cost*item.qty)}</span>
          <button class="btn btn-sm" style="margin-left:6px;padding:2px 6px" onclick="deleteBOMItem('${item.id}','${sel}')"><i class="ti ti-trash" style="font-size:12px"></i></button>
        </div>`;}).join('')}
      <div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px">
        <span style="color:var(--text2)">Total BOM Cost</span><span style="font-weight:600">${fc(totalCost)}</span>
      </div>
    </div>`:'<div class="card"><div style="text-align:center;color:var(--text2);font-size:12px;padding:20px">No BOM found. Select an assembly above.</div></div>'}
    <div style="display:flex;gap:6px;margin-top:6px;font-size:11px">
      <div style="display:flex;align-items:center;gap:5px"><div style="width:3px;height:16px;background:var(--blue);border-radius:2px"></div>Raw Part</div>
      <div style="display:flex;align-items:center;gap:5px"><div style="width:3px;height:16px;background:var(--acc);border-radius:2px"></div>Subassembly</div>
      <div style="display:flex;align-items:center;gap:5px"><div style="width:3px;height:16px;background:#a855f7;border-radius:2px"></div>Packaging</div>
    </div>
  </div>
  <div>
    ${asm?`<div class="card">
      <div class="card-head"><div class="card-title">Margin Analysis — ${sel}</div></div>
      <div style="font-size:12px">
        ${[['MSRP',fc(asm.msrp),''],['Part Cost','-'+fc(totalCost),'var(--red)'],['Shipping','-'+fc(asm.shipping_cost||10),'var(--red)'],['Fees (~3%)','-'+fc((asm.msrp||0)*0.03),'var(--red)']].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${l}</span><span style="${c?'color:'+c:''}">${v}</span></div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-weight:600">Gross Profit</span><span style="font-weight:600;color:var(--green)">${fc((asm.msrp||0)-totalCost-(asm.shipping_cost||10)-(asm.msrp||0)*0.03)}</span></div>
        ${margin!==null?`<div style="display:flex;justify-content:space-between;padding:7px 0"><span style="font-weight:600">Margin %</span><span style="font-weight:600;color:${margin>40?'var(--green)':margin>25?'var(--yellow)':'var(--red)'}">${margin.toFixed(1)}%</span></div>`:''}
      </div>
      <div class="divider"></div>
      <div style="font-size:11px;color:var(--text2)">
        ${[['Tier 1 ('+Math.round((asm.discount_t1||0.1)*100)+'% off)',fc((asm.msrp||0)*(1-(asm.discount_t1||0.1)))],['Tier 2 ('+Math.round((asm.discount_t2||0.2)*100)+'% off)',fc((asm.msrp||0)*(1-(asm.discount_t2||0.2)))],['Tier 3 ('+Math.round((asm.discount_t3||0.25)*100)+'% off)',fc((asm.msrp||0)*(1-(asm.discount_t3||0.25)))]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${l}</span><span>${v}</span></div>`).join('')}
      </div>
    </div>`:''}
    <div class="card">
      <div class="card-head"><div class="card-title">Add BOM Item</div></div>
      <div class="fg"><label>Assembly (Parent)</label>
        <select id="bom-parent" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)">
          ${S.assemblies.map(a=>`<option value="${a.pn}" ${a.pn===sel?'selected':''}>${a.pn}</option>`).join('')}
        </select></div>
      <div class="fg-row">
        <div class="fg"><label>Child Part #</label><input id="bom-child" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)" placeholder="PN"></div>
        <div class="fg"><label>Qty</label><input id="bom-qty" type="number" min="0.001" step="0.001" value="1" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)"></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>Type</label>
          <select id="bom-type" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)">
            <option>part</option><option>subassembly</option><option>packaging</option>
          </select></div>
        <div class="fg"><label>Unit Cost</label><input id="bom-cost" type="number" min="0" step="0.0001" value="0" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)"></div>
      </div>
      <button class="btn btn-primary" onclick="saveBOMItem()"><i class="ti ti-plus"></i>Add to BOM</button>
    </div>
  </div></div>`;
}

// ============================================================
// INVENTORY
// ============================================================
function renderInventory() {
  let list=S.parts;
  const sf=S.filters.inv||{};
  if(sf.search||S.searchQ){const q=(sf.search||S.searchQ).toLowerCase();list=list.filter(p=>p.pn.toLowerCase().includes(q)||((p.description||'').toLowerCase().includes(q)));}
  if(sf.reorder) list=list.filter(p=>p.avg_sales_wk>0&&wksStock(p)!==null&&wksStock(p)<(p.lead_time_weeks+2));
  const reorderCnt=S.parts.filter(p=>p.avg_sales_wk>0&&wksStock(p)!==null&&wksStock(p)<(p.lead_time_weeks+2)).length;
  return `
  <div class="grid-3">
    <div class="kpi"><div class="kpi-label">Total Part SKUs</div><div class="kpi-val">${S.parts.length}</div></div>
    <div class="kpi kpi-amber"><div class="kpi-label">Need Reorder</div><div class="kpi-val">${reorderCnt}</div><div class="kpi-sub">Within lead time window</div></div>
    <div class="kpi"><div class="kpi-label">Total Raw Value</div><div class="kpi-val" style="font-size:16px">${fc(S.parts.reduce((s,p)=>s+Math.max(0,p.total_unpckgd||0)*p.unit_cost,0))}</div></div>
  </div>
  <div class="filter-row">
    <input placeholder="Search…" value="${sf.search||''}" oninput="setFilter('inv','search',this.value)" style="width:240px">
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--text2)">
      <input type="checkbox" ${sf.reorder?'checked':''} onchange="setFilter('inv','reorder',this.checked)"> Reorder alerts only
    </label>
    <span style="font-size:11px;color:var(--text2)">${list.length} parts</span>
  </div>
  <div class="tbl-wrap">
  <table><thead><tr><th>Part #</th><th>Description</th><th>Vendor</th><th>Effective Inv</th><th>Avg/Wk</th><th>Wks Stock</th><th>Min Qty</th><th>Lead</th><th>Action</th></tr></thead><tbody>
  ${list.map(p=>{
    const w=wksStock(p);
    const needsOrder=w!==null&&w<(p.lead_time_weeks+2)&&p.avg_sales_wk>0;
    const orderQty=p.avg_sales_wk>0?Math.ceil(p.avg_sales_wk*12):0;
    return `<tr style="${needsOrder?'background:rgba(234,179,8,.04)':''}">
      <td class="mono">${p.pn}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description||''}</td>
      <td style="font-size:11px">${p.vendor||''}</td>
      <td style="font-weight:600;color:${(p.total_unpckgd||0)<0?'var(--red)':(p.total_unpckgd||0)<p.min_qty?'var(--yellow)':'inherit'}">${fn(p.total_unpckgd||0)}</td>
      <td>${p.avg_sales_wk>0?p.avg_sales_wk.toFixed(1):'-'}</td>
      <td style="color:${stockColor(w)};font-weight:600">${w!==null?w+'w':'—'}</td>
      <td>${p.min_qty>0?fn(p.min_qty):'—'}</td>
      <td>${p.lead_time_weeks||1}w</td>
      <td>${needsOrder?`<button class="btn btn-sm btn-primary" onclick='openModal("addPO",{item:"${p.pn}",desc:${JSON.stringify(p.description)},vendor:"${p.vendor||''}",qty:${orderQty},unitCost:${p.unit_cost}})'>Order ${orderQty}</button>`:'<span style="font-size:11px;color:var(--text3)">OK</span>'}</td>
    </tr>`;}).join('')}
  </tbody></table></div>`;
}

    <div id="ai-chat" style="min-height:280px;max-height:400px;overflow-y:auto;margin-bottom:10px">
      ${S.aiHistory.map(m=>`<div class="ai-bubble ${m.role==='user'?'ai-user':''}">${m.text.replace(/\n/g,'<br>')}</div>`).join('')}
      ${S.aiLoading?'<div class="ai-bubble"><div style="display:flex;align-items:center;gap:8px"><div class="spinner" style="width:14px;height:14px"></div>Thinking…</div></div>':''}
    </div>
    <div class="ai-row">
      <input type="text" id="ai-input" placeholder="Ask about inventory, reorders, BOMs, margins…" onkeydown="if(event.key==='Enter')sendAI()">
      <button class="btn btn-primary" onclick="sendAI()"><i class="ti ti-send"></i>Send</button>
    </div>
    <div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">
      ${['What needs reordering?','Critical assemblies','Pack queue status','Top selling SKUs','BOMs for TGK-BOV-01'].map(q=>`<button class="btn btn-sm" onclick="document.getElementById('ai-input').value='${q}';sendAI()">${q}</button>`).join('')}
    </div>
  </div>`;
}

async function sendAI() {
  const inp=$('ai-input');
  const msg=inp.value.trim();
  if(!msg||S.aiLoading)return;
  inp.value='';
  S.aiHistory.push({role:'user',text:msg});
  S.aiLoading=true;
  render();
  const chatEl=$('ai-chat');if(chatEl)chatEl.scrollTop=chatEl.scrollHeight;
  const lowParts=S.parts.filter(p=>p.avg_sales_wk>0&&wksStock(p)!==null&&wksStock(p)<4).map(p=>`${p.pn}(${wksStock(p)}wk,avg${p.avg_sales_wk.toFixed(1)}/wk)`).join(', ');
  const critAsm=S.assemblies.filter(a=>a.status==='critical').map(a=>`${a.pn}(${a.total_on_hand||0}oh)`).join(', ');
  const openPOs=S.purchases.filter(p=>p.status!=='Received').map(p=>`${p.pn}@${p.vendor}(${p.status})`).join(', ');
  const context=`You are the AI assistant for TGK Motorsport's ERP system. TGK builds performance Audi/Tesla automotive parts. Live data from Supabase: ${S.parts.length} parts, ${S.assemblies.length} assemblies. Low stock parts (under 4 wks): ${lowParts||'none'}. Critical assemblies (zero/negative stock): ${critAsm||'none'}. Open POs: ${openPOs||'none'}. Recent sales count (7d): ${S.sales.filter(s=>s.sale_date>='2026-06-02').length}. Be specific, actionable, and concise. Use real data above.`;
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:context,messages:S.aiHistory.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Sorry, I had trouble responding.';
    S.aiHistory.push({role:'assistant',text:reply});
  } catch(e) {
    S.aiHistory.push({role:'assistant',text:'Connection error. Please try again.'});
  }
  S.aiLoading=false;
  render();
  setTimeout(()=>{const c=$('ai-chat');if(c)c.scrollTop=c.scrollHeight;},50);
}

async function updatePOStatus(id, newStatus) {
  const {error}=await db.from('purchases').update({status:newStatus,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Error: '+error.message,false);return;}
  S.purchases=S.purchases.map(p=>p.id===id?{...p,status:newStatus}:p);
  toast(`PO marked ${newStatus}`);render();
}

async function deletePO(id) {
  if(!confirm('Delete this PO?'))return;
  const {error}=await db.from('purchases').delete().eq('id',id);
  if(error){toast('Error: '+error.message,false);return;}
  S.purchases=S.purchases.filter(p=>p.id!==id);
  toast('PO deleted');render();
}

async function deleteSale(id) {
  if(!confirm('Delete this sale?'))return;
  const {error}=await db.from('sales').delete().eq('id',id);
  if(error){toast('Error: '+error.message,false);return;}
  S.sales=S.sales.filter(s=>s.id!==id);
  toast('Sale deleted');render();
}

async function deleteDealer(id) {
  if(!confirm('Delete this dealer?'))return;
  const {error}=await db.from('dealers').delete().eq('id',id);
  if(error){toast('Error: '+error.message,false);return;}
  S.dealers=S.dealers.filter(d=>d.id!==id);
  toast('Dealer deleted');render();
}

async function deleteBOMItem(id, parentPn) {
  const {error}=await db.from('bom_items').delete().eq('id',id);
  if(error){toast('Error: '+error.message,false);return;}
  if(S.boms[parentPn]) S.boms[parentPn]=S.boms[parentPn].filter(i=>i.id!==id);
  toast('BOM item removed');render();
}

async function saveBOMItem() {
  const parent=$('bom-parent').value;
  const child=$('bom-child').value.trim();
  const qty=parseFloat($('bom-qty').value)||1;
  const type=$('bom-type').value;
  const cost=parseFloat($('bom-cost').value)||0;
  if(!parent||!child){alert('Parent and Child PN required.');return;}
  const {data,error}=await db.from('bom_items').insert({parent_pn:parent,child_pn:child,qty,item_type:type,unit_cost:cost,sort_order:(S.boms[parent]||[]).length+1}).select().single();
  if(error){toast('Error: '+error.message,false);return;}
  if(!S.boms[parent]) S.boms[parent]=[];
  S.boms[parent].push(data);
  S.selBOM=parent;
  toast('BOM item added');render();
}

async function recordPack(pn) {
  const {data,error}=await db.from('pack_log').insert({pn,qty:1,pack_date:new Date().toISOString()}).select().single();
  if(error){toast('Error: '+error.message,false);return;}
  // Update assembly on-hand
  const asm=S.assemblies.find(a=>a.pn===pn);
  if(asm){
    const newHand=(asm.total_on_hand||0)+1;
    await db.from('assemblies').update({total_on_hand:newHand,total_assembled:(asm.total_assembled||0)+1,updated_at:new Date().toISOString()}).eq('id',asm.id);
    S.assemblies=S.assemblies.map(a=>a.pn===pn?{...a,total_on_hand:newHand,total_assembled:(a.total_assembled||0)+1}:a);
  }
  toast(`Packed 1 × ${pn}`);render();
}

async function saveShopify() {
  const store=$('sh-store').value.trim();
  const key=$('sh-key').value.trim();
  const webhook=$('sh-wh').value.trim();
  S.shopify={connected:!!(store&&key),store,key,webhook};
  const {error}=await db.from('settings').upsert({key:'shopify',value:S.shopify,updated_at:new Date().toISOString()});
  if(error){toast('Error saving: '+error.message,false);return;}
  toast(S.shopify.connected?'Shopify connected!':'Settings saved');render();
}

async function saveShipStation() {
  const key=$('ss-key').value.trim();
  const secret=$('ss-secret').value.trim();
  S.shipstation={connected:!!(key&&secret),key,secret};
  const {error}=await db.from('settings').upsert({key:'shipstation',value:S.shipstation,updated_at:new Date().toISOString()});
  if(error){toast('Error saving: '+error.message,false);return;}
  toast(S.shipstation.connected?'ShipStation connected!':'Settings saved');render();
}

function setFilter(ns,key,val){
  if(!S.filters[ns]) S.filters[ns]={};
  S.filters[ns][key]=val;render();
}

    <div class="fg"><label>Expected Arrival</label><input class="fg-in" type="date" id="m-arrival" value="${data.arrival_date||''}"></div>
    <div class="fg"><label>Notes</label><textarea class="fg-in" id="m-notes">${data.notes||''}</textarea></div>
    <button class="btn btn-primary" onclick="submitPO('${data.id||''}')"><i class="ti ti-check"></i>Save PO</button>`;
  }
  else if(type==='addSale'){
    title='Record Sale';
    body=`<div class="fg-row">
      <div class="fg"><label>Date</label><input class="fg-in" type="date" id="m-date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fg"><label>Order #</label><input class="fg-in" id="m-order" placeholder="#XXXX"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>SKU</label><input class="fg-in" id="m-pn" placeholder="TGK-XXX-XX"></div>
      <div class="fg"><label>Qty</label><input class="fg-in" type="number" id="m-qty" value="1" min="1"></div>
    </div>
    <div class="fg"><label>Source</label><input class="fg-in" id="m-source" value="TGK Motorsport" placeholder="Shopify / Dealer / etc"></div>
    <button class="btn btn-primary" onclick="submitSale()"><i class="ti ti-check"></i>Record Sale</button>`;
  }
  else if(type==='addDealer'||type==='editDealer'){
    title=type==='addDealer'?'Add Dealer':'Edit Dealer';
    body=`<div class="fg-row">
      <div class="fg"><label>Dealer Name</label><input class="fg-in" id="m-name" value="${data.name||''}" placeholder="Company name"></div>
      <div class="fg"><label>Contact Name</label><input class="fg-in" id="m-contact" value="${data.contact_name||''}" placeholder="Contact"></div>
    </div>
    <div class="fg"><label>Email</label><input class="fg-in" type="email" id="m-email" value="${data.email||''}" placeholder="email@company.com"></div>
    <div class="fg-row">
      <div class="fg"><label>Discount %</label><input class="fg-in" type="number" id="m-disc" value="${Math.round((data.discount_pct||0.2)*100)}" min="0" max="100"></div>
      <div class="fg"><label>Status</label>
        <select class="fg-in" id="m-status" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)">
          <option ${data.status==='Active'?'selected':''}>Active</option>
          <option ${data.status==='Inactive'?'selected':''}>Inactive</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Notes</label><textarea class="fg-in" id="m-notes">${data.notes||''}</textarea></div>
    <button class="btn btn-primary" onclick="submitDealer('${data.id||''}')"><i class="ti ti-check"></i>Save Dealer</button>`;
  }
  else if(type==='addPart'||type==='editPart'){
    title=type==='addPart'?'Add Part':'Edit Part';
    body=`<div class="fg-row">
      <div class="fg"><label>Part #</label><input class="fg-in" id="m-pn" value="${data.pn||''}" placeholder="PN" ${data.id?'readonly':''}></div>
      <div class="fg"><label>Vendor</label><input class="fg-in" id="m-vendor" value="${data.vendor||''}" placeholder="Vendor"></div>
    </div>
    <div class="fg"><label>Description</label><input class="fg-in" id="m-desc" value="${data.description||''}" placeholder="Description"></div>
    <div class="fg-row">
      <div class="fg"><label>Category</label><input class="fg-in" id="m-cat" value="${data.category||''}" placeholder="Category"></div>
      <div class="fg"><label>Unit Cost</label><input class="fg-in" type="number" step="0.0001" id="m-cost" value="${data.unit_cost||0}"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Lead Time (weeks)</label><input class="fg-in" type="number" id="m-lead" value="${data.lead_time_weeks||1}"></div>
      <div class="fg"><label>Avg Sales/Wk</label><input class="fg-in" type="number" step="0.01" id="m-avg" value="${data.avg_sales_wk||0}"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>On Hand (Unpacked)</label><input class="fg-in" type="number" id="m-unpckgd" value="${data.total_unpckgd||0}"></div>
      <div class="fg"><label>Min Qty</label><input class="fg-in" type="number" step="0.01" id="m-min" value="${data.min_qty||0}"></div>
    </div>
    <button class="btn btn-primary" onclick="submitPart('${data.id||''}')"><i class="ti ti-check"></i>Save Part</button>`;
  }
  else if(type==='addAsm'||type==='editAsm'){
    title=type==='addAsm'?'Add Assembly':'Edit Assembly';
    body=`<div class="fg-row">
      <div class="fg"><label>SKU</label><input class="fg-in" id="m-pn" value="${data.pn||''}" placeholder="TGK-XXX-XX" ${data.id?'readonly':''}></div>
      <div class="fg"><label>Category</label><input class="fg-in" id="m-cat" value="${data.category||''}" placeholder="Category"></div>
    </div>
    <div class="fg"><label>Description</label><input class="fg-in" id="m-desc" value="${data.description||''}" placeholder="Description"></div>
    <div class="fg-row">
      <div class="fg"><label>MSRP</label><input class="fg-in" type="number" step="0.01" id="m-msrp" value="${data.msrp||0}"></div>
      <div class="fg"><label>Shipping Cost</label><input class="fg-in" type="number" step="0.01" id="m-ship" value="${data.shipping_cost||10}"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>On Hand</label><input class="fg-in" type="number" id="m-oh" value="${data.total_on_hand||0}"></div>
      <div class="fg"><label>Status</label>
        <select class="fg-in" id="m-status" style="width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)">
          <option ${(data.status||'ok')==='ok'?'selected':''} value="ok">In Stock</option>
          <option ${data.status==='low'?'selected':''} value="low">Low</option>
          <option ${data.status==='critical'?'selected':''} value="critical">Critical</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Avg Sales/Wk</label><input class="fg-in" type="number" step="0.01" id="m-avg" value="${data.avg_sales_wk||0}"></div>
    <button class="btn btn-primary" onclick="submitAsm('${data.id||''}')"><i class="ti ti-check"></i>Save Assembly</button>`;
  }
  else return;

  // Style form inputs inside modal
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><div class="modal-title">${title}</div><button class="btn btn-sm" onclick="closeModal()" aria-label="Close"><i class="ti ti-x"></i></button></div>
      <style>.fg-in{width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text)}</style>
      ${body}
    </div>
  </div>`;
}

function closeModal(){$('modal-root').innerHTML='';}

async function submitPO(existingId) {
  const vendor=$('m-vendor').value.trim();
  const pn=$('m-pn').value.trim();
  const desc=$('m-desc').value.trim();
  const qty=parseInt($('m-qty').value)||1;
  const unit_cost=parseFloat($('m-cost').value)||0;
  const arrival=$('m-arrival').value||null;
  const notes=$('m-notes').value;
  if(!vendor||!pn){alert('Vendor and Part # required.');return;}
  const payload={vendor,pn,description:desc,qty,unit_cost,arrival_date:arrival,notes,status:'On Order',updated_at:new Date().toISOString()};
  let error,data;
  if(existingId){({error}=await db.from('purchases').update(payload).eq('id',existingId));}
  else{({data,error}=await db.from('purchases').insert({...payload,order_date:new Date().toISOString().slice(0,10)}).select().single());}
  if(error){toast('Error: '+error.message,false);return;}
  if(data) S.purchases=[data,...S.purchases];
  else S.purchases=S.purchases.map(p=>p.id===existingId?{...p,...payload}:p);
  closeModal();toast('PO saved');render();
}

async function submitSale() {
  const sale_date=$('m-date').value;
  const order_number=$('m-order').value.trim();
  const pn=$('m-pn').value.trim();
  const qty=parseInt($('m-qty').value)||1;
  const source=$('m-source').value.trim();
  if(!pn){alert('SKU required.');return;}
  const {data,error}=await db.from('sales').insert({sale_date,order_number,pn,qty,source,status:'Fulfilled'}).select().single();
  if(error){toast('Error: '+error.message,false);return;}
  S.sales=[data,...S.sales];
  closeModal();toast('Sale recorded');render();
}

async function submitDealer(existingId) {
  const name=$('m-name').value.trim();
  const contact_name=$('m-contact').value.trim();
  const email=$('m-email').value.trim();
  const discount_pct=parseFloat($('m-disc').value)/100||0.20;
  const status=$('m-status').value;
  const notes=$('m-notes').value;
  if(!name){alert('Dealer name required.');return;}
  const payload={name,contact_name,email,discount_pct,status,notes};
  let error,data;
  if(existingId){({error}=await db.from('dealers').update(payload).eq('id',existingId));}
  else{({data,error}=await db.from('dealers').insert(payload).select().single());}
  if(error){toast('Error: '+error.message,false);return;}
  if(data) S.dealers=[...S.dealers,data].sort((a,b)=>a.name.localeCompare(b.name));
  else S.dealers=S.dealers.map(d=>d.id===existingId?{...d,...payload}:d);
  closeModal();toast('Dealer saved');render();
}

async function submitPart(existingId) {
  const pn=$('m-pn').value.trim();
  const vendor=$('m-vendor').value.trim();
  const description=$('m-desc').value.trim();
  const category=$('m-cat').value.trim();
  const unit_cost=parseFloat($('m-cost').value)||0;
  const lead_time_weeks=parseInt($('m-lead').value)||1;
  const avg_sales_wk=parseFloat($('m-avg').value)||0;
  const total_unpckgd=parseInt($('m-unpckgd').value)||0;
  const min_qty=parseFloat($('m-min').value)||0;
  if(!pn){alert('Part # required.');return;}
  const payload={pn,vendor,description,category,unit_cost,lead_time_weeks,avg_sales_wk,total_unpckgd,min_qty,updated_at:new Date().toISOString()};
  let error,data;
  if(existingId){({error}=await db.from('parts').update(payload).eq('id',existingId));}
  else{({data,error}=await db.from('parts').insert(payload).select().single());}
  if(error){toast('Error: '+error.message,false);return;}
  if(data) S.parts=[...S.parts,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.parts=S.parts.map(p=>p.id===existingId?{...p,...payload}:p);
  closeModal();updateBadge();toast('Part saved');render();
}

async function submitAsm(existingId) {
  const pn=$('m-pn').value.trim();
  const description=$('m-desc').value.trim();
  const category=$('m-cat').value.trim();
  const msrp=parseFloat($('m-msrp').value)||0;
  const shipping_cost=parseFloat($('m-ship').value)||10;
  const total_on_hand=parseInt($('m-oh').value)||0;
  const status=$('m-status').value;
  const avg_sales_wk=parseFloat($('m-avg').value)||0;
  if(!pn){alert('SKU required.');return;}
  const payload={pn,description,category,msrp,shipping_cost,total_on_hand,status,avg_sales_wk,updated_at:new Date().toISOString()};
  let error,data;
  if(existingId){({error}=await db.from('assemblies').update(payload).eq('id',existingId));}
  else{({data,error}=await db.from('assemblies').insert(payload).select().single());}
  if(error){toast('Error: '+error.message,false);return;}
  if(data) S.assemblies=[...S.assemblies,data].sort((a,b)=>a.pn.localeCompare(b.pn));
  else S.assemblies=S.assemblies.map(a=>a.id===existingId?{...a,...payload}:a);
  closeModal();toast('Assembly saved');render();
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const views={dashboard:renderDashboard,parts:renderParts,assemblies:renderAssemblies,boms:renderBOMs,inventory:renderInventory,purchases:renderPurchases,sales:renderSales,packqueue:renderPackQueue,dealers:renderDealers,integrations:renderIntegrations,ai:renderAI};
  const fn=views[S.view]||renderDashboard;
  $('content').innerHTML=fn();
  updateBadge();
}

// ============================================================
// INIT
// ============================================================
loadAll().then(()=>setupRealtime());
</script>
</body>
</html>
