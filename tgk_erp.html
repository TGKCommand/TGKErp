// RENDER
// ============================================================
let _renderPending=false;
function scheduleRender(){
  if(_renderPending)return;
  _renderPending=true;
  requestAnimationFrame(()=>{_renderPending=false;render();});
}
function render(){
  // Hide loader on first render  if(_sh)_sh.style.display='flex';}
  const views={dashboard:renderDashboard,parts:renderParts,assemblies:renderAssemblies,boms:renderBOMs,inventory:renderInventory,planning:renderPlanning,purchases:renderPurchasesEnhanced,vendors:renderVendors,sales:renderSales,packqueue:renderPackQueue,dealers:renderDealers,integrations:renderIntegrations,ai:renderAI,lookup:renderLookup,backups:renderBackups,cyclecounts:renderCycleCounts,corrections:renderCorrections,warranty:renderWarranty,import:renderImport,pobuilder:renderPOBuilder,reports:renderReports};
  if(!S.calc||S.calc.salesLen!==S.sales.length||S.calc.bomLen!==Object.keys(S.boms).length)computeDemand();
  // Preserve focused input + caret across re-render
  const active=document.activeElement;
  let fkey=null,selS=0,selE=0;
  if(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA')&&$('content').contains(active)){
    fkey=active.id?('id:'+active.id):('ph:'+(active.placeholder||''));
    try{selS=active.selectionStart;selE=active.selectionEnd;}catch(e){}
  }
  $('content').innerHTML=(views[S.view]||renderDashboard)();
  if(fkey){
    let el=null;
    if(fkey.startsWith('id:'))el=document.getElementById(fkey.slice(3));
    else el=$('content').querySelector('input[placeholder="'+fkey.slice(3).replace(/"/g,'\\"')+'"],textarea[placeholder="'+fkey.slice(3).replace(/"/g,'\\"')+'"]');
    if(el){el.focus();try{el.setSelectionRange(selS,selE);}catch(e){}}
  }
  updateBadge();
}

// ── TARGETED TABLE REFRESH (avoids full loadAll on minor changes) ──
async function refreshSales(){
  // Use fetchAll pagination to avoid Supabase's server-side row cap (default 1000).
  // A plain .limit(5000) can silently drop older rows when total sales exceed the cap,
  // causing the detail view to fall through to a truncated list after actions like unship.
  const data=await fetchAll((f,t)=>db.from('sales').select('*').order('created_at',{ascending:false}).range(f,t));
  S.sales=data;
  computeDemand();updateBadge();
}
async function refreshParts(){
  const{data}=await db.from('parts').select('*').order('pn');
  if(data)S.parts=data;
  computeDemand();
}
async function refreshAssemblies(){
  const{data}=await db.from('assemblies').select('*').order('pn');
  if(data)S.assemblies=data;
  computeDemand();
}

// ── INIT ─────────────────────────────────────────────────────
(function startTGK(){
  const msg=document.getElementById('tgk-msg');
  const retry=document.getElementById('tgk-retry');
  const dots=document.getElementById('tgk-dots');
  function setMsg(t){if(msg)msg.textContent=t;}
  function showRetry(){if(retry)retry.style.display='';if(dots)dots.style.opacity='.25';}

  // Auto-reload safety net — if still stuck after 60s something is seriously wrong
  const tHard=setTimeout(()=>location.reload(),60000);

  let sdkAttempts=0;
  function waitForSupabase(){
    sdkAttempts++;
    if(typeof supabase==='undefined'||typeof supabase.createClient==='undefined'){
      if(sdkAttempts>150){
        clearTimeout(tHard);
        setMsg('Could not load Supabase library — check internet connection.');
        showRetry();
        return;
      }
      if(sdkAttempts===1)setMsg('Loading libraries…');
      setTimeout(waitForSupabase,100);
      return;
    }
    if(!db)db=supabase.createClient(SUPA_URL,SUPA_KEY);
    tryConnect(1);
  }

  // Auto-retry up to 4 times with increasing delays (handles Supabase cold-start wakeup)
  // Delays: immediate, 3s, 6s, 10s  → total ~19s before giving up
  const RETRY_DELAYS=[0,3000,6000,10000];
  function tryConnect(attempt){
    const label=attempt>1?` (attempt ${attempt} of ${RETRY_DELAYS.length})`:'' ;
    setMsg('Connecting to database…'+label);
    loadAll()
      .then(()=>{
        clearTimeout(tHard);
        // Always hide loader first — errors below should not keep app stuck loading
        const loader=document.getElementById('tgk-loader');
        const app=document.getElementById('tgk-app');
        if(loader)loader.style.display='none';
        if(app)app.style.display='';
        try{computeDemand();}catch(e){console.error('computeDemand error:',e);}
        try{setupRealtime();}catch(e){console.error('setupRealtime error:',e);}
        try{loadBackups();}catch(e){console.error('loadBackups error:',e);}
        try{startAutoBackup();}catch(e){console.error('startAutoBackup error:',e);}
        try{history.replaceState(snapState(),'','#dashboard');}catch(e){}
        if(window.location.search.includes('code=')&&window.location.search.includes('shop='))handleShopifyOAuthCallback();
        render();
      })
      .catch(err=>{
        console.warn(`DB connect attempt ${attempt} failed:`,err.message);
        if(attempt<RETRY_DELAYS.length){
          const delay=RETRY_DELAYS[attempt];
          setMsg(`Database waking up — retrying in ${delay/1000}s… (${attempt}/${RETRY_DELAYS.length})`);
          setTimeout(()=>tryConnect(attempt+1),delay);
        } else {
          clearTimeout(tHard);
          setMsg('Could not connect: '+err.message);
          showRetry();
        }
      });
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',waitForSupabase);}
  else{waitForSupabase();}
})();
</script>
