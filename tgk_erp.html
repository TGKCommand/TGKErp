<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGK Motorsport ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;--bg4:#e9ebee;--bg5:#dde0e5;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --teal:#0d9488;--teal-d:#0f766e;--teal-dim:rgba(13,148,136,.09);
  --orange:#ea580c;--orange-d:#c2410c;--orange-dim:rgba(234,88,12,.09);
  --red:#dc2626;--red-dim:rgba(220,38,38,.09);
  --green:#16a34a;--green-dim:rgba(22,163,74,.09);
  --yellow:#d97706;--yellow-dim:rgba(217,119,6,.09);
  --blue:#2563eb;--blue-dim:rgba(37,99,235,.09);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.09);
  --r:6px;--r-lg:10px;
  --font:'DM Sans',sans-serif;--mono:'JetBrains Mono','DM Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
input,button,select,textarea{font-family:var(--font)}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden}
.logo-img{width:140px;height:auto;object-fit:contain;display:block}
.watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.04}
.watermark img{width:500px;height:auto;filter:grayscale(1) invert(0)}

/* ── SIDEBAR ── */
.sidebar-wrap{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:relative}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.logo-sub{font-size:10px;color:var(--text3);font-weight:400}
.sidebar-section{padding:14px 14px 4px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 11px;margin:2px 8px;border-radius:20px;cursor:pointer;transition:all .15s;border:1px solid transparent;background:transparent;width:calc(100% - 16px);text-align:left;color:var(--text2);font-size:12px;font-weight:500;outline:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .15s}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:1px 6px;border-radius:10px;min-width:22px;text-align:center;margin-left:auto}
.nav-item.active .nav-badge{color:var(--teal);background:var(--teal-dim);border-color:rgba(13,148,136,.22)}
.nav-item.alert-nav .nav-badge{color:var(--red);background:var(--red-dim);border-color:rgba(224,85,85,.25)}

/* ── SIDEBAR FOOTER ── */
.sidebar-footer{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--border);flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--green)}
.sync-dot.busy{background:var(--orange);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes rt-flash{0%{background:rgba(13,148,136,.22)}100%{background:transparent}}
.rt-flash{animation:rt-flash 2s ease-out}
.sync-label{font-size:11px;color:var(--text2);flex:1;font-weight:500}
.sync-sub{font-size:10px;color:var(--text3)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;z-index:10}
.topbar-title{font-size:14px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:11px;color:var(--text3);margin-left:4px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:20px 24px;position:relative}
.content-inner{position:relative;z-index:1}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;font-weight:600;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--bg5);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.22)}
.btn-teal:hover{background:rgba(13,148,136,.13);border-color:rgba(13,148,136,.35)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.25)}
.btn-danger:hover{background:rgba(224,85,85,.2)}
.btn-sm{padding:4px 10px;font-size:11px}
.action-btn{background:none;border:1px solid var(--border);color:var(--text3);border-radius:var(--r);padding:3px 8px;font-size:11px;cursor:pointer;transition:all .12s;font-family:var(--font)}
.action-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg4)}
.action-btn.del:hover{border-color:rgba(224,85,85,.3);color:var(--red);background:var(--red-dim)}

/* ── PANELS ── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.panel-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-title-left{display:flex;align-items:center;gap:8px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;gap:10px;margin-bottom:18px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-3{grid-template-columns:repeat(3,1fr)}
.kpi-grid-5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;line-height:1.1;font-family:var(--mono)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}
.kpi-teal .kpi-value{color:var(--teal)}
.kpi-orange .kpi-value{color:var(--orange)}
.kpi-red .kpi-value{color:var(--red)}
.kpi-green .kpi-value{color:var(--green)}
.kpi-yellow .kpi-value{color:var(--yellow)}

/* ── GRID LAYOUTS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2-lg{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg3);padding:9px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:9px 12px;color:var(--text2);vertical-align:middle}
td.main-col{color:var(--text);font-weight:500}
.pn{font-family:var(--mono);font-size:11px;color:var(--text3)}
.money{font-family:var(--mono);color:var(--text)}
.money-cost{font-family:var(--mono);color:var(--orange)}
.money-retail{font-family:var(--mono);color:var(--teal)}
.money-vendor{font-family:var(--mono);color:var(--green)}
.money-neutral{font-family:var(--mono);color:var(--text2)}

/* ── STATUS PILLS ── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;font-size:10px;font-weight:600;border-radius:10px;border:1px solid transparent}
.pill-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.pill-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(224,123,40,.2)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(76,175,125,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(212,168,67,.2)}
.pill-muted{background:var(--bg4);color:var(--text3);border-color:var(--border)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--teal)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.filter-chip{display:inline-flex;align-items:center;padding:5px 11px;font-size:11px;font-weight:600;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;transition:all .12s;white-space:nowrap}
.filter-chip:hover,.filter-chip.on{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.filter-chip.on-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.22)}
.filter-count{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:4px}
.form-input{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:12px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
.form-input::placeholder{color:var(--text3)}
select.form-input{cursor:pointer}

/* ── STOCK BAR ── */
.stock-bar-wrap{display:flex;align-items:center;gap:6px}
.stock-bar{width:60px;height:4px;background:var(--bg5);border-radius:2px;overflow:hidden}
.stock-fill{height:100%;border-radius:2px;transition:width .3s}
.wk-label{font-size:10px;font-family:var(--mono);min-width:28px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);width:660px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:24px}
.modal-title{font-size:14px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ── BOM ── */
.bom-row{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px}
.bom-row:last-child{border-bottom:none}
.bom-row:hover{background:var(--bg3)}
.type-accent{width:2px;height:28px;border-radius:2px;flex-shrink:0}

/* ── ALERT ROWS ── */
.alert-row{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:var(--r);font-size:12px;margin-bottom:7px;border-left:2px solid transparent}
.alert-row-red{background:var(--red-dim);border-left-color:var(--red);color:var(--red)}
.alert-row-yellow{background:var(--yellow-dim);border-left-color:var(--yellow);color:var(--yellow)}
.alert-row-green{background:var(--green-dim);border-left-color:var(--green);color:var(--green)}
.alert-row b{color:var(--text)}

/* ── INT CARDS ── */
.int-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.int-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.int-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.int-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--green)}
.dot-err{background:var(--red)}
.int-title{font-size:13px;font-weight:700;color:var(--text)}
.int-sub{font-size:11px;color:var(--text3)}

/* ── TABS ── */
.tabs-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}
/* ── SUB NAV ── */
.sub-nav{overflow:hidden;max-height:0;transition:max-height .2s ease}
.sub-nav.open{max-height:120px}
.nav-sub-item{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 26px;margin:1px 8px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;color:var(--text3);background:transparent;border:1px solid transparent;width:calc(100% - 16px);text-align:left;transition:all .15s}
.nav-sub-item:hover{background:var(--bg3);color:var(--text2)}
.nav-sub-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}

/* ── AI ── */
.ai-bubble{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.6;color:var(--text2)}
.ai-user-bubble{background:var(--orange-dim);border-color:rgba(224,123,40,.25);color:var(--text)}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
.ai-input-row input:focus{border-color:var(--teal)}
.ai-chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:var(--r);font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:500}
#toast.show{opacity:1}

/* ── LOADING ── */
.loading-state{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);gap:10px;font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SHOPIFY BAR ── */
.shopify-bar{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.shopify-icon{width:30px;height:30px;background:#96bf48;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}



thead th{cursor:pointer;user-select:none;position:relative;transition:color .15s}
thead th:hover{color:var(--teal)}
thead th.sorted-asc,thead th.sorted-desc{color:var(--teal)}
thead th.sorted-asc::after{content:' ↑';font-size:10px;color:var(--teal);font-weight:700}
thead th.sorted-desc::after{content:' ↓';font-size:10px;color:var(--teal);font-weight:700}
/* ── ENHANCED COMPONENTS ── */
.qty-input{width:70px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:5px 8px;font-size:12px;text-align:center;outline:none}
.qty-input:focus{border-color:var(--teal)}
.inline-edit{background:var(--bg4);border:1px solid transparent;border-radius:var(--r);color:var(--text);padding:4px 8px;font-size:12px;outline:none;width:100%}
.inline-edit:focus{border-color:var(--teal)}
.inline-edit:hover{border-color:var(--border2)}
.check-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.check-row:hover{background:var(--bg3)}
.check-row:last-child{border-bottom:none}
.progress-bar{height:6px;background:var(--bg5);border-radius:3px;overflow:hidden;flex:1}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.tag{display:inline-flex;align-items:center;padding:1px 7px;font-size:10px;font-weight:600;border-radius:4px;border:1px solid transparent;font-family:var(--mono)}
.tag-a{background:rgba(13,148,136,.11);color:var(--teal);border-color:rgba(13,148,136,.25)}
.tag-b{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(212,168,67,.3)}
.tag-c{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.3)}
.tag-d{background:var(--bg4);color:var(--text3);border-color:var(--border)}
.forecast-bar{display:flex;align-items:center;gap:6px;padding:6px 0}
.fc-seg{height:8px;border-radius:2px;min-width:4px;transition:width .3s}
.count-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:var(--border)}
.count-cell{background:var(--bg2);padding:8px 12px;font-size:12px}
.variance-pos{color:var(--green);font-weight:700;font-family:var(--mono)}
.variance-neg{color:var(--red);font-weight:700;font-family:var(--mono)}
.variance-zero{color:var(--text3);font-family:var(--mono)}
.sticky-header{position:sticky;top:0;z-index:5;background:var(--bg3)}
.bomtag{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;letter-spacing:.07em;padding:2px 7px;border-radius:4px;border:1px solid transparent;font-family:var(--mono);white-space:nowrap}
.bomtag-sub{background:var(--orange-dim);color:var(--orange);border-color:rgba(224,123,40,.35)}
.bomtag-hw{background:var(--blue-dim);color:var(--blue);border-color:rgba(74,158,218,.35)}
.bomtag-hwp{background:var(--purple-dim);color:var(--purple);border-color:rgba(157,123,216,.35)}
.bomtag-sup{background:var(--green-dim);color:var(--green);border-color:rgba(76,175,125,.35)}
.bomtag-comp{background:var(--bg4);color:var(--text3);border-color:var(--border)}
.rowlink{cursor:pointer}
.rowlink:hover td{background:rgba(13,148,136,.05)}
.component-check{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px}
.ok-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.section-header{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:10px 12px 4px;background:var(--bg3);border-bottom:1px solid var(--border)}
/* ── MISC ── */
.section-empty{text-align:center;padding:40px;color:var(--text3);font-size:12px}
.margin-analysis-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.margin-analysis-row:last-child{border-bottom:none}
.inline-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}

/* ═══ READABILITY & MOTORSPORT POLISH ═══ */
html{font-size:16px}
body{font-size:13px;-webkit-font-smoothing:antialiased}
td{font-size:12.5px;padding:10px 12px}
thead th{font-size:10px;letter-spacing:.1em;padding:10px 12px}
.pn{font-size:12px;letter-spacing:.02em}
.pill{font-size:10.5px;padding:2.5px 9px;font-weight:600}
.kpi{padding:16px 18px;border:1px solid var(--border);transition:border-color .15s,transform .12s}
.kpi:hover{border-color:var(--border2)}
.kpi[style*="cursor:pointer"]:hover{transform:translateY(-1px);border-color:var(--teal)}
.kpi-label{font-size:9.5px;letter-spacing:.12em;color:var(--text3)}
.kpi-value{font-size:24px}
.kpi-sub{font-size:10.5px;color:var(--text3);margin-top:3px}
.btn{font-size:12px;font-weight:600;letter-spacing:.01em;transition:all .12s}
.btn:hover{transform:translateY(-1px)}
.btn-sm{font-size:11px}
.action-btn{font-size:10.5px;padding:3.5px 9px}
.filter-chip{font-size:11px;padding:5px 11px}
.nav-item{font-size:12.5px;padding:8px 14px;border-radius:8px;margin:1px 8px;transition:all .12s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);border:1px solid rgba(13,148,136,.2);color:var(--teal)}
.sidebar-section{font-size:9.5px;color:var(--text3);opacity:.85}
.section-header{font-size:10px;letter-spacing:.13em;padding:11px 14px 6px}
.form-label{font-size:10px}
.form-input{font-size:12.5px;padding:9px 11px}
.inline-edit{font-size:12px;padding:5px 9px}
.qty-input{font-size:12.5px}
.panel{border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.panel-title{font-size:10.5px;letter-spacing:.11em;color:var(--text2)}
.topbar{border-bottom:1px solid var(--border);position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal) 30%,var(--orange) 70%,transparent 100%);opacity:.7}
.topbar-title{font-size:15px;letter-spacing:.01em}
.section-empty{font-size:12px;color:var(--text3);padding:22px}
.alert-row{font-size:12px}
.check-row{font-size:12px}
.modal-box{border:1px solid var(--border2);box-shadow:0 16px 48px rgba(0,0,0,.14)}
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--bg3)}
.rowlink:hover td{background:var(--teal-dim)!important}
.row-selected td{background:rgba(13,148,136,.08)!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid rgba(13,148,136,.4);outline-offset:1px}
.money,.money-neutral,.money-cost,.money-vendor,.money-retail{font-size:12px}
.search-wrap input{font-size:12.5px}
.wk-label{font-size:11px;font-weight:700}
.toast{font-size:12.5px;border:1px solid var(--border2);box-shadow:0 6px 20px rgba(0,0,0,.1)}

/* ═══ UTILITY CLASSES ═══ */
.flex-row{display:flex;align-items:center;gap:8px}
.flex-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.text-mono{font-family:var(--mono)}
.text-sm{font-size:11px}
.text-xs{font-size:10px}
.text-muted{color:var(--text3)}
.text-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:700}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-full{width:100%}
.sticky-top{position:sticky;top:0;z-index:5;background:var(--bg3)}
.panel-body{padding:14px 16px}
.gap-sm{gap:6px}
.gap-lg{gap:16px}
/* ═══ NUMERIC LEGIBILITY ═══ */
.pn{font-weight:500;letter-spacing:.015em;font-size:12.5px}
.money,.money-neutral,.money-cost,.money-vendor,.money-retail{font-size:12.5px;font-weight:500;letter-spacing:.01em}
.kpi-value{font-weight:600;letter-spacing:0}
.qty-input,.inline-edit[type=number]{font-family:var(--mono);font-weight:500}
.wk-label{font-size:11.5px}
td[class*=money]{font-variant-numeric:tabular-nums}
</style>
</head>

</div>

// ── LIVE DEMAND ENGINE ──
// All weekly averages auto-compute from real sales history.
// Part demand = direct sales + BOM explosion of finished-goods sales.
function computeDemand(){
  const wk4={},wk12={};
  const now=new Date();
  S.sales.forEach(s=>{
    if(!s.pn||!s.sale_date)return;
    if(s.fulfillment_status==='Cancelled')return;
    const w=Math.floor((now-new Date(s.sale_date))/(7*24*3600*1000));
    if(w<0||w>=12)return;
    const q=s.qty||1;
    wk12[s.pn]=(wk12[s.pn]||0)+q;
    if(w<4)wk4[s.pn]=(wk4[s.pn]||0)+q;
  });
  const asmCalc={},partCalc={};
  S.assemblies.forEach(a=>{asmCalc[a.pn]={wk4:(wk4[a.pn]||0)/4,wk12:(wk12[a.pn]||0)/12};});
  // induced demand on subassemblies (one level)
  Object.entries(S.boms).forEach(([parent,items])=>{
    const ad=asmCalc[parent];if(!ad)return;
    items.forEach(i=>{
      if(i.item_type==='assembly'&&asmCalc[i.child_pn]){
        asmCalc[i.child_pn].wk4+=ad.wk4*(i.qty||1);
        asmCalc[i.child_pn].wk12+=ad.wk12*(i.qty||1);
      }
    });
  });
  // explode to parts
  S.parts.forEach(p=>{partCalc[p.pn]={wk4:(wk4[p.pn]||0)/4,wk12:(wk12[p.pn]||0)/12};});
  Object.entries(S.boms).forEach(([parent,items])=>{
    const ad=asmCalc[parent];if(!ad)return;
    items.forEach(i=>{
      if(i.item_type!=='part')return;
      if(!partCalc[i.child_pn])partCalc[i.child_pn]={wk4:0,wk12:0};
      partCalc[i.child_pn].wk4+=ad.wk4*(i.qty||1);
      partCalc[i.child_pn].wk12+=ad.wk12*(i.qty||1);
    });
  });
  S.calc={asm:asmCalc,part:partCalc,salesLen:S.sales.length,bomLen:Object.keys(S.boms).length};
}

function avgWk(p){
  const c=S.calc&&S.calc.part&&S.calc.part[p.pn];
  if(c&&(c.wk12>0||c.wk4>0))return c.wk12>0?c.wk12:c.wk4;
  return p.avg_sales_wk||0; // fallback: imported value (no recent sales)
}
function avgWk4(p){
  const c=S.calc&&S.calc.part&&S.calc.part[p.pn];
  return c?c.wk4:0;
}
function asmAvgWk(a){
  const c=S.calc&&S.calc.asm&&S.calc.asm[a.pn];
  if(c&&(c.wk12>0||c.wk4>0))return c.wk12>0?c.wk12:c.wk4;
  return a.avg_sales_wk||0;
}
function liveStatus(a){
  const oh=a.total_on_hand||0;
  const wk=asmAvgWk(a);
  if(oh<=0)return 'critical';
  if(wk>0&&oh<wk*2)return 'low';
  return 'ok';
}

function poPill(s){
  const m={'On Order':'pill-orange','In Transit':'pill-yellow','Received':'pill-teal','Cancelled':'pill-red'};
  return `<span class="pill ${m[s]||'pill-muted'}">${s}</span>`;

// Single source of truth for PO extended cost.
// Legacy stub format: ONE po_line where unit_cost = total PO cost (not per-unit).
// Detected by "X items" or "X-line PO" in EITHER po_line description OR header description.
const _stubRe=/^\d+[\s-]+(items?|line[\s-]*PO)$/i;
function poExtended(p){
  const ls=S.poLines[p.id]||[];
  const hd=(p.description||'').trim();
  if(ls.length===1){
    const d=(ls[0].description||'').trim();
    if(_stubRe.test(d)||_stubRe.test(hd))return ls[0].unit_cost||0;
    return(ls[0].qty_ordered||0)*(ls[0].unit_cost||0);
  }
  if(ls.length>1)return ls.reduce((t,l)=>t+(l.qty_ordered||0)*(l.unit_cost||0),0);
  // No po_lines — fall back to header
  if(p.pn==='Multiple'||(p.pn||'').includes(' more'))return p.unit_cost||0;
  if(_stubRe.test(hd))return p.unit_cost||0;
  return(p.unit_cost||0)*(p.qty||0);
}

// Internal orders live in their own modules — exclude from Sales view and counts
function isInternal(on){return(on||'').startsWith('WARRANTY-')||(on||'').startsWith('SHERROR-');}
// Count unique pending orders (grouped by order_number) — Open + Partial
// Used by updateBadge and renderDashboard so numbers match what renderSales shows
function countPendingOrders(){
  const openNums=new Set();
  S.sales.forEach(s=>{
    if(isInternal(s.order_number))return;
    const fs=s.fulfillment_status||'Open';
    if(fs==='Open'||fs==='Partial')openNums.add(s.order_number||('__noid__'+s.id));
  });
  return openNums.size;
}
function countGroupedStatus(status){
  // Count unique order numbers (or individual rows if no order#) with a given status
  // For multi-line orders the effective status is determined the same way groupSales does it:
  // highest-ranked line wins. This fast path just checks if ANY line matches for single-status needs.
  const rank={'Shipped':5,'Delivered':4,'Packed':3,'On Hold':2,'Partial':2,'Open':1,'Cancelled':0,'Refunded':0};
  const byOrder={};
  S.sales.forEach(s=>{
    if(isInternal(s.order_number))return;
    const key=s.order_number||('__noid__'+s.id);
    if(!byOrder[key])byOrder[key]=[];
    byOrder[key].push(s);
  });
  return Object.values(byOrder).filter(lines=>{
    if(lines.length===1)return(lines[0].fulfillment_status||'Open')===status;
    const shippedLines=lines.filter(l=>l.fulfillment_status==='Shipped'||l.fulfillment_status==='Delivered');
    const pendingLines=lines.filter(l=>!['Shipped','Delivered','Cancelled','Refunded'].includes(l.fulfillment_status||'Open'));
    const allPendingOnHold=pendingLines.length>0&&pendingLines.every(l=>l.fulfillment_status==='On Hold');
    const effectiveStatus=allPendingOnHold?'On Hold':
      shippedLines.length>0&&pendingLines.length>0&&!allPendingOnHold?'Partial':
      lines.reduce((best,x)=>(rank[x.fulfillment_status||'Open']||0)>(rank[best]||0)?x.fulfillment_status:best,lines[0].fulfillment_status||'Open');
    return effectiveStatus===status;
  }).length;
}

  if(wEl){wEl.classList.toggle('alert-nav',totalOpen>0);}
  // Sales badge — pending orders (grouped, matches what renderSales shows)

}

// Paginate past Supabase's server-side max_rows (default 1000) — sequential, safe
async function fetchAll(query){
  const PAGE=1000;
  let rows=[],from=0;
  while(from<50000){
    const{data,error}=await query(from,from+PAGE-1);
    if(error)throw error;
    if(!data?.length)break;
    rows=[...rows,...data];
    if(data.length<PAGE)break;
    from+=PAGE;
  }
  return rows;
}

function normalizeAssemblies(rows){
  return(rows||[]).map(a=>{
    // Pattern-based rule: XX-XXXX format (e.g. 01-0001) = subassembly, unless it's a HW pack
    const patternSaysSub=/^\d{2}-\d{4}/.test(a.pn||'')&&!isHWPack(a.pn);
    // Trust the DB value as the authority — if the DB has is_subassembly explicitly set, use it.
    // Flag a mismatch so the user can review/fix if needed.
    const dbVal=a.is_subassembly;
    const effectiveSub=(dbVal===true||dbVal===false)?dbVal:patternSaysSub;
    return{...a,is_subassembly:effectiveSub,_classificationMismatch:patternSaysSub!==effectiveSub};
  });
}

let _rtChannel=null, _rtStatus='connecting';
function setupRealtime(){
  if(_rtChannel){try{_rtChannel.unsubscribe();}catch(e){}}
  _rtChannel=db.channel('erp-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'parts'},p=>{
      if(p.eventType==='INSERT')S.parts=[...S.parts,p.new].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(p.eventType==='UPDATE')S.parts=S.parts.map(x=>x.id===p.new.id?p.new:x);
      else if(p.eventType==='DELETE')S.parts=S.parts.filter(x=>x.id!==p.old.id);
      updateBadge();if(['parts','inventory','dashboard'].includes(S.view))scheduleRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'assemblies'},p=>{
      const norm=a=>{const p=/^\d{2}-\d{4}/.test(a.pn||'')&&!isHWPack(a.pn);const d=a.is_subassembly;return{...a,is_subassembly:(d===true||d===false)?d:p};};
      if(p.eventType==='INSERT')S.assemblies=[...S.assemblies,norm(p.new)].sort((a,b)=>a.pn.localeCompare(b.pn));
      else if(p.eventType==='UPDATE')S.assemblies=S.assemblies.map(x=>x.id===p.new.id?norm(p.new):x);
      else if(p.eventType==='DELETE')S.assemblies=S.assemblies.filter(x=>x.id!==p.old.id);
      if(['assemblies','dashboard'].includes(S.view))scheduleRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},p=>{
      if(p.eventType==='INSERT'){
        if(!S.sales.find(s=>s.id===p.new.id)){
          S.sales=[p.new,...S.sales];
          showOrderAlert(p.new.order_number||'',p.new.pn||'');
          pushActivity({icon:'🛒',type:'order',text:'New order #'+(p.new.order_number||''),sub:p.new.pn+(p.new.qty>1?' ×'+p.new.qty:'')+(p.new.customer_name?' — '+p.new.customer_name:''),ts:p.new.sale_date||new Date().toISOString(),cls:'var(--teal)'});
        }
      } else if(p.eventType==='UPDATE'){
        const prev=S.sales.find(s=>s.id===p.new.id);
        S.sales=S.sales.map(s=>s.id===p.new.id?p.new:s);
        // Flash the row and toast if status changed externally (e.g. ShipStation webhook)
        if(prev&&prev.fulfillment_status!==p.new.fulfillment_status){
          const statusEmoji={Shipped:'📦',Delivered:'✅',Cancelled:'🚫','On Hold':'⏸','Partial':'🔀',Refunded:'↩',Open:'🔓'}[p.new.fulfillment_status]||'🔄';
          toast(`${statusEmoji} #${p.new.order_number||''} → ${p.new.fulfillment_status}`,4000);
          const cls={Shipped:'var(--teal)',Delivered:'var(--green)',Cancelled:'var(--red)','On Hold':'var(--yellow)',Partial:'var(--orange)'}[p.new.fulfillment_status]||'var(--text2)';
          pushActivity({icon:statusEmoji,type:'order_status',text:'#'+(p.new.order_number||'')+' → '+p.new.fulfillment_status,sub:p.new.pn+(p.new.tracking_number?' · '+p.new.tracking_number:''),ts:new Date().toISOString(),cls});
          // Flash the row after next render
          setTimeout(()=>{
            const row=document.querySelector(`tr[data-order="${p.new.order_number}"]`);
            if(row){row.classList.remove('rt-flash');void row.offsetWidth;row.classList.add('rt-flash');}
          },100);
        }
      } else if(p.eventType==='DELETE'){
        S.sales=S.sales.filter(s=>s.id!==p.old.id);
      }
      updateBadge();
      if(['sales','dashboard'].includes(S.view))scheduleRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'purchases'},p=>{
      if(p.eventType==='INSERT'){
        S.purchases=[p.new,...S.purchases];
        pushActivity({icon:'📄',type:'po_created',text:'PO created — '+p.new.vendor,sub:(p.new.description||p.new.pn)+(p.new.status?' · '+p.new.status:''),ts:new Date().toISOString(),cls:'var(--orange)'});
      } else if(p.eventType==='UPDATE'){
        const prev=S.purchases.find(x=>x.id===p.new.id);
        S.purchases=S.purchases.map(x=>x.id===p.new.id?p.new:x);
        if(prev&&prev.status!==p.new.status){
          const statusEmoji={Received:'✅','In Transit':'🚢',Ordered:'📋',Cancelled:'🚫',Draft:'📝','On Order':'📦',Partial:'🔀'}[p.new.status]||'🔄';
          const cls={Received:'var(--teal)','In Transit':'var(--yellow)',Cancelled:'var(--red)','On Order':'var(--orange)'}[p.new.status]||'var(--text2)';
          pushActivity({icon:statusEmoji,type:'po_status',text:'PO '+p.new.vendor+' → '+p.new.status,sub:p.new.description||p.new.pn,ts:new Date().toISOString(),cls});
        }
      }
      if(['purchases','dashboard'].includes(S.view))scheduleRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'po_lines'},p=>{
      // Another user received a PO line — refresh the open PO detail if visible
      if(p.eventType==='UPDATE'||p.eventType==='INSERT'){
        const poId=p.new?.po_id;
        if(poId){
          if(!S.poLines[poId])S.poLines[poId]=[];
          if(p.eventType==='INSERT')S.poLines[poId]=[...S.poLines[poId],p.new];
          else S.poLines[poId]=S.poLines[poId].map(l=>l.id===p.new.id?p.new:l);
        }
        if(S.view==='purchases'&&S.activePO===poId)scheduleRender();
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'inv_corrections'},p=>{
      if(p.eventType==='INSERT'){
        S.corrections=[p.new,...S.corrections].slice(0,1000);
        const icon={po_receipt:'📦',pack:'🔧',unpack:'↩',cycle_count:'📋',shipment:'🚚',manual:'✎'}[p.new.source]||'✎';
        const cls=p.new.adjustment>0?'var(--green)':'var(--red)';
        pushActivity({icon,type:'stock_movement',text:p.new.pn+' '+(p.new.adjustment>0?'+':'')+p.new.adjustment+' ('+fn(p.new.new_qty)+' on hand)',sub:p.new.reason||p.new.source,ts:p.new.created_at,cls});
        if(S.view==='corrections')scheduleRender();
        // Silent — don't toast for every correction (too noisy with multiple users)
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'cycle_count_lines'},p=>{
      if(p.eventType==='UPDATE'&&S.activeCount){
        S.countLines=S.countLines.map(l=>l.id===p.new.id?p.new:l);
        if(S.view==='cyclecounts')scheduleRender();
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'shipment_errors'},p=>{
      if(p.eventType==='INSERT')S.shipmentErrors=[p.new,...S.shipmentErrors];
      else if(p.eventType==='UPDATE'){
        const prev=S.shipmentErrors.find(e=>e.id===p.new.id);
        S.shipmentErrors=S.shipmentErrors.map(e=>e.id===p.new.id?p.new:e);
        if(!prev?.tracking_number&&p.new.tracking_number)toast('📦 Correction shipped — #'+(p.new.order_number||p.new.id)+': '+(p.new.carrier||'')+' '+p.new.tracking_number,6000);
      }
      else if(p.eventType==='DELETE')S.shipmentErrors=S.shipmentErrors.filter(e=>e.id!==p.old.id);
      updateBadge();
      if(S.view==='warranty')scheduleRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'warranty_claims'},p=>{
      if(p.eventType==='INSERT')S.warrantyClaims=[p.new,...S.warrantyClaims];
      else if(p.eventType==='UPDATE'){
        const prev=S.warrantyClaims.find(w=>w.id===p.new.id);
        S.warrantyClaims=S.warrantyClaims.map(w=>w.id===p.new.id?p.new:w);
        if(!prev?.tracking_number&&p.new.tracking_number)toast('🔄 Warranty shipped — '+(p.new.pn||p.new.id)+': '+(p.new.carrier||'')+' '+p.new.tracking_number,6000);
      }
      else if(p.eventType==='DELETE')S.warrantyClaims=S.warrantyClaims.filter(w=>w.id!==p.old.id);
      updateBadge();
      if(S.view==='warranty')scheduleRender();
    })
    .subscribe((status)=>{
      _rtStatus=status;
      const dot=document.getElementById('sync-dot');
      const lbl=document.getElementById('sync-label');
      if(dot){dot.className='sync-dot'+(status==='SUBSCRIBED'?' ok':status==='CHANNEL_ERROR'?' err':' busy');}
      if(lbl){lbl.textContent=status==='SUBSCRIBED'?'Live — Real-time':status==='CHANNEL_ERROR'?'Disconnected':'Connecting…';}
      if(status==='CHANNEL_ERROR'){
        setTimeout(()=>{toast('Reconnecting to live sync…');setupRealtime();},5000);
      }
    });
}

function trackingUrl(carrier, tracking){
  if(!tracking)return'';
  const c=(carrier||'').toUpperCase();
  if(c.includes('UPS'))return'https://www.ups.com/track?tracknum='+tracking;
  if(c.includes('USPS')||c.includes('STAMPS')||c.includes('ENDICIA'))return'https://tools.usps.com/go/TrackConfirmAction?qtc_tLabels1='+tracking;
  if(c.includes('FEDEX')||c.includes('FED'))return'https://www.fedex.com/fedextrack/?trknbr='+tracking;
  if(c.includes('DHL'))return'https://www.dhl.com/us-en/home/tracking.html?tracking-id='+tracking;
  if(c.includes('ONTRAC'))return'https://www.ontrac.com/tracking/?number='+tracking;
  if(c.includes('LSO'))return'https://www.lso.com/go/track?tracking_id='+tracking;
  return'https://www.google.com/search?q='+encodeURIComponent(tracking+' '+carrier+' tracking');
}
function carrierLabel(code){
  if(!code)return'';
  const c=code.toUpperCase();
  if(c.includes('UPS'))return'UPS';
  if(c.includes('USPS')||c.includes('STAMPS')||c.includes('ENDICIA'))return'USPS';
  if(c.includes('FEDEX')||c.includes('FED_EX'))return'FedEx';
  if(c.includes('DHL'))return'DHL';
  if(c.includes('ONTRAC'))return'OnTrac';
  if(c.includes('LSO'))return'LSO';
  if(c.includes('AMAZON'))return'Amazon';
  if(c.includes('ASENDIA'))return'Asendia';
  if(c.includes('FIRSTMILE')||c.includes('FIRST_MILE'))return'FirstMile';
  return code; // fall back to raw code if unknown
}

function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function timeAgo(ts){
  if(!ts)return'';
  const d=new Date(ts);if(isNaN(d))return'';
  const sec=Math.floor((Date.now()-d)/1000);
  if(sec<60)return'just now';
  if(sec<3600)return Math.floor(sec/60)+'m ago';
  if(sec<86400)return Math.floor(sec/3600)+'h ago';
  if(sec<604800)return Math.floor(sec/86400)+'d ago';
  return d.toLocaleDateString();
}

function buildCatCascade(id,table,selected){
  var cats=getCats(table);
  var tops=[...new Set(cats.map(function(c){return c.split('/')[0];}))].sort();
  var subMap={};
  cats.filter(function(c){return c.includes('/');}).forEach(function(c){
    var slash=c.indexOf('/');var top=c.slice(0,slash);var sub=c.slice(slash+1);
    if(!subMap[top])subMap[top]=[];subMap[top].push(sub);
  });
  var selParts=(selected||'').split('/');
  var selTop=selParts[0]||'';var selSub=selParts.slice(1).join('/')||'';
  var subs=selTop?(subMap[selTop]||[]):[];

  var topOpts='<option value="">No category</option>';
  tops.forEach(function(t){topOpts+='<option value="'+escHtml(t)+'"'+(t===selTop?' selected':'')+'>'+escHtml(t)+'</option>';});
  topOpts+='<option value="__new_top">+ New category…</option>';

  var subOpts='<option value="">— Top level only —</option>';
  subs.forEach(function(s){subOpts+='<option value="'+escHtml(s)+'"'+(s===selSub?' selected':'')+'>'+escHtml(s)+'</option>';});
  subOpts+='<option value="__new_sub">+ New sub-category…</option>';

  return '<div style="display:flex;flex-direction:column;gap:6px">'
    +'<select id="'+id+'-l1" class="form-input" onchange="catL1(\''+id+'\',\''+table+'\')">'+topOpts+'</select>'
    +'<div id="'+id+'-l2-wrap" style="display:'+(selTop?'flex':'none')+';flex-direction:column;gap:6px">'
      +'<select id="'+id+'-l2" class="form-input" onchange="catL2(\''+id+'\')">'+subOpts+'</select>'
    +'</div>'
    +'<div id="'+id+'-ntop" style="display:none;background:var(--bg3);border-radius:6px;padding:10px;border:1px solid var(--border)">'
      +'<div style="font-size:10px;color:var(--teal);font-weight:700;margin-bottom:6px">New Top-Level Category</div>'
      +'<div style="display:flex;gap:6px">'
        +'<input id="'+id+'-ntop-nm" class="form-input" placeholder="Category name…" style="flex:1">'
        +'<button type="button" class="btn btn-primary btn-sm" onclick="catAddTop(\''+id+'\',\''+table+'\')">Add</button>'
        +'<button type="button" class="btn btn-sm" onclick="document.getElementById(\''+id+'-ntop\').style.display=\'none\'">Cancel</button>'
      +'</div>'
    +'</div>'
    +'<div id="'+id+'-nsub" style="display:none;background:var(--bg3);border-radius:6px;padding:10px;border:1px solid var(--border)">'
      +'<div style="font-size:10px;color:var(--teal);font-weight:700;margin-bottom:6px">New Sub-Category under <span id="'+id+'-nsub-par" style="color:var(--orange)"></span></div>'
      +'<div style="display:flex;gap:6px">'
        +'<input id="'+id+'-nsub-nm" class="form-input" placeholder="Sub-category name…" style="flex:1">'
        +'<button type="button" class="btn btn-primary btn-sm" onclick="catAddSub(\''+id+'\')">Add</button>'
        +'<button type="button" class="btn btn-sm" onclick="document.getElementById(\''+id+'-nsub\').style.display=\'none\'">Cancel</button>'
      +'</div>'
    +'</div>'
    +'<input type="hidden" id="'+id+'" value="'+escHtml(selected||'')+'">'
  +'</div>';
}
// Keep old name as alias for any other callers
function buildCatSelect(id,table,selected){return buildCatCascade(id,table,selected);}

function catL1(id,table){
  var l1=document.getElementById(id+'-l1');
  var l2Wrap=document.getElementById(id+'-l2-wrap');
  var l2=document.getElementById(id+'-l2');
  var hidden=document.getElementById(id);
  var val=l1.value;
  if(val==='__new_top'){
    l1.value='';
    document.getElementById(id+'-ntop').style.display='block';
    setTimeout(function(){var el=document.getElementById(id+'-ntop-nm');if(el)el.focus();},50);
    hidden.value='';return;
  }
  var cats=getCats(table);
  var subMap={};
  cats.filter(function(c){return c.includes('/');}).forEach(function(c){
    var slash=c.indexOf('/');var top=c.slice(0,slash);var sub=c.slice(slash+1);
    if(!subMap[top])subMap[top]=[];subMap[top].push(sub);
  });
  var subs=val?(subMap[val]||[]):[];
  var subOpts='<option value="">— Top level only —</option>';
  subs.forEach(function(s){subOpts+='<option value="'+escHtml(s)+'">'+escHtml(s)+'</option>';});
  subOpts+='<option value="__new_sub">+ New sub-category…</option>';
  l2.innerHTML=subOpts;
  l2Wrap.style.display=val?'flex':'none';
  hidden.value=val;
}
function catL2(id){
  var l1=document.getElementById(id+'-l1');
  var l2=document.getElementById(id+'-l2');
  var hidden=document.getElementById(id);
  var top=l1.value;var sub=l2.value;
  if(sub==='__new_sub'){
    l2.value='';
    var parSpan=document.getElementById(id+'-nsub-par');if(parSpan)parSpan.textContent=top;
    document.getElementById(id+'-nsub').style.display='block';
    setTimeout(function(){var el=document.getElementById(id+'-nsub-nm');if(el)el.focus();},50);
    return;
  }
  hidden.value=sub?top+'/'+sub:top;
}
function catAddTop(id,table){
  var nm=(document.getElementById(id+'-ntop-nm')?.value||'').trim();
  if(!nm){toast('Enter a name');return;}
  var l1=document.getElementById(id+'-l1');var hidden=document.getElementById(id);
  var lastOpt=l1.options[l1.options.length-1];
  l1.insertBefore(new Option(nm,nm,true,true),lastOpt);l1.value=nm;
  var l2=document.getElementById(id+'-l2');var l2Wrap=document.getElementById(id+'-l2-wrap');
  l2.innerHTML='<option value="">— Top level only —</option><option value="__new_sub">+ New sub-category…</option>';
  l2Wrap.style.display='flex';
  hidden.value=nm;
  document.getElementById(id+'-ntop').style.display='none';
  document.getElementById(id+'-ntop-nm').value='';
  toast('"'+nm+'" added — saves with the record');
}
function catAddSub(id){
  var nm=(document.getElementById(id+'-nsub-nm')?.value||'').trim();
  if(!nm){toast('Enter a sub-category name');return;}
  var l1=document.getElementById(id+'-l1');var l2=document.getElementById(id+'-l2');var hidden=document.getElementById(id);
  var top=l1.value;if(!top){toast('Select a top-level category first');return;}
  var lastOpt=l2.options[l2.options.length-1];
  l2.insertBefore(new Option(nm,nm,true,true),lastOpt);l2.value=nm;
  hidden.value=top+'/'+nm;
  document.getElementById(id+'-nsub').style.display='none';
  document.getElementById(id+'-nsub-nm').value='';
  toast('"'+top+'/'+nm+'" added — saves with the record');
}

function buildVendorSelect(id,selected){
  var vendors=getVendors();

function showNewCat(id){document.getElementById(id+'-new').style.display='block';setTimeout(function(){var el=document.getElementById(id+'-nm');if(el)el.focus();},50);}

function applyNewCat(id){
  var parEl=document.getElementById(id+'-par');
  var nmEl=document.getElementById(id+'-nm');
  var parent=parEl?parEl.value:'';
  var name=nmEl?nmEl.value.trim():'';
  if(!name){toast('Enter a name');return;}
  var full=parent?parent+'/'+name:name;
  var sel=document.getElementById(id);
  var idx=Array.from(sel.options).findIndex(function(o){return o.value==='__new';});
  var opt=new Option(parent?'  ↳ '+name:name,full,true,true);
  sel.insertBefore(opt,sel.options[idx]);
  sel.value=full;
  document.getElementById(id+'-new').style.display='none';
  toast('"'+full+'" added — saves when you save the record');
}

function renderDashboard(){
  const critical=S.assemblies.filter(a=>!a.discontinued&&liveStatus(a)==='critical').length;
  const needsReorder=S.parts.filter(p=>!p.discontinued&&(avgWk(p)>0||calcForecast(p.pn)>0)&&(p.total_unpckgd||0)<=calcReorderPoint(p)).length;
  const invVal=S.parts.reduce((s,p)=>s+Math.max(0,p.total_unpckgd||0)*(p.unit_cost||0),0);
  // Use grouped counts so numbers match exactly what the Sales page shows
  const openOrders  =countGroupedStatus('Open');
  const onHoldCount =countGroupedStatus('On Hold');
  const packedCount =countGroupedStatus('Packed');
  const partialCount=countGroupedStatus('Partial');
  // Stale: grouped open orders where the lead line's sale_date is older than 60 days
  // (approximation: count raw Open lines with stale dates, then deduplicate by order#)
  const staleOpenNums=new Set(S.sales.filter(s=>!isInternal(s.order_number)&&(!s.fulfillment_status||s.fulfillment_status==='Open')&&s.sale_date&&s.sale_date<daysAgo(60)).map(s=>s.order_number||('__noid__'+s.id)));
  const staleOpen=staleOpenNums.size;
  const freshOpen=Math.max(0,openOrders-staleOpen);
  // Fulfillment queue widget still uses raw lines (needs individual IDs for Pack/Ship buttons)
  const freshOpenLines=S.sales.filter(s=>!isInternal(s.order_number)&&(!s.fulfillment_status||s.fulfillment_status==='Open')&&(!s.sale_date||s.sale_date>=daysAgo(60)));
  const packedLines   =S.sales.filter(s=>!isInternal(s.order_number)&&s.fulfillment_status==='Packed');
  const openWarranty=S.warrantyClaims.filter(w=>w.status==='Open').length;
  const openCounts=S.cycleCounts.filter(c=>c.status==='Open').length;
  const weekOrds=S.sales.filter(s=>s.sale_date>=daysAgo(7)).length;
  const openPOs=S.purchases.filter(p=>p.status!=='Received');
  const openPOAmt=openPOs.reduce((s,p)=>s+poExtended(p),0);
  const feed=buildActivityFeed(12);
  return `
  <div class="kpi-grid kpi-grid-4">
    <div class="kpi kpi-red" style="cursor:pointer" onclick="setFilter('sales','fstatus','Open|Partial');nav('sales')" title="Open + Partial orders">
      <div class="kpi-label">Orders to Fulfill</div>
      <div class="kpi-value">${freshOpen+partialCount}</div>
      <div class="kpi-sub">${packedCount} packed · ${onHoldCount} on hold</div>
    </div>
    <div class="kpi kpi-orange" style="cursor:pointer" onclick="nav('planning')"><div class="kpi-label">Parts Need Reorder</div><div class="kpi-value">${needsReorder}</div><div class="kpi-sub">Below reorder point</div></div>
    <div class="kpi kpi-yellow" style="cursor:pointer" onclick="nav('assemblies')"><div class="kpi-label">Critical Assemblies</div><div class="kpi-value">${critical}</div></div>
    <div class="kpi kpi-teal"><div class="kpi-label">Parts Inventory Value</div><div class="kpi-value" style="font-size:17px">${fc(invVal)}</div><div class="kpi-sub">${weekOrds} orders this week</div></div>
  </div>
  ${staleOpen>20?`<div class="panel" style="padding:10px 18px;display:flex;gap:12px;align-items:center;border-left:3px solid var(--red);flex-wrap:wrap">
    <span style="font-size:12px;color:var(--red);font-weight:700">⚠ ${staleOpen} stale Open orders</span>
    <span style="font-size:11px;color:var(--text2);flex:1">Orders older than 60 days still showing as Open — likely fulfilled before the ERP existed.</span>
    <button class="btn btn-sm" style="color:var(--red);border-color:rgba(220,38,38,.3)" onclick="closeHistoricalOrders()">🧹 Close old orders</button>
  </div>`:''}
  ${openWarranty>0||openCounts>0?`<div class="panel" style="padding:10px 18px;display:flex;gap:18px;align-items:center;border-left:3px solid var(--yellow)">
    <span style="font-size:11px;color:var(--text2)">⚑ Pending tasks:</span>
    ${openWarranty>0?`<button class="filter-chip" onclick="nav('warranty')">${openWarranty} open warranty claim${openWarranty>1?'s':''}</button>`:''}
    ${openCounts>0?`<button class="filter-chip" onclick="nav('cyclecounts')">${openCounts} cycle count${openCounts>1?'s':''} in progress</button>`:''}
  </div>`:''}
  <div class="grid-2">
  <div>
    <div class="panel">
      <div class="panel-title"><span class="panel-title-left">🚚 Fulfillment Queue</span><button class="btn btn-sm" onclick="nav('sales')">All Orders →</button></div>
      ${freshOpenLines.length===0&&packedLines.length===0?'<div class="section-empty">All orders fulfilled ✓</div>':
      [...freshOpenLines.slice(0,4),...packedLines.slice(0,3)].map(s=>{
        const asm=S.assemblies.find(a=>a.pn===s.pn);
        const stock=asm?(asm.total_on_hand||0):null;
        const canFill=stock!==null&&stock>=(s.qty||1);
        const fs=s.fulfillment_status||'Open';
        return `<div class="alert-row ${fs==='Open'?(canFill?'alert-row-yellow':'alert-row-red'):''}" style="${fs==='Packed'?'border-left-color:var(--teal)':''}">
          <div style="flex:1"><b>${s.order_number||''}</b> — ${s.pn} ×${s.qty||1}
            <span style="font-size:10px;color:${canFill?'var(--green)':'var(--red)'};margin-left:6px">${stock!==null?'stock: '+stock:''}</span></div>
          ${fs==='Open'?`<button class="btn btn-teal btn-sm" ${canFill?'':'disabled'} onclick="markPacked('${s.id}','${s.pn}',${s.qty||1})">Pack</button>`:
          `<button class="btn btn-primary btn-sm" onclick="openShipModal('${s.id}','${s.pn}',${s.qty||1})">Ship</button>`}
        </div>`;}).join('')}
    </div>
    <div class="panel">
      <div class="panel-title"><span class="panel-title-left">⚠ Reorder Queue</span><button class="btn btn-sm" onclick="nav('planning')">Planning →</button></div>
      <div class="tbl-wrap">
      <table><thead><tr><th>Part #</th><th>On Hand</th><th>Reorder Pt</th><th></th></tr></thead><tbody>
      ${S.parts.filter(p=>!p.discontinued&&(avgWk(p)>0)&&(p.total_unpckgd||0)<=calcReorderPoint(p)).sort((a,b)=>(a.total_unpckgd||0)-(b.total_unpckgd||0)).slice(0,7).map(p=>{
        const sq=calcSuggestedQty(p);
        return `<tr><td class="pn">${p.pn}</td>
        <td class="money" style="color:var(--red);font-weight:700">${p.total_unpckgd||0}</td>
        <td class="money-neutral">${calcReorderPoint(p)}</td>
        <td><button class="action-btn" onclick='createPOFromSuggestion("${p.pn}","${p.vendor||''}",${sq},${p.unit_cost||0},"")'>Order ${sq}</button></td></tr>`;
      }).join('')||'<tr><td colspan="4" class="section-empty">Nothing needs reordering ✓</td></tr>'}
      </tbody></table></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="panel-title"><span class="panel-title-left">📋 Activity Feed <span style="font-size:9px;font-weight:400;color:var(--green);margin-left:6px">● LIVE</span></span><button class="btn btn-sm" onclick="nav('corrections')">Full Log →</button></div>
      ${feed.map(e=>`<div class="margin-analysis-row" style="padding:6px 0;gap:8px">
        <div style="display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0">
          <span style="flex-shrink:0;font-size:15px;line-height:1.2">${e.icon}</span>
          <div style="min-width:0;flex:1">
            <div style="font-size:11px;font-weight:600;color:${e.cls||'var(--text2)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.text}</div>
            ${e.sub?`<div style="font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.sub}</div>`:''}
          </div>
        </div>
        <span style="font-size:9px;color:var(--text3);font-family:var(--mono);flex-shrink:0;white-space:nowrap">${timeAgo(e.ts)}</span>
      </div>`).join('')||'<div class="section-empty">No recent activity</div>'}
  <div style="text-align:right;padding:4px 8px"><button class="btn btn-sm" style="font-size:10px;color:var(--text3)" onclick="clearActivityFeed()">🗑 Clear feed</button></div>
    </div>
    <div class="panel">
      <div class="panel-title"><span class="panel-title-left">Open Purchase Orders</span><button class="btn btn-sm" onclick="nav('purchases')">All POs →</button></div>
      <div class="inline-stat" style="margin-bottom:8px"><span style="color:var(--text3)">Open PO Value</span><span class="money-cost" style="font-weight:700">${fc(openPOAmt)}</span></div>
      <div class="tbl-wrap">
      <table><thead><tr><th>Vendor</th><th>Part #</th><th>Amount</th><th>Status</th></tr></thead><tbody>
      ${openPOs.slice(0,6).map(p=>`<tr style="cursor:pointer" onclick="openPODetail('${p.id}');nav('purchases')">
        <td class="main-col">${p.vendor}</td>
        <td class="pn">${p.pn}</td>
        <td class="money-cost">${fc(poExtended(p))}</td>
        <td>${poPill(p.status)}</td>
      </tr>`).join('')||'<tr><td colspan="4" class="section-empty">No open POs</td></tr>'}
      </tbody></table></div>
    </div>
  </div></div>`;
}

// ── BOM SEARCHABLE COMBOBOX ──────────────────────────────────────────────────
// Shared dropdown builder for both the "Select Assembly" and "Parent" pickers
function _bomDdBuild(dd, q, currentVal, onSelect) {
  const bomKeys=new Set(Object.keys(S.boms));
  // For parent picker we want ALL assemblies, not just those with BOMs
  const active=S.assemblies.filter(function(a){return !a.discontinued;}).map(function(a){return a.pn;}).sort();
  const disc=S.assemblies.filter(function(a){return a.discontinued;}).map(function(a){return a.pn;}).sort();
  const all=[...active,...disc];
  const pool=all; // both pickers show all assemblies (BOM badge distinguishes)
  const lq=(q||'').toLowerCase().trim();
  const filtered=lq?pool.filter(function(k){
    const a=S.assemblies.find(function(x){return x.pn===k;});
    return k.toLowerCase().includes(lq)||(a?.description||'').toLowerCase().includes(lq);
  }):pool;
  if(!filtered.length){dd.innerHTML='<div style="padding:12px 14px;font-size:12px;color:var(--text3)">No assemblies found</div>';return;}
  dd.innerHTML=filtered.map(function(k,i){
    const a=S.assemblies.find(function(x){return x.pn===k;});
    const isSel=k===currentVal;
    const isDisc=a?.discontinued;
    const hasBOM=bomKeys.has(k);
    return '<div class="_bom-opt" data-val="'+k+'" data-idx="'+i+'"'
      +' onclick="'+onSelect+'(\''+k+'\')"'
      +' style="padding:8px 12px;cursor:pointer;background:'+(isSel?'var(--bg4)':'transparent')+';border-bottom:1px solid var(--border);opacity:'+(isDisc?'.5':'1')+'"'
      +' onmouseenter="this.style.background=\'var(--bg3)\'" onmouseleave="this.style.background=\''+(isSel?'var(--bg4)':'transparent')+'\'">'
      +'<div style="display:flex;align-items:center;gap:6px">'        +'<span style="font-family:var(--mono);font-size:12px;color:'+(isDisc?'var(--text3)':'var(--teal)')+'">'+k+(isDisc?' <span style="font-size:9px">🗄 disc.</span>':'')+'</span>'        +(hasBOM?'<span style="font-size:9px;font-weight:700;background:var(--teal-dim);color:var(--teal);border-radius:3px;padding:1px 5px">BOM ✓</span>':'<span style="font-size:9px;color:var(--text3);border-radius:3px;padding:1px 5px;border:1px solid var(--border)">no BOM yet</span>')      +'</div>'      +(a?.description?'<div style="font-size:10px;color:var(--text3);margin-top:1px">'+escHtml(a.description)+'</div>':'')    +'</div>';
  }).join('');
}
function _bomDdKey(e, ddId, inputId, onSelect){
  const dd=document.getElementById(ddId);
  if(!dd||dd.style.display==='none')return;
  const opts=Array.from(dd.querySelectorAll('._bom-opt'));
  if(!opts.length)return;
  const cur=dd.querySelector('._bom-opt[data-active]');
  let idx=cur?parseInt(cur.dataset.idx):-1;
  if(e.key==='ArrowDown'){e.preventDefault();if(cur)cur.removeAttribute('data-active');idx=Math.min(idx+1,opts.length-1);opts[idx].setAttribute('data-active','1');opts[idx].scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();if(cur)cur.removeAttribute('data-active');idx=Math.max(idx-1,0);opts[idx].setAttribute('data-active','1');opts[idx].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();const act=dd.querySelector('._bom-opt[data-active]')||opts[0];if(act)window[onSelect](act.dataset.val);}
  else if(e.key==='Escape'){dd.style.display='none';const inp=document.getElementById(inputId);if(inp){const sel=S.selBOM||'';const a=S.assemblies.find(function(x){return x.pn===sel;});inp.value=ddId==='bom-sel-dd'?(sel?(sel+(a?.description?' — '+a.description:'')):''):(sel||'');}}
}
function _bomDdOpen(input, ddId, onSelect){
  const dd=document.getElementById(ddId);if(!dd)return;
  const cur=ddId==='bom-sel-dd'?S.selBOM||'':($('bom-parent')||{}).value||S.selBOM||'';
  _bomDdBuild(dd,input.value,cur,onSelect);
  dd.style.display='block';
  input.select();
  // Close on outside click
  setTimeout(function(){
    function outside(e){
      const wrap=document.getElementById(ddId==='bom-sel-dd'?'bom-sel-wrap':'bom-par-wrap');
      if(!wrap||!wrap.contains(e.target)){
        dd.style.display='none';
        document.removeEventListener('click',outside);
        // Restore display value
        const inp=document.getElementById(ddId==='bom-sel-dd'?'bom-sel-input':'bom-parent-input');
        if(inp){const sel=S.selBOM||'';const a=S.assemblies.find(function(x){return x.pn===sel;});inp.value=ddId==='bom-sel-dd'?(sel?(sel+(a?.description?' — '+a.description:'')):''):(sel||'');}
      }
    }
    document.addEventListener('click',outside);
  },0);
}

function renderPurchases(){

  function poDisplayData(p){
    const lines=S.poLines[p.id]||[];
    if(!lines.length){
      if(p.pn==='Multiple'||(p.pn||'').includes(' +')&&(p.pn||'').includes(' more')){
        return{pn:'Multiple',desc:p.description||'',qty:p.qty||0,unitCostHtml:'—',extended:p.unit_cost||0,tooltip:''};
      }
      return{pn:p.pn,desc:p.description||'',qty:p.qty||0,unitCostHtml:fc(p.unit_cost||0,4),extended:poExtended(p),tooltip:''};
    }
    const ext=lines.reduce((s,l)=>s+(l.qty_ordered||0)*(l.unit_cost||0),0);
    const totalQty=lines.reduce((s,l)=>s+(l.qty_ordered||0),0);
    if(lines.length===1){
      const desc0=(lines[0].description||'').trim();
      const headerDesc=(p.description||'').trim();
      const isStubLine=_stubRe.test(desc0)||_stubRe.test(headerDesc);
      if(isStubLine){
        return{pn:'Multiple',desc:desc0||headerDesc,qty:totalQty,unitCostHtml:'—',extended:lines[0].unit_cost||0,tooltip:''};
      }
      return{pn:lines[0].pn,desc:desc0||headerDesc||'',qty:totalQty,unitCostHtml:fc(lines[0].unit_cost||0,4),extended:(lines[0].qty_ordered||0)*(lines[0].unit_cost||0),tooltip:''};
    }
    const tip=lines.map(l=>`${l.pn} ×${l.qty_ordered} @ ${fc(l.unit_cost||0,4)}`).join('\n');
