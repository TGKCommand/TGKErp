<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGK Support Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#2ABFAA; --orange:#E07B28;
  --sidebar:#141618; --body-bg:#F0F2F5;
  --card:#ffffff; --border:#E3E6EA; --text:#1C2024; --text-dim:#6B7280;
  --red:#E5484D; --yellow:#F0B429; --green:#2ABFAA; --blue:#3B82F6;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--body-bg);color:var(--text);height:100vh;overflow:hidden;}
mono{font-family:'JetBrains Mono',monospace;}
#app{display:flex;height:100vh;}

/* Sidebar */
#sidebar{width:220px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
#sidebar .brand{padding:20px 18px;font-weight:700;font-size:16px;border-bottom:1px solid #2a2d30;}
#sidebar .brand span{color:var(--teal);}
#sidebar nav{flex:1;padding:12px 8px;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#c7cbd1;font-size:14px;font-weight:500;margin-bottom:2px;}
.navitem:hover{background:#1f2225;color:#fff;}
.navitem.active{background:var(--teal);color:#0b1211;}
.navitem .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;}
.navitem.active .badge{background:#0b1211;color:var(--orange);}
#sidebar .userbox{padding:14px 16px;border-top:1px solid #2a2d30;font-size:12px;color:#9aa0a6;}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;}
#topbar h1{font-size:18px;font-weight:700;}
#topbar .spacer{flex:1;}
.btn{background:var(--teal);color:#0b1211;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
.btn:hover{opacity:.88;}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.orange{background:var(--orange);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
#content{flex:1;overflow-y:auto;padding:24px;}

/* Cards / KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.kpi .label{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .value{font-size:28px;font-weight:700;margin-top:4px;}
.kpi.warn .value{color:var(--orange);}
.kpi.danger .value{color:var(--red);}

/* Filters */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;}
.filters input[type=text]{min-width:220px;}

/* Table */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);background:#F7F8FA;padding:10px 14px;border-bottom:1px solid var(--border);}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;}
tr.row:hover{background:#FAFBFC;cursor:pointer;}
tr.row:last-child td{border-bottom:none;}

.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.pill.open{background:#E3F8F5;color:#0E7C6B;}
.pill.pending{background:#FFF4E0;color:#A85D00;}
.pill.waiting_customer{background:#EAF0FF;color:#2E4FBF;}
.pill.resolved{background:#EAFBEA;color:#1E7A34;}
.pill.closed{background:#EEE;color:#666;}
.pill.priority-low{background:#EEE;color:#666;}
.pill.priority-medium{background:#FFF4E0;color:#A85D00;}
.pill.priority-high{background:#FFE7E5;color:#C23A3E;}
.pill.priority-urgent{background:var(--red);color:#fff;}
.src-tag{font-size:11px;color:var(--text-dim);border:1px solid var(--border);padding:2px 7px;border-radius:6px;}

/* Slide-over */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40;}
#overlay.show{display:block;}
#panel{position:fixed;top:0;right:0;width:520px;max-width:96vw;height:100vh;background:var(--card);z-index:41;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.15);}
#panel.show{transform:translateX(0);}
#panel .phead{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
#panel .phead h2{font-size:16px;flex:1;}
#panel .pbody{flex:1;overflow-y:auto;padding:18px 20px;}
#panel .pfoot{border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:8px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.field label{font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px;}
.field select,.field input,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
.linked-box{background:#F7F8FA;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13px;}
.linked-box .lk-title{font-weight:700;font-size:12px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
.linked-box a{color:var(--teal);text-decoration:none;font-weight:600;}

.thread{margin-top:16px;}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.45;}
.msg.customer{background:#EAF0FF;}
.msg.staff{background:#E3F8F5;}
.msg.system{background:#F0F0F0;color:#555;font-style:italic;}
.msg.note{background:#FFF4E0;border:1px dashed var(--orange);}
.msg .meta{font-size:11px;color:var(--text-dim);margin-bottom:3px;display:flex;gap:6px;align-items:center;font-weight:600;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--teal);border-color:var(--teal);}

#loginScreen{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:100;}
#loginScreen .box{background:#fff;border-radius:14px;padding:32px;width:340px;}
#loginScreen h1{font-size:18px;margin-bottom:4px;}
#loginScreen p{font-size:12px;color:var(--text-dim);margin-bottom:18px;}
#loginScreen input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;font-size:13px;}
#loginScreen .err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#1C2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);}

.empty{text-align:center;padding:40px;color:var(--text-dim);font-size:13px;}
.checkbox-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-top:6px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <h1>TGK Support Center</h1>
    <p>Sign in with your TGK team account</p>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password">
    <button class="btn" style="width:100%" onclick="doLogin()">Sign In</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="sidebar">
    <div class="brand">TGK <span>Support</span></div>
    <nav id="navList"></nav>
    <div class="userbox" id="userBox"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <button class="btn" onclick="openNewTicket()">+ New Ticket</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="overlay" onclick="closePanel()"></div>
<div id="panel"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   CONFIG — same Supabase project as the ERP
   ============================================================ */
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE"; // same anon key used in tgk_erp.html
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const IDLE_TIMEOUT_MS = 8 * 60 * 60 * 1000; // 8 hours, matches ERP

/* ============================================================
   STATE
   ============================================================ */
const S = {
  user: null,
  role: 'customer_service',
  page: 'dashboard',
  tickets: [],
  messages: {},        // ticket_id -> [messages]
  warranty: [],
  shipErrors: [],
  sales: [],
  dealers: [],
  team: [],
  activeTicket: null,
  filters: { status: '', priority: '', source: '', q: '' },
  lastActivity: Date.now()
};
window.S = S;

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isErr) el.style.background = '#E5484D';
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}
window.toast = toast;

function isUserActivelyWorking(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

document.addEventListener('mousemove', ()=> S.lastActivity = Date.now());
document.addEventListener('keydown', ()=> S.lastActivity = Date.now());
setInterval(()=>{
  if(Date.now() - S.lastActivity > IDLE_TIMEOUT_MS){
    sb.auth.signOut();
    location.reload();
  }
}, 60000);

/* ============================================================
   AUTH
   ============================================================ */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){
    errEl.textContent = e.message || 'Login failed.';
  }
}
window.doLogin = doLogin;

async function afterLogin(user){
  S.user = user;
  // Look up role from team_members — fail-safe default to lowest privilege
  try{
    const { data, error } = await sb.from('team_members').select('*').eq('email', user.email).maybeSingle();
    if(error) throw error;
    S.role = (data && data.role) ? data.role : 'warehouse';
  }catch(e){
    S.role = 'warehouse';
  }
  if(!['admin','customer_service'].includes(S.role)){
    document.getElementById('loginErr').textContent = 'Your account does not have Support Center access.';
    await sb.auth.signOut();
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userBox').textContent = user.email + ' · ' + S.role;
  await loadAll();
  renderNav();
  goPage('dashboard');
  subscribeRealtime();
}

(async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await afterLogin(data.session.user); }
})();

/* ============================================================
   DATA LOADING
   ============================================================ */
async function fetchAll(queryFn, pageSize=1000){
  let all = [], from = 0;
  while(true){
    const { data, error } = await queryFn(from, from + pageSize - 1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function loadAll(){
  try{
    const [tickets, warranty, shipErrors, dealers, team] = await Promise.all([
      fetchAll((f,t)=> sb.from('tickets').select('*').order('created_at',{ascending:false}).range(f,t)),
      fetchAll((f,t)=> sb.from('warranty_claims').select('*').order('created_at',{ascending:false}).range(f,t)),
      fetchAll((f,t)=> sb.from('shipment_errors').select('*').order('created_at',{ascending:false}).range(f,t)),
      sb.from('dealers').select('id,name,email').then(r=>r.data||[]),
      sb.from('team_members').select('id,name,email,role').then(r=>r.data||[])
    ]);
    S.tickets = tickets;
    S.warranty = warranty;
    S.shipErrors = shipErrors;
    S.dealers = dealers;
    S.team = team;
  }catch(e){
    toast('Failed to load data: ' + e.message, true);
  }
}

async function loadMessages(ticketId){
  const { data, error } = await sb.from('ticket_messages').select('*').eq('ticket_id', ticketId).order('created_at',{ascending:true});
  if(error){ toast('Failed to load messages', true); return []; }
  S.messages[ticketId] = data;
  return data;
}

/* ============================================================
   REALTIME
   ============================================================ */
function subscribeRealtime(){
  sb.channel('support-tickets')
    .on('postgres_changes', { event:'*', schema:'public', table:'tickets' }, payload=>{
      if(isUserActivelyWorking() && S.page==='ticket_detail') return;
      handleTicketRealtime(payload);
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'ticket_messages' }, payload=>{
      const m = payload.new;
      if(!S.messages[m.ticket_id]) S.messages[m.ticket_id] = [];
      S.messages[m.ticket_id].push(m);
      if(S.activeTicket && S.activeTicket.id === m.ticket_id){
        renderTicketPanel(S.activeTicket);
      }
    })
    .subscribe();
}

function handleTicketRealtime(payload){
  const idx = S.tickets.findIndex(t=>t.id === (payload.new?.id || payload.old?.id));
  if(payload.eventType === 'INSERT'){
    if(idx === -1) S.tickets.unshift(payload.new);
    toast('New ticket: ' + payload.new.subject);
  } else if(payload.eventType === 'UPDATE'){
    if(idx !== -1) S.tickets[idx] = payload.new;
  } else if(payload.eventType === 'DELETE'){
    if(idx !== -1) S.tickets.splice(idx,1);
  }
  if(S.page === 'tickets' || S.page === 'dashboard') renderPage();
}

/* ============================================================
   NAV / ROUTER
   ============================================================ */
const NAV = [
  { id:'dashboard', label:'Dashboard', icon:'📊' },
  { id:'tickets', label:'Tickets', icon:'🎫' },
  { id:'warranty', label:'Warranty Claims', icon:'🛡️' },
  { id:'shiperrors', label:'Shipment Errors', icon:'📦' },
];

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV.map(n=>{
    let badge = '';
    if(n.id==='tickets'){
      const openCount = S.tickets.filter(t=>['open','pending','waiting_customer'].includes(t.status)).length;
      if(openCount) badge = `<span class="badge">${openCount}</span>`;
    }
    if(n.id==='warranty'){
      const unlinked = S.warranty.filter(w=>!S.tickets.some(t=>t.warranty_claim_id===w.id)).length;
      if(unlinked) badge = `<span class="badge">${unlinked}</span>`;
    }
    if(n.id==='shiperrors'){
      const unlinked = S.shipErrors.filter(e=>!S.tickets.some(t=>t.shipment_error_id===e.id)).length;
      if(unlinked) badge = `<span class="badge">${unlinked}</span>`;
    }
    return `<div class="navitem ${S.page===n.id?'active':''}" onclick="goPage('${n.id}')">
      <span>${n.icon}</span><span>${n.label}</span>${badge}
    </div>`;
  }).join('');
}

function goPage(id){
  S.page = id;
  renderNav();
  document.getElementById('pageTitle').textContent = (NAV.find(n=>n.id===id)||{}).label || 'Dashboard';
  renderPage();
}
window.goPage = goPage;

function renderPage(){
  if(S.page === 'dashboard') return renderDashboard();
  if(S.page === 'tickets') return renderTicketsList();
  if(S.page === 'warranty') return renderWarrantyList();
  if(S.page === 'shiperrors') return renderShipErrorsList();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const t = S.tickets;
  const open = t.filter(x=>x.status==='open').length;
  const urgent = t.filter(x=>x.priority==='urgent' && !['resolved','closed'].includes(x.status)).length;
  const today = t.filter(x=> new Date(x.created_at).toDateString() === new Date().toDateString()).length;
  const resolved = t.filter(x=>x.resolved_at);
  const avgDays = resolved.length ? (resolved.reduce((s,x)=> s + (new Date(x.resolved_at)-new Date(x.created_at)),0) / resolved.length / 86400000).toFixed(1) : '—';
  const bySource = {};
  t.forEach(x=> bySource[x.source] = (bySource[x.source]||0)+1);

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="label">Open Tickets</div><div class="value">${open}</div></div>
      <div class="kpi danger"><div class="label">Urgent Unresolved</div><div class="value">${urgent}</div></div>
      <div class="kpi"><div class="label">New Today</div><div class="value">${today}</div></div>
      <div class="kpi"><div class="label">Avg Resolution (days)</div><div class="value">${avgDays}</div></div>
    </div>
    <div class="kpi-row" style="grid-template-columns:1fr;">
      <div class="kpi">
        <div class="label" style="margin-bottom:10px">Tickets by Source</div>
        ${Object.entries(bySource).map(([k,v])=>`<span class="src-tag" style="margin-right:8px">${k}: ${v}</span>`).join('') || '<span style="font-size:13px;color:var(--text-dim)">No tickets yet</span>'}
      </div>
    </div>
    <div style="margin-top:6px">
      <h3 style="font-size:14px;margin-bottom:10px">Recent Tickets</h3>
      ${ticketTable(t.slice(0,10))}
    </div>
  `;
}

/* ============================================================
   TICKETS LIST
   ============================================================ */
function renderTicketsList(){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="filters">
      <input type="text" id="fq" placeholder="Search subject, customer, order #, email..." value="${S.filters.q}" oninput="S.filters.q=this.value; renderTicketsList()">
      <select id="fstatus" onchange="S.filters.status=this.value; renderTicketsList()">
        <option value="">All Statuses</option>
        ${['open','pending','waiting_customer','resolved','closed'].map(s=>`<option value="${s}" ${S.filters.status===s?'selected':''}>${label(s)}</option>`).join('')}
      </select>
      <select id="fpriority" onchange="S.filters.priority=this.value; renderTicketsList()">
        <option value="">All Priorities</option>
        ${['low','medium','high','urgent'].map(s=>`<option value="${s}" ${S.filters.priority===s?'selected':''}>${label(s)}</option>`).join('')}
      </select>
      <select id="fsource" onchange="S.filters.source=this.value; renderTicketsList()">
        <option value="">All Sources</option>
        ${['manual','website','warranty','shipment_error','email'].map(s=>`<option value="${s}" ${S.filters.source===s?'selected':''}>${label(s)}</option>`).join('')}
      </select>
      <button class="btn secondary" onclick="S.filters={status:'',priority:'',source:'',q:''}; renderTicketsList()">Clear</button>
    </div>
    ${ticketTable(filteredTickets())}
  `;
}

function filteredTickets(){
  let list = S.tickets.slice();
  const f = S.filters;
  if(f.status) list = list.filter(t=>t.status===f.status);
  if(f.priority) list = list.filter(t=>t.priority===f.priority);
  if(f.source) list = list.filter(t=>t.source===f.source);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t=>
      (t.subject||'').toLowerCase().includes(q) ||
      (t.customer_name||'').toLowerCase().includes(q) ||
      (t.customer_email||'').toLowerCase().includes(q) ||
      (t.order_number||'').toLowerCase().includes(q) ||
      (t.pn||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function label(s){ return (s||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }

function ticketTable(list){
  if(!list.length) return `<div class="empty">No tickets found.</div>`;
  return `<table>
    <thead><tr>
      <th>#</th><th>Subject</th><th>Customer</th><th>Order</th><th>Source</th><th>Priority</th><th>Status</th><th>Updated</th>
    </tr></thead>
    <tbody>
      ${list.map(t=>`
        <tr class="row" onclick="openTicket('${t.id}')">
          <td>#${t.ticket_number}</td>
          <td>${escapeHtml(t.subject)}</td>
          <td>${escapeHtml(t.customer_name||t.customer_email||'—')}</td>
          <td>${t.order_number ? '#'+escapeHtml(t.order_number) : '—'}</td>
          <td><span class="src-tag">${label(t.source)}</span></td>
          <td><span class="pill priority-${t.priority}">${label(t.priority)}</span></td>
          <td><span class="pill ${t.status}">${label(t.status)}</span></td>
          <td>${timeAgo(t.updated_at)}</td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(dstr){
  if(!dstr) return '—';
  const diff = Date.now() - new Date(dstr).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

/* ============================================================
   WARRANTY / SHIPMENT ERROR QUEUES (convert-to-ticket)
   ============================================================ */
function renderWarrantyList(){
  const el = document.getElementById('content');
  const unlinked = S.warranty.filter(w=>!S.tickets.some(t=>t.warranty_claim_id===w.id));
  el.innerHTML = `
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Warranty claims without a linked support ticket. Create a ticket to start a customer conversation thread.</p>
    ${!unlinked.length ? '<div class="empty">All warranty claims have linked tickets.</div>' : `
    <table><thead><tr><th>Order</th><th>PN</th><th>Status</th><th>Cost</th><th>Created</th><th></th></tr></thead>
    <tbody>
      ${unlinked.map(w=>`
        <tr>
          <td>${w.order_number?'#'+escapeHtml(w.order_number):'—'}</td>
          <td><mono>${escapeHtml(w.pn||'—')}</mono></td>
          <td>${escapeHtml(w.status||'—')}</td>
          <td>${w.claim_cost ? '$'+Number(w.claim_cost).toFixed(2) : '—'}</td>
          <td>${timeAgo(w.created_at)}</td>
          <td><button class="btn" onclick="convertToTicket('warranty','${w.id}')">Create Ticket</button></td>
        </tr>
      `).join('')}
    </tbody></table>`}
  `;
}

function renderShipErrorsList(){
  const el = document.getElementById('content');
  const unlinked = S.shipErrors.filter(e=>!S.tickets.some(t=>t.shipment_error_id===e.id));
  el.innerHTML = `
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Shipment errors without a linked support ticket.</p>
    ${!unlinked.length ? '<div class="empty">All shipment errors have linked tickets.</div>' : `
    <table><thead><tr><th>Order</th><th>PN</th><th>Status</th><th>Cost</th><th>Created</th><th></th></tr></thead>
    <tbody>
      ${unlinked.map(e=>`
        <tr>
          <td>${e.order_number?'#'+escapeHtml(e.order_number):'—'}</td>
          <td><mono>${escapeHtml(e.pn||'—')}</mono></td>
          <td>${escapeHtml(e.status||'—')}</td>
          <td>${e.claim_cost ? '$'+Number(e.claim_cost).toFixed(2) : '—'}</td>
          <td>${timeAgo(e.created_at)}</td>
          <td><button class="btn" onclick="convertToTicket('shipment_error','${e.id}')">Create Ticket</button></td>
        </tr>
      `).join('')}
    </tbody></table>`}
  `;
}

async function convertToTicket(kind, recordId){
  const record = kind==='warranty' ? S.warranty.find(w=>w.id===recordId) : S.shipErrors.find(e=>e.id===recordId);
  if(!record){ toast('Record not found', true); return; }
  const subject = kind==='warranty'
    ? `Warranty claim — order #${record.order_number||'?'} / ${record.pn||'?'}`
    : `Shipment error — order #${record.order_number||'?'} / ${record.pn||'?'}`;
  const payload = {
    source: kind==='warranty' ? 'warranty' : 'shipment_error',
    status: 'open',
    priority: 'medium',
    subject,
    order_number: record.order_number || null,
    pn: record.pn || null,
    warranty_claim_id: kind==='warranty' ? record.id : null,
    shipment_error_id: kind==='shipment_error' ? record.id : null,
  };
  try{
    const { data, error } = await sb.from('tickets').insert(payload).select().single();
    if(error) throw error;
    S.tickets.unshift(data);
    toast('Ticket #' + data.ticket_number + ' created');
    goPage('tickets');
    openTicket(data.id);
  }catch(e){
    toast('Failed to create ticket: ' + e.message, true);
  }
}
window.convertToTicket = convertToTicket;

/* ============================================================
   TICKET DETAIL PANEL
   ============================================================ */
async function openTicket(id){
  const t = S.tickets.find(x=>x.id===id);
  if(!t){ toast('Ticket not found', true); return; }
  S.activeTicket = t;
  await loadMessages(id);
  renderTicketPanel(t);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
window.openTicket = openTicket;

function closePanel(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
  S.activeTicket = null;
}
window.closePanel = closePanel;

function renderTicketPanel(t){
  const msgs = S.messages[t.id] || [];
  const dealer = S.dealers.find(d=>d.id===t.dealer_id);
  const warranty = t.warranty_claim_id ? S.warranty.find(w=>w.id===t.warranty_claim_id) : null;
  const shipErr = t.shipment_error_id ? S.shipErrors.find(e=>e.id===t.shipment_error_id) : null;

  document.getElementById('panel').innerHTML = `
    <div class="phead">
      <h2>#${t.ticket_number} — ${escapeHtml(t.subject)}</h2>
      <button class="btn secondary" onclick="closePanel()">✕</button>
    </div>
    <div class="pbody">
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select onchange="updateTicketField('${t.id}','status',this.value)">
            ${['open','pending','waiting_customer','resolved','closed'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${label(s)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Priority</label>
          <select onchange="updateTicketField('${t.id}','priority',this.value)">
            ${['low','medium','high','urgent'].map(s=>`<option value="${s}" ${t.priority===s?'selected':''}>${label(s)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Assigned To</label>
          <select onchange="updateTicketField('${t.id}','assigned_to',this.value)">
            <option value="">Unassigned</option>
            ${S.team.map(m=>`<option value="${m.email}" ${t.assigned_to===m.email?'selected':''}>${escapeHtml(m.name||m.email)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Source</label>
          <input value="${label(t.source)}" disabled>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Customer Name</label><input value="${escapeHtml(t.customer_name||'')}" onchange="updateTicketField('${t.id}','customer_name',this.value)"></div>
        <div class="field"><label>Customer Email</label><input value="${escapeHtml(t.customer_email||'')}" onchange="updateTicketField('${t.id}','customer_email',this.value)"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Order Number</label><input value="${escapeHtml(t.order_number||'')}" onchange="updateTicketField('${t.id}','order_number',this.value)"></div>
        <div class="field"><label>Part Number</label><input value="${escapeHtml(t.pn||'')}" onchange="updateTicketField('${t.id}','pn',this.value)"></div>
      </div>

      ${dealer ? `<div class="linked-box"><div class="lk-title">Dealer</div>${escapeHtml(dealer.name)} — ${escapeHtml(dealer.email||'')}</div>` : ''}
      ${warranty ? `<div class="linked-box"><div class="lk-title">Linked Warranty Claim</div>
        Status: ${escapeHtml(warranty.status||'—')} · Cost: ${warranty.claim_cost?'$'+Number(warranty.claim_cost).toFixed(2):'—'}
        ${warranty.tracking_number?' · Tracking: '+escapeHtml(warranty.tracking_number):''}
      </div>` : ''}
      ${shipErr ? `<div class="linked-box"><div class="lk-title">Linked Shipment Error</div>
        Status: ${escapeHtml(shipErr.status||'—')} · Cost: ${shipErr.claim_cost?'$'+Number(shipErr.claim_cost).toFixed(2):'—'}
        ${shipErr.return_status?' · Return: '+escapeHtml(shipErr.return_status):''}
      </div>` : ''}
      <div id="orderLookupBox"></div>
      ${t.order_number ? `<button class="btn secondary" style="margin-bottom:10px" onclick="lookupOrder('${t.id}')">Look Up Order in ERP Data</button>` : ''}

      <div class="tabs">
        <div class="tab active" id="tabConv" onclick="switchThreadTab(true)">Conversation</div>
        <div class="tab" id="tabNotes" onclick="switchThreadTab(false)">Internal Notes</div>
      </div>
      <div class="thread" id="threadBox">
        ${renderThread(msgs, false)}
      </div>
      <div style="margin-top:12px">
        <textarea id="msgBox" rows="3" placeholder="Type a reply..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;"></textarea>
        <div class="checkbox-row">
          <input type="checkbox" id="isNoteChk"><label for="isNoteChk">Internal note (not visible to customer)</label>
        </div>
      </div>
    </div>
    <div class="pfoot">
      <button class="btn" style="flex:1" onclick="sendMessage('${t.id}')">Send</button>
      ${t.status!=='closed' ? `<button class="btn secondary" onclick="updateTicketField('${t.id}','status','resolved')">Mark Resolved</button>` : ''}
    </div>
  `;
}

let showingNotes = false;
function switchThreadTab(conv){
  showingNotes = !conv;
  document.getElementById('tabConv').classList.toggle('active', conv);
  document.getElementById('tabNotes').classList.toggle('active', !conv);
  document.getElementById('threadBox').innerHTML = renderThread(S.messages[S.activeTicket.id]||[], showingNotes);
}
window.switchThreadTab = switchThreadTab;

function renderThread(msgs, notesOnly){
  const list = msgs.filter(m => notesOnly ? m.is_internal_note : !m.is_internal_note);
  if(!list.length) return `<div class="empty">${notesOnly?'No internal notes yet.':'No messages yet.'}</div>`;
  return list.map(m=>`
    <div class="msg ${m.is_internal_note?'note':m.sender_type}">
      <div class="meta"><span>${escapeHtml(m.sender_name||m.sender_type)}</span><span>·</span><span>${timeAgo(m.created_at)}</span></div>
      <div>${escapeHtml(m.body).replace(/\n/g,'<br>')}</div>
    </div>
  `).join('');
}

async function updateTicketField(id, field, value){
  try{
    const patch = { [field]: value, updated_at: new Date().toISOString() };
    if(field==='status' && (value==='resolved'||value==='closed')) patch.resolved_at = new Date().toISOString();
    const { data, error } = await sb.from('tickets').update(patch).eq('id', id).select().single();
    if(error) throw error;
    const idx = S.tickets.findIndex(x=>x.id===id);
    if(idx!==-1) S.tickets[idx] = data;
    S.activeTicket = data;
    toast('Ticket updated');
    if(S.page!=='dashboard') renderPage();
  }catch(e){
    toast('Update failed: ' + e.message, true);
  }
}
window.updateTicketField = updateTicketField;

async function sendMessage(ticketId){
  const box = document.getElementById('msgBox');
  const isNote = document.getElementById('isNoteChk').checked;
  const body = box.value.trim();
  if(!body) return;
  try{
    const { data, error } = await sb.from('ticket_messages').insert({
      ticket_id: ticketId,
      sender_type: 'staff',
      sender_name: S.user.email,
      body,
      is_internal_note: isNote
    }).select().single();
    if(error) throw error;
    if(!S.messages[ticketId]) S.messages[ticketId] = [];
    S.messages[ticketId].push(data);
    box.value = '';
    document.getElementById('isNoteChk').checked = false;
    renderThread(S.messages[ticketId], showingNotes);
    document.getElementById('threadBox').innerHTML = renderThread(S.messages[ticketId], showingNotes);
    await sb.from('tickets').update({ updated_at: new Date().toISOString() }).eq('id', ticketId);
  }catch(e){
    toast('Failed to send: ' + e.message, true);
  }
}
window.sendMessage = sendMessage;

async function lookupOrder(ticketId){
  const t = S.tickets.find(x=>x.id===ticketId);
  if(!t || !t.order_number) return;
  const box = document.getElementById('orderLookupBox');
  box.innerHTML = `<div class="linked-box">Looking up order...</div>`;
  try{
    const { data, error } = await sb.from('sales').select('*').eq('order_number', t.order_number).limit(5);
    if(error) throw error;
    if(!data.length){ box.innerHTML = `<div class="linked-box">No matching order found for #${escapeHtml(t.order_number)}.</div>`; return; }
    box.innerHTML = data.map(s=>`
      <div class="linked-box">
        <div class="lk-title">Order #${escapeHtml(s.order_number)}</div>
        PN: <mono>${escapeHtml(s.pn||'—')}</mono> · Qty: ${s.quantity??'—'} · Fulfillment: ${escapeHtml(s.fulfillment_status||'—')}
        ${s.tracking_number?' · Tracking: '+escapeHtml(s.tracking_number):''}
      </div>
    `).join('');
  }catch(e){
    box.innerHTML = `<div class="linked-box">Lookup failed: ${escapeHtml(e.message)}</div>`;
  }
}
window.lookupOrder = lookupOrder;

/* ============================================================
   NEW TICKET
   ============================================================ */
function openNewTicket(){
  document.getElementById('panel').innerHTML = `
    <div class="phead"><h2>New Ticket</h2><button class="btn secondary" onclick="closePanel()">✕</button></div>
    <div class="pbody">
      <div class="field"><label>Subject</label><input id="ntSubject" placeholder="Brief summary"></div>
      <div class="field-row" style="margin-top:12px">
        <div class="field"><label>Customer Name</label><input id="ntName"></div>
        <div class="field"><label>Customer Email</label><input id="ntEmail"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Order Number</label><input id="ntOrder"></div>
        <div class="field"><label>Part Number</label><input id="ntPn"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Priority</label>
          <select id="ntPriority">${['low','medium','high','urgent'].map(s=>`<option value="${s}" ${s==='medium'?'selected':''}>${label(s)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Source</label>
          <select id="ntSource">${['manual','website','email'].map(s=>`<option value="${s}">${label(s)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field" style="margin-top:12px"><label>Initial Message</label><textarea id="ntBody" rows="4" placeholder="What's going on?"></textarea></div>
    </div>
    <div class="pfoot"><button class="btn" style="flex:1" onclick="createTicket()">Create Ticket</button></div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
window.openNewTicket = openNewTicket;

async function createTicket(){
  const subject = document.getElementById('ntSubject').value.trim();
  if(!subject){ toast('Subject is required', true); return; }
  const payload = {
    subject,
    customer_name: document.getElementById('ntName').value.trim() || null,
    customer_email: document.getElementById('ntEmail').value.trim() || null,
    order_number: document.getElementById('ntOrder').value.trim() || null,
    pn: document.getElementById('ntPn').value.trim() || null,
    priority: document.getElementById('ntPriority').value,
    source: document.getElementById('ntSource').value,
    status: 'open'
  };
  try{
    const { data, error } = await sb.from('tickets').insert(payload).select().single();
    if(error) throw error;
    S.tickets.unshift(data);
    const body = document.getElementById('ntBody').value.trim();
    if(body){
      await sb.from('ticket_messages').insert({
        ticket_id: data.id, sender_type: 'staff', sender_name: S.user.email, body, is_internal_note: false
      });
    }
    toast('Ticket #' + data.ticket_number + ' created');
    goPage('tickets');
    openTicket(data.id);
  }catch(e){
    toast('Failed to create ticket: ' + e.message, true);
  }
}
window.createTicket = createTicket;

</script>
