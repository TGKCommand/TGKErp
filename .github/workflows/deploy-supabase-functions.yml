name: Deploy Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$PROJECT_REF" || { echo "Add the SUPABASE_PROJECT_REF repository secret"; exit 1; }

      - name: Deploy shopify-orders (Shopify webhook - no platform JWT check)
        run: supabase functions deploy shopify-orders --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy shipstation-ship (ShipStation webhook - no platform JWT check)
        run: supabase functions deploy shipstation-ship --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy invite-user
        run: supabase functions deploy invite-user --project-ref "$PROJECT_REF"
