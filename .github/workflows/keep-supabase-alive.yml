name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 14 * * *'   # Daily at 14:00 UTC (10am ET)
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://piamamighqiielfztgic.supabase.co/rest/v1/parts?select=pn&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "✅ Supabase is alive and responding"
          elif [ "$HTTP" -eq 0 ]; then
            echo "❌ No response — project may be paused or unreachable"
            exit 1
          else
            echo "⚠️ Unexpected status $HTTP"
            exit 1
          fi
